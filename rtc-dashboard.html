hority, cost recovery, reporting deadlines, and enforceability. (Initial; verify with SMEs.)", "sponsor": "Senator Sue Rezin (R)", "last": "Referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, shell bill/watch only"}, {"state": "IL", "bill": "SB3576", "title": "REGULATION-TECH", "industry": "Shell", "script": "SB3576 makes a purely technical change to the short‑title section of the Telecommunications Article within the Public Utilities Act, without touching any of the substantive regulatory provisions. It doesn’t shift ICC authority, alter utility obligations, or change cost‑recovery or compliance requirements in any meaningful way. This one is a straightforward monitor, pending SME confirmation, but no operational or regulatory impacts are expected.", "sme": "", "gr": "Monitor unless a clear utility obligation or cost impact emerges. Check: ICC authority, cost recovery, reporting deadlines, and enforceability. (Initial; verify with SMEs.)", "sponsor": "Senator Sue Rezin (R)", "last": "Referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, shell bill/watch only"}, {"state": "IL", "bill": "SB3578", "title": "DATA CENTERS-FOREIGN OWNERSHIP", "industry": "Data Centers", "script": "SB3578 would block any “foreign‑adversary‑owned” company from building a data center in Illinois unless the ICC, IPA, and DCEO jointly study the project and certify that its load is fully self‑generated and won’t affect PJM or MISO. That’s a big new hurdle, and it could definitely slow timelines or change expectations around interconnection, because a developer wouldn’t even get to the utility‑service stage unless the agencies sign off. The SME question is whether this certification effectively shifts who pays for upgrades or alters service obligations when large loads show up—but the joint‑study requirement alone is a major new gating step.", "sme": "SB3578 aims to address national security and grid‑reliability risks by restricting foreign‑owned data centers unless state agencies certify that the facility’s load is fully self‑generated and has no impact on PJM or MISO—an extremely rigid requirement that raises feasibility and implementation concerns. For utilities, this framework would limit opportunities to serve large loads, introduce difficult certification obligations, and create uncertainty due to the undefined interagency study process. The financial impacts would be indirect but meaningful, primarily through lost load growth, reduced economic‑development opportunities, and additional administrative costs tied to analysis and coordination. A neutral‑with‑concerns position is recommended, and the bill could be improved by clarifying key definitions, allowing alternative reliability‑based compliance pathways, establishing predictable processes and timelines, and aligning the proposal with existing RTO planning and market structures.", "gr": "Industry stakeholders are opposing all data center legislation this session because of the broader cumulative impact these bills could have on utilities, including higher compliance costs, stricter operational requirements, and increased uncertainty aroun", "sponsor": "Senator Sue Rezin (R)", "last": "Referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "SB3580", "title": "ENERGY-GENERATION TASK FORCE", "industry": "Energy-Generation", "script": "SB3580 sets up an Illinois Regional Generation Reliability Task Force—basically a study and coordination group—not a new compliance program. That means no direct operational, cost, or timeline impacts for utilities or customers right now, beyond modest administrative costs to staff/participate and any future reporting the task force might request. The real impacts would only come later if its recommendations are turned into binding rules or legislation.", "sme": "A new task force has been established to monitor grid stability and reliability, but utilities—including Ameren—do not currently have representation, despite our operational responsibility for maintaining system reliability through our transmission balancing authority. Excluding utilities limits the task force’s effectiveness and does not align with Ameren’s position that grid‑reliability initiatives must incorporate direct input from those who operate and manage the system. The expected financial impact is minimal and largely tied to staff time for monitoring or participating if representation is added. We support the overall concept but recommend modifying the proposal to include utility seats, specifically Ameren Illinois (AIC) and ComEd, to ensure the task force reflects operational expertise and supports Ameren’s policy position of collaborative, utility‑inclusive grid governance.", "gr": "", "sponsor": "Senator Jil Tracy (R)", "last": "Rule 2-10 Committee Deadline Established As April 24, 2026 (in the Senate)", "hearing": "", "tags": "2026, coats, Support"}, {"state": "IL", "bill": "SB3581", "title": "EPA-GREENHOUSE GASES", "industry": "Greenhouse Fuel Cells", "script": "SB3581 would roll back the greenhouse‑gas provisions in the Environmental Protection Act to the version that existed before P.A. 102‑662, effectively undoing the accelerated emissions‑reduction timelines and requirements added in that law. In practical terms, that would push enforcement further out and give generators more operational flexibility during tight reliability conditions, but it also delays emissions‑control investments and could shift costs depending on how long older units stay online. SME input will help clarify whether reverting to the older framework meaningfully changes reliability planning or alters cost impacts for customers.", "sme": "This bill would roll back CEJA’s requirements for phasing out coal and natural gas plants. From Ameren’s perspective, keeping some of these resources online could ease resource adequacy concerns, although it also creates some policy whiplash that makes long‑term planning harder. The financial impact is tough to pin down, but keeping more supply on the system would generally help customers by reducing cost pressure. A neutral position makes sense for now, and the bill could be improved with clearer long‑term policy signals so utilities and generators can plan with more certainty.", "gr": "", "sponsor": "Senator Dale Fowler (R)", "last": "Referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "SB3606", "title": "EPA-HEAT RATE", "industry": "Heat Fuel Cells", "script": "SB3606 defines “heat rate” in statute and then requires gas‑fired and other large GHG‑emitting units with a heat rate of 7,000 Btu/kWh or higher to cut their CO₂‑equivalent emissions by 50% by 2035, based on a 12‑month average. This is a statewide emissions‑compliance requirement—not a siting or county‑level permitting rule—so it doesn’t add local steps or create new county‑facing obligations for energy‑storage projects. Any impact would fall on generators planning compliance, not on storage development timelines or local approval workflows.", "sme": "The bill codifies a specific definition of heat rate—using gross energy input over a 12‑month average—which effectively determines which generating units exceed the 7,000 Btu/kWh threshold and are therefore subject to a 50% CO₂e reduction requirement by 2035. There appears to be no direct impact on Ameren’s DER or storage interconnection activities, and broader business implications are unclear. Financial effects are similarly uncertain and would depend on how many units statewide fall under the new standard. A position of neutral is reasonable at this stage, though the bill could be improved by clarifying how heat‑rate calculations apply to different technologies or operational scenarios.", "gr": "", "sponsor": "Senator Steve Stadelman (D)", "last": "Rule 2-10 Committee Deadline Established As April 24, 2026 (in the Senate)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "SB3613", "title": "RURAL BROADBAND DEPLOY STUDY", "industry": "Broadband Deployment", "script": "SB3613 simply directs the Broadband Advisory Council to study the social and economic costs and benefits of expanding rural broadband through cooperatives, looking at things like telehealth access, remote work, and education. It’s a research and policy‑evaluation bill—not a permitting, siting, or land‑use bill—so it doesn’t add steps that slow down energy‑storage projects or create new county‑facing compliance obligations. Any impacts stay within broadband planning, not storage development or local approvals.", "sme": "This bill would require the Broadband Advisory Council to conduct a cost‑benefit study on expanding rural broadband through “broadband cooperatives,” a term the legislation does not define. It’s unclear why cooperatives are singled out, especially when broadband services can also be provided by other entities like telephone cooperatives and electric utilities. The measure doesn’t create any direct impact on Ameren’s business but does add work and cost for the Broadband Advisory Council without a clear policy purpose. Clarifying the need for the study and defining “broadband cooperatives” would make the bill more coherent and meaningful. Neutral posiiton", "gr": "", "sponsor": "Senator Rachel Ventura (D)", "last": "Rule 2-10 Committee Deadline Established As April 24, 2026 (in the Senate)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "SB3629", "title": "CTY CD-COMMERCIAL WIND/SOLAR", "industry": "Wind & Solar", "script": "SB3629 carves out a set of southern Illinois counties—those south of I‑70 plus the listed counties—so the statewide siting rules from P.A. 102‑1123 for wind, solar, and storage wouldn’t apply there. It doesn’t add new county‑level steps on its own, but it shifts projects back to local processes, which can either speed things up (if locals are more flexible) or slow them down (if locals add stricter reviews). Bottom line: no new county‑facing obligations created by the bill itself, but more variability in siting timelines and requirements in the exempted counties.", "sme": "This proposal exempts certain counties from statewide zoning limits established under P.A. 102‑1123, allowing them to impose additional restrictions on land use for renewable energy projects. While the impact is narrower than SB3450, it may still create greater volatility in DER interconnection queues as developers adjust siting strategies based on varying municipal rules. These shifts could lead to more withdrawals, redesigns, and planning uncertainties for AIC. We would take a neutral position but recommend adding language clarifying that municipal zoning authority cannot override ICC‑governed interconnection standards.\nPublic Act 102-1123, signed into law on January 27, 2023, standardizes local regulations for wind and solar energy facilities in Illinois, limiting county authority to prohibit such developments.", "gr": "Pending in tracker. Needs SME review before recommending a posture. Check: county requirements, NFPA references, decommissioning/security, and drainage/ag impacts. (Initial; verify with SMEs.)", "sponsor": "Senator Terri Bryant (R)", "last": "Referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "SB3652", "title": "BROADBAND PROVIDERS-EASEMENTS", "industry": "Broadband Deployment", "script": "SB3652 expands the rights of broadband providers—especially electric‑cooperative broadband grantees—by letting them use existing electric easements outside their grant area and enter private property for broadband deployment as long as they have the proper state or local permits. This doesn’t create new county‑level obligations for energy‑storage projects, but it does shift some land‑access dynamics by strengthening broadband providers’ ability to build infrastructure across private property. For storage specifically, it doesn’t add steps or slow down projects—its impacts stay squarely in the broadband‑deployment space.", "sme": "The bill would allow all broadband providers—not just electric cooperatives—to use existing electric easements for broadband deployment, preventing property owners from blocking access so long as required permits are obtained. This is intended to accelerate statewide broadband expansion by giving providers streamlined access to existing utility corridors, reducing the need for one‑by‑one property negotiations. For Ameren, the impact is largely positive: it creates a sizable opportunity to lease fiber for middle‑mile broadband, with potential revenue of $10–25 million annually and minimal associated costs. A support position is recommended, with suggested improvements to clarify that pole‑attachment rules remain unchanged and to streamline fiber‑lease approvals by exempting smaller transactions from ICC review.", "gr": "", "sponsor": "Senator Paul Faraci (D)", "last": "Rule 3-9(a) / Re-referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, coats, Support"}, {"state": "IL", "bill": "SB3665", "title": "INC TAX-ENERGY CHOICE", "industry": "Clean Energy Transition", "script": "SB3665 creates a 20% Illinois income‑tax credit for wages paid to “qualified energy choice workers” by regulated utilities or baseload/intermediate generators that can show material operational impacts from the state’s 2030–2045 phaseout timelines. This is a tax incentive administered through the Department of Revenue—it doesn’t add county‑level permitting steps or slow energy‑storage projects. Any impact is on employer tax filings and workforce planning, not local compliance or siting.", "sme": "This proposal would create a small income tax credit—up to $100,000 per year—for regulated utilities or power‑generation companies that employ workers impacted by the long‑term phaseout schedule in PA 102‑0662. Because Ameren does not appear to qualify for or rely on this credit, the bill has no direct business or customer impact, and a neutral position is appropriate. While the concept is modest, the measure could be improved by examining whether the far larger Energy Transition Assistance Charge, paid by all Ameren customers, is being fully deployed by DCEO to support dislocated workers as intended. This bill may highlight a need to ensure that more meaningful workforce‑transition programs are actually being implemented.\nA 102‑0662 is the Climate and Equitable Jobs Act (CEJA), signed into law in Illinois on September 15, 2021. It is a wide‑ranging energy transition law that expands the state’s Renewable Portfolio Standard, creates new clean‑energy workforce and equity programs, establishes carbon‑mitigation credits for at‑risk nuclear plants, updates renewable procurement programs, and sets long‑term decarbonization timelines for fossil‑fuel generation.", "gr": "", "sponsor": "Senator Meg Loughran Cappel (D)", "last": "Rule 2-10 Committee Deadline Established As April 24, 2026 (in the Senate)", "hearing": "", "tags": "Neutral, 2026, coats"}, {"state": "IL", "bill": "SB3705", "title": "ENERGY STORAGE REVENUE BONDS", "industry": "Energy Storage", "script": "SB3705 is basically a financing bill for energy‑storage projects. It allows the Illinois Finance Authority to issue revenue bonds specifically for storage projects that want to qualify for state storage credits or utility cost recovery. The idea is that the IFA and the Illinois Power Agency work together so the financing stays affordable for customers.", "sme": "", "gr": "", "sponsor": "Senator Sue Rezin (R)", "last": "Referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, coats, pending"}, {"state": "IL", "bill": "SB3761", "title": "DATA CENTERS-VARIOUS", "industry": "Data Centers", "script": "SB3761 creates a data‑center self‑direct program under the IPA Act, letting data‑center customers reduce what they pay toward renewable‑energy procurement if they bring new additive clean‑energy generation online. It mainly affects how large loads participate in IPA cost‑recovery—not how they interconnect—but it could shape service expectations if more data‑center developers lean on self‑direct structures when planning new capacity. The SME question is whether shifting REC‑cost responsibility this way changes upgrade economics or timeline pressures when big loads hit the system quickly.", "sme": "", "gr": "Industry stakeholders are opposing all data center legislation this session because of the broader cumulative impact these bills could have on utilities, including higher compliance costs, stricter operational requirements, and increased uncertainty aroun", "sponsor": "Senator Mike Simmons (D)", "last": "Rule 2-10 Committee Deadline Established As April 24, 2026 (in the Senate)", "hearing": "Senate Executive Subcommittee on AI and Social Media | April 9, 2026 at 1:30pm and April 10, 2026 at noon", "tags": "2026, coats, pending"}, {"state": "IL", "bill": "SB3794", "title": "LOC GOV-RESIDENTIAL ENERGY", "industry": "Energy Storage", "script": "SB3794 bars counties and municipalities from regulating the installation or inspection of residential energy‑backup systems—including in buildings with shared roofs—and it formally defines what counts as a REBS. It doesn’t change IPA procurement rules, program eligibility, or reporting requirements, but it could indirectly shape market participation by making it easier for customers to install backup systems without navigating local permitting rules. Overall, no major utility‑side obligations roll back to customers—this is mostly about simplifying local approval pathways.", "sme": "", "gr": "", "sponsor": "Senator Javier L. Cervantes (D)", "last": "Placed on Calendar Order of 3rd Reading March 26, 2026 (in the Senate)", "hearing": "", "tags": "2026, coats, pending"}, {"state": "IL", "bill": "SB3830", "title": "DATA CENTERS-VARIOUS", "industry": "Data Centers", "script": "SB3830 sets up a data‑center self‑direct program under the IPA Act, letting large data‑center customers lower the renewable‑energy procurement charges they pay if they bring new additive clean‑energy generation online. It doesn’t directly change interconnection rules or service obligations, but it could shape expectations around who pays what when big loads show up—especially if more developers pursue self‑direct options as part of their project planning. The SME question is whether this shift in REC‑cost responsibility could indirectly affect upgrade funding, timing pressures, or utility‑customer negotiations during rapid large‑load development.", "sme": "SB3830 would impose a new “data center tariff” (including tripled REA/BES charges with offsets for qualifying self‑supply), require a rapid, revenue‑neutral rate‑design filing within 90 days, and layer significant water/energy reporting and self‑direct program administration on data centers—creating conflicts with existing customer‑choice frameworks and potentially implicating FERC‑jurisdictional transmission cost recovery. For Ameren, this adds administrative and compliance burden, planning uncertainty, and a high likelihood of deterring data center development in AIC territory (pushing prospects to co‑ops/municipals), which could blunt load growth and economic development. Financial impacts are difficult to quantify but likely include increased utility administration costs, cost‑shifting risks, and reduced siting competitiveness. Recommended position: Oppose, with improvements to relocate tariff language to the proper statute (e.g., 16‑108), phase and align timelines with utility planning cycles, clarify interactions with RPS/self‑direct programs, ensure regulatory consistency across energy/water rules, allow flexible compliance pathways, and assess statewide competitiveness effects.", "gr": "Industry stakeholders are opposing all data center legislation this session because of the broader cumulative impact these bills could have on utilities, including higher compliance costs, stricter operational requirements, and increased uncertainty around future infrastructure planning and investment.", "sponsor": "Senator Rachel Ventura (D)", "last": "Rule 2-10 Committee Deadline Established As April 24, 2026 (in the Senate)", "hearing": "Senate Executive Subcommittee on AI and Social Media | April 9, 2026 at 1:30pm and April 10, 2026 at noon", "tags": "2026, coats, Oppose"}, {"state": "IL", "bill": "SB3838", "title": "BROADBAND DEPLOYMENT ACT", "industry": "Broadband Deployment", "script": "SB3838 creates a new Broadband Deployment Act, laying out findings and definitions but not adding any new permitting, siting, or county‑level procedures. It’s essentially a policy‑framing bill for broadband expansion, not a land‑use or energy‑storage measure. So no—it doesn’t slow projects or create county‑facing compliance obligations, and its impacts stay within broadband planning rather than storage development.", "sme": "This bill is designed to help expand broadband in unserved rural and urban areas by giving broadband grant recipients easier access to highway rights‑of‑way for middle‑mile infrastructure. Ameren is mostly unaffected because utilities are explicitly exempt from the bill, meaning we continue operating under existing pole‑attachment rules and existing law. The only minor exposure would be if any Ameren facilities happened to sit in an IDOT right‑of‑way, but even then broadband providers cannot use this bill to avoid standard pole‑attachment fees. The financial impact is minimal, though Ameren could miss out on potential fiber‑leasing revenue since the bill does not allow utilities to compete in the middle‑mile space.", "gr": "", "sponsor": "Senator Paul Faraci (D)", "last": "Placed on Calendar Order of 2nd Reading March 24, 2026 (in the Senate)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "SB3856", "title": "BIPA-SECURITY PURPOSE", "industry": "BIPA", "script": "SB3856 updates Illinois’ Biometric Information Privacy Act to spell out a broad “security purpose” definition—covering things like preventing theft or fraud, controlling access to property, protecting people from harm, and assisting law‑enforcement investigations. This is a privacy/usage clarification, not a siting or permitting change, so it doesn’t add steps that slow energy‑storage projects or create new county‑facing obligations. Practically, it may even ease compliance for facilities that use biometrics for access control, though companies should still keep their BIPA notices, consent, retention schedules, and security practices up to date.", "sme": "", "gr": "", "sponsor": "Senator John F. Curran (R)", "last": "Referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, coats, pending"}, {"state": "IL", "bill": "SB3890", "title": "CONSUMER DATA PRIVACY", "industry": "Data Privacy", "script": "SB3890 establishes a broad Data Privacy Protection Act that applies to companies handling large volumes of Illinois consumers’ personal data or generating significant revenue from selling it. It sets requirements around how personal data is processed, secured, and how consumers must be notified if there’s a breach. This is a data‑privacy bill, not a land‑use or permitting bill—so it does not add steps that slow energy‑storage projects or create new county‑facing compliance obligations; its impacts stay entirely on the information‑governance side.", "sme": "SB3890 establishes a broad statewide consumer data privacy framework, expanding individual rights and imposing significant new compliance obligations on covered entities. While Ameren supports strong privacy protections, the bill could create substantial administrative, technological, and operational burdens for utilities that already follow strict federal and state data security standards—potentially requiring new technology, dedicated staff, and ongoing audits. Implementation and maintenance costs could reach several million dollars and ultimately affect customers. A neutral position with targeted refinements is recommended, along with improvements such as recognizing existing utility privacy frameworks, reducing duplicative requirements, allowing flexible compliance pathways, and considering exemptions for entities that do not sell consumer data.", "gr": "", "sponsor": "Senator Rachel Ventura (D)", "last": "Rule 2-10 Committee Deadline Established As April 24, 2026 (in the Senate)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "SB3927", "title": "CLEAN ENERGY-WORKFORCE HUBS", "industry": "Clean Energy Transition", "script": "SB3927 expands the Clean Jobs Workforce Hubs under the Energy Transition Act so they specifically target outreach, training, and placement for people pursuing climate, environmental, and clean‑energy careers, and it formally defines what that sector includes. It doesn’t change IPA procurement rules or program eligibility, and it doesn’t add new reporting for utilities—its impacts sit with DCEO and workforce partners. So no, it doesn’t roll back new obligations or costs to customers, though it could subtly shape market participation by growing the clean‑energy talent pipeline.", "sme": "", "gr": "", "sponsor": "Senator Lakesia Collins (D)", "last": "Referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, coats, pending"}, {"state": "IL", "bill": "SB3929", "title": "ENVIORNMENTAL GOAL EXTENSIONS", "industry": "Clean Energy Transition", "script": "SB3929 moves Illinois’ clean‑energy target from 2050 to 2060, resetting the long‑term policy direction in the Illinois Power Agency Act and making a technical conforming change in the PUA. That shift doesn’t directly change ICC authority, utility obligations, or cost‑recovery rules, but it does recalibrate expectations about the pace of the transition and could influence long‑range planning assumptions. SME input will help confirm whether extending the target effectively eases compliance pressure or materially changes how utilities model future investments.", "sme": "The proposal moves Illinois’ clean energy target from 2050 to 2060 and extends utility performance metric timelines by 10 years, easing the pace of the state’s clean energy transition. This delay could help reduce near‑term resource adequacy shortfalls and potentially suppress capacity prices, with possible implications for Ameren Missouri’s Illinois‑based generation. We could support the measure depending on the political environment, as the emissions delay aligns with reliability and cost considerations. However, the performance metrics extension feels unrelated to the bill’s core intent and may benefit from clarification or removal.", "gr": "", "sponsor": "Senator Donald P. DeWitte (R)", "last": "Referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "SB3970", "title": "UTILITY-COST-BENEFIT ANALYSIS", "industry": "Gas", "script": "SB3970 requires the ICC to run a full, independent cost‑benefit analysis before it can approve any gas‑system decarbonization pathway or mandate—looking at lifecycle emissions, systemwide costs, stranded‑asset risk, rate impacts, equity concerns, reliability, workforce effects, and whether market‑based options could do the job more cheaply. That’s a major procedural hurdle for gas‑sector policymaking, but it doesn’t add county‑level steps or slow down energy‑storage projects, since the bill’s requirements sit entirely within ICC decision‑making. The main impact is on how fast the Commission can move on gas‑system pilots or mandates, not on local permitting or storage‑project timelines.", "sme": "", "gr": "", "sponsor": "Senator Seth Lewis (R)", "last": "Referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, coats, pending"}, {"state": "IL", "bill": "SB3974", "title": "GAS APPLIANCE LABELING", "industry": "Gas", "script": "SB3974 requires that any non‑externally vented natural‑gas appliance manufactured after January 1, 2027 carry a specific safety warning label, and it gives the Attorney General authority to set additional formatting and placement rules for that label. It’s strictly a consumer‑product labeling bill, so it doesn’t add steps that slow down storage projects or create new county‑facing compliance obligations. The impacts fall on appliance manufacturers and retailers—not on energy‑storage siting, permitting, or local approvals.", "sme": "", "gr": "", "sponsor": "Senator Graciela Guzman (D)", "last": "Rule 2-10 Committee Deadline Established As April 24, 2026 (in the Senate)", "hearing": "", "tags": "2026, coats, Oppose"}, {"state": "IL", "bill": "SB3979", "title": "UTILITIES-REGULATORY TAKINGS", "industry": "Gas", "script": "SB3979 would require every decarbonization pilot, pathway, or gas‑system infrastructure plan coming out of the ICC’s Future of Gas proceeding (Docket 24‑0158) to complete a Regulatory Takings Assessment before it can be approved. That adds a Commission‑level procedural step, but it doesn’t create county‑facing requirements or slow down energy‑storage projects, since it applies only to gas‑system regulatory actions. The practical impact is on ICC timelines and analysis—not local permitting or storage‑related compliance.", "sme": "The bill seeks to ensure that Future of Gas (FoG) decarbonization policies do not unintentionally create an uncompensated regulatory taking of utility assets, and that ICC decision‑making relies on consistent metrics such as customer bill impacts, equity considerations, and alignment with IEPA pollution standards. It could help protect gas‑asset value by reducing the risk that policy‑driven mandates prematurely strand infrastructure, though the ultimate effect depends on how terms like “mandate” and “risk” are defined in ICC rulemaking. Customer and company financial impacts are uncertain but could be stabilizing if the bill avoids premature asset write‑downs or abrupt compliance costs. Recommended position: Support, contingent on political context.", "gr": "", "sponsor": "Senator Donald P. DeWitte (R)", "last": "Referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, coats, Support"}, {"state": "IL", "bill": "SB4003", "title": "UTILITIES-RESTORE VARIOUS", "industry": "Energy Storage", "script": "SB4003 removes an existing provision in the Illinois Finance Authority Act related to energy‑storage projects and makes a corresponding update in the Illinois Power Agency Act. It doesn’t introduce new siting rules, county‑level procedures, or permitting steps—so it doesn’t slow down projects or create new local compliance obligations. The real impact depends on what specific financing authority was removed, but on its face this bill doesn’t touch storage siting, safety reviews, or county interactions.", "sme": "This proposal rolls back multiple CRGA cost adders and program elements, including REA inflation adjustments, ETAC increases, the storage standard and its rate, the stand‑alone storage net‑metering requirement, and the storage rebate—while adding a least‑cost procurement mandate to the IPA Act. For Ameren, the changes are operationally manageable and would mainly unwind tariff and program work currently in development. Customers would likely see noticeable bill savings, though long‑term supply impacts are uncertain if these rollbacks are not paired with changes to emissions‑related constraints. Recommended position: Neutral.", "gr": "", "sponsor": "Senator Chapin Rose (R)", "last": "Referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "SB4016", "title": "HYPERSCALE DATA CENTERS", "industry": "Data Centers", "script": "SB4016 creates a sweeping regulatory framework for hyperscale data centers—covering cumulative‑impact assessments, public notice, community‑benefit agreements, bans on NDAs, annual peak‑demand fees, water‑resource planning, quarterly water‑use reporting, and a new Water Impact Permit with hearings and 5‑year renewals. Most of these obligations fall on developers, but the volume of new studies, permits, and public‑process steps could definitely slow how quickly big loads move from concept to interconnection. The SME question is whether these added requirements materially change service expectations, interconnection timelines, or upgrade‑cost responsibility when a hyperscale load shows up fast—and whether utilities will be pulled into water‑planning or peak‑demand reporting dynamics.", "sme": "SB4016 addresses real environmental, water, and infrastructure concerns from hyperscale data centers but does so through prescriptive mandates that, from a utility economic development lens, risk reducing flexibility, slowing responsible projects, and undermining competitive supply choice by imposing tariffs and responsibilities on AIC for services it does not provide. The bill could affect Ameren by making Illinois less competitive for large mobile loads, adding planning/coordination/reporting complexity, and creating conflicts with existing customer‑choice frameworks and even extending utility responsibility over customer backup generation. Financially, data centers could face significant new fees and compliance costs; utilities would incur new administrative costs and systems work, with potential indirect downside if projects relocate or slow. Recommended stance: neutral with targeted concerns (Whitfield) or oppose in current form (Jones), coupled with improvements to emphasize partnership over mandates, preserve competitive supply choice, clarify utility roles/cost recovery and what constitutes a “mandate,” streamline/standardize reporting and fees (e.g., move to a fixed $/kW), and correct technical references (e.g., Sections citing 16‑105.5).", "gr": "Industry stakeholders are opposing all data center legislation this session because of the broader cumulative impact these bills could have on utilities, including higher compliance costs, stricter operational requirements, and increased uncertainty aroun", "sponsor": "Senator Ram Villivalam (D)", "last": "Rule 2-10 Committee Deadline Established As April 24, 2026 (in the Senate)", "hearing": "Senate Executive Subcommittee on AI and Social Media | April 9, 2026 at 1:30pm and April 10, 2026 at noon", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "SB4020", "title": "DISTRICT ENERGY STORAGE", "industry": "Energy Storage", "script": "SB4020 creates a new District Energy and Thermal Energy Storage Parity Act, giving the ICC an optional certification program for district‑energy infrastructure and directing IEPA to run a grant program to help fund qualifying projects. It’s a voluntary certification/financing structure—not a siting or permitting change—so it doesn’t add steps that slow projects or create new county‑facing compliance obligations. Any effects would come only if a developer chooses to participate in the certification or grant program, not from new local requirements.", "sme": "", "gr": "", "sponsor": "Senator Bill Cunningham (D)", "last": "Referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, coats, pending"}, {"state": "IL", "bill": "SB2181", "title": "DATA CENTER REPORTING", "industry": "Data Centers", "script": "Creates the Illinois Data Center Energy and Water Reporting Act. Defines terms. Provides that, beginning January 1, 2026, all data centers operating within the State shall annually report the data center's energy and water consumption to the Illinois Power Agency for the preceding calendar year. Sets forth requirements for the content of the report. Provides that reports shall be submitted to the Agency no later than March 31 of each year. Sets forth provisions concerning data confidentiality and public access to information and the enforcement of the Act and penalties. Provides that the Agency shall conduct a comprehensive study on the impact that var DEFAULT_SOURCE = {name:"tracker.xlsx"};
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];

var STANCE_LABEL={Oppose:"Oppose",Support:"Support",Neutral:"Neutral / watch",Open:"No position yet"};
var STANCE_ORDER={Oppose:0,Support:1,Open:2,Neutral:3};
var STAGE_LABEL={floor:"Floor calendar",hearing:"Hearing noticed",deadline:"Committee deadline set",referred:"Awaiting committee",none:"No action recorded"};
var MOM={floor:4,hearing:3,deadline:2,referred:1,none:0};
var TODAY=new Date();

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pct(n,t){return t?Math.round(n/t*100):0}
function plural(n,w,p){return n+" "+(n===1?w:(p||w+"s"))}
function fmtDate(d){return MON3[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear()}
function daysBetween(a,b){return Math.round((b-a)/864e5)}

/* ---------- normalization ---------- */
function tagOf(t){
  var s=(t||"").toLowerCase();
  if(!s.trim()) return "Untagged";
  if(s.indexOf("support/neutral")>-1) return "Support/Neutral";
  if(s.indexOf("oppose")>-1) return "Oppose";
  if(s.indexOf("support")>-1) return "Support";
  if(s.indexOf("neutral")>-1) return "Neutral";
  if(s.indexOf("pending")>-1) return "Pending";
  if(s.indexOf("shell")>-1) return "Watch";
  return "Untagged";
}
function groupOf(tag){
  if(tag==="Oppose") return "Oppose";
  if(tag==="Support") return "Support";
  if(tag==="Pending"||tag==="Untagged") return "Open";
  return "Neutral";
}
var IND_FIX={"energy efficiemcy":"Energy Efficiency","solar energy":"Solar"};
function cleanIndustry(s){var k=(s||"").trim(); return IND_FIX[k.toLowerCase()]||k||"Unspecified"}
function parseDates(text){
  var out=[],re=/(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2}),\s*(\d{4})/g,m;
  while((m=re.exec(text||""))){out.push(new Date(+m[3],MONTHS.indexOf(m[1]),+m[2]))}
  return out;
}
var SME_RX=[
  /\bwe (?:could |would )(support|oppose)\b/i,
  /\bwe (support|oppose) (?:the|this) (?:bill|measure|concept|proposal|legislation)\b/i,
  /\b(opposition|support) is recommended\b/i,
  /\brecommend(?:ation|ed)?(?: position)?(?: is| of|:)?(?: to)? (support|oppose)\b/i,
  /\ba (support|oppose) position is recommended\b/i
];
function smeLean(sme){
  for(var i=0;i<SME_RX.length;i++){
    var m=SME_RX[i].exec(sme||"");
    if(m){var w=m[1].toLowerCase(); return w==="opposition"?"oppose":w}
  }
  return "";
}
function stageOf(last,hearing){
  var l=last||"";
  if(/3rd Reading/i.test(l)) return {key:"floor",label:"Floor: 3rd reading"};
  if(/2nd Reading/i.test(l)) return {key:"floor",label:"Floor: 2nd reading"};
  if(/Committee Deadline/i.test(l)) return {key:"deadline",label:"Committee deadline set"};
  if(/Re-referred/i.test(l)) return {key:"referred",label:/Rules/i.test(l)?"House Rules (re-referred)":"Senate Assignments (re-referred)"};
  if(/Rules Committee/i.test(l)) return {key:"referred",label:"House Rules"};
  if(/Assignments/i.test(l)) return {key:"referred",label:"Senate Assignments"};
  if(hearing) return {key:"hearing",label:"Hearing noticed"};
  return {key:"none",label:"No action recorded"};
}
function compute(rows){
  var partyBy={};
  var pre=rows.filter(function(r){return r.bill}).map(function(r){
    var m=String(r.sponsor||"").replace(/\s+/g," ").trim();
    var pm=m.match(/\(([DRI])\)\s*$/);
    var name=m.replace(/\s*\([DRI]\)\s*$/,"").replace(/^(Representative|Senator|Sen\.|Rep\.)\s+/i,"").trim();
    if(pm) partyBy[name]=pm[1];
    return Object.assign({},r,{_name:name,_party:pm?pm[1]:"",_partyFilled:false});
  });
  return pre.map(function(r){
    var b=Object.assign({},r);
    b.bill=String(r.bill).trim();
    b.sme=(r.sme||"").trim(); b.gr=(r.gr||"").trim(); b.script=(r.script||"").trim();
    b.last=(r.last||"").replace(/\s+/g," ").trim(); b.hearing=(r.hearing||"").replace(/\s+/g," ").trim();
    b.tag=tagOf(r.tags); b.stance=groupOf(b.tag);
    b.industry=cleanIndustry(r.industry); b.industryRaw=(r.industry||"").trim();
    var st=stageOf(b.last,b.hearing); b.stageKey=st.key; b.stage=st.label;
    b.momentum=b.stageKey==="floor"?4:(b.hearing?3:MOM[b.stageKey]);
    b.chamber=/^H/i.test(b.bill)?"House":"Senate";
    if(!b._party && partyBy[b._name]){b._party=partyBy[b._name]; b._partyFilled=true}
    b.hasSME=!!b.sme;
    var lean=smeLean(b.sme); b.lean=lean;
    b.drift=false;
    if(lean){
      if(b.tag==="Neutral"||b.tag==="Pending"||b.tag==="Untagged") b.drift=true;
      if(b.tag==="Support"&&lean==="oppose") b.drift=true;
      if(b.tag==="Oppose"&&lean==="support") b.drift=true;
    }
    b.flags=[];
    if(b.stageKey==="floor") b.flags.push(["Floor calendar","key"]);
    if(b.hearing) b.flags.push(["Hearing noticed","key"]);
    if(b.stance==="Open") b.flags.push(["No position","warn"]);
    if(!b.hasSME) b.flags.push(["No SME feedback","warn"]);
    if(b.drift) b.flags.push(["Tag vs SME text","warn"]);
    b.score=b.momentum*2+(b.stance==="Open"?2:0)+(!b.hasSME?1:0)+(b.drift?2:0)+(b.stance==="Oppose"?1:0);
    b.dates=[];
    parseDates(b.last).forEach(function(d){b.dates.push({d:d,type:/Committee Deadline/i.test(b.last)?"Committee deadline":(/3rd Reading/i.test(b.last)?"Placed on 3rd reading calendar":(/2nd Reading/i.test(b.last)?"Placed on 2nd reading calendar":b.last))})});
    if(b.hearing){
      var hn=b.hearing.split("|")[0].trim();
      parseDates(b.hearing).forEach(function(d){b.dates.push({d:d,type:"Hearing: "+hn})});
    }
    return b;
  });
}

function weekEnding(name){
  var m=/WE[_\s-]?(\d{2})(\d{2})(\d{2})/i.exec(name||"");
  if(!m) return "";
  return MON3[+m[1]-1]+" "+(+m[2])+", 20"+m[3];
}
function stat(bs){
  var o={total:bs.length,Oppose:0,Support:0,Neutral:0,Open:0,pending:0,untagged:0,noSME:0,movers:0,moversOpen:0,moversNoSME:0,floor:0,hearing:0,deadline:0,referred:0,none:0,house:0,senate:0,houseRules:0,senateAssign:0,rereferred:0,drift:[],floorBills:[],D:0,R:0,I:0,Q:0};
  bs.forEach(function(b){
    o[b.stance]++; if(b.tag==="Pending")o.pending++; if(b.tag==="Untagged")o.untagged++;
    if(!b.hasSME)o.noSME++;
    o[b.stageKey]++;
    if(b.momentum>=2){o.movers++; if(b.stance==="Open")o.moversOpen++; if(!b.hasSME)o.moversNoSME++}
    if(b.chamber==="House")o.house++; else o.senate++;
    if(b.stageKey==="referred"){ if(/Rules/i.test(b.stage))o.houseRules++; else o.senateAssign++; if(/re-referred/i.test(b.stage))o.rereferred++ }
    if(b.drift)o.drift.push(b);
    if(b.stageKey==="floor")o.floorBills.push(b);
    if(b._party==="D")o.D++; else if(b._party==="R")o.R++; else if(b._party==="I")o.I++; else o.Q++;
  });
  return o;
}
function countBy(bs,fn){var m={};bs.forEach(function(b){var k=fn(b);m[k]=(m[k]||0)+1});return m}

/* ---------- render: header ---------- */
function renderHeader(S){
  var we=weekEnding(source.name);
  document.getElementById("eyebrow").textContent="RTC tracked bills"+(we?" · week ending "+we:"")+" · "+S.total+" bills";
  var latest=null;
  bills.forEach(function(b){b.dates.forEach(function(x){if(!latest||x.d>latest)latest=x.d})});
  var el=document.getElementById("fresh");
  if(latest){
    var ago=daysBetween(latest,TODAY);
    el.hidden=false;
    el.textContent=ago>=0?("Latest dated event: "+fmtDate(latest)+" ("+ago+" days ago)"):("Next dated event: "+fmtDate(latest)+" (in "+(-ago)+" days)");
    el.title="Latest date found in the Last Action and Scheduled Hearing columns";
  } else el.hidden=true;
}

  var h=top.map(function(k){
    var opp=sp[k].bills.filter(function(b){return b.stance==="Oppose"}).length;
    return '<div class="row"><button class="lbl" data-act="filter" data-f="sponsor='+esc(k)+'" title="'+esc(k)+'">'+esc(k)+(sp[k].party?' ('+sp[k].party+')':'')+'</button><div class="bar" style="width:'+(sp[k].n/max*100)+'%"><div class="seg" style="flex:1;background:var(--stage-3)" data-tip="'+esc(k)+': '+plural(sp[k].n,'bill')+(opp?', '+opp+' opposed':'')+'"></div></div><div class="n">'+sp[k].n+'</div></div>';
  }).join("");
  var twos=names.filter(function(k){return sp[k].n===2}).length, ones=names.filter(function(k){return sp[k].n===1}).length;
  var tot=S.D+S.R+S.I+S.Q||1;
  document.getElementById("sponsors").innerHTML='<div class="card-head"><div><h2>Sponsor concentration</h2><p class="sub">Primary sponsors with the most bills in the portfolio.</p></div></div><div class="rows">'+h+'</div>'+
    '<p class="sub" style="margin-top:12px">'+names.length+' sponsors in total'+(thr>=3?': '+twos+' with 2 bills, '+ones+' with 1.':'.')+'</p>'+
    '<div class="splitbar" data-tip="Bills by sponsor party"><i class="party-d" style="flex:'+S.D+'"></i><i class="party-r" style="flex:'+S.R+'"></i>'+(S.Q+S.I?'<i style="flex:'+(S.Q+S.I)+';background:var(--line)"></i>':'')+'</div>'+
    '<div class="legend"><span><i class="sw party-d"></i>Democratic sponsors <b>'+S.D+'</b></span><span><i class="sw party-r"></i>Republican <b>'+S.R+'</b></span></div>';
}

/* ---------- render: dates ---------- */
function renderDates(){
  var ev={};
  bills.forEach(function(b){b.dates.forEach(function(x){var k=x.d.getTime()+"|"+x.type; if(!ev[k])ev[k]={d:x.d,type:x.type,bills:[]}; ev[k].bills.push(b)})});
  var list=Object.keys(ev).map(function(k){return ev[k]}).sort(function(a,b){return a.d-b.d||a.type.localeCompare(b.type)});
  var h=list.map(function(e){
    var ago=daysBetween(e.d,TODAY), rel=ago>0?(ago+" days ago"):(ago===0?"today":("in "+(-ago)+" days"));
    var chips=e.bills.slice(0,8).map(function(b){return '<button class="chip link" data-act="open" data-bill="'+esc(b.bill)+'">'+esc(b.bill)+'</button>'}).join("");
    if(e.bills.length>8) chips+='<span class="chip">+'+(e.bills.length-8)+' more</span>';
    return '<div class="led"><div class="dt">'+MON3[e.d.getMonth()]+' '+e.d.getDate()+'<small>'+rel+'</small></div><div><div class="ev"><b>'+plural(e.bills.length,"bill")+'</b> · '+esc(e.type)+'</div><div class="chips">'+chips+'</div></div></div>';
  }).join("");
  document.getElementById("dates").innerHTML='<div class="card-head"><div><h2>Key dates in the tracker</h2><p class="sub">Every date found in Last Action and Scheduled Hearing.</p></div></div><div class="ledger">'+(h||'<p class="sub">No dated events in the tracker.</p>')+'</div>';
}

/* ---------- render: watchlist ---------- */
function chipStance(b){return '<span class="chip"><i class="sw '+b.stance.toLowerCase()+'"></i>'+esc(b.tag==="Untagged"?"No tag":b.tag)+'</span>'}
function flagChips(b){return b.flags.map(function(f){return '<span class="chip '+(f[1]==="warn"?"warnflag":"flag")+'">'+f[0]+'</span>'}).join(" ")}
function renderWatch(){
  var list=bills.filter(function(b){return b.flags.length&&b.momentum>=2}).sort(function(a,b){return b.score-a.score||a.bill.localeCompare(b.bill)}).slice(0,10);
  var h=list.map(function(b){
    return '<tr class="clk" data-act="open" data-bill="'+esc(b.bill)+'" tabindex="0"><td class="bill">'+esc(b.bill)+'</td><td class="ttl">'+esc(b.title)+'<span class="sub2">'+esc(b.industry)+'</span></td><td>'+chipStance(b)+'</td><td>'+esc(b.stage)+'</td><td style="display:flex;flex-wrap:wrap;gap:4px">'+flagChips(b)+'</td></tr>';
  }).join("");
  document.getElementById("watch").innerHTML='<div class="card-head"><div><h2>Priority watchlist</h2><p class="sub">Bills with a floor date, hearing or committee deadline, ranked by stage, then open decisions and missing SME input.</p></div></div><div class="tablewrap"><table><thead><tr><th>Bill</th><th>Title</th><th>Stance</th><th>Stage</th><th>Flags</th></tr></thead><tbody>'+(h||'<tr><td colspan="5">Nothing flagged.</td></tr>')+'</tbody></table></div>';
}

/* ---------- explorer ---------- */
function filtered(){
  var q=F.q.trim().toLowerCase();
  var out=bills.filter(function(b){
    if(q && (b.bill+" "+b.title+" "+b.industry+" "+b._name+" "+b.sme+" "+b.script).toLowerCase().indexOf(q)===-1) return false;
    if(F.stance && b.stance!==F.stance) return false;
    if(F.industry && b.industry!==F.industry) return false;
    if(F.stage && b.stageKey!==F.stage) return false;
    if(F.chamber && b.chamber!==F.chamber) return false;
    if(F.sponsor && b._name!==F.sponsor) return false;
    if(F.flag==="noSME" && b.hasSME) return false;
    if(F.flag==="drift" && !b.drift) return false;
    if(F.flag==="hearing" && !b.hearing) return false;
    return true;
  });
  var k=F.sort,d=F.dir;
  out.sort(function(a,b){
    var r=0;
    if(k==="stage") r=(a.momentum-b.momentum)||(a.score-b.score);
    else if(k==="stance") r=STANCE_ORDER[a.stance]-STANCE_ORDER[b.stance];
    else if(k==="sme") r=(a.hasSME?1:0)-(b.hasSME?1:0);
    else if(k==="bill") r=a.bill.localeCompare(b.bill,undefined,{numeric:true});
    else if(k==="sponsor") r=a._name.localeCompare(b._name);
    else r=String(a[k]).localeCompare(String(b[k]));
    return r*d||a.bill.localeCompare(b.bill,undefined,{numeric:true});
  });
  return out;
}
function opt(v,l,cur){return '<option value="'+esc(v)+'"'+(cur===v?' selected':'')+'>'+esc(l)+'</option>'}
function renderFilters(){
  var inds=Object.keys(countBy(bills,function(b){return b.industry})).sort();
  var h='<input id="f-q" type="search" placeholder="Search bill, title, sponsor, feedback" value="'+esc(F.q)+'" aria-label="Search bills">'+
   '<select id="f-stance" aria-label="Stance">'+opt("","All stances",F.stance)+["Oppose","Support","Neutral","Open"].map(function(k){return opt(k,STANCE_LABEL[k],F.stance)}).join("")+'</select>'+
   '<select id="f-industry" aria-label="Industry">'+opt("","All industries",F.industry)+inds.map(function(k){return opt(k,k,F.industry)}).join("")+'</select>'+
   '<select id="f-stage" aria-label="Stage">'+opt("","All stages",F.stage)+["floor","hearing","deadline","referred","none"].map(function(k){return opt(k,STAGE_LABEL[k],F.stage)}).join("")+'</select>'+
   '<select id="f-chamber" aria-label="Chamber">'+opt("","Both chambers",F.chamber)+opt("House","House",F.chamber)+opt("Senate","Senate",F.chamber)+'</select>'+
   '<select id="f-flag" aria-label="Flags">'+opt("","Any flag",F.flag)+opt("noSME","No SME feedback",F.flag)+opt("drift","Tag vs SME text",F.flag)+opt("hearing","Hearing noticed",F.flag)+'</select>'+
   '<span class="count" id="count"></span>'+
   '<button class="btn small" data-act="reset">Reset</button><button class="btn small" data-act="copy">Copy list</button>';
  document.getElementById("filters").innerHTML=h;
}
function renderActive(){
  var chips=[];
  if(F.sponsor) chips.push('Sponsor: '+F.sponsor);
  var h=chips.map(function(c){return '<span class="chip link" data-act="clearSponsor" title="Remove filter">'+esc(c)+' ×</span>'}).join("");
  document.getElementById("activef").innerHTML=h;
}
function renderTable(){
  var rows=filtered();
  var c=document.getElementById("count"); if(c) c.textContent=rows.length+" of "+bills.length+" bills";
  function th(k,l){var on=F.sort===k; return '<th aria-sort="'+(on?(F.dir>0?"ascending":"descending"):"none")+'"><button data-act="sort" data-k="'+k+'">'+l+(on?' <span class="arr">'+(F.dir>0?"▲":"▼")+'</span>':'')+'</button></th>'}
  var h='<thead><tr>'+th("bill","Bill")+th("title","Title")+th("industry","Industry")+th("stance","Stance")+th("stage","Stage")+th("sponsor","Sponsor")+th("sme","SME")+'</tr></thead><tbody>';
  rows.forEach(function(b){
    h+='<tr class="clk" data-act="open" data-bill="'+esc(b.bill)+'" tabindex="0"><td class="bill">'+esc(b.bill)+'</td><td class="ttl">'+esc(b.title)+(b.hearing?'<span class="sub2">Hearing: '+esc(b.hearing.split("|").pop().trim())+'</span>':'')+'</td><td>'+esc(b.industry)+'</td><td>'+chipStance(b)+(b.drift?' <span class="chip warnflag" data-tip="SME text reads '+esc(b.lean)+'">review</span>':'')+'</td><td>'+esc(b.stage)+'</td><td>'+esc(b._name)+(b._party?' ('+b._party+')':'')+'</td><td class="'+(b.hasSME?'sme-y':'sme-n')+'">'+(b.hasSME?'On file':'Missing')+'</td></tr>';
  });
  if(!rows.length) h+='<tr><td colspan="7" style="padding:24px;text-align:center;color:var(--ink-3)">No bills match these filters.</td></tr>';
  document.getElementById("tbl").innerHTML=h+'</tbody>';
}

/* ---------- data quality ---------- */
function renderDQ(S){
  var items=[];
  var typo=bills.filter(function(b){return b.industryRaw!==b.industry});
  if(typo.length) items.push("<b>"+plural(typo.length,"bill")+"</b> had an industry label normalized for the charts: "+Object.keys(countBy(typo,function(b){return b.industryRaw+" → "+b.industry})).map(esc).join("; ")+".");
  var fc=bills.filter(function(b){return /fuel cells/i.test(b.industryRaw)&&!/hydrogen/i.test(b.title)});
  if(fc.length) items.push("<b>"+plural(fc.length,"bill")+" have industry labels that look misapplied</b> ("+fc.map(function(b){return esc(b.bill)+" “"+esc(b.industryRaw)+"”"}).join(", ")+"). Titles read as gas and generation. Left as entered.");
  var ut=bills.filter(function(b){return b.tag==="Untagged"});
  if(ut.length) items.push("<b>"+plural(ut.length,"bill")+" have no Team Categories tag</b>: "+ut.map(billLink).join(", ")+". Counted as no position yet.");
  var nl=bills.filter(function(b){return !b.last});
  if(nl.length) items.push("<b>"+plural(nl.length,"bill")+" have no Last Action</b>, only a hearing notice: "+nl.map(billLink).join(", ")+".");
  var pf=bills.filter(function(b){return b._partyFilled});
  if(pf.length) items.push("<b>"+plural(pf.length,"sponsor entry","sponsor entries")+" had no party</b> in the source. Party was filled from the same sponsor on other bills.");
  items.push("<b>"+S.noSME+" bills have no SME feedback.</b> Use the explorer's “No SME feedback” flag to list them.");
  items.push("<b>Tag vs SME text</b> is a keyword read of explicit recommendation phrases in the SME feedback. It is a prompt to re-check the tag, not a determination.");
  var wt=bills.filter(function(b){return b.tag==="Watch"}).length;
  if(wt) items.push(plural(wt,"shell bill")+" tagged watch-only are grouped with Neutral.");
  document.getElementById("dq").innerHTML='<div class="card-head"><div><h2>Data notes</h2><p class="sub">What was cleaned or inferred to build this view. Source fields are unchanged.</p></div></div><ul class="dq" style="list-style:none;padding:0">'+items.map(function(i){return '<li>'+i+'</li>'}).join("")+'</ul>';
  document.getElementById("foot").textContent="Source: "+source.name+" (Full Context sheet). Stage, stance and sponsor party are derived from the Last Action, Team Categories and Primary Sponsor columns.";
}

/* ---------- changes (after loading a new tracker) ---------- */
function renderChanges(){
  var el=document.getElementById("changes");
  if(!changes){el.innerHTML="";return}
  function list(a,f){return a.length?'<ul>'+a.slice(0,12).map(f).join("")+(a.length>12?'<li>+'+(a.length-12)+' more</li>':'')+'</ul>':'<p class="sub">None</p>'}
  el.innerHTML='<section class="card"><div class="card-head"><div><h2>What changed</h2><p class="sub">'+esc(changes.from)+' → '+esc(changes.to)+'</p></div></div><div class="chg-grid">'+
   '<div><h4>New bills ('+changes.added.length+')</h4>'+list(changes.added,function(b){return '<li>'+billLink(b)+' '+esc(b.title)+'</li>'})+'</div>'+
   '<div><h4>Removed ('+changes.removed.length+')</h4>'+list(changes.removed,function(b){return '<li>'+esc(b.bill)+' '+esc(b.title)+'</li>'})+'</div>'+
   '<div><h4>Stage moved ('+changes.stage.length+')</h4>'+list(changes.stage,function(c){return '<li>'+billLink(c.b)+': '+esc(c.from)+' → '+esc(c.to)+'</li>'})+'</div>'+
   '<div><h4>Position changed ('+changes.stance.length+')</h4>'+list(changes.stance,function(c){return '<li>'+billLink(c.b)+': '+esc(c.from)+' → '+esc(c.to)+'</li>'})+'</div>'+
   '</div></section>';
}
function diff(oldB,newB,fromLabel,toLabel){
  var om={},nm={}; oldB.forEach(function(b){om[b.bill]=b}); newB.forEach(function(b){nm[b.bill]=b});
  var c={from:fromLabel,to:toLabel,added:[],removed:[],stage:[],stance:[]};
  newB.forEach(function(b){var o=om[b.bill]; if(!o){c.added.push(b);return}
    if(o.stage!==b.stage) c.stage.push({b:b,from:o.stage,to:b.stage});
    if(o.tag!==b.tag) c.stance.push({b:b,from:o.tag,to:b.tag});});
  oldB.forEach(function(b){if(!nm[b.bill]) c.removed.push(b)});
  return c;
}

/* ---------- drawer ---------- */
function openBill(id){
  var b=bills.filter(function(x){return x.bill===id})[0]; if(!b) return;
  var txt=function(s,empty){return s?'<div class="txt">'+esc(s)+'</div>':'<div class="empty">'+empty+'</div>'};
  var h='<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="'+esc(b.bill)+'"><header><div><div class="eyebrow">'+esc(b.bill)+' · '+esc(b.industry)+'</div><h3>'+esc(b.title)+'</h3><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">'+chipStance(b)+'<span class="chip">'+esc(b.stage)+'</span>'+flagChips(b)+'</div></div><button class="btn small" data-act="close" id="closeBtn">Close</button></header><div class="body">'+
   '<dl class="meta"><dt>Sponsor</dt><dd>'+esc(b._name)+(b._party?' ('+b._party+')':'')+'</dd><dt>Last action</dt><dd>'+esc(b.last||"None on file")+'</dd><dt>Hearing</dt><dd>'+esc(b.hearing||"None scheduled")+'</dd><dt>Tracker tags</dt><dd>'+esc(b.tags||"None")+'</dd></dl>'+
   (b.drift?'<div class="note-box">The SME feedback reads <b>'+esc(b.lean)+'</b>, but the tracker tag is <b>'+esc(b.tag)+'</b>. Confirm which is current.</div>':'')+
   '<div><h4>SME feedback</h4>'+txt(b.sme,"No SME feedback on file.")+'</div>'+
   '<div><h4>GR position considerations</h4>'+txt(b.gr,"None recorded.")+'</div>'+
   '<div><h4>Meeting script</h4>'+txt(b.script,"None recorded.")+'</div></div></aside>';
  document.getElementById("overlay").innerHTML=h;
  var cb=document.getElementById("closeBtn"); if(cb) cb.focus();
}
function closeDrawer(){document.getElementById("overlay").innerHTML=""}

/* ---------- actions ---------- */
function setFilters(str){
  FILTER_KEYS.forEach(function(k){F[k]=""});
  (str||"").split(";").forEach(function(p){var i=p.indexOf("="); if(i>0){var k=p.slice(0,i),v=p.slice(i+1); if(FILTER_KEYS.indexOf(k)>-1) F[k]=v}});
  renderFilters(); renderActive(); renderTable();
  var ex=document.getElementById("explorer"); if(ex&&ex.scrollIntoView) ex.scrollIntoView({behavior:"smooth",block:"start"});
}
function toast(msg){
  var t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
  setTimeout(function(){t.remove()},2200);
}
function copyList(){
  var rows=filtered();
  var tsv=["Bill\tTitle\tIndustry\tStance\tStage\tSponsor\tSME feedback"].concat(rows.map(function(b){return [b.bill,b.title,b.industry,b.tag,b.stage,b._name+(b._party?" ("+b._party+")":""),b.hasSME?"On file":"Missing"].join("\t")})).join("\n");
  function fallback(){var ta=document.createElement("textarea");ta.value=tsv;document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){} ta.remove(); toast(ok?"Copied "+rows.length+" bills":"Copy was blocked. Select rows manually.")}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tsv).then(function(){toast("Copied "+rows.length+" bills")},fallback)} else fallback();
}
function showBanner(msg,err){var b=document.getElementById("banner");b.hidden=!msg;b.className="banner"+(err?" err":"");b.textContent=msg||""}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]"); if(!t) return;
  var a=t.getAttribute("data-act");
  if(a==="filter"){setFilters(t.getAttribute("data-f"))}
  else if(a==="open"){openBill(t.getAttribute("data-bill"))}
  else if(a==="close"){closeDrawer()}
  else if(a==="sort"){var k=t.getAttribute("data-k"); if(F.sort===k)F.dir=-F.dir; else{F.sort=k;F.dir=(k==="stage")?-1:1} renderTable()}
  else if(a==="reset"){setFilters("");}
  else if(a==="clearSponsor"){F.sponsor="";renderActive();renderTable()}
  else if(a==="copy"){copyList()}
  else if(a==="upload"){document.getElementById("file").click()}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape") closeDrawer();
  if((e.key==="Enter"||e.key===" ")&&e.target&&e.target.matches&&e.target.matches("tr.clk")){e.preventDefault();openBill(e.target.getAttribute("data-bill"))}
});
document.addEventListener("input",function(e){if(e.target.id==="f-q"){F.q=e.target.value;renderTable()}});
document.addEventListener("change",function(e){
  var m=/^f-(stance|industry|stage|chamber|flag)$/.exec(e.target.id||"");
  if(m){F[m[1]]=e.target.value;renderTable()}
});

/* tooltip */
var tip=document.getElementById("tip");
document.addEventListener("mouseover",function(e){var t=e.target.closest&&e.target.closest("[data-tip]"); if(!t){tip.hidden=true;return} tip.textContent=t.getAttribute("data-tip"); tip.hidden=false});
document.addEventListener("mousemove",function(e){if(tip.hidden)return; var x=e.clientX+14,y=e.clientY+16; if(x+tip.offsetWidth>window.innerWidth-8)x=e.clientX-tip.offsetWidth-14; if(y+tip.offsetHeight>window.innerHeight-8)y=e.clientY-tip.offsetHeight-12; tip.style.left=x+"px";tip.style.top=y+"px"});
document.addEventListener("scroll",function(){tip.hidden=true},true);

/* upload */
var fileInput=document.getElementById("file");
if(typeof XLSX==="undefined"){document.getElementById("uploadBtn").title="The spreadsheet reader did not load, so uploads are unavailable in this view."}
fileInput.addEventListener("change",function(){
  var f=fileInput.files&&fileInput.files[0]; if(!f) return;
  if(typeof XLSX==="undefined"){showBanner("The spreadsheet reader could not load, so the file cannot be read here.",true);return}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:"array"});
      var name=wb.SheetNames.indexOf("Full Context")>-1?"Full Context":wb.SheetNames[0];
      var json=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:"",raw:false});
      var rows=json.map(function(r){var o={state:"",bill:"",title:"",industry:"",script:"",sme:"",gr:"",sponsor:"",last:"",hearing:"",tags:""};
        Object.keys(r).forEach(function(k){var m=COLS[String(k).trim().toLowerCase()]; if(m) o[m]=String(r[k]==null?"":r[k]).trim()}); return o});
      if(!rows.some(function(r){return r.bill})){showBanner("No Bill column found. Use the same columns as the Full Context sheet.",true);return}
      var nb=compute(rows);
      var fromLabel=weekEnding(source.name)||source.name, toLabel=weekEnding(f.name)||f.name;
      changes=diff(bills,nb,fromLabel,toLabel);
      bills=nb; source={name:f.name};
      showBanner("Loaded "+nb.length+" bills from "+f.name+". Changes from the previous load are shown below the read-out.",false);
      renderAll();
    }catch(err){showBanner("That file could not be read: "+(err&&err.message||err),true)}
    fileInput.value="";
  };
  rd.readAsArrayBuffer(f);
});
var COLS={"state":"state","bill":"bill","title":"title","industry":"industry","meeting script":"script","sme feedback":"sme","gr position considerations":"gr","primary sponsor":"sponsor","last action":"last","scheduled hearing":"hearing","team categories":"tags"};

function renderAll(){
  var S=stat(bills);
  renderHeader(S); renderBand(S); renderReads(S); renderChanges(); renderIndustry(); renderPipeline(S); renderSponsors(S); renderDates(); renderWatch();
  renderFilters(); renderActive(); renderTable(); renderDQ(S);
}
renderAll();
window.__bills=bills; /* inspection aid */
})();
</script>
