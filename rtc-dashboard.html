<style>
/* Layout: one-screen executive band (hero + KPI tiles + read-out), then charts, watchlist, and a full bill explorer with a detail drawer. */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --surface-2:#f6f7f9;
  --ink:#12161d; --ink-2:#465061; --ink-3:#667085;
  --line:#e2e5ea; --line-2:#c9ced6;
  --accent:#1f63bd; --accent-ink:#ffffff; --accent-wash:#e7eefa;
  --c-oppose:#eb6834; --c-support:#2a78d6; --c-neutral:#9aa1ad; --c-open:#eda100;
  --stage-1:#86b6ef; --stage-2:#3987e5; --stage-3:#256abf; --stage-4:#184f95;
  --warn-wash:#fdf3dc; --warn-ink:#7a5200;
  --serif:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --surface:#161a21; --surface-2:#1b2029;
    --ink:#eef1f5; --ink-2:#b3bbc8; --ink-3:#8b94a3;
    --line:#262c36; --line-2:#363d4a;
    --accent:#6da7ec; --accent-ink:#0e1116; --accent-wash:#1a2740;
    --c-oppose:#d95926; --c-support:#3987e5; --c-neutral:#5f6877; --c-open:#c98500;
    --stage-1:#184f95; --stage-2:#256abf; --stage-3:#3987e5; --stage-4:#86b6ef;
    --warn-wash:#2c2310; --warn-ink:#f0c46a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#161a21; --surface-2:#1b2029;
  --ink:#eef1f5; --ink-2:#b3bbc8; --ink-3:#8b94a3;
  --line:#262c36; --line-2:#363d4a;
  --accent:#6da7ec; --accent-ink:#0e1116; --accent-wash:#1a2740;
  --c-oppose:#d95926; --c-support:#3987e5; --c-neutral:#5f6877; --c-open:#c98500;
  --stage-1:#184f95; --stage-2:#256abf; --stage-3:#3987e5; --stage-4:#86b6ef;
  --warn-wash:#2c2310; --warn-ink:#f0c46a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:20px 56px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:4px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance;margin-top:4px}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:7px 12px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.small{padding:4px 9px;font-size:13px}
.fresh{display:inline-flex;align-items:center;gap:8px;background:var(--warn-wash);color:var(--warn-ink);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.fresh::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c-open)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;min-width:0}
.card h2{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.25}
.card .sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline;margin-bottom:14px}

/* executive band */
.band{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px}
.hero{display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.hero-num{font-size:68px;line-height:1;font-weight:700;letter-spacing:-.02em}
.hero-label{font-size:15px;color:var(--ink-2);margin-top:6px}
.hero-meta{color:var(--ink-3);font-size:13px;margin-top:2px}
.stackbar{display:flex;gap:2px;height:22px}
.stackbar .seg{border-radius:2px}
.stackbar .seg:last-child{border-radius:2px 4px 4px 2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.sw.oppose,.seg.oppose{background:var(--c-oppose)}
.sw.support,.seg.support{background:var(--c-support)}
.sw.neutral,.seg.neutral{background:var(--c-neutral)}
.sw.open,.seg.open{background:var(--c-open)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.tile .k{font-size:13px;color:var(--ink-2);font-weight:600}
.tile .v{font-size:32px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.tile .v small{font-size:15px;font-weight:600;color:var(--ink-3);margin-left:6px}
.tile .d{font-size:13px;color:var(--ink-3)}

/* read-out */
.reads{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
.read{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.read:nth-child(-n+2){border-top:0}
.read .lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-top:2px}
.read p{color:var(--ink-2)}
.read b{color:var(--ink);font-weight:600}
.billref{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:2px}
.billref:hover{text-decoration-color:currentColor}

/* chart rows */
.grid2{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px}
.grid2b{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:12px;align-items:center;min-height:26px}
.row .lbl{font-size:13px;color:var(--ink-2);text-align:left;background:none;border:0;padding:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .lbl:hover{color:var(--accent);text-decoration:underline}
.row .n{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:2px;height:20px}
.bar .seg{border-radius:2px;cursor:pointer;min-width:3px}
.bar .seg:last-child{border-radius:2px 4px 4px 2px}
.bar .seg:hover{filter:brightness(1.12)}
.bar.single .seg{background:var(--stage-3)}
.stagerow{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:2px 0}
.stagerow .head{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.stagerow .head b{font-weight:600}
.stagerow .head span{color:var(--ink-3);font-variant-numeric:tabular-nums}
.stagerow .note{font-size:12px;color:var(--ink-3)}
.stagebtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:block;width:100%}
.stagebtn:hover .head b{color:var(--accent)}
.s1{background:var(--stage-1)} .s2{background:var(--stage-2)} .s3{background:var(--stage-3)} .s4{background:var(--stage-4)}
.splitbar{display:flex;gap:2px;height:10px;margin-top:6px}
.splitbar i{display:block;border-radius:2px}
.party-d{background:var(--ink-2)} .party-r{background:var(--line-2)}

/* ledger */
.ledger{display:flex;flex-direction:column}
.led{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.led:first-child{border-top:0;padding-top:0}
.led .dt{font-weight:700;font-variant-numeric:tabular-nums}
.led .dt small{display:block;font-weight:500;color:var(--ink-3);font-size:12px}
.led .ev{color:var(--ink-2)}
.led .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip .sw{width:8px;height:8px;border-radius:50%}
.chip.flag{background:transparent;border-color:var(--line-2)}
.chip.warnflag{background:var(--warn-wash);border-color:transparent;color:var(--warn-ink)}
.chip.link{cursor:pointer;background:var(--accent-wash);border-color:transparent;color:var(--accent)}
.chip.link:hover{filter:brightness(.95)}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;position:sticky;top:0}
th button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer}
th button:hover{color:var(--ink)}
th .arr{opacity:.7}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover td{background:var(--surface-2)}
td.bill{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
td.ttl{min-width:200px}
td .sub2{display:block;color:var(--ink-3);font-size:12px}
.sme-y{color:var(--ink-2)} .sme-n{color:var(--warn-ink);font-weight:600}
.scroll-y{max-height:640px;overflow:auto}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input,.filters select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:6px 10px;min-width:0}
.filters input{flex:1 1 220px}
.filters select{flex:0 1 170px}
.count{color:var(--ink-3);font-size:13px;margin-left:auto}
.activef{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer header{padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.drawer h3{font-family:var(--serif);font-size:20px;line-height:1.25}
.drawer .body{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.drawer .meta{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:13px}
.drawer .meta dt{color:var(--ink-3)} .drawer .meta dd{margin:0}
.drawer h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.drawer .txt{white-space:pre-wrap;color:var(--ink-2)}
.drawer .empty{color:var(--ink-3);font-style:italic}
.note-box{background:var(--warn-wash);color:var(--warn-ink);border-radius:6px;padding:10px 12px;font-size:13px}

/* misc */
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:5px;max-width:280px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:40;font-weight:600}
.banner{border-radius:8px;padding:12px 16px;background:var(--accent-wash);color:var(--ink)}
.banner.err{background:var(--warn-wash);color:var(--warn-ink)}
.dq{display:grid;grid-template-columns:1fr 1fr;gap:10px 32px}
.dq li{color:var(--ink-2)} .dq ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.chg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.chg-grid h4{margin:0 0 6px;font-size:13px}
.chg-grid ul{margin:0;padding-left:18px;color:var(--ink-2)}
.foot{color:var(--ink-3);font-size:12px}
@media (max-width:980px){
  .band,.grid2,.grid2b{grid-template-columns:minmax(0,1fr)}
  .reads,.dq{grid-template-columns:minmax(0,1fr)}
  .read:nth-child(2){border-top:1px solid var(--line)}
}
@media (max-width:560px){
  h1{font-size:25px}
  .hero-num{font-size:56px}
  .tiles{grid-template-columns:minmax(0,1fr)}
  .read{grid-template-columns:minmax(0,1fr);gap:2px}
  .row{grid-template-columns:minmax(0,1fr) 36px;gap:4px 8px}
  .row .lbl{grid-column:1 / span 2}
  .row .bar{grid-column:1}
  .row .n{grid-column:2}
  .card{padding:16px}
  .count{margin-left:0;flex-basis:100%}
}
@media (prefers-reduced-motion: no-preference){
  .tile,.btn{transition:border-color .12s,color .12s}
}
</style>

<style>.hubbar{padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);font-family:var(--sans);font-size:14px}.hubbar b{font-family:var(--serif);color:var(--accent)}.privtag{background:#fde8e6;color:#8f1d12;border-left:5px solid #b42318;padding:8px 14px;border-radius:0 8px 8px 0;font-size:13.5px}@media (prefers-color-scheme:dark){.privtag{background:#35191a;color:#f6b1aa}}</style>

<script>
(function(){
"use strict";
var RAW = [{"state": "IL", "bill": "HB4172", "title": "UTILITY-PROJECT COST RECOVERY", "industry": "Data Centers", "script": "HB4172 blocks electric utilities from requiring big new customers—like data centers—to put up security deposits, letters of credit, or other financial assurances as long as they apply under existing ICC‑approved tariffs and stay in good standing. It also prevents utilities from slowing or deferring upgrades or interconnection work because those financial requirements are no longer allowed. The big question ahead is whether this shifts expectations around timelines, cost responsibility, or upgrade sequencing when large loads land fast—initial read leans oppose, pending SME confirmation.n.", "sme": "This bill removes all financial protections for utilities by prohibiting them from requiring deposits, letters of credit, or other financial security from large‑load customers before construction begins. As written, it forces the utility—and ultimately existing customers—to absorb all upfront and credit risk if a speculative project cancels, delays, or downsizes after upgrades are underway. The potential exposure could reach tens of millions of dollars, and the measure would also strain already‑backlogged interconnection queues by encouraging a surge in low‑commitment applicants. For these reasons, we oppose the bill; it eliminates essential safeguards without offering any alternative protections for ratepayers.", "gr": "Tagged Oppose in tracker. Likely concern: cost, mandates, or expanded liability without clear funding or operational feasibility. Check: cost allocation language, timing/obligation to serve, and any limits on enforcing milestones/standards. (Initial; verify with SMEs.)", "sponsor": "Representative Dave Vella (D)", "last": "Referred to Rules Committee (in the House)", "hearing": "", "tags": "coats, 2026, oppose"}, {"state": "IL", "bill": "HB4272", "title": "GAS APPLIANCE LABELING", "industry": "Gas", "script": "HB4272 requires that any non‑externally vented natural gas appliance manufactured after January 1, 2027 carry a specific warning label, and it gives the Attorney General authority to set rules on how that label must look and where it goes. This is really a consumer‑product labeling bill, not a siting or permitting bill, so it does not add steps that slow down storage projects or create new county‑facing compliance obligations. Its impacts fall on appliance manufacturers and retailers—not on energy storage development or local approval processes.", "sme": "This bill would require warning labels on any unvented natural gas appliance manufactured after January 1, 2027—effectively targeting stoves, ovens, and dryers, even though most other gas appliances (like furnaces and water heaters) already vent outdoors. While it doesn’t directly affect Ameren operations, it contributes to a public perception that natural gas appliances are unsafe and may rely on disputed research linking gas stoves to indoor pollution. Because the scientific basis is unclear and industry groups like AGA have challenged the methodology and conclusions of commonly cited studies, we would oppose the measure, particularly as applied to gas stoves. A reasonable improvement would be to exempt cooktops, ovens, and dryers and limit the bill’s scope to appliances where venting is actually relevant.", "gr": "Tagged Oppose in tracker. Likely concern: cost, mandates, or expanded liability without clear funding or operational feasibility. Check: county requirements, NFPA references, decommissioning/security, and drainage/ag impacts. (Initial; verify with SMEs.)\nSponsor does not plan on moving forward with his gas stove labeling bill (HB 4272) this session. He wants to do a subject matter hearing on the bill after the deadline, but that’s about as far as things will go.", "sponsor": "Representative Michael Crawford (D)", "last": "Rule 19(a) / Re-referred to Rules Committee (in the House)", "hearing": "", "tags": "2026, coats, Oppose"}, {"state": "IL", "bill": "HB4319", "title": "DATA CENTER-PROPERTY RTS", "industry": "Data Centers", "script": "HB4319 would let property owners within 1,000 feet of a data center seek compensation for things like noise, lighting, traffic, or even reduced property value, and it sets up a formal appraisal process to determine those impacts. It doesn’t regulate Ameren directly, but it could influence how quickly or confidently developers move forward if they see higher liability or community‑impact risk. The key SME question is whether this could indirectly shift expectations around interconnection timing, required studies, or cost responsibility when big new loads show up fast.", "sme": "The bill would allow property and business owners within 1,000 feet of a data center to seek compensation for demonstrable impacts such as noise, lighting, traffic, vibration, stormwater issues, reduced property value, or lost revenue. While Ameren would not face direct liability, the bill could significantly increase development risk and legal exposure for data center operators, potentially slowing or discouraging projects that represent major electric load growth. Any slowdown in data center investment could indirectly affect Ameren through reduced long‑term load growth, delayed revenue, and diminished customer affordability benefits tied to large‑scale load additions. For these reasons, the recommended position is oppose, with improvements such as requiring mitigation before compensation, narrowing the impact radius, using objective impact standards, adjusting compensation formulas, and limiting permit‑suspension authority.", "gr": "Industry stakeholders are opposing all data center legislation this session because of the broader cumulative impact these bills could have on utilities, including higher compliance costs, stricter operational requirements, and increased uncertainty around future infrastructure planning and investment.", "sponsor": "Representative Jed Davis (R)", "last": "Referred to Rules Committee (in the House)", "hearing": "", "tags": "2026, coats, Oppose"}, {"state": "IL", "bill": "HB4419", "title": "COUNTY/MUNI-NATURAL GAS", "industry": "Gas", "script": "HB4419 would prevent counties and municipalities from banning—or effectively banning—the use of natural gas in new construction unless voters approve such a policy through a referendum, and it limits home‑rule authority in this area. The bill fits squarely into the broader statewide debate over building electrification, local control, and the long‑term future of natural gas in homes and businesses. For Ameren, it does not directly affect operations but could influence public perception, policymaker expectations, and the narrative around natural gas use in new buildings. A neutral position is appropriate pending SME confirmation, with the key question being whether this sets a precedent that shapes future gas‑policy debates or customer behavior.", "sme": "This bill would prevent counties or municipalities from banning natural gas in new construction unless voters approve it through a referendum. That approach protects continued access to natural gas and supports ongoing customer connections. The financial impact is preventative rather than direct, as it avoids potential losses in areas that might otherwise restrict new gas service. We support the concept, and the measure could be improved by clarifying referendum procedures and ensuring consistent statewide standards for how such local decisions are presented to voters.", "gr": "Tagged Neutral in tracker. Focus on technical cleanup and avoiding unintended consequences. Check: preemption vs. local control, consumer messaging, and enforcement scope. (Initial; verify with SMEs.)", "sponsor": "Representative Jackie Haas (R)", "last": "Referred to Rules Committee (in the House)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "HB4798", "title": "EPA-GHG EMISSION LIMITS", "industry": "Gas Generation", "script": "HB4798 lets large generators keep running during emergency, pre‑emergency, or conservative‑operations conditions and ties all flexibility on greenhouse‑gas rules to whether statewide battery storage hits 10% of Illinois’ installed capacity. It doesn’t directly change siting or interconnection rules, but it does raise questions about how generators document emergency‑operations status and how the State tracks storage levels to trigger or withhold compliance relief. The main thing for SMEs to weigh in on is whether any of this could indirectly slow project timelines or add procedural steps for developers, counties, or utilities—especially around verification of operating conditions or statewide storage thresholds.", "sme": "This proposal appears aimed at delaying the retirement of certain generating units, keeping them online longer to support system reliability. For Ameren Illinois, extending these retirements would help maintain capacity supply and could place downward pressure on future capacity prices, benefiting customers. The financial impact is positive but dependent on market conditions, with the hope of lower capacity costs due to preserved generation availability. Based on this, we would support the measure, and no specific improvements are recommended at this time.", "gr": "", "sponsor": "Representative Lawrence \"Larry\" Walsh, Jr. (D)", "last": "Rule 19(a) / Re-referred to Rules Committee (in the House)", "hearing": "", "tags": "coats, Support, 2026"}, {"state": "IL", "bill": "HB4830", "title": "AGRIVOLTAIC SYSTEMS", "industry": "Solar", "script": "HB4830 creates a tight, statutory definition of what counts as an “agrivoltaic system,” making sure only solar projects that include real, ongoing agricultural production—not just pollinator habitat—qualify under Illinois’ dual‑use framework. It mainly affects developers and IPA program eligibility, and at first glance doesn’t look like it changes ICC authority, utility obligations, or cost‑recovery rules under the PUA. The key SME question is whether this new definition could indirectly shape utility review or interconnection processes if developers shift designs to meet the new agrivoltaic standards.", "sme": "", "gr": "", "sponsor": "Representative Michelle Mussman (D)", "last": "Rule 19(a) / Re-referred to Rules Committee (in the House)", "hearing": "", "tags": "coats, pending, 2026"}, {"state": "IL", "bill": "HB4910", "title": "CLEAN ENERGY-WORKFORCE HUBS", "industry": "Clean Energy Transition", "script": "HB4910 expands the Clean Jobs Workforce Hubs to offer more targeted outreach, training, and job‑placement services for people entering climate, environmental, and clean‑energy careers, and it adds new reporting requirements that break program data out by race, gender, geography, and equity status. For Ameren, the question is whether these changes shift procurement rules, program eligibility, or reporting obligations tied to utility‑funded programs; at first read, the impacts seem aimed at DCEO and workforce partners rather than utilities. SME review will help confirm whether the new data‑collection and equity requirements create any indirect compliance or customer‑program impacts.", "sme": "This proposal would require clean energy and broadband developers to enter a lot of detailed information into new state databases, which could slow some projects down with extra paperwork. or Ameren, the impact is minimal, though our transmission or locating work could show up in the database when we support interconnection or broadband deployment. There is no real financial impact on Ameren or our customers, since most costs would fall on developers or be covered through existing renewable‑energy funds. A neutral position makes sense, especially since the bill creates a lot of reporting without offering much real benefit, and the process could be improved by reducing the amount of unnecessary data collection.", "gr": "", "sponsor": "Representative Lisa Davis (D)", "last": "Rule 19(a) / Re-referred to Rules Committee (in the House)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "HB4940", "title": "UTILITY-IPA PROCUREMENT", "industry": "Clean Energy Transition", "script": "HB4940 would require the IPA and DCEO to build new statewide project databases—covering clean‑energy and broadband—and let them hire a third‑party administrator outside the usual state procurement process. Developers would have to enter and maintain detailed project information, so the real impact is added reporting and administrative work. The key question for SMEs is whether these new data requirements end up slowing projects or creating indirect compliance steps that affect utilities through delays in siting, storage deployment, or local coordination.", "sme": "The bill would require developers of clean‑energy and broadband projects to enter detailed information into new statewide public databases before starting work and to keep updating those records until project completion. While this creates significant administrative requirements for developers—especially smaller contractors—it has minimal direct impact on Ameren, aside from the possibility of being listed as a supplier for interconnection or pole‑attachment‑related work. The financial impact on Ameren or its customers is minimal, but the added reporting could slow down some renewable or broadband projects. A neutral position is recommended, though the bill would be more practical if the database requirements were streamlined or better justified, as the current approach creates administrative burdens without a clear policy benefit.", "gr": "", "sponsor": "Representative Jay Hoffman (D)", "last": "Rule 19(a) / Re-referred to Rules Committee (in the House)", "hearing": "", "tags": "2026, Neutral, coats"}, {"state": "IL", "bill": "HB4956", "title": "LOC GOV-ENERGY STORAGE SYSTEMS", "industry": "Energy Storage", "script": "HB4956 tightens county rules for energy‑storage projects by requiring more detailed farmland‑drainage plans, mandating decommissioning plans, and baking NFPA‑based safety and repair standards into local approvals. It also forces storage developers to enter agricultural impact mitigation agreements, which adds more upfront paperwork and ongoing compliance. The big question for SMEs is whether these extra county steps could slow project timelines or create new local interactions that indirectly affect utility construction or interconnection work.", "sme": "“HB4956, SB3078, and SB3409 carry the same substantive requirements for energy storage siting under the Counties Code: they shift drainage repair procedures into the AIMA, make decommissioning plans and NFPA‑based safety documentation mandatory, require one AIMA per system, and keep a signed AIMA on site during construction/deconstruction. The only differences are the bill numbers, chambers, and sponsors.” Neutral", "gr": "", "sponsor": "Representative Steven Reick (R)", "last": "Referred to Rules Committee (in the House)", "hearing": "", "tags": "Neutral, 2026, coats"}, {"state": "IL", "bill": "HB4989", "title": "DATA CENTER HEATING/COOLING", "industry": "Data Centers", "script": "HB4989 would require every new and existing data center in Illinois to develop a heat‑reuse plan using an air‑to‑water heat exchanger that can supply thermal energy to nearby homes or businesses. It’s part of the broader push to manage the impacts of fast‑growing data‑center load, and it could affect how developers plan and coordinate their projects. The key SME question is whether these new heat‑reuse requirements could indirectly influence utility timelines—especially interconnection, service planning, or cost‑responsibility—if developers need closer coordination with the utility to meet the mandate.", "sme": "The bill would require all data centers to implement waste‑heat reuse systems and mandate liquid‑cooling technology for large new facilities—aiming to improve efficiency and community benefit but doing so through rigid, prescriptive requirements. From Ameren’s perspective, the concern is not with the goal of efficiency but with mandates that may be impractical, uneconomic, or technologically premature, especially since heat‑reuse only works where dense heating loads and thermal networks already exist. These requirements could make Illinois less competitive for data center development, which risks losing significant load growth that helps lower delivery rates and supports economic development. A neutral‑with‑concerns position is recommended, with improvements focused on technology‑neutral performance goals, targeted heat‑reuse requirements only where viable, and greater flexibility for future innovation.", "gr": "Industry stakeholders are opposing all data center legislation this session because of the broader cumulative impact these bills could have on utilities, including higher compliance costs, stricter operational requirements, and increased uncertainty around future infrastructure planning and investment.", "sponsor": "Representative Kimberly Du Buclet (D)", "last": "Referred to Rules Committee (in the House)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "HB4994", "title": "CDB-STRETCH ENERGY CODE", "industry": "Energy Efficiemcy", "script": "HB4994 would let both counties and municipalities—not just municipalities—adopt the Illinois Stretch Energy Code, which effectively broadens where higher‑efficiency building standards can apply. It doesn’t directly change IPA procurement rules, program eligibility, or reporting requirements, but it could shape market participation by influencing where advanced efficiency measures become required or commonplace. SME review can confirm whether broader Stretch Code adoption could indirectly affect customer‑facing program costs or compliance expectations.", "sme": "This proposal would allow counties, in addition to municipalities, to adopt the Stretch Energy Code, which includes more stringent efficiency requirements and electrification‑readiness standards beyond the 2024 IECC. While this could increase the number of new buildings designed for higher efficiency and future electrification, adoption in Ameren’s largely southern and rural service territory is expected to be low, resulting in minimal near‑term business or financial impacts. Over time, broader adoption could reduce natural gas consumption while increasing electric load and winter peak demand. Based on current expectations, the recommended position is neutral, with potential improvement through better coordination between county adoption decisions and utility grid‑readiness planning.", "gr": "", "sponsor": "Representative Robyn Gabel (D)", "last": "Rule 19(a) / Re-referred to Rules Committee (in the House)", "hearing": "", "tags": "coats, 2026, Neutral"}, {"state": "IL", "bill": "HB4996", "title": "UTILITIES-VARIOUS", "industry": "VPP", "script": "HB4996 tweaks the VPP program by setting a floor on compensation for eligible storage systems ($250/kWh if the customer doesn’t take a separate storage rebate; $0/kWh if they did) and requiring utilities to let customers quickly share their data with aggregators. This is a program/compensation and data‑sharing change—it doesn’t add county‑facing permitting steps or slow siting for storage projects. The practical lift is on utilities and aggregators (IT/privacy workflows, consent and data pipelines), not on local approvals.", "sme": "This proposal makes several changes affecting DER interconnection, including reducing the maximum community solar project size back to 5MW and adding unclear requirements for utilities to “allow and enable” data sharing between customers and DER aggregators. Reducing the project size renews incentives for developers to co‑locate multiple 5MW systems—an operational challenge that can create voltage‑stability issues—and the data‑sharing language could impose new obligations on Ameren depending on how broadly it is interpreted. The bill also introduces significant potential financial exposure by establishing VPP rebates without a cost‑recovery mechanism, including payments of $250/kWh that could reach hundreds of millions of dollars if applied to EVs. Based on these impacts, the recommended position is to oppose the legislation as written, with improvements needed to maintain the 10MW cap, clarify the utility’s data‑sharing obligations, and ensure all rebates flow through established cost‑recovery processes and are justified through the IRP framework.", "gr": "", "sponsor": "Representative Robyn Gabel (D)", "last": "Rule 19(a) / Re-referred to Rules Committee (in the House)", "hearing": "", "tags": "2026, Oppose, coats"}, {"state": "IL", "bill": "HB5049", "title": "LOC GOV-RESIDENTIAL ENERGY", "industry": "Energy Storage", "script": "HB5049 basically says local governments can’t create their own rules for installing or inspecting residential energy backup systems, even in buildings with shared roofs. It doesn’t change IPA procurement or program eligibility, but it could make it easier for customers to install backup systems by cutting out local permitting hurdles. So the impact is more about smoothing the path for customer adoption than shifting major regulatory requirements.", "sme": "", "gr": "Pending in tracker. Needs SME review before recommending a posture. Check: eligibility definitions, procurement mechanics, and any new reporting/penalties. (Initial; verify with SMEs.)", "sponsor": "Representative Ann M. Williams (D)", "last": "Rule 19(a) / Re-referred to Rules Committee (in the House)", "hearing": "", "tags": "Neutral, 2026, coats"}, {"state": "IL", "bill": "HB5194", "title": "INC TAX-ENERGY CHOICE", "industry": "Clean Energy Transition", "script": "This bill creates a new income tax credit equal to 20% of the wages a qualified utility or power‑generation company pays to a “qualified energy choice worker” in Illinois. To claim it, the company has to show that the state’s mandated clean‑energy phaseout dates (2030–2045) are creating a real, material impact on its workforce or ability to operate. It doesn’t change procurement or program rules, but it could indirectly shape workforce planning and cost impacts for utilities navigating the transition.", "sme": "AIC wouldn’t benefit from this bill as currently written, because we don’t own or operate the generation that’s being phased out. So there’s no direct impact on our customers or on our business.\nIf anything, the only suggestion we’d have is that the bill could be improved by making the credit available to all utilities, not just generation companies. But overall, our position is neutral.”", "gr": "", "sponsor": "Representative Lawrence \"Larry\" Walsh, Jr. (D)", "last": "Rule 19(a) / Re-referred to Rules Committee (in the House)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "HB5221", "title": "CONSUMER DATA PRIVACY ACT", "industry": "Data Privacy", "script": "HB5221 creates a broad Consumer Data Privacy Act that gives people new rights over how their personal data is collected, used, and shared—things like opting out of targeted ads, data sales, or automated decision‑making. It mainly governs relationships between data controllers and processors, not energy storage developers or local governments. So, no—this one doesn’t add steps that slow down projects or create new county‑facing compliance obligations; its impacts sit in the general privacy/compliance space, not storage siting or permitting.", "sme": "This proposal creates broad new consumer data‑protection rights that would apply to Illinois businesses, including Ameren, and may raise internal concerns requiring review by Enterprise Analytics, Digital Policy & Risk, and other data‑governance functions. As written, the bill would require significant new technology investments, ongoing operating costs, and additional personnel to manage compliance and customer requests, and could also interfere with Ameren’s ability to administer energy‑assistance programs when customers request deletion of required data. While customer‑data protection is important, Ameren’s position is that these requirements should focus on companies that profit from selling or aggregating personal data—not utilities that collect limited data solely to provide essential services. Based on this analysis, the recommended position is to oppose the bill as drafted and seek improvements, including an exemption for utilities similar to IL SB3548 and other states’ privacy laws.", "gr": "", "sponsor": "Representative Edgar Gonzalez, Jr. (D)", "last": "Rule 19(a) / Re-referred to Rules Committee (in the House)", "hearing": "", "tags": "2026, coats, Oppose"}, {"state": "IL", "bill": "HB5366", "title": "EPA-APPLIANCE STANDARDS", "industry": "Energy Efficiemcy", "script": "HB5366 creates a new Illinois Appliance Standards Act that directs IEPA to set minimum efficiency standards and require testing, certification, and labeling for certain products sold in the state. It doesn’t change IPA procurement rules, program eligibility, or reporting requirements, so utilities and renewable developers wouldn’t see new obligations roll back to customers. The biggest impacts are market‑side—manufacturers and retailers adjusting to updated standards—rather than anything that slows projects or affects IPA program participation.", "sme": "The bill establishes appliance efficiency standards that take effect shortly after adoption and may influence how Ameren Illinois approaches energy‑efficiency program design. In practice, AIC would likely continue offering product incentives until the new standards are in place and then shift toward a Market Transformation strategy, which provides lower‑cost savings with minimal risk to overall energy‑efficiency goals. Financially, the bill could actually reduce program costs by enabling AIC to claim less‑expensive market‑driven savings. A neutral‑to‑support position is recommended from an affordability standpoint, with the only improvement being an update to statutory dates that have already passed.", "gr": "Representative Canty’s appliance efficiency bill (HB 5366) will not be moving this session.", "sponsor": "Representative Mary Beth Canty (D)", "last": "Placed on Calendar 2nd Reading - Short Debate (in the House)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "HB5374", "title": "EPA-ENVIRONMENTAL JUSTICE", "industry": "Environmental Justice", "script": "HB5374 updates the Environmental Protection Act to recognize that certain communities face disproportionate environmental impacts and formally defines terms related to environmental justice areas. On its own, it doesn’t create new permits, review steps, or county‑level requirements for energy storage projects. So no—it doesn’t add steps that slow down projects or create new county-facing compliance obligations, but it could signal future policy direction around siting sensitivity in EJ areas.", "sme": "The proposal appears to add additional bureaucratic steps and regulatory burden for projects in designated areas, which raises concerns about complexity and administrative impact. It may also apply to existing infrastructure—such as regulator stations or gas odorizers—creating uncertainty about retroactive compliance requirements. The financial impact is difficult to estimate without mapping which Ameren facilities fall within the designated zones. A neutral to slightly opposed position is recommended, with the primary improvement being the removal of any retroactive applicability.", "gr": "", "sponsor": "Representative Diane Blair-Sherlock (D)", "last": "Rule 19(a) / Re-referred to Rules Committee (in the House)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "HB5429", "title": "DISTRICT ENERGY STORAGE", "industry": "TENS", "script": "HB5429 creates the new District Energy and Thermal Energy Storage Parity Act, setting up an optional ICC certification process for district‑energy infrastructure and directing IEPA to run a grant program to support qualifying projects. It’s essentially a voluntary certification and funding framework, not a siting or permitting bill, so it doesn’t add county‑level steps or slow down energy‑storage projects. The main lift falls on projects that choose to pursue certification or grants—not on utilities or local governments.", "sme": "This bill expands state support for district energy and thermal energy storage by treating dispatchable thermal storage similarly to battery storage for programs, incentives, and procurements, while also requiring utilities to help develop measurement and verification standards and new or expanded rebate programs. Although the specific impacts will depend on future ICC proceedings, the bill could shift heating load from gas to electric systems and impose significant administrative, planning, metering, and interconnection‑process burdens on Ameren, including the need for additional FTEs. Financial implications may include gas rate‑base erosion and the cost of supporting a new interconnection track and expanded customer programs. A neutral to oppose‑as‑written position is recommended unless improved to ensure cost recovery, define key terms (such as “district energy company”), prevent cost‑shifting to non‑participants, and clarify rate stabilization and utility responsibilities.", "gr": "", "sponsor": "Representative Jay Hoffman (D)", "last": "Rule 19(a) / Re-referred to Rules Committee (in the House)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "HB5438", "title": "BROWNFIELD PHOTOVOLATIC REGS", "industry": "Solar", "script": "HB5438 adds large solar projects—including utility‑scale brownfield PV and systems over 5 MW—to the list of High Impact Businesses that can be located in enterprise zones, and it makes related updates to the IPA Act. This mainly expands eligibility for incentives rather than creating new siting or permitting hoops. So no—it doesn’t add steps that slow down energy‑storage projects or create new county‑facing compliance obligations; it’s more about making certain solar projects qualify for economic‑development treatment.", "sme": "The bill expands eligibility for Illinois Enterprise Zone “High Impact Business” incentives to include utility‑scale solar projects and large brownfield solar projects over 5 MW, while updating the definition of brownfield solar so projects qualify if at least half of the panels sit on officially designated brownfield land. For Ameren, the primary effect would be a likely increase in interconnection applications as more solar developers pursue these incentives, which could add workload for DER planning, engineering studies, and coordination. The financial impact would be modest—mostly administrative—though not zero if application volume increases. A neutral position is recommended, as the bill does not harm Ameren or materially affect power supply costs.", "gr": "", "sponsor": "Representative Jay Hoffman (D)", "last": "Rule 19(a) / Re-referred to Rules Committee (in the House)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "HB5440", "title": "ENERGY STORAGE REVENUE BONDS", "industry": "Energy Storage", "script": "HB5440 lets the Illinois Finance Authority issue revenue bonds specifically for energy‑storage projects that are seeking state‑level storage credits or utility cost recovery, and it requires the Authority to coordinate with the IPA so financing is structured to keep costs low for ratepayers. This is a financing‑tool bill, not a permitting or siting bill, so it doesn’t add county‑level steps or slow down storage projects. Any impacts would show up in how developers choose to finance projects—not in local compliance or utility‑facing processes.", "sme": "This bill would require energy storage projects to use Illinois Finance Authority bonds and ties eligibility for future storage procurements to that financing, while also adding new limits on what the IPA and ICC can approve under cost‑control rules that do not line up well with existing statutes. It could restrict the state’s ability to carry out the new battery storage standard, complicate cost recovery, and potentially affect Ameren projects like the East St. Louis storage and solar pilot. The financial impact is unclear, but it could stall future storage procurements and add work tied to a new annual rate affordability study. Given those issues, the recommendation is to oppose the bill if it moves forward, and improvements would include fixing the incorrect cost‑control references and clarifying that Rider USS pilot projects are unaffected.\nSection 16‑107.6 of the Illinois Public Utilities Act is the statute that creates the Distributed Generation (DG) Rebate program. It requires electric utilities to offer rebates to customers who install distributed energy resources—like rooftop solar, small renewable generation, and energy storage systems—on the customer side of the meter. These rebates support technologies equipped with smart inverters and are intended to reflect the grid benefits those resources provide.", "gr": "", "sponsor": "Representative Ryan Spain (R)", "last": "Referred to Rules Committee (in the House)", "hearing": "", "tags": "2026, coats, Oppose"}, {"state": "IL", "bill": "HB5477", "title": "WIND & SOLAR FACILITY DRAINAGE", "industry": "Wind & Solar", "script": "HB5477 says that if a wind or solar project is planned in an unincorporated area right next to a city, it either has to be annexed into that city or follow the city’s zoning rules, and it lays out factors for judging whether siting or special‑use permits meet state, federal, and local standards. That can add steps—think annexation petitions, municipal zoning reviews, and extra city–county coordination—which can slow timelines and change who the developer answers to. It doesn’t create brand‑new county compliance programs, but it can shift jurisdiction and add procedural layers where projects sit on the municipal edge.", "sme": "The bill adds additional government requirements for wind and solar projects, though many sophisticated local governments already require similar elements such as deconstruction plans. Ameren Illinois would not be directly affected because the company has no plans to build additional wind or solar facilities, resulting in no expected financial impact. Given the limited relevance to AIC operations, a neutral position is recommended. No specific improvements are suggested at this time.", "gr": "", "sponsor": "Representative Suzanne M. Ness (D)", "last": "Referred to Rules Committee (in the House)", "hearing": "", "tags": "Neutral, 2026, coats"}, {"state": "IL", "bill": "HB5479", "title": "EPA-GREENHOUSE GAS-EQUITY", "industry": "Gas", "script": "This bill tightens the greenhouse‑gas rules for certain gas‑fired electric generating units by clarifying which communities count for triggering the stricter deadlines. Under the change, the tougher requirements only apply if the nearby equity‑investment‑eligible community was officially designated by the Restore, Reinvest, and Renew Board as of January 11, 2024 and is located in an R3 area under the Cannabis Regulation and Tax Act. In practice, this narrows the number of units that must meet the accelerated reduction schedule. The goal seems to be providing more clarity and limiting compliance to communities already formally recognized when the rules were set.", "sme": "", "gr": "", "sponsor": "Representative Jay Hoffman (D)", "last": "Rule 19(a) / Re-referred to Rules Committee (in the House)", "hearing": "", "tags": "2026, coats, pending"}, {"state": "IL", "bill": "HB5513", "title": "HYPERSCALE DATA CENTERS", "industry": "Data Centers", "script": "HB5513 creates a sweeping regulatory framework for hyperscale data centers—covering environmental reviews, water‑use permits, community‑benefit agreements, public reporting, and annual fees tied to peak demand. While most of the requirements fall on developers rather than utilities, the sheer volume of new approvals and studies could influence how quickly big loads move through planning. The key SME question is whether these added obligations might indirectly affect service expectations, interconnection timelines, or upgrade cost‑responsibility when a large data‑center load arrives fast.", "sme": "This bill would require hyperscale data centers to complete environmental and community‑impact studies, participate in expanded public‑engagement processes, and pay annual fees into a new statewide public‑benefit fund. It also gives data centers the option to self‑generate capacity to avoid certain storage‑related charges, while separately requiring municipalities and counties to adopt automated permitting for residential solar. For Ameren, the concern is that the bill could make building or connecting large data centers in Illinois significantly more expensive and complex, potentially slowing or shifting projects to other states and reducing long‑term load growth. A neutral‑with‑concerns position is recommended, with improvements focused on more flexible, outcome‑based requirements and streamlined reporting to avoid discouraging investment.", "gr": "Industry stakeholders are opposing all data center legislation this session because of the broader cumulative impact these bills could have on utilities, including higher compliance costs, stricter operational requirements, and increased uncertainty around future infrastructure planning and investment.", "sponsor": "Representative Robyn Gabel (D)", "last": "Rule 19(a) / Re-referred to Rules Committee (in the House)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "HB5538", "title": "EPA-GHG-EMITTING UNITS-10YRS", "industry": "Gas", "script": "HB5538 gives gas‑fired generators and cogeneration units an extra 10 years to meet Illinois’ carbon‑reduction deadlines, effectively pushing back when these plants must hit reduced or zero‑emissions targets. In practice, that means enforcement comes later and operators have more runway to keep units online during tight system conditions, which can help with reliability but may also delay emissions‑control investments. The key SME question is whether the extended timelines meaningfully change reliability planning or shift cost impacts for customers if retrofits, replacements, or compliance spending get pushed further into the future.", "sme": "The proposal’s full impact is still unclear, but additional government requirements may be introduced, similar to those already used by more sophisticated local jurisdictions. Ameren Illinois does not anticipate any direct business impacts because the company has no plans to build new wind or solar facilities. Any financial effects are therefore expected to be negligible. Based on this assessment, a neutral position is recommended, with no suggested improvements at this time.", "gr": "", "sponsor": "Representative Ryan Spain (R)", "last": "Referred to Rules Committee (in the House)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "HB5607", "title": "ADVANCED TECHNOLOGY LEADERSHIP", "industry": "Data Centers", "script": "The bill would require large Illinois data centers to increase their use of clean energy by purchasing and retiring verified clean energy certificates. Over time, they would also need to match their electricity use with clean energy production on an hour by hour basis, and the clean energy would have to come from facilities within the same regional power grid. The Illinois Power Agency would decide which data centers are covered and would oversee compliance while working to keep administrative costs low.", "sme": "HB5607, as written, would add another layer of regulatory uncertainty that could make Illinois, particularly downstate communities, less attractive to data center investment. Data center developers place a high value on regulatory clarity, and the bill’s undefined requirements and potential future rulemaking create added risk at a time when Illinois already faces challenges in this area. While the proposal does not directly affect Ameren Illinois rates or impose new costs on the company, it could discourage or delay major data center projects. These facilities provide consistent load growth that helps make better use of existing electric infrastructure and spread fixed system costs, which can help keep rates more affordable for all customers. If that growth does not materialize, communities could miss out on jobs, tax base growth, and other economic benefits, while customers may experience upward pressure on rates over time. For these reasons, opposition is recommended, and the bill could be improved by offering clearer definitions and a more stable regulatory framework that supports continued investment.", "gr": "Industry stakeholders are opposing all data center legislation this session because of the broader cumulative impact these bills could have on utilities, including higher compliance costs, stricter operational requirements, and increased uncertainty around future infrastructure planning and investment.", "sponsor": "Representative Jay Hoffman (D)", "last": "Rule 19(a) / Re-referred to Rules Committee (in the House)", "hearing": "", "tags": "Pending"}, {"state": "IL", "bill": "HR744", "title": "DATA CENTERS-SUPPLY OWN ENERGY", "industry": "Data Centers", "script": "Urges all data centers in Illinois to provide their own energy to alleviate the burden they place on Illinois residents. Urges the Illinois Power Agency and the Illinois Environmental Protection Agency to, pursuant to 415 ILCS 5/9.15(o), develop a plan to reduce or delay CO2e and copollutant emissions reductions. Urges the Illinois Commerce Commission to approve the plan developed by Illinois Power Agency and the Illinois Environmental Protection Agency.", "sme": "", "gr": "Industry stakeholders are opposing all data center legislation this session because of the broader cumulative impact these bills could have on utilities, including higher compliance costs, stricter operational requirements, and increased uncertainty around future infrastructure planning and investment.", "sponsor": "Representative Tony M. McCombie (R)", "last": "Referred to Rules Committee (in the House)", "hearing": "", "tags": ""}, {"state": "IL", "bill": "SB2727", "title": "UTILITIES-VARIOUS", "industry": "Energy Storage", "script": "SB2727 defines “battery storage resource” and “total State‑installed generation capacity,” and says the State can’t grant variances or regulatory relief from emissions‑reduction requirements once battery storage reaches 10% of Illinois’ total generation capacity. In practice, that means gas‑fired emitting units can’t be forced to close early or lose their compliance flexibility until storage hits that threshold, which effectively ties retirement pressure to how fast storage builds out. It doesn’t add county‑level siting steps or slow local approvals—its impacts show up in statewide compliance timing and generator‑planning decisions.", "sme": "This bill links Illinois’ emissions‑reduction deadlines for large gas‑fired plants to how much battery storage has been built statewide, creating a reliability “safety valve” that allows IEPA to delay retirements until storage reaches meaningful scale. It also lets gas units exceed normal emissions limits during RTO‑directed emergency operations and adds a new requirement for utilities to publicly report and justify their RTO votes—an element that is burdensome and problematic for Ameren’s multi‑state voting structure. The flexibility to delay emissions deadlines is beneficial for reliability and could help keep capacity prices lower, while the RTO voting mandate creates administrative risk without improving grid outcomes. A support‑with‑targeted‑fixes position is recommended, with improvements focused on removing the RTO voting disclosure requirement and replacing the “at any time storage hits 10%” trigger with a predictable, time‑bound waiver framework to support planning and capacity‑market stability.", "gr": "Support the delaying of retirements. The RTO vote piece is a bit concerning, but probably worth accepting in order to delay retirements.", "sponsor": "Senator Chris Balkema (R)", "last": "Rule 2-10 Committee Deadline Established As April 24, 2026 (in the Senate)", "hearing": "", "tags": "coats, Support, 2026"}, {"state": "IL", "bill": "SB2736", "title": "EPA-NATURAL GAS PEAKER PLANTS", "industry": "Gas", "script": "SB2736 lets every natural‑gas peaker plant in Illinois run essentially continuously until 30 days after IEPA posts notice that the state has brought at least 21,000 MW of new utility‑scale renewables online. IEPA is also directed to update rules and permits so these plants can operate under this temporary flexibility. It doesn’t add county‑level steps or slow storage projects—this one is really about giving peakers room to operate for reliability until the state hits its renewables‑capacity milestone.", "sme": "This bill would allow natural‑gas peaker plants in Illinois to operate continuously—not just during peak or emergency periods—until the state brings 21,000 MW of new utility‑scale renewable generation online, after which normal limits resume following a 30‑day transition. The intent is to ensure reliability during the energy transition and prevent premature retirement of fast‑starting gas units before sufficient renewable capacity is built. For Ameren, this approach is largely positive: greater operational flexibility for peakers supports grid reliability, helps stabilize capacity prices, and reduces the risk of supply shortfalls affecting customers, with only minimal administrative cost implications. A support position is recommended, though the bill could be improved by clarifying whether the 21,000 MW benchmark refers to accredited (not nameplate) capacity and by recognizing differences between MISO and PJM reliability needs.", "gr": "Tagged Support in tracker. Likely value: clarity, reliability protection, streamlined processes, or beneficial program design. Check: county requirements, NFPA references, decommissioning/security, and drainage/ag impacts. (Initial; verify with SMEs.)", "sponsor": "Senator Li Arellano, Jr. (R)", "last": "Referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, coats, support/neutral"}, {"state": "IL", "bill": "SB2842", "title": "CO2 PIPELINES-EMINENT DOMAIN", "industry": "Carbon Sequestration", "script": "SB2842 would bar carbon‑dioxide pipeline developers from seeking or using eminent‑domain authority through the ICC, even if they hold a certificate under the Carbon Dioxide Transportation and Sequestration Act. That effectively narrows the Commission’s role and removes a major tool that pipeline operators have relied on for routing and land acquisition. The key SME question is whether taking eminent domain off the table meaningfully shifts ICC authority or creates new utility‑side cost, siting, or compliance implications when CO₂‑transport infrastructure intersects with utility assets or planned projects.", "sme": "", "gr": "", "sponsor": "Senator Michael W. Halpin (D)", "last": "Rule 3-9(a) / Re-referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, coats, pending"}, {"state": "IL", "bill": "SB2875", "title": "CONSUMER DATA PRIVACY", "industry": "Data Privacy", "script": "SB2875 creates a broad Consumer Data Privacy Act that applies to businesses handling large volumes of Illinois consumers’ personal data or earning significant revenue from selling it. It’s a data‑governance bill—not a siting or permitting bill—so it doesn’t add steps that slow energy‑storage projects or create county‑level compliance obligations. Any impact would fall on companies’ internal data‑handling practices, not on local approvals or project timelines.", "sme": "", "gr": "", "sponsor": "Senator Laura M. Murphy (D)", "last": "Rule 2-10 Committee Deadline Established As April 24, 2026 (in the Senate)", "hearing": "", "tags": "2026, coats, pending"}, {"state": "IL", "bill": "SB2886", "title": "GENETIC INFO PRIVACY-BIOMARKER", "industry": "Data Privacy", "script": "SB2886 expands Illinois’ genetic‑privacy rules so that biomarker testing—along with genetic testing—is fully confidential, and insurers can’t use that information for underwriting or non‑therapeutic purposes unless the individual voluntarily shares favorable results. This is strictly a privacy and insurance‑use update, not a land‑use or permitting change. So no—it doesn’t add steps that slow down energy‑storage projects or create any new county‑facing compliance obligations.", "sme": "No Impact", "gr": "Pending in tracker. Needs SME review before recommending a posture. Check: county requirements, NFPA references, decommissioning/security, and drainage/ag impacts. (Initial; verify with SMEs.)", "sponsor": "Senator Bill Cunningham (D)", "last": "Placed on Calendar Order of 3rd Reading March 3, 2026 (in the Senate)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "SB2958", "title": "AGRIVOLTAIC SYSTEMS", "industry": "Solar", "script": "SB2958 lays out a very specific definition of what counts as an “agrivoltaic system,” making sure only solar projects that pair real, ongoing agricultural production with generation—not just pollinator plantings—qualify under the IPA and PUA frameworks. The bill mainly tightens eligibility for developers, and at first glance doesn’t appear to shift ICC authority, utility obligations, or cost‑recovery expectations in a meaningful way. The SME question is whether these stricter criteria could indirectly affect utility review or interconnection processes if more projects are redesigned to meet the new agrivoltaic standard.", "sme": "This proposal simply provides a definition for agrivoltaics—solar installations that allow agricultural activity to continue beneath or around the panels—and does not create new programs, incentives, or regulatory requirements. Because these systems would be evaluated and interconnected just like any other solar project, the proposal has minimal to no impact on Ameren’s operations, power supply, or customer rates. There is no expected financial impact on Ameren or ratepayers. Given the limited scope and neutral effect, our recommended position is neutral, and no improvements to the measure are necessary.", "gr": "Tagged Neutral in tracker. Focus on technical cleanup and avoiding unintended consequences. Check: ICC authority, cost recovery, reporting deadlines, and enforceability. (Initial; verify with SMEs.)", "sponsor": "Senator Doris Turner (D)", "last": "Rule 2-10 Committee Deadline Established As April 24, 2026 (in the Senate)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "SB2979", "title": "COUNTY/MUNI-NATURAL GAS", "industry": "Gas", "script": "SB2979 says local governments can’t ban natural gas in new construction unless voters approve it through a referendum, and it limits home‑rule authority so cities can’t get around that requirement. It’s a clear, precedent‑setting move in the gas‑vs‑electrification debate because it reins in local bans and signals strong state‑level support for preserving consumer choice. The SME question is whether this shifts the broader narrative or customer expectations around gas use in new buildings—and whether other states might look to a similar model.", "sme": "This proposal would prevent local governments from banning natural gas in new construction or indirectly restricting it through appliance rules, preserving customer choice and preventing communities from being forced into all‑electric options as costs rise. For Ameren, this creates a positive business impact by allowing continued system expansion that helps spread fixed costs and improve overall affordability. While the financial impact is difficult to quantify, maintaining access to natural gas generally supports rate dilution as new customers join the system. We support the measure, and it could be improved by expanding protections to address future attempts to restrict gas appliances or existing buildings through indoor air‑quality or efficiency regulations.", "gr": "Tagged Support in tracker. Likely value: clarity, reliability protection, streamlined processes, or beneficial program design. Check: preemption vs. local control, consumer messaging, and enforcement scope. (Initial; verify with SMEs.)", "sponsor": "Senator Patrick J. Joyce (D)", "last": "Referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, coats, Support"}, {"state": "IL", "bill": "SB3078", "title": "LOC GOV-ENERGY STORAGE SYSTEMS", "industry": "Energy Storage", "script": "SB3078 tightens county requirements for energy‑storage projects by requiring more detailed farmland‑drainage plans and making decommissioning plans mandatory rather than optional. That means developers have to provide more documentation up front and follow the agricultural‑impact mitigation agreement for drainage repairs, which can add some extra coordination with counties. So yes—it can add steps that slow projects or create new county‑facing compliance obligations, especially around drainage, restoration, and decommissioning paperwork.", "sme": "“HB4956, SB3078, and SB3409 carry the same substantive requirements for energy storage siting under the Counties Code: they shift drainage repair procedures into the AIMA, make decommissioning plans and NFPA‑based safety documentation mandatory, require one AIMA per system, and keep a signed AIMA on site during construction/deconstruction. The only differences are the bill numbers, chambers, and sponsors.”", "gr": "", "sponsor": "Senator Doris Turner (D)", "last": "Referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "SB3234", "title": "EPA-GREENHOUSE GAS-EQUITY", "industry": "Gas", "script": "This bill makes a small but important clarification to the state’s greenhouse‑gas rules for certain gas‑fired power plants. Right now, some units face stricter emission‑reduction deadlines if they are located near an equity‑investment‑eligible community. What this amendment does is tighten that definition so it only applies when the nearby community was officially designated by the Restore, Reinvest, and Renew Board as of January 11, 2024 and is located in an R3 area under the Cannabis Regulation and Tax Act.\nSpeaker: In plain terms, it narrows which power plants have to follow the faster emission‑reduction schedule and gives everyone clearer boundaries on who is covered.", "sme": "This bill tightens the greenhouse‑gas rules for certain gas‑fired generating units by clarifying exactly which nearby communities trigger the stricter emission‑reduction deadlines. Under the change, the tougher requirements only apply when the nearby equity‑investment‑eligible community was officially designated by the Restore, Reinvest, and Renew Board as of January 11, 2024 and is located in an R3 area under the Cannabis Regulation and Tax Act. This narrows the number of plants that must meet the accelerated standards and gives clearer boundaries for who is covered. Overall, it adds precision to the law so only already‑recognized communities influence compliance.", "gr": "", "sponsor": "Senator Bill Cunningham (D)", "last": "Rule 2-10 Committee Deadline Established As April 24, 2026 (in the Senate)", "hearing": "", "tags": "pending, 2026, coats"}, {"state": "IL", "bill": "SB3246", "title": "UTILITIES-HYDROGEN BATTERIES", "industry": "Hydrogen Fuel Cells", "script": "SB3246 directs the Illinois Power Agency to run a major new energy‑storage procurement—over 1,038 MW of stand‑alone, cost‑effective storage by 2029/2030 for utilities over 300,000 customers—and updates related county provisions. The bill drives utility‑scale storage deployment but doesn’t itself add new county‑level steps or local permitting requirements, so it shouldn’t slow projects on the siting side. The main lift is on procurement, contracting, and development timelines, not on creating new county‑facing compliance obligations.", "sme": "This bill would block hydrogen fuel‑cell systems, referred to as hydrogen batteries, from the state’s initial storage procurement and from participating in net metering or storage rebate programs. For Ameren, the impact is small and mostly administrative, since we would need to screen out hydrogen‑based systems when reviewing net metering and DG or storage rebate applications. At a broader level, removing a non‑emitting technology from the market could limit competition and potentially raise long‑term power supply costs by pushing everything toward lithium‑ion. A neutral position makes sense, although the bill could be improved by understanding the sponsor’s concerns about hydrogen and possibly requiring that any hydrogen used be produced from clean sources.", "gr": "", "sponsor": "Senator Laura Ellman (D)", "last": "Rule 3-9(a) / Re-referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "SB3268", "title": "RES SOLAR PERMITTING PLATFORM", "industry": "Solar", "script": "SB3268 would require cities and counties over 10,000 residents to adopt an automated residential solar‑permitting platform by mid‑2027, with the goal of processing at least 75% of standard residential solar applications through that system. This is meant to speed up approvals, not slow them down, and it doesn’t add new county‑facing requirements beyond adopting and using the platform itself. So no—it doesn’t create new steps that slow projects; if anything, it pushes local governments toward faster, more standardized solar permitting.", "sme": "The bill requires municipalities and counties with at least 10,000 residents to adopt automated permitting software for residential solar projects, including a remote‑inspection requirement when the automated review does not flag safety issues. This change has little to no impact on Ameren Illinois because utility interconnection procedures remain separate from local permitting and do not affect AIC’s ability to conduct witness tests or evaluate projects under existing ICC rules. There is no expected financial impact to Ameren or its customers. A neutral position is recommended, and no improvements are identified at this time.", "gr": "", "sponsor": "Senator Laura Ellman (D)", "last": "Rule 2-10 Committee Deadline Established As April 24, 2026 (in the Senate)", "hearing": "", "tags": "coats, 2026, Neutral"}, {"state": "IL", "bill": "SB3409", "title": "LOC GOV-ENERGY STORAGE SYSTEMS", "industry": "Energy Storage", "script": "SB3409 tightens county rules for energy‑storage projects by requiring more detailed farmland‑drainage plans and making decommissioning plans mandatory instead of optional. That means developers have to provide more documentation up front and work more closely with counties on drainage repair and restoration. So yes—it adds steps and creates new county‑facing compliance obligations that can slow timelines, especially around drainage planning and decommissioning requirements.", "sme": "“HB4956, SB3078, and SB3409 carry the same substantive requirements for energy storage siting under the Counties Code: they shift drainage repair procedures into the AIMA, make decommissioning plans and NFPA‑based safety documentation mandatory, require one AIMA per system, and keep a signed AIMA on site during construction/deconstruction. The only differences are the bill numbers, chambers, and sponsors.”", "gr": "This bill adds new requirements for developers when they build certain types of facilities. For Ameren, the only impact would be if we end up constructing something that falls under the bill’s definition, so most effects are limited or indirect. There is no expected financial impact on customers unless Ameren builds a covered facility. A neutral position makes sense, and the measure could be improved by clarifying what happens to these facilities after leases expire and tightening up any unclear language.", "sponsor": "Senator Christopher Belt (D)", "last": "Rule 3-9(a) / Re-referred to Assignments (in the Senate)", "hearing": "", "tags": "Neutral, coats, 2026"}, {"state": "IL", "bill": "SB3450", "title": "MUNI CD-SOLAR ENERGY SYSTEM", "industry": "Solar Energy", "script": "SB3450 would let municipalities regulate—or even prohibit—solar installations if it aligns with their comprehensive plan or zoning authority, removing the current protection that blocks local bans. That means more local discretion, which can add steps and slow projects through extra zoning reviews, potential prohibitions in certain areas, and new compliance with city‑specific standards. It doesn’t create county‑level obligations, but it can materially change municipal approvals and timelines for rooftop or small solar.", "sme": "SB3450 would repeal the statewide prohibition on municipal restrictions for solar installations and give municipalities expanded authority to regulate or prohibit solar facilities, including within their extraterritorial zoning areas, while preserving a carve‑out for municipal utilities. This change could introduce more volatility into DER interconnection queues, lead developers to alter siting strategies, and increase project withdrawals, redesigns, or disputes—potentially affecting system planning and utility workload. While the financial impact is unclear, the recommendation is neutral with suggested refinements to clarify that municipal zoning authority should not extend into utility interconnection standards, which must remain under ICC jurisdiction. Additional guardrails—such as requiring municipal notification or consultation—could be beneficial but may risk provoking broader municipal involvement in utility processes.", "gr": "", "sponsor": "Senator David Koehler (D)", "last": "Rule 2-10 Committee Deadline Established As April 24, 2026 (in the Senate)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "SB3488", "title": "WIND & SOLAR AFFECT WATER FLOW", "industry": "Wind & Solar", "script": "SB3488 would require wind and solar developers to fully compensate landowners if a project damages drainage—whether on the owner’s land, adjoining land, or drainage‑district property—and the Department of Agriculture would determine the amount owed. This raises the bar for siting because developers now face automatic, state‑determined compensation obligations for water‑flow impacts, which can make projects harder to place and increase local scrutiny. It doesn’t create new referendum or preemption rules, but it strengthens local leverage and could make permitting and community engagement more complicated.", "sme": "The bill would require solar and wind facility owners to compensate nearby landowners if their projects negatively affect water flow on surrounding properties. If Ameren continues to develop solar facilities, this could expose the company to claims of drainage impacts from adjacent landowners. The potential financial impact is uncertain but could arise if additional Ameren‑owned solar sites lead to alleged water‑flow issues. A neutral but slightly negative position is recommended, and no specific improvements are identified at this time.", "gr": "", "sponsor": "Senator Sally J. Turner (R)", "last": "Referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "SB3548", "title": "CONSUMER DATA PRIVACY ACT", "industry": "Data Privacy", "script": "SB3548 sets up a new Consumer Data Privacy Act that gives people clear rights over their personal data—things like correcting information, deleting it, getting a copy, or opting out of targeted ads, data sales, or profiling. It’s a data‑privacy bill, not a land‑use or permitting bill, so it doesn’t add steps that slow energy‑storage projects or create any new county‑facing compliance obligations. Any impact stays on the data‑governance side, not project siting or local approvals.", "sme": "Neutral to support", "gr": "Pending in tracker. Needs SME review before recommending a posture. Check: county requirements, NFPA references, decommissioning/security, and drainage/ag impacts. (Initial; verify with SMEs.)", "sponsor": "Senator Sue Rezin (R)", "last": "Rule 2-10 Committee Deadline Established As April 24, 2026 (in the Senate)", "hearing": "", "tags": "2026, coats, Neutral"}, {"state": "IL", "bill": "SB3574", "title": "REGULATION-TECH", "industry": "Shell", "script": "SB3574 makes only a technical change to a short‑title section of the Public Utilities Act, so it doesn’t alter how the ICC operates or how utilities handle cost recovery, compliance, or service obligations. In other words, it doesn’t shift Commission authority or utility duties in any meaningful way. This one is a straightforward monitor, pending SME confirmation, but no substantive impacts are expected.", "sme": "", "gr": "Monitor unless a clear utility obligation or cost impact emerges. Check: ICC authority, cost recovery, reporting deadlines, and enforceability. (Initial; verify with SMEs.)", "sponsor": "Senator Sue Rezin (R)", "last": "Referred to Assignments (in the Senate)", "hearing": "", "tags": "2026, shell bill/watch only"}, {"state": "IL", "bill": "SB3575", "title": "REGULATION-TECH", "industry": "Shell", "script": "SB3575 is just a technical tweak to a short‑title provision in the Public Utilities Act, with no substantive changes to how the ICC regulates utilities. It doesn’t shift Commission authority, utility obligations, cost‑recovery rules, or compliance expectations in any meaningful way. This one is a simple monitor, pending SME confirmation, but no impacts are expected.", "sme": "", "gr": "Monitor unless a clear utility obligation or cost impact emerges. Check: ICC aut
