<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Behavioral Interview Lab</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface2:#efece4; --ink:#1b2230; --muted:#5b6374; --line:#dcd7cb;
  --accent:#e2611b; --accent-ink:#ffffff; --accent-soft:#fbe6d9; --navy:#1d3557; --navy-soft:#e3e9f2;
  --good:#1f7a4a; --good-soft:#dff1e6; --warn:#a15c00; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#f9dedc;
  --shadow:0 1px 2px rgba(20,25,35,.06),0 6px 20px rgba(20,25,35,.06); --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141b; --surface:#1a1f29; --surface2:#222835; --ink:#eceef3; --muted:#a2a9b8; --line:#2f3644;
    --accent:#ff8a4c; --accent-ink:#1a1206; --accent-soft:#3a2416; --navy:#9fbbe6; --navy-soft:#1f2a3d;
    --good:#6fd39b; --good-soft:#163024; --warn:#f2b866; --warn-soft:#352914; --bad:#ff8f86; --bad-soft:#3a1c1a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#11141b; --surface:#1a1f29; --surface2:#222835; --ink:#eceef3; --muted:#a2a9b8; --line:#2f3644;
  --accent:#ff8a4c; --accent-ink:#1a1206; --accent-soft:#3a2416; --navy:#9fbbe6; --navy-soft:#1f2a3d;
  --good:#6fd39b; --good-soft:#163024; --warn:#f2b866; --warn-soft:#352914; --bad:#ff8f86; --bad-soft:#3a1c1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(1.7rem,3.2vw,2.5rem)} h2{font-size:1.55rem} h3{font-size:1.15rem}
p{margin:0 0 .85em} a{color:var(--navy)} button{font:inherit}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.brand{font-family:Fraunces,serif;font-weight:700;font-size:1.1rem;white-space:nowrap}
.brand small{display:block;font-family:Inter;font-weight:500;font-size:.72rem;color:var(--muted)}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.88rem}
.pill:hover{border-color:var(--accent)}
.spacer{flex:1}
.privbadge{background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.flow{height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:flow 3.6s linear infinite}
@keyframes flow{from{background-position:-40% 0}to{background-position:140% 0}}
@media (prefers-reduced-motion:reduce){.flow{animation:none;background-size:100% 100%;opacity:.5}}
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:230px 1fr;gap:24px;padding:20px 16px 60px}
nav.side{position:sticky;top:72px;align-self:start;display:flex;flex-direction:column;gap:2px}
nav.side a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:8px 12px;border-radius:10px;font-weight:500;font-size:.95rem}
nav.side a:hover{background:var(--surface2)}
nav.side a.on{background:var(--accent-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
nav.side .grp{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 12px 4px}
main{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:stretch;margin-bottom:20px}
.hero .card:first-child{background:linear-gradient(135deg,var(--navy-soft),var(--surface) 60%)}
.kicker{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700;margin-bottom:6px}
.muted{color:var(--muted)} .small{font-size:.86rem}
.stat{padding:16px}
.stat b{display:block;font-family:Fraunces,serif;font-size:1.7rem;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;margin:4px auto 10px}
.ring::before{content:"";width:92px;height:92px;border-radius:50%;background:var(--surface);grid-area:1/1}
.ring b{grid-area:1/1;font-family:Fraunces,serif;font-size:1.6rem;position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:10px;padding:10px 16px;cursor:pointer;min-height:42px}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);margin:2px 4px 2px 0}
.tag.acc{background:var(--accent-soft);color:var(--ink)}
.tag.nav{background:var(--navy-soft);color:var(--navy)}
.qcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);margin-bottom:10px}
.qcard summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:10px;align-items:flex-start}
.qcard summary::-webkit-details-marker{display:none}
.qcard summary .chev{transition:transform .2s;color:var(--muted);flex:none;margin-top:2px}
.qcard[open] summary .chev{transform:rotate(90deg)}
.qcard .done{color:var(--good);flex:none}
ul.clean{margin:.3em 0 .8em;padding-left:1.15em} ul.clean li{margin:.25em 0}
.callout{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:8px;margin:12px 0}
.callout.priv{border-color:var(--bad);background:var(--bad-soft)}
.callout.navy{border-color:var(--navy);background:var(--navy-soft)}
.star{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.star div{border-radius:12px;padding:14px;background:var(--surface2);border-top:4px solid var(--accent)}
.star div b{font-family:Fraunces,serif;font-size:2rem;color:var(--accent);display:block;line-height:1}
.bar{display:flex;height:16px;border-radius:999px;overflow:hidden;margin:6px 0 14px;border:1px solid var(--line)}
.bar span{display:block;height:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.timer{font-family:Fraunces,serif;font-size:3rem;font-variant-numeric:tabular-nums;text-align:center;margin:8px 0}
.timer.warn{color:var(--warn)} .timer.over{color:var(--bad)}
textarea,input[type=text],input[type=date],select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:90px;resize:vertical}
textarea:focus,input:focus,select:focus,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.lab{font-weight:600;font-size:.88rem;display:flex;justify-content:space-between;margin:10px 0 4px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)} .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.flash{perspective:1000px;height:300px;cursor:pointer}
.flash-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:24px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--navy-soft)}
.face h3{font-size:1.35rem}
.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:18px}
.timeline .ev{position:relative;margin-bottom:16px}
.timeline .ev::before{content:"";position:absolute;left:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.script{white-space:pre-wrap;background:var(--surface2);border-radius:10px;padding:14px;font-size:.95rem}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.leader{display:flex;flex-direction:column;gap:6px}
.leader .ini{width:44px;height:44px;border-radius:50%;background:var(--navy);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:Fraunces,serif}
.mobnav{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fb{margin-top:10px;padding:12px;border-radius:10px;background:var(--surface2)}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent)}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th,table.t td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
@media (max-width:900px){
  .shell{grid-template-columns:1fr;padding-top:8px}
  nav.side{display:none}
  .mobnav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
  .mobnav a{flex:none;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem}
  .mobnav a.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .hero,.g2,.g3,.g4{grid-template-columns:1fr}
  .star{grid-template-columns:1fr 1fr}
  .brand small{display:none}
}
@media print{.topbar,nav.side,.mobnav,.btn{display:none}.shell{display:block}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">Behavioral Interview Lab<small>STAR practice and a ComEd and Exelon briefing</small></div>
    <div class="spacer"></div>
    
    <button class="pill" id="themeBtn" aria-label="Switch light or dark mode">◐ Theme</button>
  </div>
  <div class="flow" aria-hidden="true"></div>
  <nav class="mobnav" id="mobnav" aria-label="Sections"></nav>
</header>
<div class="shell">
  <nav class="side" id="sidenav" aria-label="Sections"></nav>
  <main id="app" tabindex="-1"></main>
</div>
<script>
// Public content.
var PREP = window.PREP = window.PREP || {};

PREP.meta = {
  title: "Behavioral Interview Lab",
  subtitle: "STAR practice for a utility government affairs director role, with a ComEd and Exelon company briefing",
  updated: "November 1, 2026"
};

PREP.categories = [
  {id:"lead", name:"Leadership and team management", blurb:"Leading people, contract lobbyists and cross-functional teams, including without formal authority."},
  {id:"influence", name:"Influence and persuasion", blurb:"Moving a legislator, a sponsor or an internal leader from no to yes."},
  {id:"coalition", name:"Stakeholders and coalitions", blurb:"Working with peers, competitors, labor, advocates and the administration."},
  {id:"ethics", name:"Ethics and integrity", blurb:"Gray areas, pressure, compliance and doing the right thing when nobody is watching. Expect extra weight here."},
  {id:"strategy", name:"Strategic thinking", blurb:"Seeing around corners, aligning GR to business goals, long-range planning."},
  {id:"crisis", name:"Crisis and adversity", blurb:"A session going sideways, a storm, a bad news cycle."},
  {id:"conflict", name:"Conflict and disagreement", blurb:"Disagreeing with leadership, resolving internal fights over positions."},
  {id:"data", name:"Data and analysis", blurb:"Turning numbers into a policy case people remember."},
  {id:"process", name:"Process improvement", blurb:"Making the function work better and proving the value."},
  {id:"current", name:"Current issues", blurb:"Data centers, affordability, interconnection and defending the company's record."},
  {id:"fit", name:"Motivation and fit", blurb:"Why this company, why this role, why now."},
  {id:"curve", name:"Curveballs", blurb:"Questions designed to see how you think under pressure."}
];

// Each question: id, cat, q, probe (what the panel is listening for), shows (what a strong answer includes), stories (private story ids that fit)
PREP.questions = [
  // Leadership
  {id:"q1", cat:"lead", q:"Tell me about a time you led a team to a result when you did not have formal authority over the people involved.", probe:"Can you lead peers and senior leaders through influence, clarity and follow-through rather than title?", shows:["A named goal and why it mattered to the business","How you set roles, cadence and decision rights without a reporting line","One moment where someone resisted and how you brought them along","A measurable result and what the team said afterward"], stories:["datacenter","org","sme"]},
  {id:"q2", cat:"lead", q:"Describe a time you directed outside lobbyists or consultants. How did you hold them accountable?", probe:"A director manages contract lobbyists. They want to know you set expectations, track work and protect the company's name.", shows:["Clear assignments and reporting expectations","How you measured their contribution","A time you corrected course or redirected effort","Compliance awareness, including registration and reporting"], stories:["lobbyists","ethics"]},
  {id:"q3", cat:"lead", q:"Tell me about a time you developed someone on your team or helped a colleague grow.", probe:"Supervisory readiness. Do you invest in people or just use them?", shows:["The person's starting point and goal","Specific coaching, stretch assignments or feedback you gave","How you measured growth","What you learned about your own leadership"], stories:["southwest","lobbyists"]},
  {id:"q4", cat:"lead", q:"Describe a time you had to deal with an underperforming team member or partner.", probe:"Do you address problems directly and fairly, and do you document and follow up?", shows:["The facts of the performance gap, not personality","A private, direct conversation with clear expectations","Support offered and a timeline","The outcome, whether improvement or a harder decision"], stories:["southwest","lobbyists"]},
  {id:"q5", cat:"lead", q:"Give an example of how you have built trust with a new senior leader.", probe:"You will report into an SVP and work with a CEO. Can you earn their confidence quickly?", shows:["Learning their priorities before pitching your own","Early, reliable delivery on something small","Candor when news was bad","How the relationship changed over time"], stories:["polrd","datacenter","governor"]},

  // Influence
  {id:"q6", cat:"influence", q:"Tell me about a time you changed a legislator's mind.", probe:"The core skill of the job. They want your method, not just the outcome.", shows:["Where the legislator started and why","How you learned what they cared about","The evidence or local impact you brought","The ask, the response and what happened to the bill or vote"], stories:["harmful","org","koehler"]},
  {id:"q7", cat:"influence", q:"Describe a time you had to persuade senior leaders inside your company to change a position.", probe:"GR directors often have to tell executives what they do not want to hear.", shows:["The original position and the risk you saw","How you framed the case in business terms","Allies or SMEs you brought in","What leadership decided and why"], stories:["polrd","org","datacenter"]},
  {id:"q8", cat:"influence", q:"Tell me about a time you explained a complex technical or regulatory issue to a non-expert audience.", probe:"Can you translate rate design, capacity markets or grid plans for a legislator with five minutes?", shows:["Who the audience was and what they needed","The one or two ideas you led with","A visual, analogy or local example","Evidence they understood and used it"], stories:["koehler","econ","org"]},
  {id:"q9", cat:"influence", q:"Describe a situation where you got a meeting or result with a decision-maker who was hard to reach.", probe:"Relationship-building and persistence without burning bridges.", shows:["Why access was hard","The path you used, such as staff, allies or local officials","How you made the meeting worth their time","What it led to"], stories:["governor","koehler","harmful"]},

  // Coalition
  {id:"q10", cat:"coalition", q:"Tell me about a time you built a coalition around a shared legislative goal.", probe:"Energy bills pass through coalitions. They want to see you assemble and hold one together.", shows:["The common goal and the different interests at the table","How you found overlap","How you handled a partner who wanted to defect","The legislative outcome"], stories:["crga","eima","harmful"]},
  {id:"q11", cat:"coalition", q:"Describe a time you worked with a competitor or industry peer whose interests only partly matched yours.", probe:"Utilities are often peers, sometimes on the same side. Can you collaborate without giving away your company's interests?", shows:["Where interests overlapped and where they split","Ground rules you set","How you protected your company's position","What the collaboration produced"], stories:["harmful","crga","eima"]},
  {id:"q12", cat:"coalition", q:"Give an example of working with the Governor's office or a state agency on an issue.", probe:"Executive branch relationships matter as much as legislative ones.", shows:["The issue and who you engaged","How you kept the relationship two-way","How you handled disagreement","The result"], stories:["governor","crga"]},
  {id:"q13", cat:"coalition", q:"Tell me about a time you had to work with an advocacy group that was critical of your company.", probe:"Consumer and environmental groups are frequent opponents. Can you engage respectfully and find common ground?", shows:["Their concern stated fairly","What you listened for","Any common ground found","How the relationship or outcome changed"], stories:["crga","koehler"]},

  // Ethics
  {id:"q14", cat:"ethics", q:"Tell me about a time you were asked to do something that did not feel right. What did you do?", probe:"For this company in particular, the panel needs to hear that you stop, ask and escalate.", shows:["The request and why it raised a flag","Who you consulted, such as ethics, legal or compliance","What you did, even if it cost you something","What you would do the same or differently"], stories:["ethics"]},
  {id:"q15", cat:"ethics", q:"How do you make sure political fundraising and lobbying activity stays within the rules?", probe:"Specific knowledge of compliance processes, not just good intentions.", shows:["The rules you work within, such as registration, gift and contribution limits, and company policy","Your personal checklist or process","A time you caught or prevented a problem","How you keep records"], stories:["ethics","lobbyists"]},
  {id:"q16", cat:"ethics", q:"Describe a time you had to deliver an honest message that was unpopular.", probe:"Integrity includes telling leadership or a legislator the truth.", shows:["The message and the audience","Why it mattered to say it","How you said it","The reaction and the result"], stories:["polrd","org"]},
  {id:"q17", cat:"ethics", q:"How would you handle a legislator or staff member asking for a favor, such as a job referral for someone they know?", probe:"This is the exact pattern behind the company's past. They want a clear, calm, policy-based answer.", shows:["A polite, immediate redirect to the standard public process","No promises and no side channels","Documenting the contact and informing compliance","Keeping the relationship intact"], stories:["ethics"]},

  // Strategy
  {id:"q18", cat:"strategy", q:"Tell me about a time you anticipated a legislative or regulatory issue before it became a problem.", probe:"Foresight is what separates a director from a tracker.", shows:["The early signal you noticed","How you validated it","What you did before it surfaced","What happened and what it saved"], stories:["polrd","org","datacenter"]},
  {id:"q19", cat:"strategy", q:"How have you aligned a government relations plan with your company's business strategy?", probe:"GR serves the business. Can you connect a bill to earnings, customers or operations?", shows:["The business goal","The legislative or regulatory lever","How you measured alignment","The outcome for the business"], stories:["org","datacenter","econ"]},
  {id:"q20", cat:"strategy", q:"Describe a multi-year campaign you led or helped lead.", probe:"Director-level work is long horizon. They want to see planning, stamina and adjustment.", shows:["The end goal and timeline","Phases and milestones","A pivot when conditions changed","Where it stands and what you learned"], stories:["org","crga","eima"]},
  {id:"q21", cat:"strategy", q:"Tell me about a time you tested an idea and decided not to pursue it.", probe:"Judgment and intellectual honesty. Can you kill your own idea?", shows:["The idea and why you believed in it","How you tested it","The evidence that changed your mind","What you recommended instead"], stories:["polrd"]},

  // Crisis
  {id:"q22", cat:"crisis", q:"Tell me about a time a legislative session went sideways at the last minute.", probe:"Composure and speed. How do you decide what to do with hours left?", shows:["What changed and when","How you got facts fast","Who you mobilized","The outcome and what you changed afterward"], stories:["harmful","crga"]},
  {id:"q23", cat:"crisis", q:"Describe how you kept elected officials informed during a major outage or emergency.", probe:"Storm communication is a core GR duty at an electric utility.", shows:["The event and the scale","Your role in the enterprise response","The cadence and content of updates","Feedback from officials"], stories:["storm"]},
  {id:"q24", cat:"crisis", q:"Tell me about a time your company was under public criticism and you had to represent it.", probe:"Can you defend the company honestly without spin?", shows:["The criticism and whether it had merit","What you acknowledged","The facts and actions you shared","How the relationship recovered"], stories:["storm","koehler"]},

  // Conflict
  {id:"q25", cat:"conflict", q:"Tell me about a time you disagreed with your manager or a senior leader.", probe:"Can you disagree respectfully, then commit?", shows:["The disagreement in neutral terms","How you raised it","What you did after the decision","The relationship afterward"], stories:["polrd","org"]},
  {id:"q26", cat:"conflict", q:"Describe a time two internal departments disagreed on a position on a bill. How did you resolve it?", probe:"Internal alignment is half the job.", shows:["Each side's interest","How you got the right people in the room","The process you used to reach a position","The final position and buy-in"], stories:["sme","datacenter","org"]},
  {id:"q27", cat:"conflict", q:"Tell me about a difficult working relationship and how you managed it.", probe:"Self-awareness and maturity.", shows:["The behavior, not the person","What you did to understand them","What changed","What you learned"], stories:["lobbyists","southwest"]},

  // Data
  {id:"q28", cat:"data", q:"Tell me about a time you used data to win an argument.", probe:"The posting asks for analyzing and presenting data. Show it.", shows:["The question you needed to answer","Where the data came from","How you made it simple","The decision it changed"], stories:["econ","org"]},
  {id:"q29", cat:"data", q:"Describe a time the data did not support the position you wanted to take.", probe:"Honesty with numbers.", shows:["What you expected","What the data showed","How you adjusted the message or the position","The result"], stories:["polrd","econ"]},
  {id:"q30", cat:"data", q:"How do you measure the success of a government relations function?", probe:"Directors are expected to show value beyond bills passed.", shows:["Outcome measures, such as bills passed, amended or stopped","Relationship and access measures","Internal measures, such as speed and quality of positions","An example of reporting results to leadership"], stories:["sme","polrd"]},

  // Process

PREP.star = {
  parts: [
    {k:"S", name:"Situation", pct:15, tip:"Two or three sentences. Where, when, what was at stake. Skip background the panel does not need."},
    {k:"T", name:"Task", pct:10, tip:"Your specific responsibility. Say what you owned, not what the team owned."},
    {k:"A", name:"Action", pct:50, tip:"The heart of the answer. Three to five concrete steps, in order, in the first person. Say I, not we."},
    {k:"R", name:"Result", pct:25, tip:"What happened, with a number when you have one. Then one line on what you learned or would repeat."}
  ],
  mistakes: [
    "Spending a minute on background before the panel knows why it matters",
    "Saying we for the whole answer so the panel cannot tell what you did",
    "Ending at the action with no result",
    "A result with no number, date or concrete change",
    "Picking a story that answers a different question than the one asked",
    "Running past three minutes. Aim for ninety seconds to two minutes, then stop and let them ask follow-ups"
  ],
  example: {
    q:"Tell me about a time you used data to win an argument.",
    weak:"We had a bill that would have hurt us, so we put together some numbers and showed legislators. It went well and the bill didn't pass. Data is really important in this job.",
    good:"Last session a bill would have capped a fee we rely on to fund local safety work. My job was to show legislators the effect in their districts. I pulled the spending by county and built a one-page leave-behind for each member. Several members cited the numbers in committee and the cap was amended.",
    strong:"Last session a bill would have capped a fee that funds local system safety work, and leadership asked me to make the local cost real for legislators. I owned the analysis and the leave-behinds. I pulled five years of spending by county, matched it to each member's district, and converted it into projects and jobs so a member could repeat it in one sentence. I tested the one-pagers with two friendly staffers, cut each to three numbers, and briefed the committee chair before the hearing. Members used the figures in committee, and the cap was amended to protect the safety work. What I took away is that a number only works if a legislator can say it back to a constituent."
  },
  timing: "Target ninety seconds to two minutes. A rough split is Situation fifteen percent, Task ten, Action fifty, Result twenty-five. Add one closing line on what you learned. This is sometimes called STAR plus L and it lands well at director level."
};

  {id:"m1", kind:"Judgment", q:"A legislator's staffer asks if you can help a relative get an interview at the company. What is the strongest response?", opts:["Say you will pass the resume to HR personally and let them know how it goes","Politely point them to the public careers site, make no promises, and log the contact with compliance","Say you cannot discuss it and end the conversation","Ask the staffer what the legislator needs this session first"], a:1, why:"Redirect to the standard process, make no promises and document it. That is exactly the safeguard the company built after 2020, and it keeps the relationship intact."},
  {id:"m2", kind:"Judgment", q:"In a STAR answer, which part should take the most time?", opts:["Situation","Task","Action","Result"], a:2, why:"About half your time belongs in Action, told in the first person."},
  {id:"m3", kind:"Judgment", q:"Your answer has run past three minutes and you have not reached the result. Best move?", opts:["Keep going, details show depth","Stop and ask if they want more background","Jump to the result in one or two sentences and stop","Apologize and start over with a different story"], a:2, why:"Land the result fast and let them ask follow-ups. Long answers cost you more than short ones."},
  {id:"m4", kind:"Judgment", q:"Which closing line best fits STAR plus L?", opts:["So that is the story","What I took away is that a number only works if a legislator can repeat it to a constituent","I think it went really well overall","We all worked very hard on it"], a:1, why:"A one-line lesson shows reflection and gives the panel something to remember."},
  {id:"m5", kind:"Judgment", q:"A panelist asks what concerns you about the company's past. Strongest approach?", opts:["Say you would rather not get into it","Walk through the trial details to show you did your research","Acknowledge it briefly, credit the reforms, explain what you bring, and look forward","Say every utility has problems like that"], a:2, why:"Brief, respectful, forward-looking. Never speculate about individuals."},
  {id:"m6", kind:"Judgment", q:"A legislator is angry about constituent bills going up. What should come first?", opts:["Explain that supply costs come from PJM, not the utility","Acknowledge the pain constituents are feeling","Share the company's reliability ranking","Offer a meeting with the CEO"], a:1, why:"Empathy first. Then separate supply from delivery and point to assistance programs."},
  {id:"m7", kind:"Judgment", q:"While Grid Plan 2 is pending at the ICC, a legislator asks you to explain why the plan should be approved. Best approach?", opts:["Make the full case for approval","Decline to talk about the grid plan at all","Educate on what the plan covers and the process, coordinate with regulatory, and avoid lobbying on the merits of a pending case","Refer them to the CUB"], a:2, why:"Respect the regulatory process while staying helpful."},
  {id:"m8", kind:"Judgment", q:"Which word should you use most when describing your actions?", opts:["We","The team","I","Leadership"], a:2, why:"The panel needs to know what you did. Use we for context and I for actions."},
  {id:"m9", kind:"Judgment", q:"Two departments disagree on the company position on a bill. Your first step?", opts:["Pick the position that best protects revenue","Escalate to the CEO","Get each side's interest on the table with the right decision-maker and a deadline","Let the bill pass without a position"], a:2, why:"Surface interests, convene the right people, and set a decision date before session forces one."},
  {id:"m10", kind:"Judgment", q:"How long should a typical behavioral answer run?", opts:["Thirty seconds","Ninety seconds to two minutes","Four to five minutes","As long as needed"], a:1, why:"Long enough for a full STAR, short enough to invite follow-ups."},
  // Company facts
  {id:"m11", kind:"Company", q:"Who is president and CEO of ComEd?", opts:["Calvin Butler","Gil Quiniones","Jeanne Jones","Terry Donnelly"], a:1, why:"Quiniones became CEO in November 2021 after leading NYPA."},
  {id:"m12", kind:"Company", q:"Who is president and CEO of Exelon?", opts:["Calvin Butler","Anne Pramaggiore","Gil Quiniones","Chris Crane"], a:0, why:"Butler also chaired EEI for a year ending June 2026."},
  {id:"m13", kind:"Company", q:"Melissa Washington's current title is", opts:["SVP, Customer Operations","SVP, Governmental, Regulatory and External Affairs","VP, Legislative Affairs","Chief of Staff"], a:1, why:"She took GREA on September 1, 2025."},
  {id:"m14", kind:"Company", q:"Whom did Melissa Washington succeed as SVP of GREA?", opts:["Louie Binswanger","Jan Hickman","Terry Donnelly","Josh Levin"], a:0, why:"Binswanger became senior advisor to the CEO before retiring."},
  {id:"m15", kind:"Company", q:"Exelon's six reporting utilities are ComEd, PECO, BGE and", opts:["Duquesne, PPL and Pepco","Pepco, Delmarva Power and Atlantic City Electric","Nicor, Peoples Gas and Pepco","Constellation, Pepco and BGE Gas"], a:1, why:"Pepco, DPL and ACE sit under Pepco Holdings."},
  {id:"m16", kind:"Company", q:"What did Exelon spin off in 2022?", opts:["PECO","Its generation business, Constellation","Its gas utilities","Its transmission business"], a:1, why:"Exelon became a pure transmission and distribution company."},
  {id:"m17", kind:"Company", q:"How much did ComEd agree to pay under its July 2020 deferred prosecution agreement?", opts:["$20 million","$75 million","$200 million","$1.3 million"], a:2, why:"$200 million. The $1.3 million is the payments to Madigan associates."},
  {id:"m18", kind:"Company", q:"ComEd's Grid Plan 2 proposes about how much investment for 2028 to 2031?", opts:["$2 billion","$6.5 billion","$15.3 billion","$41.7 billion"], a:2, why:"$41.7B is Exelon's whole four-year capital plan."},
  {id:"m19", kind:"Company", q:"When is the ICC expected to rule on Grid Plan 2?", opts:["June 2026","By mid December 2026","Spring 2027","2028"], a:1, why:"An order is expected by December 15, with a rate filing in early 2027."},
  {id:"m20", kind:"Company", q:"What did the ICC approve for ComEd in March 2026?", opts:["A data center moratorium","Higher, size-based security deposits for large-load projects","A new rate case","A time-of-use mandate"], a:1, why:"Deposits start at $1 million for 50 to 200 MW and rise $500,000 per additional 100 MW."},
  {id:"m21", kind:"Company", q:"Per the ICC, ComEd's large-load pipeline equals about how many times its all-time peak?", opts:["0.5","1.2","3","10"], a:1, why:"More than 28,000 MW of requests against a peak near 24,000 MW."},
  {id:"m22", kind:"Company", q:"What is the Exelon Promise?", opts:["A dividend commitment","An affordability campaign launched in 2026","An ethics pledge for lobbyists","A data center partnership"], a:1, why:"It argues large users should carry the risk and backs extending PJM's price collar."},
  {id:"m23", kind:"Company", q:"Where did PJM's 2027/28 capacity auction clear?", opts:["$28.92 per MW-day","$269.92 per MW-day","$333.44 per MW-day, the cap","$555 per MW-day"], a:2, why:"The cap bound for a second straight auction. Uncapped would have been near $530."},
  {id:"m24", kind:"Company", q:"CRGA was signed on", opts:["October 31, 2025","January 8, 2026","June 1, 2026","September 15, 2021"], a:1, why:"Signed January 8 at Joliet Junior College; effective June 1, 2026."},
  {id:"m25", kind:"Company", q:"CRGA's battery storage target is", opts:["1 GW by 2030","3 GW","6 GW by 2035","No target"], a:1, why:"Three gigawatts of grid-scale storage, plus virtual power plants and lifting the large nuclear moratorium."},
  {id:"m26", kind:"Company", q:"Exelon's projected annual rate base growth through 2029 is about", opts:["3 percent","5 percent","7.9 percent","12 percent"], a:2, why:"From about $64.6B in 2025 to about $87.4B in 2029."},
  {id:"m27", kind:"Company", q:"What was Exelon's adjusted operating EPS for Q3 2026?", opts:["$0.70","$0.87","$0.91","$2.86"], a:1, why:"GAAP was $0.70; adjusted was $0.87."},
  {id:"m28", kind:"Company", q:"What did ComEd's Long-Range Strategy organize around?", opts:["Safety, Speed, Savings","People, Power and Progress","Reliability, Resilience, Renewables","Customers First"], a:1, why:"Released November 2025."},
  {id:"m29", kind:"Company", q:"Which program partners ComEd with the Metropolitan Mayors Caucus?", opts:["Green Region","Powering Safe Communities","Powering the Arts","Power Up Academy"], a:1, why:"Green Region is with Openlands; Powering the Arts with the League of Chicago Theatres."},
  {id:"m30", kind:"Company", q:"In December 2025 the ICC struck $25.4M from ComEd's reconciliation mainly because of", opts:["Storm costs","Overruns on its customer billing system rollout","Data center deposits","Executive pay"], a:1, why:"The ICC found ComEd had not proven those costs prudent."},
  {id:"m31", kind:"Company", q:"How did Exelon describe its July 2026 data center pipeline change?", opts:["It doubled","It weeded out speculative projects","It paused all new requests","It sold the pipeline to Constellation"], a:1, why:"About 11 GW high-probability, including 4 GW backed by signed TSAs."},
  {id:"m32", kind:"Company", q:"What was Madigan's sentence?", opts:["Probation","Two years","Seven and a half years and a $2.5M fine","Twelve years"], a:2, why:"Sentenced in June 2025."},
  {id:"m33", kind:"Company", q:"Which ComEd workforce program won CEWD's 2025 Community Partner Award?", opts:["CONSTRUCT","Craft Academy","Power Up Academy","Icebox Derby"], a:2, why:"Launched in 2023 for adult learners entering technical roles."},
  {id:"m34", kind:"Company", q:"About what share of Exelon's incremental capital in its 2026 plan update was driven by transmission?", opts:["None","About a quarter","Most of it","Exactly half"], a:2, why:"Exelon said transmission drove most or all incremental capital in its 2026 updates."}
];

<script>
(function(){
"use strict";
var P = window.PREP;
var PRIV = !!P.isPrivate;
var KEY = PRIV ? "interviewlab_private_v1" : "interviewlab_public_v1";

/* ---------- storage ---------- */
var S = {practiced:{}, mastered:{}, quizBest:0, quizRuns:0, mocks:[], essays:{}, notes:{}, date:"", checks:{}};
try{ var raw = localStorage.getItem(KEY); if(raw){ var o = JSON.parse(raw); for(var k in o) S[k]=o[k]; } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- theme ---------- */
var root = document.documentElement;
try{ var th = localStorage.getItem("interviewlab_theme"); if(th) root.setAttribute("data-theme", th); }catch(e){}
document.getElementById("themeBtn").onclick = function(){
  var cur = root.getAttribute("data-theme");
  var dark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  var next = dark ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try{ localStorage.setItem("interviewlab_theme", next); }catch(e){}
};

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function hl(s){ return esc(s).replace(/\[([^\]]+)\]/g,'<mark style="background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 3px">[$1]</mark>'); }
function $(sel,el){ return (el||document).querySelector(sel); }
function $$(sel,el){ return Array.prototype.slice.call((el||document).querySelectorAll(sel)); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function catName(id){ for(var i=0;i<P.categories.length;i++) if(P.categories[i].id===id) return P.categories[i].name; return id; }
function story(id){ if(!P.stories) return null; for(var i=0;i<P.stories.length;i++) if(P.stories[i].id===id) return P.stories[i]; return null; }
function qById(id){ for(var i=0;i<P.questions.length;i++) if(P.questions[i].id===id) return P.questions[i]; return null; }
function fmt(sec){ var m=Math.floor(Math.abs(sec)/60), s=Math.abs(sec)%60; return (sec<0?"-":"")+m+":"+(s<10?"0":"")+s; }
function words(s){ s=(s||"").trim(); return s? s.split(/\s+/).length : 0; }
var timers=[];
function clearTimers(){ timers.forEach(function(t){clearInterval(t);}); timers=[]; stopRec(); }

/* ---------- nav ---------- */
var NAV = [
  {grp:"Start"},
  {id:"home", label:"Dashboard", ic:"⌂"},
  {id:"star", label:"STAR method", ic:"★"},
  {grp:"Prepare"},
  {id:"stories", label:"Story bank", ic:"✎", priv:true},
  {id:"questions", label:"Question bank", ic:"?"},
  {id:"scripts", label:"Scripts", ic:"❝", priv:true},
  {grp:"Practice"},
  {id:"verbal", label:"Speak it", ic:"🎙"},
  {id:"essay", label:"Write it", ic:"✍"},
  {id:"quiz", label:"Multiple choice", ic:"◉"},
  {id:"flash", label:"Flashcards", ic:"▤"},
  {id:"recall", label:"Recall drill", ic:"⚡", priv:true},
  {id:"mock", label:"Mock interview", ic:"▶"},
  {grp:"The company"},
  {id:"company", label:"ComEd and Exelon", ic:"⚑"},
  {id:"issues", label:"Hot issues", ic:"⚠"},
  {id:"leaders", label:"Leadership", ic:"☺"},
  {id:"news", label:"News tracker", ic:"◷"},
  {grp:"Interview day"},
  {id:"ask", label:"Questions to ask", ic:"↩"},
  {id:"dayof", label:"Day-of toolkit", ic:"✓"},
  {id:"sources", label:"Sources", ic:"§"}
].filter(function(n){ return !n.priv || PRIV; });

function buildNav(cur){
  var side="", mob="";
  NAV.forEach(function(n){
    if(n.grp){ side += '<div class="grp">'+esc(n.grp)+'</div>'; return; }
    var on = n.id===cur ? ' class="on" aria-current="page"' : '';
    side += '<a href="#'+n.id+'"'+on+'><span aria-hidden="true">'+n.ic+'</span>'+esc(n.label)+'</a>';
    mob += '<a href="#'+n.id+'"'+on+'>'+esc(n.label)+'</a>';
  });
  $("#sidenav").innerHTML = side; $("#mobnav").innerHTML = mob;
  var a = $("#mobnav a.on"); if(a && a.scrollIntoView) a.scrollIntoView({inline:"center",block:"nearest"});
}

/* ---------- readiness ---------- */
function readiness(){
  var qDone = Object.keys(S.practiced).length / P.questions.length;
  var st = PRIV && P.stories ? Object.keys(S.mastered).length / P.stories.length : null;
  var quiz = S.quizBest/100;
  var mock = Math.min(S.mocks.length,3)/3;
  var parts = st===null ? [[qDone,.4],[quiz,.35],[mock,.25]] : [[qDone,.3],[st,.3],[quiz,.2],[mock,.2]];
  var v=0; parts.forEach(function(p){ v+=Math.min(1,p[0])*p[1]; });
  return Math.round(v*100);
}

/* ---------- views ---------- */
var V = {};

V.home = function(el){
  var r = readiness();
  var days = "";
  if(S.date){ var d = Math.ceil((new Date(S.date+"T09:00:00") - new Date())/86400000); days = d>=0 ? d+" days" : "Done"; }
  var q = P.questions[Math.floor(Math.random()*P.questions.length)];
  var f = P.mcq.filter(function(m){return m.kind==="Company";}); f = f[Math.floor(Math.random()*f.length)];
  var st = PRIV ? P.stories[Math.floor(Math.random()*(P.stories.length-1))] : null;
  el.innerHTML =
  '<div class="hero">'+
    '<div class="card"><div class="kicker">'+(PRIV?'Private edition':'Behavioral interview lab')+'</div>'+
      '<h1>'+esc(P.meta.title)+'</h1><p class="muted">'+esc(P.meta.subtitle)+'</p>'+
      '<p>Build answers with STAR, rehearse them out loud and in writing, test what you know about the company, then run a timed mock interview.</p>'+
      '<div class="row"><a class="btn" href="#mock">Start a mock interview</a><a class="btn ghost" href="#star">Review STAR</a></div>'+
      '<p class="small muted" style="margin-top:12px">Updated '+esc(P.meta.updated)+'. Progress saves in this browser only.</p></div>'+
    '<div class="card" style="text-align:center"><div class="kicker">Readiness</div><div class="ring" style="--p:'+r+'"><b>'+r+'%</b></div>'+
      '<label class="lab" for="idate"><span>Interview date</span><span class="muted">'+esc(days)+'</span></label><input type="date" id="idate" value="'+esc(S.date)+'"></div>'+
  '</div>'+
  '<div class="grid g4" style="margin-bottom:20px">'+
    stat(Object.keys(S.practiced).length+" / "+P.questions.length,"Questions practiced")+
    (PRIV? stat(Object.keys(S.mastered).length+" / "+P.stories.length,"Stories mastered") : stat(P.categories.length,"Competency areas"))+
    stat(S.quizBest+"%","Best quiz score")+
    stat(S.mocks.length,"Mock interviews")+
  '</div>'+
  '<h2>Today\'s drill</h2>'+
  '<div class="grid g3">'+
    '<div class="card"><div class="kicker">Question</div><p><b>'+esc(q.q)+'</b></p><p class="small muted">'+esc(catName(q.cat))+'</p><a class="btn sm" href="#verbal" data-q="'+q.id+'" id="drillQ">Practice it</a></div>'+
    '<div class="card"><div class="kicker">Company fact</div><p><b>'+esc(f.q)+'</b></p><details><summary class="small">Show answer</summary><p>'+esc(f.opts[f.a])+'</p><p class="small muted">'+esc(f.why)+'</p></details></div>'+
    (st? '<div class="card"><div class="kicker">Story to recall</div><p><b>'+esc(st.title)+'</b></p><p class="small muted">Say the 60-second version out loud before you open it.</p><a class="btn sm ghost" href="#stories" data-s="'+st.id+'" id="drillS">Open story</a></div>'
       : '<div class="card"><div class="kicker">Hot issue</div><p><b>'+esc(P.company.topics[0].title)+'</b></p><p class="small">'+esc(P.company.topics[0].points[0])+'</p><a class="btn sm ghost" href="#issues">Read more</a></div>')+
  '</div>'+
  (PRIV? '<h2 style="margin-top:24px">Private notes</h2><div class="callout priv"><ul class="clean">'+P.privateNotes.map(function(n){return '<li>'+esc(n)+'</li>';}).join("")+'</ul></div>' : '')+
  '<div class="row" style="margin-top:20px"><button class="btn ghost sm" id="resetAll">Reset all progress</button></div>';
  $("#idate").onchange=function(){ S.date=this.value; save(); route(); };
  $("#drillQ").onclick=function(){ pendingQ=this.getAttribute("data-q"); };
  var ds=$("#drillS"); if(ds) ds.onclick=function(){ pendingS=this.getAttribute("data-s"); };
  $("#resetAll").onclick=function(){ if(confirm("Reset all saved progress in this browser?")){ S={practiced:{},mastered:{},quizBest:0,quizRuns:0,mocks:[],essays:{},notes:{},date:"",checks:{}}; save(); route(); } };
};
function stat(v,l){ return '<div class="card stat"><b>'+esc(v)+'</b><span>'+esc(l)+'</span></div>'; }

V.star = function(el){
  var s=P.star, colors=["var(--navy)","#7a8aa6","var(--accent)","var(--good)"];
  el.innerHTML = '<h1>The STAR method</h1><p class="muted">ComEd interviews use STAR. Every behavioral answer should move through these four parts.</p>'+
  '<div class="star">'+s.parts.map(function(p){return '<div><b>'+p.k+'</b><h3>'+esc(p.name)+'</h3><p class="small">'+esc(p.tip)+'</p><span class="tag acc">~'+p.pct+'% of time</span></div>';}).join("")+'</div>'+

  el.innerHTML='<h1>Flashcards</h1><p class="muted">Tap or press space to flip. Arrow keys move between cards.</p><div class="tabs" id="fTabs"></div><div class="flash" id="fc" tabindex="0" role="button" aria-label="Flashcard, press to flip"><div class="flash-in"><div class="face front" id="ff"></div><div class="face back" id="fb"></div></div></div>'+
  '<div class="row" style="justify-content:center;margin-top:14px"><button class="btn ghost" id="fprev">← Prev</button><span class="muted" id="fpos"></span><button class="btn ghost" id="fnext">Next →</button><button class="btn ghost" id="fshuf">Shuffle</button></div>';
  function tabs(){ $("#fTabs").innerHTML=Object.keys(decks).map(function(k){return '<button class="'+(k===dk?'on':'')+'" data-d="'+k+'">'+esc(decks[k].name)+'</button>';}).join(""); $$("#fTabs button").forEach(function(b){b.onclick=function(){dk=b.getAttribute("data-d");order=decks[dk].cards.map(function(c,j){return j;});i=0;tabs();draw();};}); }
  function draw(){ var c=decks[dk].cards[order[i]]; $("#fc").classList.remove("flip"); $("#ff").innerHTML='<div class="kicker">'+esc(decks[dk].name)+'</div><h3>'+esc(c.f)+'</h3>'; $("#fb").innerHTML='<h3>'+esc(c.b)+'</h3><p>'+esc(c.n)+'</p>'; $("#fpos").textContent=(i+1)+" / "+order.length; }
  $("#fc").onclick=function(){ this.classList.toggle("flip"); };
  $("#fc").onkeydown=function(e){ if(e.key===" "||e.key==="Enter"){e.preventDefault();this.classList.toggle("flip");} if(e.key==="ArrowRight") $("#fnext").click(); if(e.key==="ArrowLeft") $("#fprev").click(); };
  $("#fnext").onclick=function(){ i=(i+1)%order.length; draw(); };
  $("#fprev").onclick=function(){ i=(i-1+order.length)%order.length; draw(); };
  $("#fshuf").onclick=function(){ order=shuffle(order); i=0; draw(); };
  order=decks[dk].cards.map(function(c,j){return j;}); tabs(); draw();
};

V.recall = function(el){
  var qs=P.questions.filter(function(q){return q.stories.some(function(id){return story(id);});}), cur, t, iv, n=0, ok=0, done=false;
  el.innerHTML='<h1>Recall drill</h1><p class="muted">A question appears. Pick the best story within ten seconds. Speed matters because in the room you need to choose fast.</p><div class="card" id="rc"></div>';
  function next(){
    clearInterval(iv); done=false; cur=qs[Math.floor(Math.random()*qs.length)];
    var right=story(cur.stories[0]), wrong=shuffle(P.stories.filter(function(s){return cur.stories.indexOf(s.id)<0&&s.id!=="setback";})).slice(0,3), opts=shuffle([right].concat(wrong));
    t=10; $("#rc").innerHTML='<div class="row" style="justify-content:space-between"><span class="tag acc">'+esc(catName(cur.cat))+'</span><span class="small muted">'+ok+' of '+n+' correct</span></div><h3 style="margin-top:10px">'+esc(cur.q)+'</h3><div class="timer" id="rt">10</div>'+opts.map(function(s){return '<button class="opt" data-s="'+s.id+'">'+esc(s.title)+'</button>';}).join("")+'<div id="rfb"></div>';
    iv=setInterval(function(){ t--; var e=$("#rt"); if(!e){clearInterval(iv);return;} e.textContent=t; e.className="timer"+(t<=3?" over":t<=6?" warn":""); if(t<=0){ clearInterval(iv); finish(null); } },1000); timers.push(iv);
    $$("#rc .opt").forEach(function(b){ b.onclick=function(){ finish(b.getAttribute("data-s")); }; });
  }
  function finish(id){ if(done) return; done=true; clearInterval(iv); n++; var good=id&&cur.stories.indexOf(id)>=0; if(good) ok++;
    $$("#rc .opt").forEach(function(b){ var s=b.getAttribute("data-s"); if(cur.stories.indexOf(s)>=0) b.classList.add("right"); else if(s===id) b.classList.add("wrong"); });
    $("#rfb").innerHTML='<div class="fb"><b>'+(good?"Yes.":id?"Better fit shown in green.":"Time.")+'</b> Any of these work: '+cur.stories.map(story).filter(Boolean).map(function(s){return esc(s.title);}).join(", ")+'.</div><div class="row" style="margin-top:10px"><button class="btn" id="rnext">Next</button></div>';
    $("#rnext").onclick=next; $("#rnext").focus(); }
  next();
};

V.mock = function(el){
  var set=[], i=0, t=0, iv=null, ratings=[];
  el.innerHTML='<h1>Mock interview</h1><p class="muted">Eight questions in a row, like the real panel. Answer each out loud, rate yourself, and move on. The clock turns amber at 1:30 and red at 2:30.</p><div class="card" id="mk"></div>';
  function intro(){
    $("#mk").innerHTML='<h2>Ready?</h2><p>The set mixes one fit question, one ethics question, one current-issues question and five others. Sit up, speak to the screen as if it were the panel, and do not pause the clock.</p>'+
    (S.mocks.length?'<p class="small muted">Past sessions: '+S.mocks.slice(-5).map(function(m){return m.d+" ("+m.avg+"/5)";}).join(", ")+'</p>':'')+'<button class="btn" id="mkgo">Begin</button>';
    $("#mkgo").onclick=begin;
  }
  function begin(){
    var by=function(c){return shuffle(P.questions.filter(function(q){return q.cat===c;}))[0];};
    var core=[by("fit"),by("ethics"),by("current")], ids=core.map(function(q){return q.id;});
    var rest=shuffle(P.questions.filter(function(q){return ids.indexOf(q.id)<0&&q.cat!=="fit";})).slice(0,5);
    set=[core[0]].concat(shuffle(rest.concat(core.slice(1)))); i=0; ratings=[]; ask();
  }
  function ask(){
    clearInterval(iv); t=0; var q=set[i];
    $("#mk").innerHTML='<div class="row" style="justify-content:space-between"><span class="tag acc">Question '+(i+1)+' of '+set.length+'</span><span class="tag">'+esc(catName(q.cat))+'</span></div><div class="meter" style="margin:10px 0"><span style="width:'+(i/set.length*100)+'%"></span></div><h2>'+esc(q.q)+'</h2><div class="timer" id="mt">0:00</div>'+
    '<p class="small"><b>Rate this answer</b></p><div class="row" id="mrate">'+[1,2,3,4,5].map(function(n){return '<button class="btn ghost sm" data-r="'+n+'">'+n+'</button>';}).join("")+'</div><p class="small muted">1 rambled or no result · 3 solid STAR · 5 crisp, specific, memorable</p>';
    iv=setInterval(function(){ t++; var e=$("#mt"); if(!e){clearInterval(iv);return;} e.textContent=fmt(t); e.className="timer"+(t>150?" over":t>=90?" warn":""); },1000); timers.push(iv);
    $$("#mrate button").forEach(function(b){ b.onclick=function(){ ratings.push({q:q,r:+b.getAttribute("data-r"),t:t}); S.practiced[q.id]=Math.max(S.practiced[q.id]||0,+b.getAttribute("data-r")); i++; if(i<set.length) ask(); else end(); }; });
  }
  function end(){
    clearInterval(iv); var sum=0,tt=0; ratings.forEach(function(r){sum+=r.r;tt+=r.t;}); var avg=(sum/ratings.length).toFixed(1);
    S.mocks.push({d:new Date().toLocaleDateString(),avg:avg}); save();
    var weak=ratings.filter(function(r){return r.r<=3||r.t>150||r.t<60;});
    $("#mk").innerHTML='<h2>Session complete</h2><div class="grid g3">'+stat(avg+" / 5","Average rating")+stat(fmt(Math.round(tt/ratings.length)),"Average length")+stat(weak.length,"Answers to rework")+'</div>'+
    '<table class="t" style="margin-top:16px"><thead><tr><th>Question</th><th>Time</th><th>Rating</th></tr></thead><tbody>'+ratings.map(function(r){return '<tr><td>'+esc(r.q.q)+'</td><td>'+fmt(r.t)+'</td><td>'+r.r+'</td></tr>';}).join("")+'</tbody></table>'+
    (weak.length?'<div class="callout" style="margin-top:14px"><b>Next step.</b> Rework these in Write it, then run another mock.</div>':'<div class="callout navy" style="margin-top:14px">Every answer landed in range. Try another set.</div>')+
    '<div class="row" style="margin-top:12px"><button class="btn" id="mkag">Run another</button><a class="btn ghost" href="#essay">Go to Write it</a></div>';
    $("#mkag").onclick=begin;
  }
  intro();
};

V.company = function(el){
  var C=P.company, sel=C.sections[0].id;
  el.innerHTML='<h1>ComEd and Exelon</h1><p class="muted">What the company is, what it does well, where it struggles and where it is headed. Facts as of '+esc(P.meta.updated)+'; check the news tracker before your interview.</p>'+
  '<div class="grid g3" style="margin-bottom:18px">'+C.snapshot.map(function(s){return '<div class="card stat"><span>'+esc(s.label)+'</span><b>'+esc(s.value)+'</b><span>'+esc(s.note)+'</span></div>';}).join("")+'</div>'+
  '<div class="tabs" id="cTabs"></div><div class="card" id="cBody"></div>';
  function draw(){
    $("#cTabs").innerHTML=C.sections.map(function(s){return '<button class="'+(s.id===sel?'on':'')+'" data-c="'+s.id+'">'+esc(s.title)+'</button>';}).join("");
    $$("#cTabs button").forEach(function(b){b.onclick=function(){sel=b.getAttribute("data-c");draw();};});
    var s=C.sections.filter(function(x){return x.id===sel;})[0];
    $("#cBody").innerHTML='<h2>'+esc(s.title)+'</h2>'+s.body.map(function(p){return '<p>'+esc(p)+'</p>';}).join("")+(s.callout?'<div class="callout">'+esc(s.callout)+'</div>':'');
  }
  draw();
};

V.issues = function(el){
  el.innerHTML='<h1>Hot issues</h1><p class="muted">The three topics most likely to come up, with the points you should be able to make without notes.</p>'+
  P.company.topics.map(function(t){return '<div class="card" style="margin-bottom:16px"><h2>'+esc(t.title)+'</h2><ul class="clean">'+t.points.map(function(p){var i=p.indexOf(". ");return '<li>'+(i>0&&i<40?'<b>'+esc(p.slice(0,i+1))+'</b>'+esc(p.slice(i+1)):esc(p))+'</li>';}).join("")+'</ul></div>';}).join("")+
  '<div class="card"><h3>Practice these</h3><p>'+P.questions.filter(function(q){return q.cat==="current";}).map(function(q){return '<a href="#verbal" class="tag nav" data-q="'+q.id+'">'+esc(q.q)+'</a>';}).join(" ")+'</p></div>';
  $$("[data-q]",el).forEach(function(a){a.onclick=function(){pendingQ=a.getAttribute("data-q");};});
};

V.leaders = function(el){
  el.innerHTML='<h1>Leadership</h1><p class="muted">Who you may meet or hear referenced. Confirm titles before the interview, since roles change.</p>'+
  (PRIV?'<div class="callout priv"><b>Private.</b> Your notes on each leader appear in red boxes. Keep this edition off GitHub.</div>':'')+
  '<div class="grid g2">'+P.leaders.map(function(l){var ini=l.name.split(" ").map(function(w){return w[0];}).join("");
    return '<div class="card leader"><div class="row"><div class="ini" aria-hidden="true">'+esc(ini)+'</div><div><h3 style="margin:0">'+esc(l.name)+'</h3><div class="small muted">'+esc(l.role)+'</div></div></div><ul class="clean">'+l.facts.map(function(f){return '<li>'+esc(f)+'</li>';}).join("")+'</ul>'+(PRIV&&P.leaderNotes[l.name]?'<div class="callout priv small">'+esc(P.leaderNotes[l.name])+'</div>':'')+'</div>';}).join("")+'</div>'+
  '<div class="card" style="margin-top:16px"><h3>Reporting line for this role</h3><p>Director of government affairs → Vice President, External Affairs or directly → SVP, Governmental, Regulatory and External Affairs → President and CEO, ComEd → Exelon. Confirm which before your interview.</p></div>';
};

V.news = function(el){
  el.innerHTML='<h1>News tracker</h1><p class="muted">Newest first. Add your own entries as things happen; they save in this browser.</p>'+
  '<div class="card" style="margin-bottom:16px"><div class="grid g3"><div><label class="lab" for="nd">Date</label><input type="date" id="nd"></div><div><label class="lab" for="ntg">Tag</label><input type="text" id="ntg" placeholder="e.g. Regulatory"></div><div><label class="lab" for="ntx">What happened</label><input type="text" id="ntx"></div></div><div class="row" style="margin-top:10px"><button class="btn sm" id="nadd">Add entry</button></div></div>'+
  '<div class="timeline" id="tl"></div>';
  function draw(){
    var mine=(S.notes.news||[]).map(function(n,ix){return {date:n.date,tag:n.tag,text:n.text,mine:ix};});
    var all=P.news.concat(mine).sort(function(a,b){return a.date<b.date?1:-1;});
    $("#tl").innerHTML=all.map(function(n){return '<div class="ev"><div class="small muted">'+esc(n.date)+' <span class="tag">'+esc(n.tag||"Note")+'</span>'+(n.mine!=null?' <button class="btn ghost sm" data-del="'+n.mine+'">Remove</button>':'')+'</div><div>'+esc(n.text)+'</div></div>';}).join("");
    $$("[data-del]").forEach(function(b){b.onclick=function(){S.notes.news.splice(+b.getAttribute("data-del"),1);save();draw();};});
  }
  $("#nadd").onclick=function(){ var t=$("#ntx").value.trim(); if(!t) return; S.notes.news=S.notes.news||[]; S.notes.news.push({date:$("#nd").value||new Date().toISOString().slice(0,10),tag:$("#ntg").value.trim(),text:t}); save(); $("#ntx").value=""; draw(); };
  draw();
};

V.ask = function(el){
  el.innerHTML='<h1>Questions to ask them</h1><p class="muted">Pick two or three that you genuinely want answered. Star the ones you will use.</p>'+
  P.ask.map(function(g,gi){return '<div class="card" style="margin-bottom:14px"><h3>'+esc(g.theme)+'</h3>'+g.items.map(function(it,ii){var k="a"+gi+"_"+ii;return '<label class="check"><input type="checkbox" data-k="'+k+'"'+(S.checks[k]?' checked':'')+'><span>'+esc(it)+'</span></label>';}).join("")+'</div>';}).join("");
  $$("[data-k]",el).forEach(function(c){c.onchange=function(){S.checks[c.getAttribute("data-k")]=c.checked;save();};});
};

V.dayof = function(el){
  var d=P.dayof;
  el.innerHTML='<h1>Day-of toolkit</h1><div class="grid g2"><div class="card"><h3>Checklist</h3>'+d.checklist.map(function(c,i){var k="d"+i;return '<label class="check"><input type="checkbox" data-k="'+k+'"'+(S.checks[k]?' checked':'')+'><span>'+esc(c)+'</span></label>';}).join("")+'</div>'+
  '<div class="card"><h3>Your close</h3><p>'+esc(d.close)+'</p>'+(PRIV?'<div class="script">'+esc(P.scripts.closing)+'</div>':'')+'<h3 style="margin-top:16px">Top ten numbers to know</h3><ul class="clean small">'+
  ["4M+ customers, about 9 million people","Exelon: six utilities, nearly 11M customers","Grid Plan 2: about $15.3B, 2028 to 2031, ICC order by mid December","Large-load pipeline over 28,000 MW vs. a peak near 24,000 MW","PJM 2027/28 capacity: $333.44 per MW-day, at the cap","Exelon capital plan: about $41.7B, 2026 to 2029","Rate base growth about 7.9% a year","Q3 2026 adjusted EPS $0.87","CRGA: signed Jan 8, 2026, 3 GW storage target","2020 deferred prosecution agreement: $200M"].map(function(n){return '<li>'+esc(n)+'</li>';}).join("")+'</ul></div></div>'+
  '<div class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Thank-you note</h3><button class="btn sm ghost" id="cpy">Copy</button></div><div class="script" id="ty" style="margin-top:10px">'+esc(d.thankyou)+'</div></div>';
  $$("[data-k]",el).forEach(function(c){c.onchange=function(){S.checks[c.getAttribute("data-k")]=c.checked;save();};});
  $("#cpy").onclick=function(){ var b=this; try{ navigator.clipboard.writeText(d.thankyou).then(function(){b.textContent="Copied";}); }catch(e){} };
};

V.sources = function(el){
  el.innerHTML='<h1>Sources</h1><p class="muted">Every company fact on this site traces to one of these. Recheck anything time-sensitive before the interview.</p><div class="card"><ol>'+P.sources.map(function(s){return '<li style="margin:.35em 0"><a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+esc(s[0])+'</a></li>';}).join("")+'</ol></div>';
};

/* ---------- router ---------- */
function route(){
  clearTimers();
  var id=(location.hash||"#home").slice(1);
  if(!V[id] || NAV.every(function(n){return n.id!==id;})) id="home";
  buildNav(id);
  var el=$("#app"); el.innerHTML=""; V[id](el);
  window.scrollTo(0,0);
  if(document.activeElement && document.activeElement.tagName==="A") el.focus({preventScroll:true});
}
window.addEventListener("hashchange",route);
document.addEventListener("click",function(e){ var a=e.target.closest&&e.target.closest("a[data-q],a[data-s]"); if(a){ if(a.getAttribute("data-q")) pendingQ=a.getAttribute("data-q"); if(a.getAttribute("data-s")) pendingS=a.getAttribute("data-s"); } },true);
route();
})();

</script>
