s":[["Illinois interstates","I-55, I-57 and I-70 cross long stretches of farm country where lines are proposed."]],"news":[]},"co2-eminent":{"headline":"Bar CO2 pipelines from using eminent domain","bg":"Carbon dioxide pipelines with an ICC certificate under the Carbon Dioxide Transportation and Sequestration Act would be prohibited from seeking or exercising eminent domain. Pipelines proposed to carry CO2 to sequestration sites drew strong landowner opposition in the Midwest.","why":"Without eminent domain, pipeline projects depend on voluntary easements, which can make them hard to complete. The bill is written inside the Public Utilities Act, so it touches the same provisions public utilities rely on for their own land rights.","q":["Does the change spill over into utility eminent domain generally"],"go":["policy"],"plain":["Eminent domain is the power to force a property sale for a public use, with payment. SB2842 would bar carbon dioxide pipelines with an ICC certificate from seeking or using it. These pipelines carry captured CO2 to underground storage. Landowners in the Midwest strongly opposed them.","Without eminent domain a pipeline needs every landowner to agree, which makes long routes very hard."],"ex":"A pipeline needs a 30 mile route and 400 landowners. If 20 refuse to sell, the company cannot take the land by force and has to reroute or quit. Made up numbers.","viz":{"kind":"flow","title":"Without eminent domain","steps":["Pipeline proposes route","Negotiate with each landowner","Holdouts cannot be forced","Reroute or cancel"]},"states":[["South Dakota","Banned eminent domain for CO2 pipelines in 2025, which threatened the large Summit Carbon project."],["Illinois already","Public Act 104-0390 requires drain tile repair and landowner compensation."]],"places":[["Decatur","ADM runs a carbon storage project in the Mt. Simon sandstone."],["Heartland Greenway","Navigator cancelled its large Midwest CO2 pipeline in 2023."]],"news":[{"t":"South Dakota bans eminent domain for carbon pipelines","src":"E&E News","u":"https://www.eenews.net/articles/south-dakota-bans-eminent-domain-for-carbon-pipelines/","d":"2025-03"}]},"icc-property":{"headline":"Let the ICC buy real property in Springfield","bg":"In fiscal years 2027 and 2028 the ICC may acquire real property in Springfield as needed to carry out its duties, subject to third party interests.","why":"Housekeeping for the agency that regulates utilities. It is not tied to rates.","q":["What property is planned"],"go":["icc"],"plain":["SB3973 allows the ICC to buy real property in Springfield in fiscal years 2027 and 2028 as needed for its duties, subject to third party interests.","It is an administrative housekeeping bill."],"ex":"The ICC needs more office or hearing space and buys a building. Made up example.","viz":{"kind":"flow","title":"Purchase","steps":["ICC identifies need","Buys property in Springfield in FY2027 or FY2028"]},"states":[["General","Agencies commonly need legislative permission to buy property."]],"places":[["Springfield","Home of the ICC office."]],"news":[]},"takings":{"headline":"Require a regulatory takings assessment before approving gas decarbonization plans","bg":"Decarbonization pilots, pathways or infrastructure plans in the ICC Future of Gas proceeding (Docket 24-0158) would need an independent third party Regulatory Takings Assessment before approval. A mandate could not be approved if it risks a taking equal to at least 80 percent of depreciated asset value. Rules would apply to all Phase 2C proposals and be done by June 1, 2026, with uniform metrics for bill impacts and equity analysis.","why":"It adds a high bar and an independent check on any plan that would strand gas assets. The bill is closely tied to the Future of Gas docket and its Phase 2C. See the hub's Future of Gas page.","q":["How is a regulatory taking measured","Does the June 2026 rulemaking date still matter"],"go":["gas","icc"],"plain":["A regulatory taking happens when a government rule cuts the value of property so much that it is treated like taking it. SB3979 says decarbonization pilots, pathways or infrastructure plans in the ICC's Future of Gas proceeding, Docket 24-0158, would need an independent third party Regulatory Takings Assessment before approval. A mandate could not be approved if it risks a taking equal to at least 80 percent of depreciated asset value. The rules would apply to all Phase 2C proposals.","In plain terms, it asks whether shutting down parts of the gas system would wipe out the value of pipes the utility is still paying for."],"ex":"A gas utility has $1 billion in pipes, which after depreciation are worth $400 million on the books. A plan that strands $320 million or more would hit the 80 percent line and could not be approved. Made up numbers.","viz":{"kind":"bars","title":"The 80 percent line","rows":[["Depreciated asset value",100.0],["Maximum taking allowed",80.0]],"unit":"percent, illustrative"},"states":[["Massachusetts","Its regulator has ordered utilities to plan for lower gas use."],["Colorado","Requires clean heat plans."],["New York","Has a building electrification law and gas planning."]],"places":[["Illinois gas utilities","Ameren Illinois, Nicor Gas and Peoples Gas are named in CUB's discussion of the proceeding."]],"news":[{"t":"CUB Q&A, the Illinois Future of Gas proceeding","src":"Citizens Utility Board","u":"https://www.citizensutilityboard.org/blog/2026/08/03/cub-qa-the-illinois-future-of-gas-proceeding/","d":"2026-08-03"}]},"excavation":{"headline":"Rules for communications crews digging near buried utility lines","bg":"Illinois' damage prevention law requires locates before digging. HB4731 excludes shallow hand tool excavation by a communications provider to connect a customer's building to its own network. SB3573 defines fiber optic excavation crews and requires JULIE training and other safety practices.","why":"Third party damage to buried gas and electric lines is a safety risk and a leading cause of gas incidents. Gas utilities watch any exemption from locate rules closely, while fiber builders want fewer delays.","q":["Is a 12 inch hand dig exemption safe for gas lines","What training is required"],"go":["u101"],"plain":["Illinois law requires a locate before digging so crews do not hit buried pipes and cables. HB4731 excludes shallow hand tool excavation by a communications provider to connect a customer's building to its own network. SB3573 defines fiber optic excavation crews and requires JULIE training and other safety practices.","JULIE is the Illinois one call system."],"ex":"A cable installer digs three inches with a hand shovel to connect a house. Under HB4731 that hand dig would not need the same locate rules. A fiber crew running a long trench would need training under SB3573. Made up example.","viz":{"kind":"vs","title":"Two approaches","sides":[{"h":"HB4731","items":["Excludes shallow hand tool digging to connect a customer"]},{"h":"SB3573","items":["Adds training and safety rules for fiber crews"]}]},"states":[["One call states","Every state has an 811 call before you dig system, and most have training or penalty rules."]],"places":[["Illinois streets and yards","Where fiber is being installed."]],"news":[]},"rta-vote":{"headline":"Require utilities to report their votes in RTOs and explain how each serves the public","bg":"Regional transmission organizations such as MISO and PJM run the grid and markets using member votes. A utility that belongs to one would report each recorded vote to the ICC every February 1, including votes cast by affiliates, with a brief explanation of how each vote serves the public interest.","why":"It brings RTO governance into ICC view and creates a record that could be cited in rate or planning cases. Utilities that vote through affiliates would need new internal processes.","q":["How does it treat votes made by a parent company","What would the ICC do with the reports"],"go":["miso","icc"],"plain":["Regional transmission organizations such as MISO and PJM run the grid and markets using member votes. HB1802 would require a utility that belongs to one to report each recorded vote to the ICC every February 1, including votes cast by affiliates, with a short explanation of how each vote serves the public interest.","It makes the votes of utilities visible to regulators and the public."],"ex":"Ameren votes on a market rule change in MISO. The next February it must tell the ICC how it voted and why that serves customers. Made up example.","viz":{"kind":"flow","title":"Annual vote report","steps":["Utility votes in MISO or PJM","Records vote including affiliates","Reports to ICC every Feb 1","Explains public interest"]},"states":[["General","Few states require this level of vote reporting. I did not find a direct model."]],"places":[["Ameren Illinois and ComEd","MISO and PJM members."]],"news":[]},"rate-hearings":{"headline":"Require a public hearing for every general rate increase request","bg":"For any general rate increase by a gas, electric, water or sewer utility, the ICC would hold at least one public hearing where affected ratepayers can testify. This bill passed both houses.","why":"Hearings add a public record and can raise political attention during rate cases. They add scheduling work in a process that already runs on statutory deadlines.","q":["How would hearings fit into an 11 month rate case clock"],"go":["icc"],"plain":["HB4514 requires the ICC to hold at least one public hearing where ratepayers can testify for every general rate increase request by a gas, electric, water or sewer utility. It passed both houses.","A general rate case sets the prices a utility can charge for several years."],"ex":"Ameren files a rate case. Before the ICC decides, at least one hearing lets customers speak. In the recent Ameren gas case a hearing was held in Springfield. Made up example for the general rule, with the Springfield hearing from NPR Illinois.","viz":{"kind":"flow","title":"Rate case path","steps":["Utility files","ICC reviews","Public hearing where customers testify","ICC order"]},"states":[["Many states","Require public comment or hearings, including Pennsylvania and Maryland. I did not verify each state."]],"places":[["Springfield","NPR Illinois reported a hearing on Ameren's gas rate hike request in August 2025."]],"news":[{"t":"Regulators strike millions from Ameren, ComEd electric rate hike requests","src":"NPR Illinois","u":"https://www.nprillinois.org/economy-business/2025-12-19/regulators-strike-millions-from-ameren-comed-electric-rate-hike-requests","d":"2025-12-19"},{"t":"Ameren residential gas customers to see average 3.65 percent increase","src":"St. Louis Public Radio","u":"https://www.stlpr.org/economy-business/2025-12-01/amerens-illinois-customers-average-3-65-increase-gas-bills-january","d":"2025-12-01"}]},"icc-transparency":{"headline":"Annual billing transparency reports from utilities","bg":"The ICC would require gas, electric and water utilities to report annually on their efforts to maintain billing transparency.","why":"A reporting requirement that increases oversight of bills. Utilities would need to design and report on a metric set.","q":["What goes in the report"],"go":["icc"],"plain":["HB4355 would have the ICC require gas, electric and water utilities to report annually on their efforts to maintain billing transparency.","Billing transparency means customers can understand what they are charged."],"ex":"Each year a utility files a report on how it explains bills, including changes to notices and website. Made up example.","viz":{"kind":"flow","title":"Report","steps":["Utility prepares report","ICC receives annually","Public sees efforts"]},"states":[["General","Billing rules are common, such as plain language bill requirements."]],"places":[["Illinois bills","The ICC handles complaints about bills."]],"news":[]},"low-income-rate":{"headline":"Allow low income discount rates covering the entire bill","bg":"The ICC could approve a low income discount rate for residential electric and gas customers that applies to the whole bill, including delivery and supply, funded by a surcharge on customers. Changes apply retroactively from January 1, 2023. HB4456 also changes the Energy Assistance Act, capping eligibility at 300 percent of the federal poverty level and raising the administrative cap. HB4456 passed both houses.","why":"Affordability is the dominant theme of 2026. A discount funded by a surcharge shifts cost to other customers, so design questions on size, eligibility and who pays are where the argument lies. SB3839 would go the opposite way and remove the ICC's authority to order low income discount rates.","q":["How large a surcharge on other customers","Does it replace or add to existing assistance programs"],"go":["policy","icc"],"plain":["HB4456 and SB3717 allow the ICC to approve a low income discount rate for residential electric and gas customers that applies to the whole bill, delivery and supply, funded by a surcharge on other customers. Changes apply retroactively from January 1, 2023. HB4456 also changes the Energy Assistance Act, caps eligibility at 300 percent of the federal poverty level and raises the administrative cap. HB4456 passed both houses.","The cost of the discount is spread across other ratepayers."],"ex":"A household at 200 percent of the federal poverty level gets a lower rate on its entire bill. Other customers pay a small surcharge to fund it. Made up example.","viz":{"kind":"bars","title":"Eligibility cap","rows":[["Federal poverty level",100.0],["Eligibility cap",300.0]],"unit":"percent of poverty level"},"states":[["California","The CARE program gives low income customers a discount of around 30 to 35 percent."],["Pennsylvania","Customer Assistance Programs charge a share of income."],["Ohio","Percentage of income plans have run for years."]],"places":[["Illinois energy assistance","LIHEAP and utility programs."]],"news":[{"t":"Regulators strike millions from Ameren, ComEd electric rate hike requests","src":"NPR Illinois","u":"https://www.nprillinois.org/economy-business/2025-12-19/regulators-strike-millions-from-ameren-comed-electric-rate-hike-requests","d":"2025-12-19"}]},"savings-monitor":{"headline":"ICC to monitor each utility's effect on consumer savings and the grid","bg":"The ICC would monitor the effect of each public utility on overall consumer savings and on the grid, and report each year to the Governor, Attorney General and General Assembly.","why":"A new oversight report that would invite comparison among utilities.","q":["What metrics would be used"],"go":["icc"],"plain":["HB4595 has the ICC monitor the effect of each public utility on overall consumer savings and on the grid, and report each year to the Governor, Attorney General and General Assembly.","It adds a scorecard on how utilities affect bills and the grid."],"ex":"Each year the ICC publishes a chart showing whether utility actions saved or cost customers. Made up example.","viz":{"kind":"flow","title":"Monitoring","steps":["ICC tracks each utility","Annual report","Governor, Attorney General, General Assembly"]},"states":[["Performance based regulation","Several states use scorecards or performance metrics, including Hawaii and New York."]],"places":[["Illinois utilities","ComEd, Ameren Illinois and others."]],"news":[{"t":"Regulators strike millions from Ameren, ComEd electric rate hike requests","src":"NPR Illinois","u":"https://www.nprillinois.org/economy-business/2025-12-19/regulators-strike-millions-from-ameren-comed-electric-rate-hike-requests","d":"2025-12-19"}]},"district-office-bills":{"headline":"Pay legislators' district office utility bills across fiscal years","bg":"The General Assembly Compensation Act would allow prior year district office utility bills to be paid from current year funds, and certain bills from fiscal years 2015 to 2017 plus interest and penalties.","why":"Internal legislative housekeeping with no bearing on utility regulation.","q":["Why is this needed now"],"go":["policy"],"plain":["HB4661 would allow prior year district office utility bills to be paid from current year funds, and certain bills from fiscal years 2015 to 2017 plus interest and penalties.","It is a back payment fix, not a policy bill."],"ex":"A district office had a utility bill that was never paid in the right budget year. This bill lets the legislature pay it now. Made up example.","viz":{"kind":"flow","title":"Payment","steps":["Old bill unpaid","Bill authorizes payment","Paid with interest and penalties"]},"states":[["General","Not a policy issue other states copy."]],"places":[["Legislators' district offices","Across Illinois."]],"news":[]},"muni-audit-info":{"headline":"Let municipalities see basic premises data when auditing a utility","bg":"Premises address and zip code, the premises classification such as residential, commercial or industrial, and other basic information would not be treated as customer specific for municipal utility audits.","why":"Cities that audit franchise fees need data from utilities. Privacy limits can block these audits, and the bills would loosen them for basic fields.","q":["Which fields are added","How is customer privacy protected"],"go":["policy"],"plain":["Cities sometimes audit a utility to check that it charges correct franchise fees and taxes. HB4692 and SB2907 say premises address and zip code, the premises classification such as residential, commercial or industrial, and other basic information would not be treated as customer specific for municipal utility audits.","That lets a city see the data it needs without a privacy block."],"ex":"A city asks a utility for a list of addresses and classes to check it is collecting the correct tax. Today the utility may say the data is customer specific. The bill says it is not. Made up example.","viz":{"kind":"flow","title":"Audit data","steps":["City requests audit data","Utility provides premises data","City checks fees and taxes"]},"states":[["General","Municipal franchise audits are common across the country."]],"places":[["Illinois cities and villages","Those with franchise agreements."]],"news":[]},"charge-freeze":{"headline":"Freeze monthly customer charges for low income households","bg":"A utility would freeze its monthly customer charge for low income households at an amount tied to a percentage of income no greater than the share used in the Percentage of Income Payment Plan.","why":"It targets fixed charges that critics say hit low usage, low income households hard. A freeze shifts revenue recovery to other customers or to variable charges.","q":["How many households qualify","Who covers the foregone revenue"],"go":["icc"],"plain":["Every bill has a fixed monthly customer charge no matter how much power you use. HB4769 would freeze that charge for low income households at an amount tied to a percentage of income no greater than the share used in the Percentage of Income Payment Plan.","The goal is to keep the fixed part of the bill from rising for poor households."],"ex":"A low income customer pays a fixed monthly charge. If the utility asks to raise it, the freeze keeps that household's charge flat. Made up example.","viz":{"kind":"flow","title":"Freeze","steps":["Low income household","Monthly charge capped by percent of income","Stays flat when others rise"]},"states":[["Ohio","Percentage of income plans have run for years."],["Pennsylvania","Customer Assistance Programs set bills as a share of income."]],"places":[["Ameren Illinois and ComEd","The two main electric utilities."]],"news":[]},"recoverable":{"headline":"Limit which utility expenses can be recovered from customers","bg":"HB4781 and SB3497 bar the ICC from allowing recovery of political activity and lobbying, trade association and chamber dues, directors and officers and fiduciary insurance, and goodwill and institutional advertising, and treat rate case attorney and expert costs as nonrecoverable. SB3822 narrower, bars recovery of political contributions and gifts and related items.","why":"This is a direct hit on the rate case cost structure. Rate case litigation costs, association dues and insurance are normal operating costs that utilities currently seek to recover. Barring them would reduce allowed revenue or fall to shareholders.","q":["What dollar amounts would shift from customers to shareholders","Does the rate case expense rule reduce a utility's ability to participate in proceedings"],"go":["icc"],"plain":["Rates include costs the utility is allowed to pass on to customers. HB4781 and SB3497 bar the ICC from allowing recovery of political activity and lobbying, trade association and chamber dues, directors and officers and fiduciary insurance, and goodwill and institutional advertising, and treat rate case attorney and expert costs as not recoverable. SB3822 is narrower and bars recovery of political contributions and gifts and related items.","The point is that shareholders, not customers, should pay for political activity."],"ex":"A utility spends money on a trade association that lobbies. Today that may be built into rates. Under the bills it would come out. Made up example.","viz":{"kind":"vs","title":"Two versions","sides":[{"h":"HB4781 and SB3497","items":["Lobbying, dues, D and O insurance, goodwill ads, rate case legal costs"]},{"h":"SB3822","items":["Political contributions, gifts and related items"]}]},"states":[["Connecticut","A 2023 law bars ratepayers from paying lobbying, advertising and trade dues, and about $9.7 million in prohibited costs were reported from June 2023 to September 2024."],["Colorado","Regulators disallowed more than $775,000 a year in lobbying and dues Xcel Energy sought to recover."]],"places":[["Connecticut and Colorado","The two states in the Energy and Policy Institute report."]],"news":[{"t":"New laws curbing utility political spending saving ratepayers millions","src":"Energy and Policy Institute","u":"https://energyandpolicy.org/new-laws-curbing-utility-political-spending-saving-ratepayers-millions-of-dollars/","d":""},{"t":"Regulators strike millions from Ameren, ComEd electric rate hike requests","src":"NPR Illinois","u":"https://www.nprillinois.org/economy-business/2025-12-19/regulators-strike-millions-from-ameren-comed-electric-rate-hike-requests","d":"2025-12-19"}]},"vpp":{"headline":"Set minimum payments for storage in virtual power plant programs","bg":"Virtual power plants aggregate home batteries and other resources to act as a single resource. The bills set minimum upfront and performance payments for eligible systems with storage, $250 per kWh for systems that forgo a storage rebate, require utilities to let customers share data with aggregators, and keep the $300 per kW distributed generation rebate until the later of 2029 or a threshold date.","why":"Minimum payments fix the price utilities must pay, which affects program cost. Data sharing requirements add operations work. Virtual power plants may help reduce peak capacity needs.","q":["What is the cost to ratepayers","How are customer data privacy rules handled"],"go":["storage"],"plain":["A virtual power plant links many home batteries and other devices so the utility can call on them together like a single power plant. HB4996 and SB3922 set minimum upfront and performance payments for eligible systems with storage, $250 per kWh for systems that forgo a storage rebate, require utilities to let customers share data with aggregators, and keep the $300 per kW distributed generation rebate until the later of 2029 or a threshold date.","Customers get paid for letting the grid use their battery in peak hours."],"ex":"A homeowner has a 10 kWh battery. When the grid is strained, an aggregator draws a share of it and pays the homeowner. Made up example.","viz":{"kind":"flow","title":"VPP","steps":["Homes with batteries","Aggregator links them","Utility calls them at peak","Homeowners paid"]},"states":[["Illinois","SB25 created a scheduled dispatch VPP program with a payment of at least $10 per kW of average dispatch."],["Virginia","Cooperatives can create VPP programs starting in 2027."],["Massachusetts","Executive order targets 5 GW of added storage and 3.5 GW of load management by 2035."],["Minnesota","Xcel Capacity Connect allows up to 200 MW of utility owned batteries by 2028."],["New Jersey","Governor ordered a VPP program in 180 days."],["Puerto Rico","Over 80,000 auto enrolled customers get paid for sharing battery power."]],"places":[["Puerto Rico","The Customer Battery Energy Sharing program."],["Illinois utilities","Had to file a scheduled dispatch tariff by June 1, 2026."]],"news":[{"t":"VPP and supporting DER policy developments, Q1 2026","src":"SEPA","u":"https://sepapower.org/knowledge/vpp-and-supporting-der-policy-developments-q1-2026/","d":"2026"}]},"charge-website":{"headline":"A public website listing every charge on an electric bill other than delivery and supply","bg":"Beginning January 1, 2027 the ICC would maintain a website detailing any charges, whether required by law or approved by the Commission, other than delivery or supply charges, including how much is remitted to the state and how much the utility keeps. This bill passed both houses.","why":"Many riders and surcharges appear on bills, and the website would make them visible and compare their sizes. It supports the affordability argument by showing what is driven by law and what by utilities.","q":["How many charges are included","How is the amount retained by the utility reported"],"go":["icc"],"plain":["Beginning January 1, 2027, HB5524 would have the ICC maintain a website detailing every charge on a bill other than delivery or supply, whether set by law or approved by the ICC, including how much goes to the state and how much the utility keeps. It passed both houses.","Many bills have riders and fees most people cannot decode."],"ex":"A customer sees a charge called a rider on the bill. The website says what it is, who set it, and how much goes to the state and how much the utility keeps. Made up example.","viz":{"kind":"flow","title":"Website","steps":["ICC lists each charge","Shows law or order that set it","Shows who gets the money"]},"states":[["Many states","Require bill transparency, but I did not find a state with a public site listing every non delivery or supply charge."]],"places":[["Illinois bills","ComEd and Ameren bills carry many riders."]],"news":[{"t":"Regulators strike millions from Ameren, ComEd electric rate hike requests","src":"NPR Illinois","u":"https://www.nprillinois.org/economy-business/2025-12-19/regulators-strike-millions-from-ameren-comed-electric-rate-hike-requests","d":"2025-12-19"}]},"battery-variance":{"headline":"Tie emission deadlines to battery storage share and allow reliability runs","bg":"No variance from the emission reduction obligations would be available once batteries are at least 10 percent of state installed capacity. If batteries are below 10 percent, Illinois EPA delays enforcement and lets gas units exceed existing emissions during RTO dispatched emergency or reliability hours.","why":"Nearly the same mechanism as HB4798. It lets reliability needs override emission limits and links timing to battery buildout.","q":["How do the RTO dispatch hours get verified"],"go":["ctg"],"plain":["SB2727 says no variance from the emission reduction obligations is available once batteries are at least 10 percent of state installed capacity. If batteries are below 10 percent, the Illinois EPA delays enforcement and lets gas units exceed existing emissions during RTO dispatched emergency or reliability hours.","It ties environmental rules to battery build out."],"ex":"Batteries are 8 percent of capacity. A gas plant called in an emergency can run above its normal limit. At 10 percent that relief ends. Made up numbers.","viz":{"kind":"bars","title":"Threshold","rows":[["Battery share threshold",10.0]],"unit":"percent of installed capacity"},"states":[["Not a common design","I did not find another state that ties emissions deadlines to a battery share."]],"places":[["MISO and PJM regions","Dispatch emergencies are called by the grid operator."]],"news":[]},"water-termination":{"headline":"No water shutoffs in extreme heat or cold","bg":"Termination of residential water service for nonpayment would be prohibited on any day when the six day forecast includes temperatures of 32 degrees or below, and with heat criteria, including master metered buildings and tenants.","why":"The text speaks to water, but Illinois already has seasonal protections for gas and electric. It shows continued legislative interest in shutoff rules.","q":["How do these rules compare with gas and electric shutoff rules"],"go":["icc"],"plain":["SB3579 would prohibit termination of residential water service for nonpayment on any day when the six day forecast includes temperatures of 32 degrees or below, and adds heat criteria, including master metered buildings and tenants.","A shutoff in a heat wave or freeze can be dangerous."],"ex":"A family is behind on its water bill. On a day when the six day forecast shows a freeze, the water cannot be shut off. Made up example.","viz":{"kind":"flow","title":"Shutoff rule","steps":["Overdue bill","Check six day forecast","If 32 degrees or below, no termination"]},"states":[["California","SB 998 limits residential water shutoffs, including a grace period and medical protections."],["Illinois electric and gas","Utilities already face cold weather disconnection limits under ICC rules."]],"places":[["Illinois cities","Municipal water systems."]],"news":[]},"rate-caps":{"headline":"Cap customer cost of renewable procurement at 4.25 percent of 2009 prices","bg":"The total renewable resources procured would shrink as needed to keep the average net increase to eligible retail customers from renewable procurement to no more than 4.25 percent of the 2009 per kilowatt hour amount, with the inflation adjustment removed. The energy transition assistance charge cap would drop from 1.45 to 1.3 percent.","why":"Removing the inflation adjustment tightens the cap over time and could cut renewable procurement volumes. It is an affordability framed bill that can slow clean energy goals.","q":["How close is the current cap to binding","Would this reduce renewable energy credit procurement"],"go":["policy"],"plain":["SB3586 shrinks the renewables procured as needed to keep the average net increase to eligible retail customers from renewable procurement to no more than 4.25 percent of the 2009 per kilowatt hour amount, with the inflation adjustment removed. It also drops the energy transition assistance charge cap from 1.45 to 1.3 percent.","A cap means the state buys less renewable energy if costs rise."],"ex":"If the cost cap is hit, the IPA must stop buying more renewable energy for that year. Made up example.","viz":{"kind":"bars","title":"Caps","rows":[["Renewable cost cap",4.25],["Energy transition charge cap now",1.45],["Energy transition charge cap under bill",1.3]],"unit":"percent"},"states":[["Other states","Several states have cost caps on renewable programs, including Ohio historically."]],"places":[["Illinois electric bills","Appear as charges tied to renewable programs."]],"news":[]},"repeal-various":{"headline":"Repeal major clean energy programs and electricity excise tax","bg":"This large repeal bill ends the Energy Transition Assistance Fund, removes the renewable portfolio standard, repeals the Electricity Excise Tax Law and the tax on invested capital and distribution of electricity, removes ICC authority for low income discount rates, bars storage program fees on electric bills, and repeals energy efficiency and demand response provisions.","why":"It would unwind a large part of the framework built by FEJA and CEJA, and it also repeals a tax paid by electric utilities. It is the most sweeping repeal proposal on the list and shows the outer edge of the debate.","q":["Which utility tax revenue would be lost to local governments","What federal or contractual obligations tie to the RPS"],"go":["policy"],"plain":["SB3839 is a big repeal bill. It ends the Energy Transition Assistance Fund, removes the renewable portfolio standard, repeals the Electricity Excise Tax Law and the tax on invested capital and distribution of electricity, removes ICC authority for low income discount rates, bars storage program fees on electric bills, and repeals energy efficiency and demand response provisions.","It rolls back many parts of the state's clean energy system."],"ex":"A customer would see fewer riders on the bill, but programs that those riders funded would end. Made up example.","viz":{"kind":"flow","title":"What is repealed","steps":["Renewable portfolio standard","Energy Transition Assistance Fund","Electricity excise taxes","Low income discount authority","Efficiency and demand response"]},"states":[["Rollbacks","Some states have repealed or frozen clean standards, including Ohio's 2019 law (HB 6) that ended its mandates. I did not verify more."]],"places":[["Illinois bills","All customers are affected."]],"news":[]},"gas-cba":{"headline":"Require independent cost benefit analysis before approving gas decarbonization","bg":"Before approving any gas distribution decarbonization pathway, pilot, investment or mandate, the ICC would conduct an independent cost benefit analysis that covers life cycle emissions, cumulative system costs including stranded assets estimated at no less than 80 billion dollars by 2050, bill impacts, reliability, equity, workforce and competitive alternatives. It could approve only plans that show net benefits.","why":"A high bar similar to SB3979 but framed as cost benefit analysis. It adds an independent study step to the Future of Gas proceeding and rests on a stated stranded asset estimate that would be debated.","q":["Where does the 80 billion dollar estimate come from","Who conducts the independent analysis"],"go":["gas","icc"],"plain":["SB3970 says before approving any gas distribution decarbonization pathway, pilot, investment or mandate, the ICC would conduct an independent cost benefit analysis covering life cycle emissions, cumulative system costs including stranded assets estimated at no less than 80 billion dollars by 2050, bill impacts, reliability, equity, workforce and competitive alternatives. It could approve only plans that show net benefits.","Stranded assets are pipes that customers must still pay for after use falls."],"ex":"The ICC is asked to approve a pilot that replaces gas service on a street with electric heat pumps. It must first run the analysis, and if it does not show net benefits, the pilot cannot go forward. Made up example.","viz":{"kind":"bars","title":"The stranded asset figure in the bill","rows":[["Estimated stranded assets by 2050",80.0]],"unit":"billion dollars, per the bill text"},"states":[["Massachusetts","Gas planning orders look at costs and alternatives."],["Colorado and New York","Also run gas transition planning."]],"places":[["Illinois gas utilities","Ameren Illinois, Nicor and Peoples."]],"news":[{"t":"CUB Q&A, the Illinois Future of Gas proceeding","src":"Citizens Utility Board","u":"https://www.citizensutilityboard.org/blog/2026/08/03/cub-qa-the-illinois-future-of-gas-proceeding/","d":"2026-08-03"},{"t":"Ameren residential gas customers to see average 3.65 percent increase","src":"St. Louis Public Radio","u":"https://www.stlpr.org/economy-business/2025-12-01/amerens-illinois-customers-average-3-65-increase-gas-bills-january","d":"2025-12-01"}]},"restore-various":{"headline":"Least cost procurement only, tighter renewable cost cap and local approval for new wind, solar and storage","bg":"The IPA could develop new procurement plans only through least cost procurement and with the most reliable options, the renewable cost cap would tighten, the energy transition assistance charge cap would fall, and a new commercial wind, solar or storage facility within 1.5 miles of a unit of local government would need that unit's approval. The Legislative Reference Bureau would draft a conforming bill for the 2027 spring session. The bill also removes a provision on energy storage projects from the Finance Authority Act.","why":"Combines several rollback ideas in one vehicle. Least cost without clean energy goals would change the IPA's mandate and could redirect procurement toward gas and existing resources.","q":["How does the 1.5 mile local approval test work in practice"],"go":["policy"],"plain":["SB4003 would let the IPA develop new procurement plans only through least cost procurement and with the most reliable options, tighten the renewable cost cap, lower the energy transition assistance charge cap, and require that a new commercial wind, solar or storage facility within 1.5 miles of a unit of local government have that unit's approval. The Legislative Reference Bureau would draft a conforming bill for the 2027 spring session. It also removes a provision on energy storage projects from the Finance Authority Act.","The local approval part gives towns a veto."],"ex":"A solar company plans a project within 1.5 miles of a village. The village board has to approve it. If it says no, the project does not go ahead. Made up example.","viz":{"kind":"bars","title":"Local approval distance","rows":[["Distance that triggers local approval",1.5]],"unit":"miles"},"states":[["Local control","Some states give local governments strong control over wind and solar, while others limit it. Illinois adopted statewide rules for counties in 2023."]],"places":[["Illinois county and village boards","Where siting is decided."]],"news":[]},"shell":{"headline":"Shell bills hold a place for a later amendment","bg":"A shell bill makes only a technical change, such as to a short title, and has no real policy content when filed. Leaders and sponsors use shells as vehicles. A later amendment can replace the entire text, which is called a gut and replace, and move quickly because the bill already passed earlier steps. SB3574, SB3575 and SB3576 amend the Public Utilities Act. The others touch the Employment First Act, the Consumer Legal Funding Act, the Code of Civil Procedure and the Economic Development Project Area Tax Increment Allocation Act.","why":"The risk is that a shell becomes a major bill with little notice. Tracking shells is a way to watch for veto session and lame duck vehicles. Utilities pay particular attention to shells that amend the Public Utilities Act.","q":["Is any of these shells already moving","Who holds the shell and does the sponsor chair a relevant committee"],"go":["trends","gloss"]},"id-verify":{"headline":"Verify a customer's identity before opening or changing service","bg":"The Identity Verification for Consumer Services Act requires covered entities to verify identity before starting or changing an agreement, and to report attempted or confirmed identity theft that they become aware of through compliance.","why":"Utilities open and change service for millions of customers, so a covered services definition that includes them would add steps to account setup and could affect call center operations.","q":["Does the covered services list include utilities"],"go":["policy"],"plain":["The Identity Verification for Consumer Services Act, HB4538, requires covered entities to verify a person's identity before starting or changing an agreement, and to report attempted or confirmed identity theft that they become aware of through compliance.","Someone who steals your information could otherwise open service in your name."],"ex":"A thief uses a stolen name to open a utility account. Under the bill the company has to check identity first and report attempts it spots. Made up example.","viz":{"kind":"flow","title":"Verification","steps":["Request to open or change service","Company verifies identity","Reports identity theft it finds"]},"states":[["General","Know your customer checks are standard in banking. I did not find a general state law for consumer service accounts."]],"places":[["Utility and telecom accounts","Typical places for service in someone else's name."]],"news":[]},"data-privacy":{"headline":"A comprehensive consumer data privacy law for Illinois","bg":"Illinois does not have a general consumer data privacy law, unlike many other states. These four bills create one, with rights to access, correct, delete, receive a copy of personal data and opt out of targeted advertising, sale or profiling. Coverage thresholds start at businesses that control or process data of 100,000 consumers or more.","why":"Utilities hold large amounts of customer data, including usage from smart meters. Depending on the exemptions, a privacy law could reach utility data practices, vendor contracts and data sharing with aggregators. Four bills indicate a strong interest.","q":["Are regulated utilities exempt","How does it interact with ICC rules on customer data"],"go":["policy"],"plain":["Illinois does not have a general consumer data privacy law. HB5221, SB2875, SB3548 and SB3890 create one, with rights to access, correct, delete and receive a copy of personal data and to opt out of targeted advertising, sale or profiling. Coverage starts at businesses that control or process data of 100,000 consumers or more.","The rights work like a menu a person can use with each business."],"ex":"You ask a retailer what data it holds about you, ask it to delete your account history, and opt out of its sale of your data to advertisers. Made up example.","viz":{"kind":"flow","title":"Consumer rights","steps":["Ask what data a business holds","Correct or delete it","Opt out of targeted ads, sale or profiling"]},"states":[["Twenty states","Per MultiState, twenty states now have comprehensive privacy laws, counting Florida's narrower law. Indiana, Kentucky and Rhode Island took effect Jan 1, 2026."],["California","Passed the first one in 2018."]],"places":[["Illinois","One of the states without a general law, though it has specific ones such as the biometric law."]],"news":[{"t":"All of the comprehensive privacy laws that take effect in 2026","src":"MultiState","u":"https://www.multistate.us/insider/2026/2/4/all-of-the-comprehensive-privacy-laws-that-take-effect-in-2026","d":"2026-02-04"}]},"drone":{"headline":"Create offenses for drones over critical infrastructure and emergency scenes","bg":"The Drone Safety and Interference Prevention Act creates offenses for unlawful imaging of emergency response, unlawful operation over critical infrastructure facilities and correctional facilities, and restricts private drone operation.","why":"Utilities operate substations, plants and gas facilities that count as critical infrastructure, and drones are also used by utilities for inspection. The bills could protect sites and need carve outs for utility drone operations.","q":["Is utility drone use for inspection exempt"],"go":["policy"],"plain":["The Drone Safety and Interference Prevention Act in HB5275 and SB3930 creates offenses for unlawful imaging of emergency response, unlawful operation over critical infrastructure facilities and correctional facilities, and restricts private drone operation.","It targets drones that interfere with firefighters and flights over power plants and substations."],"ex":"A hobbyist flies a drone over a substation or a fire scene to get video. Under the bills that could be a crime. Made up example.","viz":{"kind":"flow","title":"Offenses","steps":["Drone over a fire or rescue scene","Offense","Drone over critical infrastructure or prison","Offense"]},"states":[["Many states","Passed laws against drones over critical infrastructure, including Texas, Florida and Oklahoma."]],"places":[["Illinois substations and power plants","Typical critical infrastructure."]],"news":[]},"genetic":{"headline":"Extend genetic privacy protections to biomarker testing","bg":"The use of genetic testing and biomarker testing and the resulting information would be confidential and privileged and could be released only to the person tested or those the person authorizes in writing. Insurers could not seek the information. This bill passed both houses.","why":"It is a health privacy bill with little direct utility relevance, though employers fall under genetic privacy rules too.","q":["What new employer duties follow"],"go":["policy"],"plain":["SB2886 makes genetic testing and biomarker testing and the resulting information confidential and privileged and releasable only to the person tested or to those the person authorizes in writing. Insurers could not seek the information. It passed both houses.","A biomarker test measures things in blood or tissue that signal health conditions."],"ex":"A person takes a biomarker test for a health risk. An insurer cannot ask for the result to decide on coverage. Made up example.","viz":{"kind":"flow","title":"Who can see results","steps":["Test result","Person tested and anyone they authorize in writing","Insurer cannot seek it"]},"states":[["Many states","Have genetic privacy laws, and Illinois's Genetic Information Privacy Act extends the idea to biomarkers."]],"places":[["Illinois insurance market","Applies to insurers."]],"news":[]},"ai-disclosure":{"headline":"Tell consumers when they are dealing with AI and not a person","bg":"A person using AI in trade or commerce could not communicate with a consumer in a way that may mislead a reasonable consumer into thinking they are talking to a human, unless a clear and conspicuous notice says otherwise.","why":"Utilities increasingly use chatbots and automated agents for customer service, so a disclosure duty would apply to those channels.","q":["How much notice is conspicuous enough"],"go":["policy"],"plain":["SB2995 says a person using AI in trade or commerce cannot communicate with a consumer in a way that may mislead a reasonable consumer into thinking they are talking to a human, unless a clear and conspicuous notice says otherwise.","You should know if the chat on a company site is a bot."],"ex":"A customer chats with a help agent that is software. A banner says it is an AI assistant. Without it, the company risks violating the law. Made up example.","viz":{"kind":"flow","title":"Disclosure","steps":["Consumer talks to AI","Clear notice shown","No notice and may mislead means violation"]},"states":[["California","A 2019 law requires bots to disclose in certain sales and election settings."],["Utah","A 2024 law requires disclosure of generative AI use when asked."],["Colorado","Passed a broader AI law."]],"places":[["Online chat and phone","Customer service tools."]],"news":[]},"crit-infra":{"headline":"Felony penalties for damaging or tampering with critical infrastructure equipment","bg":"Intentionally damaging, destroying or tampering with equipment in a critical infrastructure facility without authorization would be criminal damage to property, a Class 4 felony for damage up to $500 and higher classes above that.","why":"Utilities report theft, vandalism and attacks on substations and other equipment. Stronger penalties are one of the tools they seek.","q":["Which facilities count as critical infrastructure"],"go":["policy"],"plain":["SB3093 makes it criminal damage to property to intentionally damage, destroy or tamper with equipment in a critical infrastructure facility without authorization, a Class 4 felony for damage up to $500 and higher classes above that.","Attacks on substations drew attention nationwide."],"ex":"A person cuts a fence and breaks equipment at a substation. Even small damage is a felony under the bill. Made up example.","viz":{"kind":"flow","title":"Penalty","steps":["Damage equipment at critical facility","Criminal damage to property","Class 4 felony at $500 or less, higher classes above"]},"states":[["Many states","Have passed critical infrastructure laws since 2022, including Oklahoma and Texas."]],"places":[["Illinois substations and pipelines","Typical protected sites."]],"news":[]},"tel-theft":{"headline":"Stop the purchase of stolen telecommunications wire by scrap dealers","bg":"The bill makes it a violation to buy or sell telecommunications wire in any amount unless the seller is an authorized agent or employee of a licensed contractor of a utility or provider.","why":"Copper theft is a nuisance and a safety hazard for utilities and telecom providers. Restricting the scrap market is a standard response.","q":["How does a dealer verify authorization"],"go":["policy"],"plain":["SB3593 makes it a violation to buy or sell telecommunications wire in any amount unless the seller is an authorized agent or employee of a licensed contractor of a utility or provider.","Copper theft cuts phone and internet service."],"ex":"A scrap dealer is offered a spool of cable by someone with no contractor ID. The dealer cannot buy it. Made up example.","viz":{"kind":"flow","title":"Scrap rule","steps":["Seller offers telecom wire","Dealer checks contractor status","Not authorized means no purchase"]},"states":[["Many states","Have scrap metal laws. Copper theft laws exist in most states."]],"places":[["Illinois scrap yards","Where stolen wire shows up."]],"news":[]},"broadband-study":{"headline":"Study the costs and benefits of rural broadband in co-op areas","bg":"The Broadband Advisory Council would evaluate costs and benefits of deploying rural broadband in all areas served by broadband cooperatives.","why":"Electric cooperatives and utilities are often partners or competitors in rural broadband. The study could inform later funding bills.","q":["What deliverable is due and when"],"go":["policy"],"plain":["SB3613 has the Broadband Advisory Council evaluate costs and benefits of deploying rural broadband in all areas served by broadband cooperatives.","Co-ops are member owned and often serve places the large carriers skip."],"ex":"The council estimates the cost of fiber to every farm served by a co-op and the benefits in jobs and school access. Made up example.","viz":{"kind":"flow","title":"Study","steps":["Council evaluates costs","Evaluates benefits","Report guides funding"]},"states":[["General","Many states run broadband offices and rural co-op programs."]],"places":[["Rural Illinois","Co-op service areas."]],"news":[]},"broadband-easements":{"headline":"Let broadband providers use existing electric easements and highway rights of way","bg":"SB3652 lets a broadband provider use existing electric easements outside a grant service area if it holds them or has an agreement with the holder. SB3838 lets a broadband grant recipient install infrastructure along highway rights of way with the right permit, and says property owners within the right of way cannot block it.","why":"Electric easements are utility property rights. Allowing third party use can create liability and safety questions for utilities, and compensation and consent terms are the main issue.","q":["Does the easement holder have to consent","How are safety and liability handled"],"go":["policy"],"plain":["SB3652 lets a broadband provider use existing electric easements outside a grant service area if it holds them or has an agreement with the holder. SB3838 lets a broadband grant recipient install infrastructure along highway rights of way with the right permit, and says property owners within the right of way cannot block it.","It uses existing corridors so fewer landowners are involved."],"ex":"A provider with a grant runs fiber alongside a highway under a permit instead of getting new easements. Made up example.","viz":{"kind":"flow","title":"Use existing corridors","steps":["Electric easement or highway right of way","Permit or agreement","Fiber installed","No extra landowner veto in the right of way"]},"states":[["Dig once policies","Many states use dig once or shared corridors for broadband."]],"places":[["Rural Illinois","Along highways and power lines."]],"news":[]},"bipa":{"headline":"Carve out a security purpose exception under the biometric privacy law","bg":"Illinois' Biometric Information Privacy Act, known as BIPA, has produced many lawsuits. The bill defines security purpose as preventing or investigating retail theft, fraud and similar harms, protecting property and people, and builds that into the Act.","why":"Utilities that use biometric access controls or voice authentication would want clarity on permitted uses.","q":["How broad is the security purpose exception"],"go":["policy"],"plain":["Illinois's Biometric Information Privacy Act, known as BIPA, sets rules for collecting fingerprints, face scans and similar data, and lets people sue. It has produced many lawsuits. SB3856 defines security purpose as preventing or investigating retail theft, fraud and similar harms, and protecting property and people, and builds that into the Act as an exception.","Retailers say cameras and face matching help catch theft."],"ex":"A store uses face matching to flag people banned for theft. Under the exception, using the tool for security may be allowed. Made up example.","viz":{"kind":"vs","title":"BIPA now vs with the exception","sides":[{"h":"Now","items":["Consent needed for collecting biometric data"]},{"h":"With the exception","items":["Security purpose carve out"]}]},"states":[["Texas and Washington","Have biometric laws that only the attorney general enforces. Illinois lets private lawsuits."],["Facebook","Settled a BIPA class action for $650 million in 2021."]],"places":[["Illinois courts","Where BIPA suits are filed."]],"news":[]},"megaproject":{"headline":"Incentives for very large projects","bg":"HB2789 creates an assessment freeze for property certified as mega project property, with minimum investment and other requirements and special payments to the local municipality. HB4564 creates the Illinois Competitiveness and Innovation Working Group, directs DCEO to propose a megaproject incentive framework with performance based tax credits, capital assistance and workforce tools, and directs the ICC to monitor and report annually on the affordability, reliability and capacity of energy for industrial users.","why":"Megaproject incentives are how states attract factories and data centers. The ICC reporting language shows that energy supply to large industry is a competitiveness issue. A property tax freeze also reduces local revenue.","q":["Which project types qualify","How do local taxing districts get compensated"],"go":["dc"],"plain":["HB2789 creates an assessment freeze for property certified as mega project property, with minimum investment and other requirements and special payments to the local municipality. HB4564 creates the Illinois Competitiveness and Innovation Working Group, directs DCEO to propose a megaproject incentive framework with performance based tax credits, capital assistance and workforce tools, and directs the ICC to monitor and report annually on the affordability, reliability and capacity of energy for industrial users.","An assessment freeze holds the property's taxable value flat so taxes do not rise with the investment."],"ex":"A manufacturer builds a plant worth billions. Under the freeze the taxable value stays fixed for a set period, and the company makes special payments to the village. Made up example.","viz":{"kind":"flow","title":"Megaproject incentives","steps":["Qualified investment","Certified as megaproject property","Assessment frozen","Special payments to the municipality"]},"states":[["Many states","Offer megaproject incentives, such as large site programs in Ohio, Georgia and Michigan."]],"places":[["Illinois","The state has competed for large factories and the quantum park in Chicago."]],"news":[{"t":"Roundup, Data centers face growing local resistance","src":"Capitol Fax","u":"https://capitolfax.com/2026/09/02/roundup-data-centers-face-growing-local-resistance/","d":"2026-09-02"}]},"worker-protection":{"headline":"Investigation and subpoena powers for the Attorney General's worker protection unit","bg":"Before bringing an action the Attorney General would investigate and could issue subpoenas, demand sworn interrogatory answers, inspect employer premises and records, and interview workers on site. HB4725 passed both houses.","why":"Employers including utilities would face a stronger enforcement process on employment law. It is an employment compliance matter, not an energy one.","q":["Which laws does the unit enforce"],"go":["policy"],"plain":["Before bringing an action, the Attorney General would investigate and could issue subpoenas, demand sworn answers, inspect employer premises and records, and interview workers on site. HB4725 passed both houses.","It gives the AG's worker protection unit more investigative power."],"ex":"The AG hears of wage theft at a warehouse. Staff can inspect the premises and records and interview workers. Made up example.","viz":{"kind":"flow","title":"Investigation","steps":["Complaint","AG investigates","Subpoenas, inspection and interviews","Action filed"]},"states":[["General","State labor agencies commonly have subpoena power."]],"places":[["Illinois workplaces","Statewide."]],"news":[]},"prevailing-craft":{"headline":"Restore skill based pay rules in the Prevailing Wage Act","bg":"The bill restores provisions in the Prevailing Wage Act to the form they had before Public Act 104-17 and says pay based on craft and skill level is allowed if set by a collective bargaining agreement for similar work in the locality. It takes effect July 1, 2026.","why":"Prevailing wage rules affect the cost of public works and of energy projects that have prevailing wage requirements. It matters to the labor groups that back much of the energy legislation.","q":["What did Public Act 104-17 change"],"go":["policy"],"plain":["HB4751 restores provisions in the Prevailing Wage Act to the form they had before Public Act 104-17 and says pay based on craft and skill level is allowed if set by a collective bargaining agreement for similar work in the locality. It takes effect July 1, 2026.","Prevailing wage is the local going pay for work on public projects."],"ex":"A public project employs journeyman and apprentice electricians. Pay can differ by skill level if the union contract in that area says so. Made up example.","viz":{"kind":"flow","title":"Skill based pay","steps":["Public works project","Collective bargaining agreement sets skill levels","Pay can follow skill"]},"states":[["Roughly half of states","Have prevailing wage laws. Details differ."]],"places":[["Illinois public works","Roads, schools and buildings."]],"news":[]},"prevailing-multi":{"headline":"Pay the highest prevailing wage when a worker holds more than one trade title in a day","bg":"A worker classified in two or more trade titles for any time during a day on a public works project would receive the highest prevailing rate among them for all hours that day, apprentice pay rules apply, and payments could be withheld for violations.","why":"It raises labor cost on prevailing wage projects, which now include many renewable and storage projects.","q":["How many projects are exposed"],"go":["policy"],"plain":["A worker classified in two or more trade titles for any time during a day on a public works project would receive the highest prevailing rate among them for all hours that day, apprentice pay rules apply, and payments could be withheld for violations.","It stops a worker being paid the lower rate for part of the day."],"ex":"An electrician spends two hours in the morning on laborer work and six hours on electrician work. Under HB4938 all eight hours are paid at the higher electrician rate. Made up example.","viz":{"kind":"bars","title":"Pay effect","rows":[["Hours at lower title",2.0],["Hours at higher title",6.0],["Hours paid at the higher rate",8.0]],"unit":"hours"},"states":[["General","Some states have rules on mixed classifications. I did not compare."]],"places":[["Illinois public works","Mixed trade jobs."]],"news":[]},"ui-prefile":{"headline":"Employers with 75 or more workers must start unemployment claims for laid off workers","bg":"When an employer with 75 or more employees in Illinois conducts a layoff, furlough or temporary shutdown, it would submit required claim initiation information to the Department of Employment Security for each affected worker.","why":"Large employers including utilities would handle this process during restructurings.","q":["What data must be submitted and by when"],"go":["policy"],"plain":["When an employer with 75 or more employees in Illinois conducts a layoff, furlough or temporary shutdown, it would submit required claim initiation information to the Department of Employment Security for each affected worker.","It speeds up unemployment benefits for laid off workers."],"ex":"A factory lays off 200 workers. The employer submits their information so claims start right away. Made up example.","viz":{"kind":"flow","title":"Pre filing","steps":["Layoff","Employer submits claim information","Workers' claims start sooner"]},"states":[["Some states","Use employer filed or attached claims, such as shared work and employer reporting programs."]],"places":[["Illinois layoffs","Employers with 75 or more."]],"news":[]},"equal-pay-scale":{"headline":"Pay scale rules for job postings and variable pay","bg":"Employers with 15 or more employees would have to post base pay and variable pay scales as separate ranges in job postings.","why":"Posting requirements affect compensation practices and the postings of any large employer.","q":["How is variable pay defined"],"go":["policy"],"plain":["HB4858 would require employers with 15 or more employees to post base pay and variable pay scales as separate ranges in job postings.","It shows bonuses and commissions upfront."],"ex":"A posting says base $60,000 to $75,000 and commission $10,000 to $30,000, not a single combined range.
