"Equal Pay-Workforce Management","raw":"EQUAL PAY-WORKFORCE MANAGEMENT","theme":"Workforce, labor & tax incentives","issue":"equal-pay-reports","also":[],"chamber":"Senate","sponsor":"Omar Aquino","party":"D","cos":["Senator Mattie Hunter (D)","Senator Lakesia Collins (D)","Senator David Koehler (D)","Senator Laura M. Murphy (D)","Senator Kimberly A. Lightford (D)","Senator Mary Edly-Allen (D)"],"nCos":6,"bip":false,"committees":["Executive (Senate)","Assignments (Senate)"],"statutes":["820 ILCS 112/12 new"],"nStat":1,"amend":["Senate Amendment 001","Senate Amendment 002"],"summary":"Amends the Equal Pay Act of 2003. Provides that, no later than 2 years after the effective date of the amendatory Act, the Department of Labor shall adopt rules that require specified employers doing business in the State to file an annual report, that will be made available to the public on a dedicated page of the Department's website, regarding workforce management policies, practices, and performance with respect to the employer. Describes the information required to be reported. Sets forth provisions concerning the standardization of data and exemptions to the provision.","last":"Senate Committee Amendment No. 1 Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-08","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"SB3979","type":"SB","num":3979,"title":"Utilities-Regulatory Takings","raw":"UTILITIES-REGULATORY TAKINGS","theme":"Transmission, siting & land","issue":"takings","also":[],"chamber":"Senate","sponsor":"Javier L. Cervantes","party":"D","cos":["Senator Donald P. DeWitte (R)","Senator Chris Balkema (R)","Senator Craig Wilcox (R)","Senator Seth Lewis (R)"],"nCos":4,"bip":true,"committees":["Assignments (Senate)"],"statutes":["220 ILCS 5/4-620 new"],"nStat":1,"amend":[],"summary":"Amends the Public Utilities Act. Provides that all decarbonization pilots, pathways, or infrastructure plans under a Future of Gas proceeding pursuant to the final Order of the Commission in Docket No. 24-0158 shall undergo a Regulatory Takings Assessment prior to approval. Requires the Assessment shall be conducted by an independent third party and evaluated and confirmed by intervenors and stakeholders. Provides that the Assessment shall evaluate certain factors. Provides that a mandate in a decarbonization pilot, pathway, or infrastructure plan shall not be approved if the mandate risks creating a taking without compensation that is equivalent to at least 80% of depreciated asset value. Provides that the Commission shall coordinate with the Environmental Protection Agency to ensure the alignment of air pollution standards and shall require, by rule, uniform metrics across decarbonization pilots, pathways, and infrastructure plans, including bill impacts and equity analyses. Provides that rulemaking pursuant to the amendatory Act shall be completed by June 1, 2026 and rules adopted pursuant to the amendatory Act shall be applied to all Phase 2C proposals, as specified under the final Order of the Commission in Docket No. 24-0158.","last":"Referred to Assignments","lastDate":"2026-02-06","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":[]},{"id":"SB3980","type":"SB","num":3980,"title":"Zero Emission Vehicle Act","raw":"ZERO EMISSION VEHICLE ACT","theme":"Environment, climate & EPA","issue":"zev","also":[],"chamber":"Senate","sponsor":"Graciela Guzman","party":"D","cos":["Senator Lakesia Collins (D)"],"nCos":1,"bip":false,"committees":["Executive (Senate)","Assignments (Senate)"],"statutes":["30 ILCS 500/20-185 new","30 ILCS 805/8.50 new","35 ILCS 105/3-5","35 ILCS 110/3-5","35 ILCS 115/3-5","35 ILCS 120/2-5","415 ILCS 120/27","415 ILCS 120/37 new","415 ILCS 120/40","605 ILCS 10/11from Ch. 121, par. 100-11","625 ILCS 5/13-102.1","625 ILCS 5/13-109.1","625 ILCS 5/18c-1206 new","765 ILCS 1085/10","765 ILCS 1085/15","765 ILCS 1085/20","765 ILCS 1085/25","765 ILCS 1085/35","765 ILCS 1085/5"],"nStat":19,"amend":["Senate Amendment 001"],"summary":"Amends the Procurement Code. Requires bidders that respond to solicitations issued on or after January 1, 2027 for master contracts for the purchase of vehicles to submit an Illinois Jobs Plan that meets certain requirements. Amends the Electric Vehicle Rebate Act. Provides that, beginning July 1, 2027, changes electric vehicle rebates and requires Illinois residency and changes the luxury and low efficiency vehicle fee. Amends the Toll Highway Act. Requires the Toll Highway Authority to build at least 4 150 kW fast charging ports by 2027, expand to 8 ports by 2029 and 16 ports by 2031. Amends the Vehicle Code. Requires the Illinois Commerce Commission to establish biennial reporting for large fleets beginning in 2027. Amends the Electric Vehicle Charging Act. Provides that units of local government may grant exceptions if utility upgrades would materially increase construction costs, but EV capable spaces cannot fall below certain levels. Provides that Tenants and condominium owners may install Level 1, Low Power Level 2, or Level 2 charging systems at their own expense, subject to reasonable restrictions. Amends the State Mandates Act. Provides that State mandates created by the amendatory Act requires no reimbursement to units of local governments. Amends the Retailer Occupation Tax Act, the Service Use Tax Act, the Service Occupation Tax Act, and the Retailers' Occupation Tax Act to make other changes. Effective immediately.","last":"Senate Committee Amendment No. 1 Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-03-27","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB5482"]},{"id":"SB4003","type":"SB","num":4003,"title":"Utilities-Restore Various","raw":"UTILITIES-RESTORE VARIOUS","theme":"Utility rates, cost recovery & regulation","issue":"restore-various","also":[],"chamber":"Senate","sponsor":"Chapin Rose","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["20 ILCS 3501/801-10","20 ILCS 3855/1-10","20 ILCS 3855/1-20","20 ILCS 3855/1-5","20 ILCS 3855/1-56","20 ILCS 3855/1-75","20 ILCS 3855/1-76 new","220 ILCS 5/16-105.17","220 ILCS 5/16-107.5","220 ILCS 5/16-107.6","220 ILCS 5/16-107.9 rep.","220 ILCS 5/16-108","220 ILCS 5/16-108.19","220 ILCS 5/16-108.30","220 ILCS 5/16-111.5","220 ILCS 5/17-900","220 ILCS 5/23-121 new","220 ILCS 5/23-122 new","220 ILCS 5/8-512","35 ILCS 200/10-920 rep.","35 ILCS 200/10-925 rep.","35 ILCS 200/10-930 rep.","35 ILCS 200/10-935 rep.","35 ILCS 200/10-940 rep.","35 ILCS 200/10-945 rep.","35 ILCS 200/10-950 rep.","35 ILCS 200/10-953 rep.","35 ILCS 200/10-955 rep.","35 ILCS 200/Art. 10 Div. 22 rep.","55 ILCS 5/5-12020","55 ILCS 5/5-12024 rep."],"nStat":31,"amend":[],"summary":"Amends the Illinois Finance Authority Act. Removes a provision concerning energy storage projects. Amends the Illinois Power Agency Act. Makes changes in provisions concerning legislative findings. Provides that, on and after the effective date of the amendatory Act, the Agency shall develop new energy procurement plans only through the method of least-cost procurement, regardless of the power source of the procurement, and only with the most reliable procurements possible. Defines\"least-cost procurement\" as the procurement of electric service in a manner that is cost-effective, reliable, and prudent. In provisions concerning the Planning and Procurement Bureau, provides that the total of renewable energy resources procured shall be reduced for all retail customers based on the amount necessary to limit the annual estimated average net increase due to the costs of these resources included in the amounts paid by eligible retail customers in connection with electric service to no more than 4.25% of the amount paid per kilowatthour by those customers during the year ending May 31, 2009 (removes provisions concerning an inflation adjustment). In provisions concerning the Energy Transition Assistance Fund, provides that the energy transition assistance charge shall not exceed 1.3% (instead of 1.45%) of the amount paid per kilowatthour by eligible retail customers during the year ending May 31, 2009. Removes provisions concerning an adjustment in the energy transition assistance charge for inflation. Provides that, notwithstanding any other law, no commercial wind energy facility, commercial solar energy facility, or energy storage system shall be built in the State without the construction of such facility first being approved by the applicable unit of local government if the facility is within 1.5 miles of that unit of local government. Requires the Legislative Reference Bureau to prepare for introduction in the 2027 spring session of the General Assembly a bill effecting such changes in the statutes as may be necessary to conform the statutes to the changes in law made by the amendatory Act. Removes references to energy storage projects, energy storage resources, and energy storage systems. Amends the Property Tax Code and the Counties Code. Removes provisions concerning energy storage systems. Makes other changes. Effective immediately.","last":"Referred to Assignments","lastDate":"2026-02-06","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":[]},{"id":"SB4016","type":"SB","num":4016,"title":"Hyperscale Data Centers","raw":"HYPERSCALE DATA CENTERS","theme":"Data centers & large load","issue":"dc-hyperscale","also":[],"chamber":"Senate","sponsor":"Robert Peters","party":"D","cos":["Senator Graciela Guzman (D)","Senator Rachel Ventura (D)","Senator Mattie Hunter (D)","Senator David Koehler (D)","Senator Laura Fine (D)","Senator Sara Feigenholtz (D)","Senator Lakesia Collins (D)","Senator Emil Jones, III (D)","Senator Mike Simmons (D)","Senator Suzy Glowiak Hilton (D)","Senator Mary Edly-Allen (D)","Senator Adriane Johnson (D)","Senator Julie A. Morrison (D)","Senator Karina Villa (D)"],"nCos":14,"bip":false,"committees":["Executive (Senate)","Assignments (Senate)","AI and Social Media (Senate)"],"statutes":["20 ILCS 3125/30","20 ILCS 3125/60 new","20 ILCS 3855/1-5","20 ILCS 3855/1-75","220 ILCS 31/1-40 new","220 ILCS 5/16-105.8 new","220 ILCS 5/16-105.9 new","220 ILCS 5/4-620 new","30 ILCS 105/5.1038 new","30 ILCS 105/5.1039 new","415 ILCS 5/39.5from Ch. 111 1/2, par. 1039.5","415 ILCS 5/39from Ch. 111 1/2, par. 1039","415 ILCS 5/60.10 new","415 ILCS 5/60.11 new","415 ILCS 5/60.12 new","415 ILCS 5/60.13 new","415 ILCS 5/60.14 new","415 ILCS 5/60.15 new","415 ILCS 5/60.16 new","415 ILCS 5/60.1 new","415 ILCS 5/60.2 new","415 ILCS 5/60.3 new","415 ILCS 5/60.4 new","415 ILCS 5/60.5 new","415 ILCS 5/60.6 new","415 ILCS 5/60.7 new","415 ILCS 5/60.8 new","415 ILCS 5/60.9 new","415 ILCS 5/60 new","415 ILCS 5/Art. Tit. XIX heading new","New Act"],"nStat":31,"amend":[],"summary":"Amends the Environmental Protection Act, Energy Efficient Building Act, Illinois Power Agency Act, Public Utilities Act, and related statutes to establish comprehensive environmental, water, and energy regulations for hyperscale data centers. In the Environmental Protection Act, requires cumulative impact assessments, public notice, and community benefits agreements for data centers; prohibits nondisclosure agreements; and creates the Data Center Community Intervenor Compensation Fund and Hyperscale Data Center Public Benefits and Affordability Fund funded by annual fees based on peak demand. Mandates water resource planning, quarterly water usage reporting, water scarcity plans, and Water Impact Permits with public hearings and renewal every 5 years. Requires compliance with stringent energy codes and annual energy and water reporting to the Illinois Commerce Commission. Expands renewable energy procurement programs, establishes a hyperscale data center self-direct program, and strengthens equity, transparency, and labor standards in clean energy initiatives. Creates the Residential Automated Solar Permitting Platform Act to require municipalities and counties to adopt a residential automated solar permitting platform on or before July 1, 2027, and authorizes persons to file a civil action against a municipality or county in violation.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["HB5513"]},{"id":"SB4020","type":"SB","num":4020,"title":"District Energy Storage","raw":"DISTRICT ENERGY STORAGE","theme":"Solar, storage & distributed energy","issue":"district-energy","also":[],"chamber":"Senate","sponsor":"Bill Cunningham","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["20 ILCS 3501/801-40","20 ILCS 3855/1-10","20 ILCS 3855/1-79 new","20 ILCS 605/605-1006 new","20 ILCS 605/605-106 new","20 ILCS 605/6-1011 new","220 ILCS 5/16-107.9","220 ILCS 5/8-104.5 new","30 ILCS 500/20-61 new","30 ILCS 500/20-66 new","35 ILCS 105/3-5","35 ILCS 110/3-5","35 ILCS 115/3-5","35 ILCS 120/2-5","35 ILCS 200/18-176 new","New Act"],"nStat":16,"amend":[],"summary":"Creates the District Energy and Thermal Energy Storage Parity Act. Provides that the Illinois Commerce Commission, in consultation with Environmental Protection Agency, shall establish an optional certification process for Qualified District Energy Infrastructure. Requires the Environmental Protection Agency to establish a grant program to support certain projects. Provides that, within 180 days after the effective date of the Act, the Commission shall initiate a docketed proceeding to develop standardized thermal service agreement templates, suitable for developer financing and underwriting, and minimum requirements for customer rate stabilization options. Provides that a developer shall obtain a District Energy Feasibility Assessment from a qualified preparer for certain projects. Sets forth requirements for the content of the District Energy Feasibility Assessment. Amends the Department of Commerce and Economic Opportunity Law of the Civil Administrative Code of Illinois. Requires the Department to develop and make available to units of local government a municipal alignment toolkit to facilitate the development and expansion of district energy systems. Requires the Department to establish and administer a district energy expansion program to support the development expansion, modernization, and decarbonization of district energy systems in the State. Amends the Illinois Finance Authority Act. Provides that the Authority may provide loans, credit enhancements, interest rate buydowns, loan loss reserves, or other financial assistance for the development, construction, expansion, or operation of the Qualified Energy Infrastructure and Dispatchable Thermal Energy Storage. Amends the Illinois Power Agency Act. Creates the Thermal Energy Storage Credit procurement program. Sets forth requirements for the program. Amends the Illinois Procurement Code. Sets forth provisions concerning district energy evaluation in State procurements. Amends the Use Tax Act, the Service Use Tax Act, the Service Occupation Tax Act, and the Retailers' Occupation Tax Act. Makes changes in provisions concerning exemptions. Amends the Property Tax Code. Defines\"commercial energy storage system\". Amends the Public Utilities Act. Sets forth provisions concerning district energy enabling measures and heat recovery incentives. Makes other changes.","last":"Referred to Assignments","lastDate":"2026-02-06","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":["HB5429"]},{"id":"SB4028","type":"SB","num":4028,"title":"Utility-Interconnection Rules","raw":"UTILITY-INTERCONNECTION RULES","theme":"Solar, storage & distributed energy","issue":"interconnection-rules","also":[],"chamber":"Senate","sponsor":"Terri Bryant","party":"R","cos":["Senator Donald P. DeWitte (R)","Senator Chris Balkema (R)","Senator Craig Wilcox (R)","Senator Seth Lewis (R)"],"nCos":4,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["220 ILCS 5/16-108"],"nStat":1,"amend":[],"summary":"Amends the Public Utilities Act. In provisions concerning the recovery of costs associated with the provision of delivery and other services, provide that the Illinois Commerce Commission shall, within 180 days after the effective date of the amendatory Act, initiate and complete a rulemaking proceeding to revise 83 Ill. Adm. Code 466 and 83 Ill. Adm. Code 467 to address barriers to timely and cost-effective interconnections for distributed generation facilities with a nameplate capacity of at least 40 kilowatts but no greater than 2 megawatts, including stand-alone solar photovoltaic systems, battery energy storage, hybrid gas-electric systems, and renewable natural gas integrations. Requires the revisions to include certain factors. Provides that the Commission shall coordinate the revisions with a Future of Gas proceeding pursuant to the final Order of the Commission in Docket No. 24-0158 to ensure compatibility with gas decarbonization pathways and to prioritize market-driven distributed resources that enhance reliability and affordability. Provides that the revised rules shall take effect no later than July 1, 2026. Effective immediately.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-03-27","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"SB4039","type":"SB","num":4039,"title":"Solar Energy-Various","raw":"SOLAR ENERGY-VARIOUS","theme":"Solar, storage & distributed energy","issue":"cs-colocation","also":[],"chamber":"Senate","sponsor":"Steve Stadelman","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["20 ILCS 3855/1-75","20 ILCS 730/5-40"],"nStat":2,"amend":["Senate Amendment 002","Senate Amendment 001"],"summary":"Amends the Illinois Power Agency Act. In provisions concerning colocation of photovoltaic community renewable generation projects, changes references from\"community renewable generation project\" to\"photovoltaic community renewable generation project\" and\"community solar projects\" to\"photovoltaic community renewable generation projects\". Requires a project labor agreement for the new construction of certain facilities related to community-driven community solar projects. In a provision applying prevailing wage requirements to facilities for which a renewable energy credit delivery contract is signed, removes an exception for multi-family residential buildings with aggregate geothermal system tonnage, including colocated projects, of no more than 29 tons. Amends the Energy Transition Act. Provides that the Department of Corrections and the Department of Commerce and Economic Opportunity shall jointly develop activities to support the recruitment of eligible candidates to the Illinois Climate Works Preapprenticeship Program. Provides that the activities shall include coordinating on sharing with community-based providers the contact information of persons preparing to be released into the community, including names, addresses, phone numbers, and email addresses, if the person preparing to be released consents to the person's contact information being shared. Makes other changes.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-06-01","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB5459"]}],"issues":{"dc-property":{"headline":"Should neighbors be paid when a data center hurts their property value or business?","bg":"Data centers draw heavy power, run backup generators, use water and generate noise. Residents near proposed sites have raised these concerns in Illinois and other states. This bill creates a compensation right for owners within 1,000 feet who can show measurable harm such as lost property value, lost business revenue or environmental damage.","why":"It shifts risk from neighbors to the data center developer and could lengthen siting timelines or raise project costs. It does not touch rates directly, but it feeds the wider debate over who bears the costs of the data center boom, which is also the argument behind most of the rate bills on this list.","q":["How is measurable harm proven and by whom","Does a compensation right slow site selection in Ameren Illinois territory","Would local zoning make this redundant in practice"],"go":["dc"],"plain":["If this became law, anyone who owns land or runs a business within 1,000 feet of a data center could ask for money when the data center causes measurable harm. The harm has to be something you can point to, such as a drop in what the property is worth, lost business revenue, or damage to the environment on the property.","The bill puts the burden on the developer instead of the neighbor. Today a neighbor who thinks a data center hurt their home value usually has to file a nuisance lawsuit, which is slow and expensive."],"ex":"Imagine a family owns a home 800 feet from a planned data center. After the building goes up, constant fan noise and diesel generator tests make the house hard to sell, and an appraiser documents a drop in value. Under this bill the family could seek compensation from the operator. A home 2,000 feet away would not qualify. These numbers are made up to show how the bill works.","viz":{"kind":"vs","title":"Who could claim under the bill","sides":[{"h":"Within 1,000 feet","items":["Can seek compensation if harm is measurable","Property value, business revenue or environmental harm"]},{"h":"Beyond 1,000 feet","items":["Not covered by the bill"]}]},"states":[["General","I did not find another state that has adopted a flat compensation right for data center neighbors. Most places handle it through zoning conditions, setbacks and community benefit agreements, and Governor Pritzker has publicly urged developers to sign those agreements."],["Pennsylvania","Capitol Fax reports that Pennsylvania already has regulations requiring companies to negotiate with communities."]],"places":[["Grayslake, Lake County","The village granted a building permit for the first building of a planned 472 acre campus and opponents have sued, saying the hearings were inadequate."],["Yorkville and Plano, Kendall County","Three projects were approved, only CyrusOne is under construction, and two are tied up in community driven litigation."],["Northlake, Cook County","An Illinois Answers analysis estimated homeowners would save more than $2,000 a year, about 30 percent, if local data center tax breaks did not exist."]],"news":[{"t":"Roundup, Data centers face growing local resistance","src":"Capitol Fax","u":"https://capitolfax.com/2026/09/02/roundup-data-centers-face-growing-local-resistance/","d":"2026-09-02"},{"t":"You sold us out, Illinois data center boom ignites local backlash","src":"Shaw Local","u":"https://www.shawlocal.com/news/2026/05/30/you-sold-us-out-illinois-data-center-boom-ignites-local-backlash/","d":"2026-05-30"}]},"dc-heat":{"headline":"Should data centers be required to send waste heat to nearby homes and businesses?","bg":"Servers turn nearly all the electricity they use into heat. Some European cities capture that heat for district heating. This bill requires new and existing Illinois data centers to adopt a heat reuse plan built on an air to water heat exchanger, with added requirements for newer facilities.","why":"It is a design mandate with real cost and engineering questions, since heat is only useful if buildings and pipes exist nearby. It also touches utility turf. Heat delivered by a data center could substitute for gas or electric heating, which connects to the Future of Gas questions.","q":["Which sites could realistically use the heat","Who owns and regulates the thermal loop","Does it displace gas distribution load"],"go":["dc","gas"],"plain":["Almost every watt a server uses ends up as heat. Today most data centers just blow that heat outside. This bill would require data centers in Illinois, new and existing, to have a plan to capture the heat with an air to water heat exchanger, which moves heat from the building air into a loop of water that could be piped somewhere useful. Newer facilities would face extra requirements.","The catch is that captured heat only has value if there is a building nearby that needs warmth, and pipes to carry it."],"ex":"A data center sits next to a new apartment complex and a community college. The heat exchanger warms water to a usable temperature and a buried pipe loop carries it to the buildings, where it handles part of the winter heating load. If the nearest building is three miles away in a farm field, the heat plan is mostly paperwork. Made up example.","viz":{"kind":"flow","title":"How heat reuse works","steps":["Servers make heat","Heat exchanger moves it into water","Pipes carry warm water","Nearby buildings use it for heating"]},"states":[["Denmark","A Meta data center in Odense sends its waste heat into the city district heating system."],["Finland","Microsoft and the utility Fortum announced a plan for a data center region near Helsinki that would feed heat into district heating."],["Sweden","Stockholm Data Parks markets data center heat to the city network."]],"places":[["Illinois","I did not find an operating Illinois data center that sells its heat to a district system. This bill would be a first step. The bigger Illinois heat networks are on college campuses and downtown Chicago, which connects to the district energy bills on this list."]],"news":[]},"dc-hyperscale":{"headline":"A comprehensive rulebook for hyperscale data centers covering environment, water, energy and community benefit","bg":"These twin bills are the broadest data center proposals on the list. They require cumulative impact assessments, public notice and community benefit agreements, ban nondisclosure agreements, and create two funds paid for by fees based on peak demand. They add water planning, water impact permits that renew every five years, stricter energy codes, annual energy and water reporting to the ICC, expanded renewable procurement, a hyperscale self direct program, and a residential automated solar permitting requirement for cities and counties.","why":"This is a package, so it touches the Public Utilities Act, the Illinois Power Agency Act, the Environmental Protection Act and the Energy Efficient Building Act at once. For a utility, the pieces to watch are the peak demand fees, the ICC reporting duties, the self direct program that could pull large customers out of renewable procurement charges, and any change to how large load customers are interconnected and billed.","q":["How would the peak demand fee interact with a utility's large load tariff","What new reporting lands on the ICC and utilities","How does self direct affect charges other customers pay"],"go":["dc"],"plain":["A hyperscale data center is the very large kind, built by companies such as cloud and AI providers, drawing tens or hundreds of megawatts. HB5513 and SB4016 are the same big package. They would make developers study the combined effect on a community before building, give public notice, sign a community benefit agreement, and give up nondisclosure agreements with local governments. They add water planning with permits that renew every five years, tougher energy codes, yearly reporting of energy and water use to the ICC, and fees based on peak demand that pay into two funds.","The bills also bundle in a requirement that cities and counties adopt automated residential solar permitting, which has nothing to do with data centers on its face but shows up here as part of the same package."],"ex":"A developer wants a 300 megawatt campus in a county. Under the package it would first have to publish a cumulative impact study, hold public notice, negotiate a benefit agreement with the community, and apply for a water impact permit that has to be renewed every five years. Each year it would report how much power and water it used. Made up example.","viz":{"kind":"flow","title":"Path to build a hyperscale site under the package","steps":["Impact study and public notice","Community benefit agreement","Water impact permit (renews every 5 years)","Build and pay peak demand fees","Annual energy and water report to the ICC"]},"states":[["Governor Pritzker","In June 2026 the Governor called for data center specific electric rates, efficiency rules for energy and water, temporary shutdowns during grid stress, a ban on nondisclosure agreements with local governments, and public notice when data centers apply for permits. Many of those pieces appear in these bills."],["Oregon","The 2025 POWER Act in Oregon created a separate rate class for large loads."],["Texas","Senate Bill 6 in 2025 let the grid operator curtail big loads in emergencies and required more disclosure."]],"places":[["Joliet, Will County","A 795 acre project approved 8 to 1 after a 6.5 hour meeting, with $51 million offered up front over four years."],["Yorkville, Kendall County","Project Cardinal, 1,037 acres, approved in March, and the developer later asked for an 18 month extension to buy land."],["Champaign County","One year moratorium on large data centers adopted in April 2026 while a task force writes rules."]],"news":[{"t":"Pritzker pauses data center tax incentives, calls for new protections","src":"Rock River Current","u":"https://www.rockrivercurrent.com/2026/06/pritzker-pauses-data-center-tax-incentives-calls-for-new-protections/","d":"2026-06"},{"t":"Illinois lawmakers debate data center regulations","src":"St. Louis Public Radio","u":"https://www.stlpr.org/health-science-environment/2026-05-01/illinois-lawmakers-debate-data-center-regulations-in-response-to-growing-energy-and-water-use-concerns","d":"2026-05-01"},{"t":"Developers of Project Cardinal data center in Yorkville ask for 18 month extension","src":"Shaw Local","u":"https://shawlocal.com/kendall-county-now/2026/06/08/developers-of-project-cardinal-data-center-in-yorkville-ask-for-18-month-extension-to-purchase-land","d":"2026-06-08"}]},"dc-selfsupply":{"headline":"A House resolution urging data centers to bring their own power","bg":"HR744 is a resolution, so it has no force of law. It urges data centers to supply their own energy, and urges the IPA and Illinois EPA to develop a plan to reduce or delay CO2 and copollutant reductions under the Environmental Protection Act, with the ICC asked to approve that plan.","why":"The signal matters more than the text. It pairs a bring your own generation idea with a request to slow the emissions timeline in the Climate and Equitable Jobs Act, which is the same tension in the peaker, heat rate and goal extension bills. A resolution can still shape the framing of later bills.","q":["Who is the audience for this resolution","Does it preview language for a binding bill"],"go":["dc","ctg"],"plain":["A resolution is a statement, not a law. HR744 asks data centers to supply their own power instead of drawing from the shared grid. It also asks the IPA and the Illinois EPA to come up with a plan to reduce or delay certain carbon dioxide and co-pollutant reductions required under state environmental law, with the ICC approving that plan. In plain terms, it nudges data centers toward on site generation and nudges regulators to give power plants more room if demand grows fast.","Because it has no force of law, nothing changes unless later legislation or agency action follows."],"ex":"A data center owner reads the resolution as a signal that lawmakers would welcome a gas turbine on its own property. That could speed the project, but it also puts new emissions sources next to neighbors, which is why this resolution connects to the emissions deadline bills.","viz":{"kind":"vs","title":"What a resolution can and cannot do","sides":[{"h":"Can","items":["Express the will of the House","Signal priorities to agencies and developers","Start a policy conversation"]},{"h":"Cannot","items":["Create a requirement","Change a deadline in current law","Bind the ICC or the IPA"]}]},"states":[["Texas","Senate Bill 6 in 2025 pushes large loads to disclose backup generation and allows grid operators to call on it in emergencies."],["PJM","The grid operator that covers northern Illinois is leaning on states and utilities to require data centers to secure their own power or accept being cut off in grid emergencies, according to Capitol News Illinois as summarized by Capitol Fax."]],"places":[["Northern Illinois","ComEd territory sits inside PJM, so the bring your own power idea is most live there. Ameren Illinois sits in MISO, which has its own large load discussions."]],"news":[{"t":"Roundup, Data centers face growing local resistance","src":"Capitol Fax","u":"https://capitolfax.com/2026/09/02/roundup-data-centers-face-growing-local-resistance/","d":"2026-09-02"}]},"dc-foreign":{"headline":"Should foreign companies be barred from building data centers unless the state certifies their energy use?","bg":"The bill creates the Data Center Construction by Foreign Adversaries Act. A foreign company could not build a data center in Illinois until the ICC, the IPA and DCEO complete a joint study of its energy consumption and certify results to the Governor and General Assembly.","why":"It adds a state review step and puts three agencies in the approval path, which raises questions of capacity and timing. It also reflects a national security framing of data centers that sits apart from the rate and reliability framing used in most other bills.","q":["How is a foreign adversary defined","What does certification actually decide"],"go":["dc"],"plain":["SB3578 would create the Data Center Construction by Foreign Adversaries Act. A foreign company could not build a data center in Illinois until the ICC, the IPA and DCEO jointly study how much energy it would use and certify the results to the Governor and the General Assembly. So it is a hold on construction until a state study is done, rather than a flat ban.","The bill relies on the federal idea of a foreign adversary. A reader should check how the bill defines the term, since that decides which companies are caught."],"ex":"A company headquartered in a country the state treats as a foreign adversary files to build a data center. Under the bill it could not break ground until the three agencies finish the energy study and send the certified results to the Governor and legislature. A domestic company would not face that step. Made up example.","viz":{"kind":"flow","title":"Steps under SB3578","steps":["Foreign company proposes data center","ICC, IPA and DCEO study its energy use","Results certified to Governor and General Assembly","Construction may begin"]},"states":[["Texas","A 2025 law restricts purchases of land by entities tied to China, Iran, North Korea and Russia."],["Florida","A 2023 law limits land purchases by people and companies tied to China and other countries of concern, especially near military sites."]],"places":[["No Illinois site tied to this bill","I did not find a specific Illinois project that triggered the bill. It follows a national wave of foreign ownership laws."]],"news":[]},"dc-selfdirect":{"headline":"A data center self direct program plus disclosure and water reporting rules","bg":"Two Senate bills with identical summaries. They let customers on the data center tariff reduce the renewable procurement charges they pay if they bring new additive clean generation, with the reduction growing with the energy or capacity value of what they add. They also require data center operators to file a disclosure with the ICC at least 180 days before construction, with public notice and open meetings, and annual water use disclosures to the Department of Natural Resources, with fines up to $10,000 per violation.","why":"Two ideas sit in one bill. Self direct rewards data centers for building new clean supply, but it also lowers the charges those customers pay toward programs that other customers keep funding. The disclosure rules give regulators and the public earlier visibility into large load, which helps planning and may help utilities see load before it arrives.","q":["Who covers the procurement charges a self direct customer no longer pays","What does the 180 day disclosure mean for interconnection timing"],"go":["dc"],"plain":["Customers on Illinois's data center electric rate pay renewable procurement charges like other customers. SB3761 and SB3830 would let those customers cut those charges if they bring brand new clean generation to the grid. The more energy or capacity value the new project adds, the bigger the reduction.","The same bills add two transparency rules. A data center operator must file a disclosure with the ICC at least 180 days before it builds, with public notice and open meetings. Operators must also report water use every year to the Department of Natural Resources, and violations can bring fines up to $10,000."],"ex":"A data center pays a renewable charge on every kilowatt hour. It signs a contract for a new solar and battery project in Illinois. The size of that project's energy and capacity value sets how much the charge drops. If it never builds anything new, it pays the full charge. Made up example.","viz":{"kind":"flow","title":"Self direct idea","steps":["Data center pays renewable procurement charge","Adds new clean generation","Charge reduced by the value of what it added"]},"states":[["Ohio","The state utility commission approved AEP Ohio's data center tariff in July 2025, which requires large customers to pay for a large share of the capacity they ask for."],["Virginia","Regulators approved a separate rate class for data centers and other large loads."]],"places":[["Sangamon County","A $500 million data center project was approved, according to St. Louis Public Radio."],["Mahomet Aquifer, central Illinois","The aquifer serves nearly 1 million people, and proposals in the Senate would ban data centers from using its water."]],"news":[{"t":"Illinois lawmakers debate data center regulations","src":"St. Louis Public Radio","u":"https://www.stlpr.org/health-science-environment/2026-05-01/illinois-lawmakers-debate-data-center-regulations-in-response-to-growing-energy-and-water-use-concerns","d":"2026-05-01"}]},"dc-clean-match":{"headline":"Require data centers to match their power use with clean energy certificates","bg":"The Advanced Technology Leadership Act would require covered data centers, beginning in 2027, to self generate or buy and retire energy attribute certificates equal to set percentages of their Illinois electricity use. Certificates must come from eligible facilities physically interconnected in the applicable grid region, and matching is hourly. The IPA identifies covered data centers.","why":"Hourly matching is a demanding standard, tougher than annual matching. It would push data centers toward storage and new clean supply close to load. It routes compliance through the IPA, not through utility rates, but it changes how large customers think about supply contracts and utility service.","q":["How steep are the percentages over time","What happens if matching clean supply is not available in the region","How does a utility sell service to a customer with hourly obligations"],"go":["dc"],"plain":["Utilities and companies track clean energy with certificates, one for each megawatt hour from a wind, solar or other clean source. HB5607 would require covered data centers, starting in 2027, to generate their own clean power or buy and retire enough certificates to match set percentages of their Illinois electricity use. Matching is hourly, which means a certificate bought for noon sun does not count against a 9 p.m. load. The certificates must come from facilities connected to the same grid region.","Hourly matching is much stricter than the usual yearly matching, because it cannot be met with cheap daytime solar alone."],"ex":"A data center uses 100 megawatt hours between 6 and 7 p.m. On a yearly basis it could cover that with solar certificates from spring afternoons. On an hourly basis it needs clean energy produced in that same evening hour, which points toward wind, storage or nuclear. Made up numbers.","viz":{"kind":"vs","title":"Yearly matching vs hourly matching","sides":[{"h":"Yearly","items":["Add up all clean energy bought in a year","Compare with total use","Cheap midday solar can cover a night load"]},{"h":"Hourly","items":["Compare each hour separately","Evening and night load needs clean power at that hour","Pushes toward storage, wind and firm clean power"]}]},"states":[["Oregon","The 2025 POWER Act created a separate large load rate class and ties data center growth to clean energy goals."],["Google and others","Large tech buyers have set voluntary goals to run on carbon free energy every hour, which is the idea this bill would make mandatory."]],"places":[["Illinois grid regions","Certificates must come from facilities in the same region. Northern Illinois is in PJM and central and southern Illinois is in MISO, which changes where a data center could shop."]],"news":[]},"lg-load-deposits":{"headline":"Limit what utilities can demand from large new loads before connecting them","bg":"The bill bars electric utilities from requiring deposits, letters of credit, advance payments or similar financial assurance from a large demand project applicant that applied under existing ICC approved tariffs and is in good standing on interconnection and construction requirements. Utilities could not delay investment to serve these applicants. It keeps technical standards, reasonable construction milestones and prudent cost recovery intact, and it becomes inoperative September 1, 2026.","why":"Financial assurance is how utilities protect other customers from stranded cost if a speculative large load never shows up. Limiting it shifts risk toward the utility and its customers, which is why the cost recovery savings clause matters. The sunset date also means this was meant as a short bridge and not permanent policy.","q":["Who bears the cost if a large load applicant walks away","Is the September 2026 sunset still meaningful now","How does this square with existing large load tariffs"],"go":["dc","icc"],"plain":["When a very large customer asks a utility to connect, the utility can ask for deposits, letters of credit or advance payments so that the rest of the customers are protected if the project is cancelled. HB4172 says that if a large load applicant applied under tariffs the ICC already approved and is in good standing on interconnection and construction requirements, the utility cannot demand that kind of financial assurance. The utility also could not delay investment to serve that applicant. Technical standards, reasonable milestones and prudent cost recovery stay. The bill becomes inoperative September 1, 2026, so it has a built in expiration.","Critics will see this as lowering protection for ordinary customers. Supporters will say it removes red tape for projects that are already playing by the rules."],"ex":"A developer has an approved tariff application for a big manufacturing plant and is on schedule. The utility wants a $50 million letter of credit before ordering transformers. Under the bill it could not require it. If the plant is later cancelled, the question is who pays for equipment already ordered. Made up numbers.","viz":{"kind":"vs","title":"Who carries the risk","sides":[{"h":"Today","items":["Utility can ask for deposits and guarantees","Customer posts them before the utility invests"]},{"h":"Under HB4172","items":["No deposits for qualified applicants","Utility must not delay","Risk of a cancelled project shifts toward other ratepayers"]}]},"states":[["Ohio","AEP Ohio's data center tariff, approved in July 2025, requires large customers to pay for a large share of the capacity they reserve even if they use less, which is the opposite direction from this bill."],["Virginia","Regulators created a new rate class for data centers and other large loads with its own cost responsibility."]],"places":[["Ameren Illinois and ComEd territory","The two utilities have received data center requests totaling about 44 gigawatts, according to the sponsor of the POWER Act as quoted by St. Louis Public Radio."]],"news":[{"t":"Illinois lawmakers debate data center regulations","src":"St. Louis Public Radio","u":"https://www.stlpr.org/health-science-environment/2026-05-01/illinois-lawmakers-debate-data-center-regulations-in-response-to-growing-energy-and-water-use-concerns","d":"2026-05-01"}]},"wetlands":{"headline":"Create a state wetlands permit program","bg":"In 2023 the US Supreme Court in Sackett v. EPA narrowed which wetlands the federal Clean Water Act covers. Several states have moved to protect the wetlands that dropped out of federal reach. These bills create a Wetlands Protection Act that bars discharge of dredged or fill material into state jurisdictional wetlands without a permit from the Department of Natural Resources, with exemptions and set application procedures.","why":"Utilities build lines, substations, pipelines and solar and storage sites, so any new permit layer for fill in wetlands can add time and cost to projects. How broad the exemptions are, and whether routine maintenance and linear utility work qualify, decides the practical impact.","q":["Are utility line and pipeline activities exempt","Which wetlands are state jurisdictional","How long is permit review"],"go":["policy"],"plain":["Wetlands are marshy areas that soak up floodwater, filter pollution and shelter wildlife. In 2023 the US Supreme Court decided in Sackett v. EPA that the federal Clean Water Act reaches fewer wetlands than before, mainly those with a continuous surface connection to a larger water body. Wetlands that lost federal protection can be filled in without a federal permit. HB3596 and SB2401 would create an Illinois Wetlands Protection Act that bars dumping dredged or fill material into state jurisdictional wetlands without a permit from the Department of Natural Resources, with exemptions and set application steps."],"ex":"A developer wants to fill a two acre wetland that sits a quarter mile from a creek with no continuous surface link. After Sackett, the federal government may no longer require a permit. Under the bill the developer would apply to the Department of Natural Resources and might have to avoid the wetland or offset the loss. Made up example.","viz":{"kind":"flow","title":"Wetland fill decision under the bill","steps":["Proposed fill in a wetland","Is it a state jurisdictional wetland","Yes, apply to DNR for a permit","Permit with conditions or denial"]},"states":[["Michigan and New Jersey","These states run their own federal wetlands permit program and have state level protection."],["Several states","Since Sackett, states such as Minnesota and Virginia have looked at or acted on their own wetlands protections, while Indiana in 2021 reduced protection for some wetlands. I did not independently verify each current law, so check before quoting."]],"places":[["Illinois farm and suburban edges","Isolated wetlands near new development and tile drained farm fields are where the gap matters most."]],"news":[]},"superfund":{"headline":"Make large fossil fuel producers pay into a state climate fund","bg":"Vermont and New York have enacted climate superfund laws that bill large fossil fuel companies for a share of climate damage costs, and these laws have drawn legal challenges. The Illinois bills create a Climate Change Superfund, require at least 40 percent of money to benefit disadvantaged communities, and direct Illinois EPA to write rules within a year on how liability is apportioned.","why":"The direct payers would be fuel producers, not utilities. The indirect effects are what to watch, since costs could pass through to fuel prices that gas utilities and their customers see, and the fund could become a competing source of money for resilience and adaptation projects.","q":["Who counts as a responsible party","Could costs pass through to gas supply prices","Does the fund pay for grid resilience"],"go":["policy"],"plain":["A climate superfund works like a toxic waste cleanup fund. The state would send a bill to the largest fossil fuel producers in proportion to their share of past emissions, and use the money for climate damage and adaptation. Illinois HB4773 and SB2981 would create a Climate Change Superfund, require at least 40 percent of the money to go to disadvantaged communities, and direct the Illinois EPA to write rules within a year on how liability is split.","The big open question is whether a state can do this at all. Industry argues federal law and the Constitution leave this to Washington."],"ex":"Suppose Illinois spends $500 million over several years on flood control, heat protection and storm damage. Under a superfund, the state would assess a company that sold a large share of the fuel that caused the warming, rather than sending the whole cost to taxpayers. Made up numbers.","viz":{"kind":"flow","title":"How a climate superfund works","steps":["Study past emissions of big producers","Assign each a share","Bill each company over time","Pay for adaptation and recovery projects"]},"states":[["Vermont","Passed the first climate superfund law in 2024. A lawsuit against it is still pending."],["New York","Passed its own in 2024 to charge fossil fuel companies $75 billion over 25 years. On Sept 1, 2026 reports said a federal judge ruled the law preempted by the federal Clean Air Act and cannot be enforced, and the legal fight continues."],["At least 12 other states","Proposed similar bills this year and none has advanced, with some lawmakers waiting for the New York and Vermont cases."]],"places":[["Illinois climate costs","Heat, flooding and storm damage are the cost items that a fund would pay for, such as Chicago area basement flooding."]],"news":[{"t":"Judge blocks New York's climate Superfund law as other states watch closely","src":"New Jersey Monitor","u":"https://newjerseymonitor.com/2026/09/01/repub/judge-new-york-climate-superfund/","d":"2026-09-01"}]},"ghg-emergency":{"headline":"Let power plants keep running in emergencies and delay emissions rules if storage is scarce","bg":"The Climate and Equitable Jobs Act, or CEJA, set emission reduction deadlines for fossil power plants. This bill lets a generating unit keep operating during an emergency, pre emergency or conservative operations situation. It bars variances or adjusted standards if batteries make up at least 10 percent of installed capacity, and requires Illinois EPA to delay enforcement of some controls if batteries fall below 10 percent.","why":"It ties emissions deadlines to a storage threshold, so the timeline moves with how fast batteries are built. For regional reliability planning this is a pressure valve. For anyone relying on CEJA deadlines to plan retirements or investments, it adds uncertainty. SB2727 contains very similar language.","q":["Who declares conservative operations and for how long","Is 10 percent of capacity a realistic trigger in the near term"],"go":["ctg","policy"],"plain":["The Climate and Equitable Jobs Act, called CEJA, set deadlines for fossil power plants to cut greenhouse gas emissions. HB4798 would do three things. It would let a power plant keep running during an emergency or a pre emergency situation. It would bar variances or adjusted standards, which are formal exceptions to the deadlines, if batteries make up at least 10 percent of installed capacity. And it would require the Illinois EPA to delay enforcement of some controls if batteries fall below 10 percent.","In short, the rules would tighten or loosen depending on how much battery storage the state has built."],"ex":"On a very hot evening the grid operator calls an emergency. A gas plant that would otherwise have to limit its hours is allowed to run flat out. If batteries are only 6 percent of capacity, enforcement of some controls is delayed. If batteries are at 12 percent, the plant cannot get an exception. Made up numbers.","viz":{"kind":"vs","title":"Battery share of capacity and what happens","sides":[{"h":"Batteries below 10 percent","items":["Illinois EPA delays enforcement of some controls","Plants may keep running in emergencies"]},{"h":"Batteries at 10 percent or more","items":["No variances or adjusted standards"]}]},"states":[["Not a common design","I did not find another state that ties emissions deadlines to a battery share. The nearest comparison is reliability must run arrangements that keep older plants open when the grid operator says they are needed."]],"places":[["Illinois fossil plants","Plants in MISO and PJM territory are the ones affected. The CEJA deadlines start with large greenhouse gas emitting units."]],"news":[]},"anti-backsliding":{"headline":"Lock in current state environmental standards and protect the right to seek stricter ones","bg":"With federal environmental rules being rolled back, some states are writing floors into their own law. This bill bars the Pollution Control Board from adopting standards less stringent than those now in its regulations for air, water, drinking water, hazardous waste and landfills, and preserves the right of a person to petition for stricter rules.","why":"A floor limits future flexibility for regulated entities, including utilities with coal ash, air permits and water discharge obligations. If federal standards loosen, Illinois requirements would stay put, so compliance costs would not fall with them.","q":["Does the floor cover existing variances and adjusted standards","How does it interact with CEJA deadlines"],"go":["policy"],"plain":["HB5070 would bar the Pollution Control Board from adopting any standard weaker than what its rules say today for air, water, drinking water, hazardous waste and landfills. It also keeps in place the right of any person to petition for stricter rules. It works like a ratchet that only turns toward more protection.","The reason is that federal agencies are rolling back some environmental rules, and sponsors want Illinois to hold the line even if Washington does not."],"ex":"Suppose the federal government relaxes a limit on a pollutant in drinking water. Illinois would not be able to match that weaker limit through the Board. It could stay where it is or go stricter. Made up example.","viz":{"kind":"vs","title":"Ratchet rule","sides":[{"h":"Without the bill","items":["Board can loosen a standard"]},{"h":"With the bill","items":["Board cannot go below current standards","Anyone can still ask for stricter"]}]},"states":[["Stringency laws","A number of states have the opposite kind of law, which says state rules cannot be stricter than federal rules. HB5070 is the mirror image."],["California","California has often written state rules that go beyond federal ones, including appliance and vehicle rules."]],"places":[["Illinois Pollution Control Board","The Board adopts the state rules and decides enforcement cases, so this bill changes what it is allowed to do."]],"news":[]},"appliance-standards":{"headline":"State minimum efficiency standards for appliances","bg":"The Illinois Appliance Standards Act would direct Illinois EPA to adopt minimum efficiency standards for covered products, with testing, certification, labeling and enforcement. Many states adopt their own standards when federal standards lag.","why":"Tighter appliance standards reduce energy use, which lowers customer bills and slightly reduces sales volume for utilities. The covered product list in rulemaking would decide whether gas appliances are in scope, which links to the gas appliance debates.","q":["Which products are covered first","How are standards coordinated with federal rules"],"go":["policy"],"plain":["Appliance standards set the minimum efficiency for things like water heaters, furnaces and dishwashers. The federal government sets a base level, and states can add their own for products where federal rules lag. HB5366 would have the Illinois EPA adopt minimum standards, run testing and certification, require labeling and enforce them.","Standards cut utility bills over time, but they can raise the sticker price, and manufacturers prefer one national rule rather than a patchwork."],"ex":"A store sells two models of a water heater. One uses a lot more electricity or gas to heat the same water. If the state sets a minimum, the least efficient model can no longer be sold. A buyer pays more up front for the better model and saves on monthly bills. Made up example.","viz":{"kind":"flow","title":"How the standard reaches the store","steps":["Illinois EPA sets minimum for a product","Manufacturers test and certify","Labeling shows compliance","Non compliant models cannot be sold in Illinois"]},"states":[["California","The first state to set its own appliance rules, through Title 20."],["A group of states","Washington, Colorado, New York, Vermont, Maryland, Massachusetts and others have adopted standards on products the federal government has not covered. Check each state before quoting."]],"places":[["Illinois retailers","Rules apply at the point of sale, so big box stores and online sellers shipping into Illinois would be affected."]],"news":[]},"ej-permits":{"headline":"More review of air permits in environmental justice areas","bg":"These bills add review steps for air pollution construction permits. IEPA would evaluate whether a source is in an area of environmental justice concern, notify specified persons, and consider whether emissions can be reduced or limited and whether more air quality analysis is needed. HB5374 applies to permits applied for on or after January 1, 2026 and SB3772 begins January 1, 2027.","why":"Gas peaking plants, compressor stations and some utility facilities need air permits, so added review can slow siting and add conditions. The same designation, environmental justice area, also drives where other incentives and obligations in CEJA apply.","q":["Which facility types trigger the review","What can IEPA require beyond what the permit already contains"],"go":["policy"],"plain":["Before a company can build or change a source of air pollution, it needs a construction permit from the Illinois EPA. HB5374 and SB3772 would add steps for permits in environmental justice areas, meaning communities that already carry a heavier pollution burden. The agency would check whether the source is in such an area, notify certain people, and consider whether emissions can be cut or limited and whether more air quality analysis is needed. HB5374 applies to permits applied for on or after January 1, 2026, and SB3772 starts January 1, 2027.","The bills do not ban anything. They add review and information."],"ex":"A company applies to add a boiler at a plant in a neighborhood already near a highway and several factories. Under these bills the agency flags the neighborhood, tells the specified people, and asks whether the plant can lower its emissions or needs more modeling before the permit is issued. A similar plant in a rural area with few sources would see fewer extra steps. Made up example.","viz":{"kind":"flow","title":"Extra review steps","steps":["Permit application","Agency checks for environmental justice area","Notice to specified people","Look at reducing emissions and extra air analysis","Decision"]},"states":[["New Jersey","A 2020 environmental justice law requires state review of permits for certain facilities in overburdened communities and lets the state deny some permits."],["New York","A similar law applies cumulative impact rules to permits in disadvantaged communities."]],"places":[["Southeast Side of Chicago","The Chicago health department denied the permit for a metal shredder in 2022 after a long fight over air pollution in the area. This is the type of dispute the bills target."]],"news":[]},"ccr":{"headline":"Tighter rules for coal ash storage and closure","bg":"Coal combustion residuals, or coal ash, are stored in surface impoundments at power plants. Illinois adopted coal ash rules in 2021. HB5453 defines a CCR management unit, any land area outside an impoundment where ash is managed. SB1436 requires CCR surface impoundments within 4,000 feet of Lake Michigan to close by removal and off site disposal.","why":"Closure by removal is much more expensive than capping in place. Owners of Illinois coal plants and their regulators would face higher closure costs and timelines. The cost of closure can influence retirement decisions, which loops back to reliability and replacement generation.","q":["Which sites fall in the Lake Michigan buffer","Who pays for closure by removal"],"go":["ctg","policy"],"plain":["Coal ash is the waste left after burning coal. Power plants store it in ponds called surface impoundments and in other piles and landfills, and it can leak heavy metals like arsenic and boron into groundwater. HB5453 defines a CCR management unit, which is any land area outside an impoundment where ash is managed, so those areas fall under the rules. SB1436 requires ash ponds within 4,000 feet of Lake Michigan to close by removal and off site disposal, which rules out capping the ash in place.","Capping in place is cheaper. Removal is more protective but more expensive and requires trucking the ash."],"ex":"A plant on a lake has an ash pond 1,000 feet from the shore. The owner wants to cover it with a cap and monitor it. Under SB1436 the owner would have to dig it out and haul it to a lined landfill farther away. Made up example.","viz":{"kind":"vs","title":"Two ways to close an ash pond","sides":[{"h":"Cap in place","items":["Cover the ash with a liner and soil","Lower cost","Ash stays where it is, monitoring for decades"]},{"h":"Remove","items":["Dig up the ash","Haul to a lined landfill","Higher cost, nothing left near water"]}]},"states":[["Illinois 2019 and 2021","Illinois passed its own coal ash law in 2019 and later rules, which the bill builds on."],["Federal","The EPA's 2015 coal ash rule is the national baseline, and the EPA has recently moved to cover more legacy sites, as Grist has reported."]],"places":[["Waukegan, Lake County","NRG's former coal plant on the Lake Michigan shore stored about 70,000 cubic yards of ash in a lined pond, and the company's plan was to cap it in place. Groundwater there showed high boron. Canary Media's 2021 report is the source."],["Vermilion Power Station near Oakwood","Ash ponds sit on the bank of the Middle Fork of the Vermilion River, the state's only national wild and scenic river."]],"news":[{"t":"Historic coal ash raises concerns at iconic Illinois coal plant site","src":"Canary Media (2021 background)","u":"https://www.canarymedia.com/articles/enn/historic-coal-ash-raises-concerns-at-iconic-illinois-coal-plant-site","d":"2021-12-21"},{"t":"New EPA rules tell polluters in Great Lakes communities to clean up legacy coal waste","src":"Grist","u":"https://grist.org/accountability/new-epa-rules-tell-polluters-in-great-lakes-communities-to-clean-up-legacy-coal-waste/","d":""}]},"ghg-equity-community":{"headline":"Narrow which communities qualify for stricter timelines near gas plants","bg":"CEJA sets different emission timelines for gas fired units depending on whether they are close to an equity investment eligible community. These bills specify that such a community must have been designated by the Restore, Reinvest, and Renew Program Board as of January 11, 2024 and be located in an R3 Area under the Cannabis Regulation and Tax Act.","why":"The definition decides which plants face earlier deadlines. Tying it to a fixed date and a specific program map removes ambiguity and ends the chance that the set of qualifying communities changes later. That predictability matters for plant owners planning compliance.","q":["Which gas plants are inside or outside the defined communities","Does a fixed date matter for any near term compliance"],"go":["ctg"],"plain":["CEJA gives gas fired plants different timelines to cut emissions depending on whether they are near an equity investment eligible community, which is a community the law treats as hit harder by pollution. HB5479 and SB3234 would narrow that definition. Only a community designated by the Restore, Reinvest, and Renew Program Board as of January 11, 2024, and located in an R3 Area under the Cannabis Regulation and Tax Act, would count.","Fewer communities counting means fewer plants face the tougher timeline."],"ex":"Suppose 40 communities near gas plants qualify under the current wording and 15 would qualify under the new one. A plant near one of the 25 communities that drop out would move from the tougher timeline to the looser one. Made up numbers to show the mechanism.","viz":{"kind":"vs","title":"Who counts as an equity community","sides":[{"h":"Today","items":["Wider group under CEJA definitions"]},{"h":"Under the bills","items":["Must be designated by R3 Board by Jan 11, 2024","Must sit in an R3 Area"]}]},"states":[["Not a common design","Environmental justice community definitions vary state to state. New Jersey, New York and Minnesota use screening tools based on income, race and pollution. I did not find another state that ties a deadline to a cannabis program map."]],"places":[["R3 areas","The R3 program targets neighborhoods hit hard by violence, high poverty and incarceration, including parts of Chicago, East St. Louis and other cities."]],"news":[]},"zev":{"headline":"Jobs plan requirement for state vehicle contracts and a rewrite of EV rebates","bg":"The bills require bidders on state master contracts for vehicles, for solicitations after January 1, 2027, to submit an Illinois Jobs Plan. They also change electric vehicle rebates starting July 1, 2027, including an Illinois residency requirement and changes to the luxury and low efficiency vehicle provisions.","why":"Electric vehicle rebates influence how fast charging load grows on distribution systems. Utilities plan for that load and run their own transportation electrification programs, so changes in rebate size or eligibility shift forecasts.","q":["How are rebate amounts changing","Does the jobs plan alter state fleet electrification"],"go":["policy"],"plain":["Two things happen here. First, anyone bidding on a state master contract for vehicles, for solicitations after January 1, 2027, would have to submit an Illinois Jobs Plan. Second, starting July 1, 2027, the electric vehicle rebate changes, including a requirement that the buyer live in Illinois and changes to the luxury and low efficiency vehicle provisions.","The bills tie vehicle purchasing and rebates to in state jobs."],"ex":"A manufacturer bids to sell vehicles to state agencies. Under the bill it has to submit a plan showing how it supports Illinois jobs. A person who lives in Indiana and buys an electric car in Illinois would not qualify for the rebate. Made up example.","viz":{"kind":"flow","title":"What changes and when","steps":["Jan 1, 2027","Bidders on state vehicle master contracts file an Illinois Jobs Plan","Jul 1, 2027","EV rebate rules change, including an Illinois residency rule"]},"states":[["Colorado, New Jersey and California","Run their own electric vehicle incentives with income or price caps. Illinois's version has its own rules, so compare before assuming."]],"places":[["Normal, Illinois","Rivian builds electric vehicles at its plant in Normal, which is why in state jobs come up in EV incentive debates."]],"news":[]},"climate-home":{"headline":"A grant pilot to help Illinois homes withstand climate risk","bg":"The bill creates the Strengthen Illinois Homes Fund and, by July 1, 2028 and subject to funding, a pilot grant program run with the Department of Insurance and DCEO to harden homes against climate hazards.","why":"It is mostly a state funding and insurance resilience measure. For utilities the relevance is storm and heat events that drive outages and customer vulnerability, and possible overlap with weatherization and efficiency programs.","q":["Where does the funding come from","Does the pilot overlap utility efficiency programs"],"go":["policy"],"plain":["HB5529 would create the Strengthen Illinois Homes Fund and, by July 1, 2028 and subject to funding, a pilot grant program run with the Department of Insurance and DCEO to harden homes against climate hazards. Hardening means things like sealing basements against flooding, stronger roofs, better windows and cooling.","Nothing is paid out unless money is appropriated."],"ex":"A family in a flood prone neighborhood gets a grant to install a backwater valve and raise their furnace off the basement floor. The goal is fewer insurance claims and less damage. Made up example.","viz":{"kind":"flow","title":"Grant pilot","steps":["Fund is created","Money must be appropriated","Pilot opens by July 1, 2028","Homeowners get grants to harden homes"]},"states":[["Alabama","Strengthen Alabama Homes pays for roof and storm upgrades and gives insurance discounts, and the Illinois bill uses a similar name."],["Florida","My Safe Florida Home gives grants for hurricane hardening."]],"places":[["Chicago area","Basement flooding and heavy rain are the best known Illinois home risks."]],"news":[]},"ghg-delay":{"headline":"Push emissions deadlines for gas fired and cogeneration units back by ten years","bg":"CEJA requires gas fired large greenhouse gas emitting units and cogeneration units to cut to zero or reduced carbon on a schedule that runs through 2045. This bill moves each of those deadlines out by 10 years.","why":"It is one of several 2026 bills aiming to relax CEJA timelines, along with SB3929 and the battery threshold bills. Delay reduces near term retirement pressure on gas units and lowers the replacement capacity needed, but it also changes the state's clean energy trajectory.","q":["Which units does this extend and by how much","Does it affect gas units discussed in the CTG retirement debate"],"go":["ctg"],"plain":["CEJA requires gas fired units and cogeneration units to cut greenhouse gases to zero or a reduced carbon level on a schedule running through 2045. HB5538 moves every one of those deadlines out by ten years.","That gives plant owners more time and more emissions before they must change, and it is part of a family of bills on this list that revisit CEJA."],"ex":"A gas plant that had to hit its target in 2035 would now have until 2045. Over those ten extra years it keeps running with the current emissions level. Made up example.","viz":{"kind":"bars","title":"What a ten year push does","rows":[["Old deadline",2035.0],["New deadline under HB5538",2045.0]],"unit":"year, illustrative"},"states":[["Not common","Most states with clean power laws keep their dates fixed, though several have added reliability safety valves. Illinois legislators have also looked at 2060 versions in SB3929."]],"places":[["Illinois gas plants","CEJA covers large greenhouse gas emitting units and cogeneration units in Illinois."]],"news":[]},"warehouse":{"headline":"Pollution reduction rules for large warehouses","bg":"The Warehouse Pollution Reduction Act directs Illinois EPA and the Pollution Control Board to create a qualifying warehouse review program, with annual emissions reduction targets, a points system for mitigation measures, reporting and construction permits for new or modified qualifying warehouses.","why":"Warehouse mitigation measures often include rooftop solar, electric truck charging and electric loading equipment, so a points system could increase demand for utility interconnection and make ready work.","q":["Which warehouse size triggers the program","Do mitigation points favor onsite solar and charging"],"go":["policy"],"plain":["Warehouses draw hundreds of diesel truck trips a day, and the pollution lands on nearby homes. The Warehouse Pollution Reduction Act in HB5600 directs the Illinois EPA and the Pollution Control Board to create a review program for qualifying warehouses. The program sets annual emissions reduction targets, a points system for mitigation measures, reporting, and construction permits for new or changed qualifying warehouses.","A points system works like a menu. A warehouse picks measures such as electric yard trucks or solar panels until it reaches the required score."],"ex":"A new 1 million square foot warehouse needs a construction permit. To pass it picks measures worth enough points, such as charging for electric trucks, filtered air for nearby buildings and a tree buffer. A warehouse that picks nothing does not get its permit. Made up example.","viz":{"kind":"flow","title":"Points system","steps":["Qualifying warehouse","Pick mitigation measures","Add up points","Reach the required score","Permit"]},"states":[["California","The South Coast Air Quality Management District adopted an Indirect Source Rule for warehouses in 2021, and the state passed a warehouse siting law in 2024."],["New Jersey","Has also looked at warehouse siting and truck traffic."]],"places":[["Will County","Joliet, Elwood and nearby towns are among the busiest freight and warehouse hubs in the country, which is why the debate is so active there."],["Chicago Southeast Side","Truck traffic and industrial neighbors are a long running issue."]],"news":[]},"dark-sky":{"headline":"Require shielded, efficient outdoor lighting on state funded projects","bg":"The bill renames the Responsible Outdoor Lighting Control Act as the Dark Sky Act. From December 1, 2026, new or renovated luminaires bought or rented with state funds, and certain installed lighting, would have to meet shielding and efficiency rules.","why":"It affects streetlights and outdoor fixtures purchased with state money. It touches utilities where they own or maintain street and area lighting.","q":["Does it apply to utility owned street lighting"],"go":["policy"],"plain":["SB3037 renames the Responsible Outdoor Lighting Control Act as the Dark Sky Act. From December 1, 2026, new or renovated lights bought or rented with state money, and certain installed lighting, would have to be shielded and efficient. Shielded means the light shines down where it is needed rather than up into the sky or sideways into windows.","The aim is to cut wasted energy and light pollution. It affects state funded projects, not private homes."],"ex":"A state funded parking lot is repaved and new lights go in. Under the bill the lights must point downward and meet an efficiency standard, so the lot stays lit but the glow does not wash out the night sky. Made up example.","viz":{"kind":"vs","title":"Shielded vs unshielded light","sides":[{"h":"Unshielded","items":["Light goes up and sideways","Wastes energy","Glare for neighbors"]},{"h":"Shielded","items":["Light goes down","Same visibility with less power","Darker sky"]}]},"states":[["Arizona and others","Arizona, Colorado, Connecticut, Texas and other states have outdoor lighting laws, often tied to the International Dark Sky Association model. Check each one before quoting."],["Flagstaff","Became the first International Dark Sky City in 2001."]],"places":[["Illinois state parks and roads","State funded projects such as roads, buildings and parks are what the bill touches."]],"news":[]},"air-setbacks":{"headline":"Minimum distances between air pollution sources and homes, schools and hospitals","bg":"Illinois EPA would propose and the Pollution Control Board adopt rules ensuring mandatory minimum distances between air pollution sources and homes, schools, hospitals and similar sites in applicable Clean Air Act permits, except as federal law prohibits.","why":"Setback rules limit where new gas plants, compressors and backup generators can go. They could narrow site choices for peaking generation and for data center backup power.","q":["How large would the distances be","Which source categories are covered"],"go":["policy"],"plain":["A setback is a minimum distance. SB3245 would have the Illinois EPA propose and the Pollution Control Board adopt rules that require minimum distances between air pollution sources and homes, schools, hospitals and similar places in the permits issued under the Clean Air Act, unless federal law prohibits it.","Setbacks are common for oil wells and landfills. This bill would apply the idea to air polluters in general, so the details of the rules decide how big the effect is."],"ex":"A company wants to build a plant that emits fine particles. The rules say it must be at least a set distance from a school. If the only site available is closer, the permit is refused or the company moves. Made up example.","viz":{"kind":"flow","title":"How a setback works","steps":["Rule sets minimum distance","Permit application shows distance to homes and schools","Too close and the permit is denied or moved"]},"states":[["Colorado and Pennsylvania","Both have rules on how close oil and gas wells can be to homes and schools."],["Many states","Also require distances for landfills, quarries or hog confinement facilities."]],"places":[["Chicago and Illinois industrial corridors","Neighborhoods next to industrial areas raise the same question."]],"news":[]},"filing-fees":{"headline":"Let the Pollution Control Board change its own filing fees","bg":"The Pollution Control Board would be able to amend its filing fees by rulemaking, instead of fees being fixed in statute.","why":"Low consequence on its face. It affects the cost of filing petitions and variances before the Board.","q":["Is there a cap on increases"],"go":["policy"],"plain":["Right now the filing fees that people pay to bring cases to the Pollution Control Board are fixed in state law, so changing them takes a bill. SB3324 would let the Board change its own filing fees by writing a rule.","It is a housekeeping power. The practical question is whether future fees would go up and whether a fee could keep citizens from filing."],"ex":"If the Board needs more money for administration, it could raise the filing fee by rule after public comment instead of waiting for the legislature. Made up example.","viz":{"kind":"flow","title":"Who sets fees","steps":["Today the legislature amends the statute","Under SB3324 the Board sets fees by rulemaking"]},"states":[["General","Many agencies and boards set their fees by rule. I did not find a comparison that is specific to pollution control boards."]],"places":[["Springfield and Chicago","The Pollution Control Board hears cases and rules in both cities."]],"news":[]},"ghg-revert":{"headline":"Undo the greenhouse gas provisions added by CEJA","bg":"The bill reverts the greenhouse gas provisions of the Environmental Protection Act to their language before Public Act
