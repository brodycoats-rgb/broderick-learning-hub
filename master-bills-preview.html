chamber":"House","sponsor":"Lawrence Larry Walsh, Jr.","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Public Utilities (House)","Rules (House)"],"statutes":["220 ILCS 5/16-115"],"nStat":1,"amend":[],"summary":"Amends the Public Utilities Act. In provisions concerning the certification of alternative retail electric suppliers, provides that the alternative retail electric supplier shall publish notice of its application in the official State newspaper within 14 days (rather than 10 days) following the date of its filing. Provides that, no later than 60 days (rather than 45 days) after a complete application is properly filed with the Illinois Commerce Commission, and such notice is published, the Commission shall issue its order granting or denying the application. Provides that, in determining the level of technical, financial, and managerial resources and abilities which an applicant must demonstrate, the Commission shall consider the applicant's commitment of resources to the management of its sales and marketing staff through affirmative managerial policies, independent audits, technology, hands-on field monitoring, and training and, for applicants who have sales personnel or sales agents within the State, the applicant's managerial presence within the State. Provides that the Commission shall grant the application for a certificate of service authority if it finds, among other things, that the applicant will comply with all applicable federal, State, regional, and industry rules, policies, practices, procedures, and tariffs for the use, operation, and maintenance of the safety, integrity, and reliability, of the interconnected electric transmission system.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-04-17","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["SB3332"]},{"id":"HB4887","type":"HB","num":4887,"title":"Property-Energy Audits","raw":"PROPERTY-ENERGY AUDITS","theme":"Gas & building decarbonization","issue":"energy-audit","also":[],"chamber":"House","sponsor":"Barbara Hernandez","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Housing (House)"],"statutes":["20 ILCS 3125/15.1 new","765 ILCS 77/42 new"],"nStat":2,"amend":[],"summary":"Amends the Energy Efficient Building Act. Provides that each builder who completes construction on a newly constructed residential building in the State shall cause an energy audit to be completed on the building resulting in a Home Energy Rating System (HERS) Index Score. Amends the Residential Real Property Disclosure Act. Provides that, subject to certain exceptions, prior to the transfer of title of a dwelling, the seller shall obtain an energy audit resulting in a Home Energy Rating System (HERS) Index Score of the dwelling. Effective immediately.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"HB4910","type":"HB","num":4910,"title":"Clean Energy-Workforce Hubs","raw":"CLEAN ENERGY-WORKFORCE HUBS","theme":"Workforce, labor & tax incentives","issue":"workforce-hubs","also":[],"chamber":"House","sponsor":"Lisa Davis","party":"D","cos":["Representative Michael Crawford (D)"],"nCos":1,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["20 ILCS 730/5-20"],"nStat":1,"amend":[],"summary":"Amends the Energy Transition Act. Provides that the Clean Jobs Workforce Hubs Network shall incorporate targeted outreach, recruitment, training, and placement services specifically for participants seeking careers within the climate, environmental, and clean energy sector. Defines\"climate, environmental, and clean energy sector\". Provides that the Department of Commerce and Economic Opportunity shall collect, track, and report certain information concerning the Clean Jobs Workforce Network Program. Provides that the information shall be disaggregated by race, gender, geography, and equity status.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["SB3927"]},{"id":"HB4921","type":"HB","num":4921,"title":"Muni Code-Commercial Operations","raw":"MUNI CD-COMMERCIAL OPERATIONS","theme":"Transmission, siting & land","issue":"muni-commercial","also":[],"chamber":"House","sponsor":"Martha Deuter","party":"D","cos":["Representative Barbara Hernandez (D)","Senator Mary Edly-Allen (D)"],"nCos":2,"bip":false,"committees":["Rules (House)","Assignments (Senate)","Cities & Villages (House)"],"statutes":["65 ILCS 5/11-42-10.3 new"],"nStat":1,"amend":[],"summary":"Amends the Illinois Municipal Code. Provides that the corporate authorities of a municipality may license and regulate all commercial operations within the municipality's boundaries, whether for profit or not for profit, but may not impose any tax upon their operations except as otherwise authorized by law. Limits the definition of\"commercial operations\" to exclude agritourism operations, agricultural properties, agribusinesses, agritourism activities, agricultural experiences, and pollution control facilities.","last":"Referred to Assignments","lastDate":"2026-04-14","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":[]},{"id":"HB4938","type":"HB","num":4938,"title":"Prevailing Wage-Various","raw":"PREVAILING WAGE-VARIOUS","theme":"Workforce, labor & tax incentives","issue":"prevailing-multi","also":[],"chamber":"House","sponsor":"Jay Hoffman","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Labor & Commerce (House)","Rules (House)"],"statutes":["820 ILCS 130/11from Ch. 48, par. 39s-11","820 ILCS 130/2.2 new","820 ILCS 130/2.3 new","820 ILCS 130/5.1"],"nStat":4,"amend":[],"summary":"Amends the Prevailing Wage Act. Provides that, if a laborer, mechanic, or other worker, to whom the prevailing rate of wages is required to be paid, is classified in 2 or more trade titles for any amount of time during a day on which the individual is employed on a public works project, the individual shall receive the prevailing rate of wages that is the highest among those trade titles for all hours worked that day. Provides that a laborer, mechanic, or other worker, to whom the prevailing wage is required to be paid, may be paid at an apprentice rate of pay if the laborer is enrolled in an apprenticeship and training program. Provides for the withholding of payments for violations of the Act. Makes other changes. Effective immediately.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"HB4940","type":"HB","num":4940,"title":"Utility-IPA Procurement","raw":"UTILITY-IPA PROCUREMENT","theme":"Retail choice & procurement","issue":"ipa-database","also":[],"chamber":"House","sponsor":"Jay Hoffman","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["20 ILCS 3855/1-75","220 ILCS 81/4-20","30 ILCS 500/20-10","30 ILCS 708/50"],"nStat":4,"amend":[],"summary":"Amends the Illinois Power Agency Act and the Broadband Infrastructure Advancement Act. Provides that the Illinois Power Agency and the Department of Commerce and Economic Opportunity, respectively, shall create a specific Database and may contract with a third-party database program administrator to do so. Provides that, if the Agency or Department decides to contract with a third-party database program administrator, the third-party database program administrator shall be exempt from certain requirements in the Illinois Procurement Code. Provides that the specific Database shall be a searchable database of awardees, contractors, developers, suppliers, vendors, and subcontractors for certain projects or providers that is: (i) publicly accessible; (ii) easy for people to find and use; (iii) organized by company specialty or field; (iv) region-specific; and (v) populated with information that includes, but is not limited to, project names, project size, contact information, including the addresses, phone numbers, and email addresses of suppliers, vendors, or subcontractors who participate or have participated in any of the programs described in the respective Act, and the current status of such projects. Provides that a posting on the specific Database shall be made by the applicable developer prior to the start of work on a project. Requires developers to provide regular updates on the status of such projects until a project's completion. Amends the Illinois Procurement Code. In provisions concerning competitive sealed bidding, provides that public notice of an invitation for bids shall be published in the Illinois Procurement Bulletin and in the BidBuy eProcurement System at least 14 calendar days before the date set in the invitation for the opening of bids. Provides that the Director of the Illinois Power Agency may create alternative bidding procedures to procure renewable energy resources smaller than 1,000 kilowatts (rather than to procure renewable energy resources) under certain provisions of the Illinois Power Agency Act. Makes other changes. Effective immediately.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":[]},{"id":"HB4942","type":"HB","num":4942,"title":"Work Comp-Surcharges & Fees","raw":"WORK COMP-SURCHARGES & FEES","theme":"Workforce, labor & tax incentives","issue":"workcomp-fees","also":[],"chamber":"House","sponsor":"Jay Hoffman","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Labor & Commerce (House)","Rules (House)"],"statutes":["215 ILCS 5/416","820 ILCS 305/4d","820 ILCS 305/7"],"nStat":3,"amend":[],"summary":"Amends the Illinois Insurance Code and the Workers' Compensation Act. Provides for increases in the rate of the Illinois Workers' Compensation Commission Operations Fund Surcharge, the Illinois Workers' Compensation Commission Operations Fund Fee, and payments to the Rate Adjustment Fund. Effective immediately.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-04-17","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"HB4956","type":"HB","num":4956,"title":"Loc Gov-Energy Storage Systems","raw":"LOC GOV-ENERGY STORAGE SYSTEMS","theme":"Solar, storage & distributed energy","issue":"storage-farmland","also":[],"chamber":"House","sponsor":"Steven Reick","party":"R","cos":["Representative Joe C. Sosnowski (R)","Representative Nicolle Grasse (D)","Representative Jason Bunting (R)","Representative Tony M. McCombie (R)"],"nCos":4,"bip":true,"committees":["Rules (House)"],"statutes":["505 ILCS 147/10","505 ILCS 147/15","55 ILCS 5/5-12024"],"nStat":3,"amend":[],"summary":"Amends the Counties Code. In provisions concerning energy storage systems, provides that the farmland drainage plan that a facility owner must file with a county shall include, among other things, plans to repair any subsurface drainage affected during construction or deconstruction using procedures outlined in the agricultural impact mitigation agreement (rather than outlined in the decommissioning plan) and procedures for the repair and restoration of surface drainage affected during construction or deconstruction. Provides that a county shall (rather than may) require a facility owner to provide a decommissioning plan to the county. Makes changes to the requirements of a decommissioning plan. Provides that a county shall (rather than may) require the facility owner to submit to the county (i) a commercial operation a commissioning report meeting specified requirements of specified publications of the National Fire Protection Association; (ii) a hazard mitigation analysis meeting specified requirements of specified publications of the National Fire Protection Association; (iii) an emergency operations plan meeting specified requirements of specified publications of the National Fire Protection Association; and (iv) a warning that complies with specified publications of the National Fire Protection Association. Provides that the energy storage system owner shall enter into one agricultural impact mitigation agreement for each energy storage system. Requires the agricultural impact mitigation agreement for an energy storage system to include specified plans. Requires a commercial renewable energy facility owner to make available a copy of the signed agricultural impact mitigation agreement at the site of the commercial renewable energy facility during any construction or deconstruction activities. Makes other changes.","last":"Referred to Rules Committee","lastDate":"2026-02-06","lastChamber":"House","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":["SB3078","SB3409"]},{"id":"HB4989","type":"HB","num":4989,"title":"Data Center Heating/Cooling","raw":"DATA CENTER HEATING/COOLING","theme":"Data centers & large load","issue":"dc-heat","also":[],"chamber":"House","sponsor":"Kimberly Du Buclet","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)"],"statutes":["New Act"],"nStat":1,"amend":[],"summary":"Creates the Data Center Heating and Cooling Act. Defines\"air to water heat exchanger\" and\"data center\". Provides that any new or existing data center in the State shall adopt a heat energy reuse plan that involves the use of an air to water heat exchanger to help heat homes and businesses in the area around the data center. Provides that any data center constructed on or after the effective date of the Act that has an aggregate demand load of 20 megawatts or more shall have a liquid cooling system, such as direct-to-chip cooling or immersion cooling, incorporated into the data center. Effective January 1, 2027.","last":"Referred to Rules Committee","lastDate":"2026-02-06","lastChamber":"House","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":[]},{"id":"HB4994","type":"HB","num":4994,"title":"CDB-Stretch Energy Code","raw":"CDB-STRETCH ENERGY CODE","theme":"Gas & building decarbonization","issue":"stretch-code","also":[],"chamber":"House","sponsor":"Robyn Gabel","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["20 ILCS 3125/55"],"nStat":1,"amend":[],"summary":"Amends the Energy Efficient Building Act. Provides that municipalities and counties (instead of municipalities only) may adopt the Illinois Stretch Energy Code.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":[]},{"id":"HB4995","type":"HB","num":4995,"title":"Electric Transmission Siting","raw":"ELECTRIC TRANSMISSION SITING","theme":"Transmission, siting & land","issue":"tx-siting","also":[],"chamber":"House","sponsor":"Robyn Gabel","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["220 ILCS 33/5-10","220 ILCS 5/16-107.6","220 ILCS 5/16-107.9","415 ILCS 5/9.15","New Act"],"nStat":5,"amend":[],"summary":"Creates the Electric Transmission Facilities Siting Act. Defines terms. Requires that, in the siting of new electric transmission facilities, available corridors be used in the following order of priority: (1) existing public utility corridors; (2) highway corridors; and (3) new corridors. Provides that a public utility or developer may construct, place, or maintain a high-voltage electric service line on a public right-of-way or along a highway if (i) the public utility or developer submits a colocation request for the high-voltage electric service line to the Secretary of Transportation and (ii) the Secretary reviews and approves the colocation request. Requires a public utility or developer to develop a constructability report in consultation with the Department of Transportation and requires the public utility or developer and the Department to follow the terms and conditions of the constructability report during the planning and approval process for the siting of a high-voltage electric service line. Sets forth requirements for the content of the constructability report. Amends the Public Utilities Act. In provisions concerning distributed generation rebates, provides that the owner or operator of distributed generation that, before January 1, 2025 (rather than before the threshold date), is eligible for net metering under the Act may apply for a base rebate for an associated energy storage device behind the same retail customer meter as the distributed generation, regardless of whether the distributed generation applies for a rebate for the distributed generation device. Provides that, after the threshold date, a stand-alone energy storage system that is neither paired with distributed generation nor with any electric load beyond the electric load that is used by the energy storage system itself (rather than a stand-alone energy storage system) shall be compensated with a rebate of $250 per kilowatt-hour of nameplate capacity. Amends the Environmental Protection Act. In provisions concerning greenhouse gases, provides that the Environmental Protection Agency and the Illinois Power Agency shall file a plan to reduce or delay certain emissions reductions requirements with the Illinois Commerce Commission for review in conjunction with the integrated resource plan under certain provisions of the Public Utilities Act. Makes other changes. Effective immediately.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-04-17","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB4803","SB2808"]},{"id":"HB4996","type":"HB","num":4996,"title":"Utilities-Various","raw":"UTILITIES-VARIOUS","theme":"Utility rates, cost recovery & regulation","issue":"vpp","also":[],"chamber":"House","sponsor":"Robyn Gabel","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["20 ILCS 3855/1-10","220 ILCS 5/16-107.6","220 ILCS 5/16-107.9","220 ILCS 5/20-140","220 ILCS 5/23-115","55 ILCS 5/5-12020"],"nStat":6,"amend":[],"summary":"Amends the Public Utilities Act. In provisions concerning virtual power plant programs, provides that, in setting the values of upfront payment and performance payment compensation under the provisions, the Illinois Commerce Commission shall set values for eligible systems that include energy storage that are, taking into account the time value of money, not less than: (A) for an eligible system that did not receive and agrees not to apply for a rebate for its storage component under specified provisions, $250 per kilowatt-hour nameplate capacity paid on the date the system is placed in service; or (B) for an eligible system that received a rebate for its storage component under specified provisions, $0 per kilowatt-hour. Provides that, to facilitate adoption and participation, a utility must allow and enable participating customers to expeditiously share their customer information with aggregators to serve customers and comply with any reporting requirements. In provisions concerning distributed generation and storage rebates, provides that, until the later of December 31, 2029 or the threshold date (rather than until December 31, 2029), the value of specified rebates shall be $300 per kilowatt of nameplate generating capacity, measured as nominal DC power output, of the distributed generation. Amends the Counties Code. In provisions concerning setback distances for commercial wind energy facilities or commercial solar energy facilities, specifies that the ability of a county to require a reasonable setback distance between fencing and public rights-of-way if the requirement is not specific to commercial wind energy facilities or commercial solar energy facilities and does not preclude the development of commercial wind energy facilities or commercial solar energy facilities or the ability of commercial wind energy facilities or commercial solar energy facilities to comply with the requirements set forth in the provisions shall not exceed 50 feet between fencing and public rights-of-way. Amends the Illinois Power Agency Act. Provides that a\"community renewable generation project\" means an electric generating facility that, among other things, is limited in nameplate capacity to less than or equal to 5,000 kilowatts (rather than 10,000 kilowatts). Makes other changes.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["SB3922"]},{"id":"HB5049","type":"HB","num":5049,"title":"Loc Gov-Residential Energy","raw":"LOC GOV-RESIDENTIAL ENERGY","theme":"Gas & building decarbonization","issue":"res-backup","also":[],"chamber":"House","sponsor":"Ann M. Williams","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["55 ILCS 5/5-46005","55 ILCS 5/5-46025","55 ILCS 5/5-46030 new","65 ILCS 5/11-15.5-25","65 ILCS 5/11-15.5-30 new","65 ILCS 5/11-15.5-5"],"nStat":6,"amend":[],"summary":"Amends the Counties Code and the Illinois Municipal Code. Provides that a county or a municipality may not adopt or enforce an ordinance, rule, or other measure that would regulate the installation or inspection of a residential energy backup system, including on a building with a shared roof. Defines\"residential energy backup system\". Effective June 1, 2026.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["SB3794"]},{"id":"HB5070","type":"HB","num":5070,"title":"EPA-Federal Backstop","raw":"EPA-FEDERAL BACKSTOP","theme":"Environment, climate & EPA","issue":"anti-backsliding","also":[],"chamber":"House","sponsor":"Theresa Mah","party":"D","cos":["Representative Janet Yang Rohr (D)","Senator Laura Ellman (D)","Senator Adriane Johnson (D)","Senator Mary Edly-Allen (D)"],"nCos":4,"bip":false,"committees":["Rules (House)","Assignments (Senate)","Energy & Environment (House)"],"statutes":["415 ILCS 5/10from Ch. 111 1/2, par. 1010","415 ILCS 5/13from Ch. 111 1/2, par. 1013","415 ILCS 5/17.5from Ch. 111 1/2, par. 1017.5","415 ILCS 5/17from Ch. 111 1/2, par. 1017","415 ILCS 5/22.40","415 ILCS 5/22.4from Ch. 111 1/2, par. 1022.4"],"nStat":6,"amend":["House Amendment 002","House Amendment 001"],"summary":"Amends the Environmental Protection Act. In provisions concerning the regulation of air pollution, water pollution, drinking water, hazardous waste, and landfills, provides that the Illinois Pollution Control Board shall not adopt any standards that are less stringent than those existing in Board regulations. Provides that various provisions of the Act shall not be construed to limit the right of a person to submit to the Board, or for the Board to adopt, regulations more stringent than the regulations promulgated by the Administrator of the United States Environmental Protection Agency.","last":"Passed Both Houses","lastDate":"2026-05-14","lastChamber":"House","stage":"Passed both houses","stageLabel":"Passed both houses","stageNote":"Both chambers approved the same text","passed":true,"rtc":false,"pair":[]},{"id":"HB5194","type":"HB","num":5194,"title":"Income Tax-Energy Choice","raw":"INC TAX-ENERGY CHOICE","theme":"Retail choice & procurement","issue":"energy-choice-credit","also":[],"chamber":"House","sponsor":"Lawrence Larry Walsh, Jr.","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Revenue & Finance (House)"],"statutes":["35 ILCS 5/246 new"],"nStat":1,"amend":[],"summary":"Amends the Illinois Income Tax Act. Provides that a qualified taxpayer may apply to the Department of Revenue for an income tax credit in an amount equal to 20% of the wages paid by the qualified taxpayer to a qualified energy choice worker based in Illinois in the taxable year. Provides that the term\"qualified taxpayer\" means a taxpayer that is a regulated utility in the State of Illinois or a power generating company providing baseload or intermediate generation in Illinois and that meets specified criteria and is able to demonstrate an adverse and material operational impact to either its overall Illinois-based workforce or its ability to conduct business in Illinois based on the scheduled phaseout target dates of 2030, 2035, 2040, and 2045, as provided in Public Act 102-662. Sets forth limitations on the amount of the credit. Effective immediately.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["SB3665"]},{"id":"HB5195","type":"HB","num":5195,"title":"DCEO-Energy Choice","raw":"DCEO-ENERGY CHOICE","theme":"Retail choice & procurement","issue":"energy-choice-commission","also":[],"chamber":"House","sponsor":"Lawrence Larry Walsh, Jr.","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["20 ILCS 605/605-1119 new"],"nStat":1,"amend":["House Amendment 001"],"summary":"Amends the Department of Commerce and Economic Opportunity Law of the Civil Administrative Code of Illinois. Creates the Illinois Future of Energy Choice and Economic Impact Commission. Sets forth the membership of the Commission. Provides that the Commission has certain duties with respect to energy policy. Effective immediately.","last":"House Floor Amendment No. 1 Rule 19(c) / Re-referred to Rules Committee","lastDate":"2026-04-17","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["SB3664"]},{"id":"HB5221","type":"HB","num":5221,"title":"Consumer Data Privacy Act","raw":"CONSUMER DATA PRIVACY ACT","theme":"Technology, privacy & communications","issue":"data-privacy","also":[],"chamber":"House","sponsor":"Edgar Gonzalez, Jr.","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Cybersecurity, Data Analytics, & IT (House)"],"statutes":["5 ILCS 140/7.5","New Act"],"nStat":2,"amend":[],"summary":"Creates the Consumer Data Privacy Act. Sets forth provisions concerning agreements between personal data processors and controllers. Provides for consumer personal data rights, including the right to opt out of the processing of personal data concerning the consumer for purposes of targeted advertising, the sale of personal data, or profiling in furtherance of automated decisions that produce legal effects. Sets forth provisions concerning the responsibilities of controllers; requirements for small businesses; and data privacy and protection assessments. Provides for civil penalties. Preempts home rule. Amends the Freedom of Information Act to make a conforming change. Effective January 1, 2027.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["SB2875","SB3548","SB3890"]},{"id":"HB5275","type":"HB","num":5275,"title":"Drone Safety & Interference","raw":"DRONE SAFETY & INTERFERENCE","theme":"Technology, privacy & communications","issue":"drone","also":[],"chamber":"House","sponsor":"Angelica Guerrero-Cuellar","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Judiciary - Criminal (House)"],"statutes":["New Act"],"nStat":1,"amend":["House Amendment 001"],"summary":"Creates the Drone Safety and Interference Prevention Act. Creates the offenses of (1) unlawful imaging of an emergency response activity; (2) unlawful operation over critical infrastructure facilities; and (3) unlawful operation of a drone over a correctional institution or facility. Defines these offenses and establishes penalties. Provides that a private person or entity operating a drone in the State is prohibited from equipping or using on the drone any firearm, weaponized laser, kinetic impact projectile, chemical agent or irritant, or any other lethal or non-lethal weapon. Provides that a law enforcement officer may seize a drone and any attached equipment, including any image-capturing devices, storage media, or weapons, if the officer has probable cause to believe the drone was used or operated in violation of the Act. Provides that any drone or equipment seized under the Act is subject to forfeiture in accordance with the Criminal Code of 2012 and the Forfeiture Article of the Code of Criminal Procedure of 1963, as applicable. Provides that the State may use forfeited drones and equipment for law enforcement purposes, including training and counter-drone operations. Provides that prior to forfeiture, the court shall provide notice and an opportunity for hearing to the owner or operator of the drone, unless the drone was abandoned or unclaimed. Provides that, if the court determines, by a preponderance of the evidence, that the drone was used in violation of the Act, the drone shall be forfeited to the State. Provides that any images or data seized under the provision shall be retained only if there is a reasonable suspicion they contain evidence of a crime. Provides that all other data must be deleted within 30 days unless relevant to an ongoing investigation. Provides that the State, any unit of local government, any law enforcement agency or any officers or agents of those entities that are acting reasonably and in good faith to enforce the Act are not civilly liable for damage to or loss of a drone, except for willful or wanton misconduct. Provides that the Act shall be enforced by State and local law enforcement agencies. Provides that enforcement data under the Act shall be reported through the Illinois State Police's existing Uniform Crime Reporting program. Contains a severability provision. Effective January 1, 2027.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-04-17","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["SB3930"]},{"id":"HB5366","type":"HB","num":5366,"title":"EPA-Appliance Standards","raw":"EPA-APPLIANCE STANDARDS","theme":"Environment, climate & EPA","issue":"appliance-standards","also":[],"chamber":"House","sponsor":"Eva-Dina Delgado","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["New Act"],"nStat":1,"amend":[],"summary":"Creates the Illinois Appliance Standards Act. Directs the Illinois Environmental Protection Agency to adopt minimum efficiency standards for covered products. Provides for testing, certification, and labeling of covered products. Contains provisions concerning enforcement of the Act's requirements. Provides for administrative rulemaking by the Agency. Makes findings. Defines terms.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-04-17","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":[]},{"id":"HB5374","type":"HB","num":5374,"title":"EPA-Environmental Justice","raw":"EPA-ENVIRONMENTAL JUSTICE","theme":"Environment, climate & EPA","issue":"ej-permits","also":[],"chamber":"House","sponsor":"Diane Blair-Sherlock","party":"D","cos":["Representative Michelle Mussman (D)","Representative Lilian Jim\u00e9nez (D)","Representative Kelly M. Cassidy (D)","Representative Laura Faver Dias (D)","Representative Mary Beth Canty (D)"],"nCos":5,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["415 ILCS 155/18 new","415 ILCS 5/39.16 new"],"nStat":2,"amend":[],"summary":"Amends the Environmental Protection Act. Makes findings about the imposition of disproportionate and adverse effects on communities in areas of environmental justice concern. Defines terms. Applies to the following permits for which an owner or operator applies on or after January 1, 2026: (1) a construction permit for a new source that is to be located in an area of environmental justice concern and that is required to obtain from the Agency a CAAPP permit or a Federally Enforceable State Operating Permit; (2) a construction permit for any existing source that is located in an area of environmental justice concern, that possesses a CAAPP permit or a Federally Enforceable State Operating Permit issued by the Agency, and that seeks an increase in annual permitted emissions; or (3) a construction permit for any existing source that is located in an area of environmental justice concern, that seeks an increase in annual permitted emissions, and that will for the first time require a new CAAPP permit or a Federally Enforceable State Operating Permit issued by the Agency. Requires the Environmental Protection Agency to evaluate the application for affects on environmental justice and may suggest additional testing or changes in the application. Requires that the Agency to conduct an evaluation of the prospective owner's or operator's prior experience in owning and operating sources of air pollution before it may issue a construction permit. Makes other changes. Creates the Office of Environmental Justice within the Environmental Protection Agency. Effective immediately.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["SB3772"]},{"id":"HB5388","type":"HB","num":5388,"title":"Solar Energy Checkoff Program","raw":"SOLAR ENERGY CHECKOFF PROGRAM","theme":"Solar, storage & distributed energy","issue":"solar-checkoff","also":[],"chamber":"House","sponsor":"Ann M. Williams","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)"],"statutes":["30 ILCS 105/5.1038 new","New Act"],"nStat":2,"amend":[],"summary":"Creates the Solar Energy Reliability and Affordability Checkoff Program Act. Sets forth findings. Defines terms. Creates the Solar Energy Reliability and Affordability Fund. Provides that the Fund may receive deposits of moneys collected by the Department of Agriculture under provisions of the Act concerning the collection of solar energy fees. Creates the Solar Energy Reliability and Affordability Board appointed by the Governor to administer and manage the Fund. Sets forth membership requirements of the Board. Provides that the Board shall ensure that assessments collected under the Act are used for the creation and publication of research, communication, marketing, and education programs that promote accurate information related to, emphasize the clean energy benefits and affordability of, and promote the adoption of solar energy systems and energy storage systems, which may include the funding of third-party organizations for these purposes and any related activities to carry out the programs as proposed by the Board. Requires each owner, operator, or developer of a solar energy system to pay a 2 cents per watt assessment on all solar energy systems sold for installation within the State to the Department of Agriculture. Provides that assessments are payable directly to the Board and shall be paid when a commercial renewable energy facility owner enters into an agricultural impact mitigation agreement as required under the Renewable Energy Facilities Agricultural Impact Mitigation Act. Requires the Board to publish an annual financial and activities report. Amends the State Finance Act to create the Solar Energy Reliability and Affordability Fund as a special fund in the State treasury. Effective immediately.","last":"Referred to Rules Committee","lastDate":"2026-02-10","lastChamber":"House","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":["SB3711"]},{"id":"HB5402","type":"HB","num":5402,"title":"Solar Energy-Shared Roofs","raw":"SOLAR ENERGY-SHARED ROOFS","theme":"Solar, storage & distributed energy","issue":"shared-roof","also":[],"chamber":"House","sponsor":"Daniel Didech","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)"],"statutes":["765 ILCS 165/15","765 ILCS 165/45"],"nStat":2,"amend":[],"summary":"Amends the Homeowners' Energy Policy Statement Act. Provides that the Act applies to any building with a shared roof if (1) a solar energy system is located entirely within that portion of the shared roof owned and maintained by the property owner or (2) all property owners sharing the shared roof agree to install a solar energy system. Provides that the governing entity of a homeowners' association, common interest community association, or condominium unit owners' association may adopt for those buildings with a shared roof that are under its control and that are subject to the Act bylaws or other requirements that set standards regarding the installation, maintenance, and use of solar energy systems, including, but not limited to, regulations that require the governing entity to approve the vendor that will supply, install, or maintain the solar energy system and regulations that grant vendors exclusive rights to perform those functions. Provides that, when exercising powers over properties with shared roofs, a governing entity must act solely in the collective interest of the members of the association; must cooperate with property owners interested in installing, maintaining, or using a solar energy system on property under their ownership or control; and must not delay any request for a decision involving the installation, maintenance, or use of a solar energy system by an association member for more than 60 days. Provides that the failure of a governing entity to comply with these provisions renders voidable any bylaw or other requirement adopted by the governing authority pursuant to the provisions of the amendatory Act.","last":"Referred to Rules Committee","lastDate":"2026-02-13","lastChamber":"House","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":["SB2785"]},{"id":"HB5429","type":"HB","num":5429,"title":"District Energy Storage","raw":"DISTRICT ENERGY STORAGE","theme":"Solar, storage & distributed energy","issue":"district-energy","also":[],"chamber":"House","sponsor":"Jay Hoffman","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["20 ILCS 3501/801-40","20 ILCS 3855/1-10","20 ILCS 3855/1-79 new","20 ILCS 605/605-1006 new","20 ILCS 605/605-106 new","20 ILCS 605/6-1011 new","220 ILCS 5/16-107.9","220 ILCS 5/8-104.5 new","30 ILCS 500/20-61 new","30 ILCS 500/20-66 new","35 ILCS 105/3-5","35 ILCS 110/3-5","35 ILCS 115/3-5","35 ILCS 120/2-5","35 ILCS 200/18-176 new","New Act"],"nStat":16,"amend":[],"summary":"Creates the District Energy and Thermal Energy Storage Parity Act. Provides that the Illinois Commerce Commission, in consultation with Environmental Protection Agency, shall establish an optional certification process for Qualified District Energy Infrastructure. Requires the Environmental Protection Agency to establish a grant program to support certain projects. Provides that, within 180 days after the effective date of the Act, the Commission shall initiate a docketed proceeding to develop standardized thermal service agreement templates, suitable for developer financing and underwriting, and minimum requirements for customer rate stabilization options. Provides that a developer shall obtain a District Energy Feasibility Assessment from a qualified preparer for certain projects. Sets forth requirements for the content of the District Energy Feasibility Assessment. Amends the Department of Commerce and Economic Opportunity Law of the Civil Administrative Code of Illinois. Requires the Department to develop and make available to units of local government a municipal alignment toolkit to facilitate the development and expansion of district energy systems. Requires the Department to establish and administer a district energy expansion program to support the development expansion, modernization, and decarbonization of district energy systems in the State. Amends the Illinois Finance Authority Act. Provides that the Authority may provide loans, credit enhancements, interest rate buydowns, loan loss reserves, or other financial assistance for the development, construction, expansion, or operation of the Qualified Energy Infrastructure and Dispatchable Thermal Energy Storage. Amends the Illinois Power Agency Act. Creates the Thermal Energy Storage Credit procurement program. Sets forth requirements for the program. Amends the Illinois Procurement Code. Sets forth provisions concerning district energy evaluation in State procurements. Amends the Use Tax Act, the Service Use Tax Act, the Service Occupation Tax Act, and the Retailers' Occupation Tax Act. Makes changes in provisions concerning exemptions. Amends the Property Tax Code. Defines\"commercial energy storage system\". Amends the Public Utilities Act. Sets forth provisions concerning district energy enabling measures and heat recovery incentives. Makes other changes.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["SB4020"]},{"id":"HB5438","type":"HB","num":5438,"title":"Brownfield Photovoltaic Regs","raw":"BROWNFIELD PHOTOVOLATIC REGS","theme":"Transmission, siting & land","issue":"brownfield-pv","also":[],"chamber":"House","sponsor":"Jay Hoffman","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["20 ILCS 3855/1-10","20 ILCS 655/5.5from Ch. 67 1/2, par. 609.1"],"nStat":2,"amend":[],"summary":"Amends the Illinois Enterprise Zone Act. In provisions concerning High Impact Businesses, adds utility-scale brownfield site photovoltaic projects and over 5,000 kilowatts and utility-scale solar projects to High Impact Businesses that may be located, at the time of designation, in an enterprise zone. Amends the Illinois Power Agency Act. Provides that\"brownfield site photovoltaic project\" includes photovoltaics that are interconnected to an electric utility, a municipal utility, a public utility, or an electric cooperative, where at least 50% of the acreage occupied by the photovoltaics is located on the property regulated under specified United States Environmental Protection Agency or Illinois Environmental Protection Agency programs. Makes other changes","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":[]},{"id":"HB5440","type":"HB","num":5440,"title":"Energy Storage Revenue Bonds","raw":"ENERGY STORAGE REVENUE BONDS","theme":"Solar, storage & distributed energy","issue":"storage-bonds","also":[],"chamber":"House","sponsor":"Ryan Spain","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)"],"statutes":["20 ILCS 3501/801-40","20 ILCS 3501/825-65","20 ILCS 3855/1-75","220 ILCS 5/16-107.6","220 ILCS 5/8-507.5 new","415 ILCS 5/9.15 rep."],"nStat":6,"amend":[],"summary":"Amends the Illinois Finance Authority Act. Provides that the Illinois Finance Authority shall have power to issue revenue bonds for energy storage projects that seek State-level energy storage credits or utility cost recovery. Provides that the Authority shall coordinate with the Illinois Power Agency to ensure that the financing terms of the revenue bonds are structured to minimize costs to State ratepayers. In provisions concerning Clean Coal, Coal, Energy Efficiency, PACE, and Renewable Energy Project financing, provides that bonds issued by the Authority shall be limited obligations of the Authority and payable solely from the revenues and receipts derived from the energy storage projects for which the bonds are issued. Requires the bonds to contain on their face a certain statement. Amends the Illinois Power Agency Act. In provisions concerning the Planning and Procurement Bureau, provides that an energy storage project shall not be eligible for the procurement of energy storage credits under provisions concerning the equity accountability system unless the owner or developer of the energy storage project demonstrates, as a condition of bid eligibility, that the energy storage project's long-term debt financing is secured through bonds issued by the Authority. Provides that the Agency shall not execute any procurement plan or enter into contracts for energy storage or renewable energy credits that would result in the average retail customer's bill exceeding cost-control caps set forth in certain provisions of the Public Utilities Act, unless the excess amount is approved by the General Assembly. Amends the Public Utilities Act. Requires the Illinois Commerce Commission to conduct an annual Energy Affordability and Rate Impact Study. Sets forth requirements for the content of the Study. In provisions concerning distributed generation rebates, provides that, if a Multi-Year Integrated Grid Plan or any subsequent integrated resource plan submitted by a utility or the Commission includes a proposal to increase, suspend, or otherwise exceed any existing statutory rate caps or cost-control benchmarks in certain provisions of the Act, such adjustment shall not take effect unless specifically approved by a joint resolution of the General Assembly. Amends the Environmental Protection Act by repealing provisions concerning greenhouse gases. Makes other changes. Effective immediately.","last":"Referred to Rules Committee","lastDate":"2026-02-13","lastChamber":"House","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":["SB3705"]},{"id":"HB5453","type":"HB","num":5453,"title":"EPA-CCR Management","raw":"EPA-CCR MANAGEMENT","theme":"Environment, climate & EPA","issue":"ccr","also":[],"chamber":"House","sponsor":"Carol Ammons","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["415 ILCS 5/22.59","415 ILCS 5/3.144 new"],"nStat":2,"amend":[],"summary":"Amends the Environmental Protection Act. Defines\"CCR management unit\" as any area of land at any facility with a CCR surface impoundment, on which any noncontainerized accumulation of CCR is received, is placed, or is otherwise managed, and that is not itself a CCR surface impoundment. Provides that the term\"CCR management unit\" does not include CCR used in a manner that meets the definition of coal combustion by-product, unless the owner or operator, or the Agency, determines that the CCR is causing or contributing to a statistically significant concentration of one or more constituents above the groundwater protection standard established by the Board. Provides that no later than February 8, 2027, the owner or operator of a CCR surface impoundment must submit to the Agency a copy of the Facility Evaluation Reports Part 1 and 2. Provides that the Board shall adopt rules establishing permit requirements, reporting, financial assurance, and closure and post-closure care requirements for CCR management units. Provides that the owner or operator of a CCR management unit shall pay an initial fee of $75,000 for each CCR management unit by July 1, 2027 and an annual fee of $25,000 for each CCR management unit that has not completed closure; and $15,000 for each CCR management unit that has not completed post-closure care, beginning July 1, 2028.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["SB1436"]},{"id":"HB5459","type":"HB","num":5459,"title":"Solar Energy-Various","raw":"SOLAR ENERGY-VARIOUS","theme":"Solar, storage & distributed energy","issue":"cs-colocation","also":[],"chamber":"House","sponsor":"Lawrence Larry Walsh, Jr.","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["20 ILCS 3855/1-75","20 ILCS 730/5-40"],"nStat":2,"amend":["House Amendment 001"],"summary":"Amends the Illinois Power Agency Act. In provisions concerning colocation of photovoltaic community renewable generation projects, changes references from\"community renewable generation project\" to\"photovoltaic community renewable generation project\" and\"community solar projects\" to\"photovoltaic community renewable generation projects\". Requires a project labor agreement for the new construction of certain facilities related to community-driven community solar projects. In a provision applying prevailing wage requirements to facilities for which a renewable energy credit delivery contract is signed, removes an exception for multi-family residential buildings with aggregate geothermal system tonnage, including colocated projects, of no more than 29 tons. Amends the Energy Transition Act. Provides that the Department of Corrections and the Department of Commerce and Economic Opportunity shall jointly develop activities to support the recruitment of eligible candidates to the Illinois Climate Works Preapprenticeship Program. Provides that the activities shall include coordinating on sharing with community-based providers the contact information of persons preparing to be released into the community, including names, addresses, phone numbers, and email addresses, if the person preparing to be released consents to the person's contact information being shared. Makes other changes.","last":"House Committee Amendment No. 1 Rule 19(c) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["SB4039"]},{"id":"HB5470","type":"HB","num":5470,"title":"DCEO-Various","raw":"DCEO-VARIOUS","theme":"Workforce, labor & tax incentives","issue":"dceo-various","also":[],"chamber":"House","sponsor":"Yolonda Morris","party":"D","cos":["Representative Sharon Chung (D)","Representative Gregg Johnson (D)","Senator Paul Faraci (D)","Senator Mattie Hunter (D)","Senator Doris Turner (D)","Senator Mary Edly-Allen (D)"],"nCos":6,"bip":false,"committees":["Rules (House)","Assignments (Senate)","Revenue & Finance (House)","Commerce (Senate)"],"statutes":["20 ILCS 3855/1-130","20 ILCS 5075/15","20 ILCS 605/605-300was 20 ILCS 605/46.2","20 ILCS 605/605-465","20 ILCS 605/605-503","20 ILCS 605/605-913","20 ILCS 655/12-9from Ch. 67 1/2, par. 626","220 ILCS 80/20","305 ILCS 20/5from Ch. 111 2/3, par. 1405","30 ILCS 738/40-40","30 ILCS 750/10-9from Ch. 127, par. 2710-9","30 ILCS 750/9-9from Ch. 127, par. 2709-9","35 ILCS 5/201","35 ILCS 5/220","35 ILCS 5/221","35 ILCS 5/231","410 ILCS 705/7-15","70 ILCS 518/20"],"nStat":18,"amend":["House Amendment 001","House Amendment 002"],"summary":"Amends the Department of Commerce and Economic Opportunity Law of the Civil Administrative Code of Illinois. Provides that provisions requiring the Department of Commerce and Economic Opportunity's official website to contain a comprehensive list of State, local, and federal economic benefits available to businesses in each of the State's counties and municipalities are repealed on July 1, 2026. Provides that the following reports shall be filed on or before January 31 of each year (instead of January 1): a report on entrepreneurial assistance centers; reports on the Enterprise Zone Loan Fund and the Large Business Attraction Fund; and reports concerning cannabis social equity. Amends the Southeastern Illinois Economic Development Authority Act. Makes changes concerning the membership of the Board of the Southeastern Illinois Economic Development Authority. Amends the Illinois Income Tax Act. Extends the sunset for the apprenticeship education expense tax credit, the research and development tax credit, the angel investment tax credit, and the River Edge Redevelopment Zone tax credit. Effective immediately.","last":"Passed Both Houses","lastDate":"2026-05-28","lastChamber":"House","stage":"Passed both houses","stageLabel":"Passed both houses","stageNote":"Both chambers approved the same text","passed":true,"rtc":false,"pair":["SB3437","SB3443"]},{"id":"HB5477","type":"HB","num":5477,"title":"Wind & Solar Facility Drainage","raw":"WIND & SOLAR FACILITY DRAINAGE","theme":"Transmission, siting & land","issue":"drainage","also":[],"chamber":"House","sponsor":"Joe C. Sosnowski","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)"],"statutes":["505 ILCS 147/10","505 ILCS 147/15","55 ILCS 5/5-12020"],"nStat":3,"amend":[],"summary":"Amends the Counties Code. Provides that a commercial wind energy facility or commercial solar energy facility proposed to be located on property in an unincorporated area of the county within the zoning jurisdiction of a municipality and located adjacent to the corporate boundary of a municipality shall either be annexed to the municipality or be subject to the municipality's zoning regulations. Provides factors for determining if a request for siting approval or a special use permit for a commercial wind energy facility or a commercial solar energy facility or a request for modification of an approved siting or special use permit complies with the standards and conditions imposed in the Code, the zoning ordinance adopted consistent with the Code, and the conditions imposed under State and federal statutes and regulations. Provides that a county may not approve a request for siting approval or a special use permit for a commercial wind energy facility or a commercial solar energy facility or modification of an approved siting or special use permit, if the proposal shall disturb more than one acre of land, unless the facility owner has obtained a National Pollution Discharge Elimination System (\"NPDES\") permit from the Illinois Environmental Protection Agency. Requires a facility owner to provide the county where a commercial solar energy facility or commercial wind energy facility is to be located with a deconstruction plan that has been prepared by a professional engineer who has been selected by the facility owner. Provides that, based on an initial evaluation or reevaluation during the county approval process, the county may require changes in the level of financial assurance from the facility owner. Amends the Renewable Energy Facilities Agricultural Impact Mitigation Act. Provides that the standard agricultural impact mitigation agreements shall be amended as needed to conform with the financial assurance procedures and requirements of specified provisions of the Code. Makes other changes.","last":"Referred to Rules Committee","lastDate":"2026-02-13","lastChamber":"House","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":["SB3488"]},{"id":"HB5479","type":"HB","num":5479,"title":"EPA-Greenhouse Gas-Equity","raw":"EPA-GREENHOUSE GAS-EQUITY","theme":"Environment, climate & EPA","issue":"ghg-equity-community","also":[],"chamber":"House","sponsor":"Jay Hoffman","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["415 ILCS 5/9.15"],"nStat":1,"amend":[],"summary":"Amends the Environmental Protection Act. In provisions establishing greenhouse gas emission reduction deadlines and requirements for electric generating units and large greenhouse gas-emitting units that use gas as a fuel, that are not public GHG-emitting units, and that are located within a specified distance of an equity investment eligible community, specifies that the equity investment eligible community must have been designated by the Restore, Reinvest, and Renew Program Board as of January 11, 2024 and must be located in an R3 Area established under the Cannabis Regulation and Tax Act.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["SB3234"]},{"id":"HB5482","type":"HB","num":5482,"title":"Zero Emission Vehicle Act","raw":"ZERO EMISSION VEHICLE ACT","theme":"Environment, climate & EPA","issue":"zev","also":[],"chamber":"House","sponsor":"Barbara Hernandez","party":"D","cos":["Representative Michelle Mussman (D)","Representative Lilian Jim\u00e9nez (D)","Representative Lindsey LaPointe (D)"],"nCos":3,"bip":false,"committees":["Rules (House)","Transportation: Vehicles & Safety Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["220 ILCS 5/4-306 new"],"nStat":1,"amend":["Senate Amendment 002","Senate Amendment 001"],"summary":"Amends the Public Utilities Act. Provides that, beginning January 1, 2027, the Illinois Commerce Commission shall maintain a website that details any charges, either required by law or approved by the Commission, that are charged by an electric utility, other than delivery or supply charges. Provides that the website shall include certain information for amounts collected from a charge that are remitted to the State and for amounts collected from a charge that are retained by the electric utility.","last":"Passed Both Houses","lastDate":"2026-05-31","lastChamber":"House","stage":"Passed both houses","stageLabel":"Passed both houses","stageNote":"Both chambers approved the same text","passed":true,"rtc":false,"pair":[]},{"id":"HB5529","type":"HB","num":5529,"title":"Climate Risk & Strengthen Home","raw":"CLIMATE RISK & STRENGTHEN HOME","theme":"Environment, climate & EPA","issue":"climate-home","also":[],"chamber":"House","sponsor":"Thaddeus Jones","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Insurance (House)","Rules (House)"],"statutes":["20 ILCS 605/871 new","215 ILCS 110/25from Ch. 32, par. 690.25","215 ILCS 125/5-3from Ch. 111 1/2, par. 1411.2","215 ILCS 130/4003from Ch. 73, par. 1504-3","215 ILCS 5/143.15 rep.","215 ILCS 5/143.16from Ch. 73, par. 755.16","215 ILCS 5/143.17from Ch. 73, par. 755.17","215 ILCS 5/143.21e new","215 ILCS 5/1801 new","215 ILCS 5/1805 new","215 ILCS 5/1810 new","215 ILCS 5/1815 new","215 ILCS 5/1901 new","215 ILCS 5/1902 new","215 ILCS 5/1905 new","215 ILCS 5/1910 new","215 ILCS 5/1920 new","215 ILCS 5/1925 new","215 ILCS 5/1930 new","215 ILCS 5/Art. XLIX heading new","215 ILCS 5/Art. XLVIII heading new","30 ILCS 105/5.1038 new"],"nStat":22,"amend":[],"summary":"Amends the Department of Commerce and Economic Opportunity Law of the Civil Administrative Code of Illinois. Creates the Strengthen Illinois Homes Fund. On or before July 1, 2028, and depending on availability of funds, provides that the Department of Insurance shall identify areas of need to administer a pilot grant program known as the Strengthen Illinois Homes Program. Requires the Department of Commerce and Economic Opportunity, in conjunction with the Department of Insurance, to develop a standard application and grant award rubric for the eligible program grantees. Establishes program requirements for contractors. Amends the State Finance Act to make a conforming change. Amends the Illinois Insurance Code. Establishes notice requirements for companies providing flood coverage. Creates the Climate Risk Disclosure Article, which may be referred to as the Climate Risk Disclosure Law. Requires all companies, corporations, and organizations subject to the Article to, upon direction from the Department, participate in climate surveys issued by the National Association of Insurance Commissioners. Creates the Strengthen Illinois Homes Article, which may be referred to as the Strengthen Illinois Homes Act. Provides that, for homeowners insurance policies, an insurer shall provide an actuarially justified premium discount or insurance rate reduction to a specified owner. Provides that the Director of Insurance may adopt rules that establish standard discount amounts, targets, or benchmarks for the coverage of insurable property meeting the specified mitigation program standards. Provides that an insurer writing homeowners insurance policies that provide coverage of an insurable property that is a nonfortified insurable property shall offer an optional rider, endorsement, or supplemental policy provision that provides the insured a right to receive claim payments for the cost to upgrade an insurable property to mitigation program standards for a specified claim. Makes other changes. Amends the Dental Service Plan Act, the Health Maintenance Organization Act, and the Limited Health Service Organization Act to establish conforming requirements.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"HB5538","type":"HB","num":5538,"title":"EPA-GHG-Emitting Units-10Yrs","raw":"EPA-GHG-EMITTING UNITS-10YRS","theme":"Environment, climate & EPA","issue":"ghg-delay","also":[],"chamber":"House","sponsor":"William E Hauter","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)"],"statutes":["415 ILCS 5/9.15"],"nStat":1,"amend":[],"summary":"Amends the Environmental Protection Act. Extends deadlines for reduced or zero carbon dioxide emissions by 10 years for EGUs and large greenhouse gas-emitting units that use gas as a fuel or that use cogeneration technology.","last":"Referred to Rules Committee","lastDate":"2026-02-13","lastChamber":"House","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":[]},{"id":"HB5593","type":"HB","num":5593,"title":"Land Conservation Act","raw":"LAND CONSERVATION ACT","theme":"Transmission, siting & land","issue":"ag-land-fee","also":["Data centers & large load"],"chamber":"House","sponsor":"Sonya M. Harper","party":"D","cos":["Representative Diane Blair-Sherlock (D)"],"nCos":1,"bip":false,"committees":["Agriculture & Conservation (House)","Rules (House)"],"statutes":["30 ILCS 105/5.1036 new","New Act"],"nStat":2,"amend":["House Amendment 001"],"summary":"Creates the Agricultural Land Conservation Act. Provides that, beginning on January 1, 2027, a Farmland Conversion Fee of $275 per acre shall be paid by the buyer or lessee of a transaction for any agricultural land that will be removed from production for the specific purpose of developing an industrial park, a commercial area, a single-family or multi-family dwelling or for being put to any other use that removes the agricultural land from production. Provides that the fee shall be collected by the Department of Agricultural. Provides for the creation of the Farmland Conversion Fee Fund as a special fund in the State Treasury. Provides that all Farmland Conversion Fees collected by the Department of Agriculture shall be contributed to the Fund. Further provides that moneys in the Fund may be exclusively used for the following purposes: (i) supporting education and programs that support healthy soil clean water, and climate-smart agricultural practices; (ii) supporting operations funding for soil and water conservation districts; (iii) covering costs associated with administering the Act; (iv) any other purposes that the Department of Agriculture determines are consistent with the purposes of the Act. Provides that, before expending moneys for any other purposes, the Department of Agriculture shall, subject to the availability of moneys in the Fund, ensure that during each State fiscal year, $10,000,000 is distributed to soil and water conservation districts, for the purpose of supporting their operations funding. Provides that $500,000 shall be distributed to the Department of Agriculture for the purposes of collecting fees and administering the program created under the Act. Provides for penalties. Effective immediately.","last":"House Committee Amendment No. 1 Rule 19(c) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"HB5600","type":"HB","num":5600,"title":"Warehouse Pollution Reduction","raw":"WAREHOUSE POLLUTION REDUCTION","theme":"Environment, climate & EPA","issue":"warehouse","also":[],"chamber":"House","sponsor":"Aaron M. Ortiz","party":"D","cos":["Representative Janet Yang Rohr (D)","Representative Lilian Jim\u00e9nez (D)","Representative Michelle Mussman (D)","Representative Laura Faver Dias (D)","Representative Kelly M. Cassidy (D)","Representative Diane Blair-Sherlock (D)"],"nCos":6,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["30 ILCS 105/5.1038 new","New Act"],"nStat":2,"amend":[],"summary":"Creates the Warehouse Pollution Reduction Act. Requires the Environmental Protection Agency to propose and the Pollution Control Board to adopt rules establishing a qualifying warehouse review program. Provides for reporting, recordkeeping, and notice requirements; annual emissions-reduction targets; and a system of points for air-pollution mitigation measures. Requires construction permits for new or modified qualifying warehouses and sets conditions for permit issuance, including zero-emission readiness and buffer requirements near sensitive receptors. Establishes a qualifying warehouse registry and requires public access to reports, notices, and permitting records. Provides for mitigation fees and directs their use in the same geographic area as the site of the qualifying warehouse. Requires the Agency to develop an air-quality modeling program and publish results annually. Creates the Warehouse Pollution Management Fund and provides for fee collection and deposit. Prohibits certain acts, provides civil penalties, authorizes enforcement and citizen suits, and allows recovery of attorney's fees. Limits home rule powers. Amends the State Finance Act to make a conforming change.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"HB5607","type":"HB","num":5607,"title":"Advanced Technology Leadership","raw":"ADVANCED TECHNOLOGY LEADERSHIP","theme":"Technology, privacy & communications","issue":"dc-clean-match","also":["Data centers & large load"],"chamber":"House","sponsor":"Jay Hoffman","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["New Act"],"nStat":1,"amend":[],"summary":"Creates the Advanced Technology Leadership Act. Sets forth findings. Defines terms. Sets forth provisions concerning the qualification of credits under the Act. Provides that, beginning calendar year 2027, each covered data center shall self-generate or procure and then retire eligible energy attribute certificates equal to the certain percentages of the covered data center's annual State electricity consumption. Provides that a covered data center's compliance requirement shall be otherwise met by retirements of eligible energy attribute certificates produced by eligible energy facilities that are physically interconnected and located in the applicable grid region. Requires a covered data center to retire eligible energy attribute certificates that are matched on an hourly basis to the certain percentages of the covered data center's total State electricity consumption for the following compliance years. Provides that covered data centers shall account for and comply with the Act exclusively through the retirement of eligible energy attribute certificates. Requires the Illinois Power Agency to, on an ongoing basis, identify facilities that meet the definition of covered data center. Provides that the Agency shall strive to minimize administrative expenses in the implementation and regulation of activities related to the Act. Makes other changes. Effective immediately.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or As - Prevailed 066-029-000","lastDate":"2026-05-25","lastChamber":"House","stage":"Floor action","stageLabel":"Floor action","stageNote":"Moving on the floor","passed":false,"rtc":false,"pair":["HB910","SB329","SB640","SB3574","SB3575","SB3576"]},{"id":"SB329","type":"SB","num":329,"title":"Civil Law-Tech","raw":"CIVIL LAW-TECH","theme":"Technology, privacy & communications","issue":"shell","also":[],"chamber":"Senate","sponsor":"Cristina Castro","party":"D","cos":["Senator Rachel Ventura (D)","Senator Adriane Johnson (D)","Senator Karina Villa (D)","Senator David Koehler (D)"],"nCos":4,"bip":false,"committees":["Executive (Senate)","Assignments (Senate)"],"statutes":["735 ILCS 5/1-101from Ch. 110, par. 1-101"],"nStat":1,"amend":["Senate Amendment 001"],"summary":"Amends the Code of Civil Procedure. Makes a technical change in the short title Section.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-06-01","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB910","SB317","SB640","SB3574","SB3575","SB3576"]},{"id":"SB640","type":"SB","num":640,"title":"Local Government-Tech","raw":"LOCAL GOVERNMENT-TECH","theme":"Technology, privacy & communications","issue":"shell","also":[],"chamber":"Senate","sponsor":"Mattie Hunter","party":"D","cos":["Senator David Koehler (D)"],"nCos":1,"bip":false,"committees":["Executive (Senate)","Assignments (Senate)"],"statutes":["65 ILCS 110/1"],"nStat":1,"amend":["Senate Amendment 001","Senate Amendment 002"],"summary":"Amends the Economic Development Project Area Tax Increment Allocation Act of 1995. Makes a technical change in a Section concerning the short title.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-06-01","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB910","SB317","SB329","SB3574","SB3575","SB3576"]},{"id":"SB1436","type":"SB","num":1436,"title":"EPA-Great Lakes CCR Protection","raw":"EPA-GREAT LAKES CCR PROTECTION","theme":"Environment, climate & EPA","issue":"ccr","also":[],"chamber":"Senate","sponsor":"Rachel Ventura","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["415 ILCS 5/22.59","415 ILCS 5/22.59a new"],"nStat":2,"amend":[],"summary":"Amends the Environmental Protection Act. Provides that owners and operators of CCR surface impoundments at electric generating plants that are within 4,000 feet of Lake Michigan shall close the CCR surface impoundment by removal and off-site disposal, pursuant to specified provisions and requirements. In additional provisions, requires an owner or operator of an electric generating plant located within 4,000 feet of Lake Michigan that generates or has generated CCR that is not disposed of, treated, stored, or abandoned in a CCR surface impoundment to remove from the owner's or operator's site, for off-site disposal, all CCR generated by the facility that is not disposed of, treated, stored, or abandoned in a CCR surface impoundment and remediate all soil and groundwater impacted by the CCR, in accordance with specified requirements. Requires owners or operators to submit specified plans and reports to the Environmental Protection Agency. Provides that an owner or operator shall post with the Agency a performance bond or other security for the purpose of ensuring removal and remediation in accordance with the provisions. Provides that the Agency may enter into such contracts and agreements as it deems necessary to carry out the purposes of the provisions. Provides that neither the State, nor the Director of the Agency, nor any State employee shall be liable for any damages or injuries arising out of or resulting from any action taken under the provisions. Contains other provisions. Contains a severability provision. Effective immediately.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-03-27","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB5453"]},{"id":"SB2401","type":"SB","num":2401,"title":"Wetlands Protection Act","raw":"WETLANDS PROTECTION ACT","theme":"Environment, climate & EPA","issue":"wetlands","also":[],"chamber":"Senate","sponsor":"Mike Simmons","party":"D","cos":["Senator Robert F. Martwick (D)","Senator Graciela Guzman (D)","Senator Javier L. Cervantes (D)","Senator Adriane Johnson (D)","Senator Mary Edly-Allen (D)","Senator Karina Villa (D)","Senator Sara Feigenholtz (D)","Senator Robert Peters (D)","Senator Celina Villanueva (D)","Senator Laura Fine (D)","Senator Mike Porfirio (D)","Senator David Koehler (D)","Senator Julie A. Morrison (D)","Senator Rachel Ventura (D)","Senator Mark L. Walker (D)","Senator Lakesia Collins (D)","Senator Ram Villivalam (D)","Senator Laura M. Murphy (D)","Senator Napoleon Harris, III (D)"],"nCos":19,"bip":false,"committees":["Judiciary (Senate)","Assignments (Senate)"],"statutes":["30 ILCS 105/5.1030 new","New Act"],"nStat":2,"amend":[],"summary":"Creates the Wetlands Protection Act. Provides that no person may discharge dredged or fill material into a State jurisdictional wetland except with a permit issued by the Department of Natural Resources. Exempts certain activities from the requirements of the Act. Sets forth procedures for individual permit applications and other related procedural requirements. Provides that the Department shall not issue an individual permit unless the Environmental Protection Agency certifies to the Department that there will not be a violation of State water quality standards. Provides that the Department may issue an after-the-fact permit in certain emergency circumstances. Sets forth financial assurance requirements. Authorizes the Department to adopt general permits under the Act. Provides that any person who intends to conduct a regulated activity may do so in accordance with a general permit issued by the Department, which pre-authorizes a category of activities with minimal adverse effects. Provides procedures and requirements regarding preconstruction notifications. Provides that certain entities may establish and operate a mitigation bank or in lieu fee program. Describes procedures and requirements for mitigation banks. Grants the Department rulemaking powers. Provides that the Department shall prepare certain reports and studies. Provides for the review of final decisions of the Department. Provides for investigations by the Department and enforcement by a State's Attorney or the Attorney General. Provides for a civil penalty not to exceed $10,000 per day of violation, with interest after judgment, and with certain costs, fees, and expenses, payable to the Wetlands Protection Fund. Provides that any person may file a complaint with the Illinois Pollution Control Board concerning a violation of the Act, a rule adopted under the Act, a condition of a permit issued under the Act, or an order of the Pollution Control Board issued under the Act. Provides for county and special district stormwater program authorities to control or regulate activities in any wetlands within their jurisdiction. Establishes the Wetlands Protection Fund. Provides that a permit review fee for all permit applications is to be set by the Department by rule. Makes corresponding changes to the State Finance Act. Makes findings. Defines terms. Effective immediately.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2025-05-09","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or
