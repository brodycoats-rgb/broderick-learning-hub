Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB3596"]},{"id":"SB2570","type":"SB","num":2570,"title":"Independent Tax Tribunal","raw":"$INDEPENDENT TAX TRIBUNAL","theme":"Workforce, labor & tax incentives","issue":"tax-tribunal","also":[],"chamber":"Senate","sponsor":"Elgie R. Sims, Jr.","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":[],"nStat":0,"amend":[],"summary":"Makes appropriations for the ordinary and contingent expenses of the Illinois Independent Tax Tribunal for the fiscal year beginning July 1, 2025, as follows: General Funds $628,300; Other State Funds $82,700; Total $711,000.","last":"Referred to Assignments","lastDate":"2025-02-25","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":[]},{"id":"SB2727","type":"SB","num":2727,"title":"Utilities-Various","raw":"UTILITIES-VARIOUS","theme":"Utility rates, cost recovery & regulation","issue":"battery-variance","also":[],"chamber":"Senate","sponsor":"Bill Cunningham","party":"D","cos":["Senator Chris Balkema (R)","Senator Patrick J. Joyce (D)"],"nCos":2,"bip":true,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["415 ILCS 5/9.15"],"nStat":1,"amend":[],"summary":"Amends the Environmental Protection Act. Defines\"battery storage resource\" and\"total State-installed generation capacity\". Provides that no variance, adjusted standard, or other regulatory relief otherwise available in the Act may be granted to the emissions reduction and elimination obligations in the amendatory provisions if battery storage resources constitute at least 10% of the total State-installed generation capacity in the State. Provides that, if battery storage resources constitute less than 10% of the total State-installed generation capacity at any time after the effective date of the amendatory Act, the Environmental Protection Agency shall delay enforcement of certain timelines and relieve generators of their obligation not to exceed their existing emission levels. Provides that, for a large GHG-emitting unit that uses gas as a fuel and is subject to certain restrictions within the provisions concerning greenhouse gases, the unit may exceed its existing emissions during run hours dispatched by a regional transmission organization during emergency, pre-emergency, or conservative operations or run hours that are required to maintain system reliability. Makes other changes. Effective immediately.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-04-24","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":[]},{"id":"SB2736","type":"SB","num":2736,"title":"EPA-Natural Gas Peaker Plants","raw":"EPA-NATURAL GAS PEAKER PLANTS","theme":"Gas & building decarbonization","issue":"peaker","also":[],"chamber":"Senate","sponsor":"Chris Balkema","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["415 ILCS 5/9.15a new"],"nStat":1,"amend":[],"summary":"Amends the Environmental Protection Act. Provides that, notwithstanding any provision of the Act, any rule adopted under the Act, or any term or condition in any permit issued under the Act, each natural gas-fired peaker power plant in the State may, to the extent allowed by federal law, be operated on up to a continuous basis beginning on the effective date of the amendatory Act and until 30 days after the date upon which the Illinois Environmental Protection Agency first posts on its website a notice that it has determined, based on data supplied to it annually by the Illinois Power Agency, that at least 21,000 MWe of new utility-scale renewable power generation capacity has been brought online in the State. Directs the Environmental Protection Agency to adopt any rules and to amend any existing permits as necessary to implement the provisions added by the amendatory Act. Effective immediately.","last":"Referred to Assignments","lastDate":"2025-10-28","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":[]},{"id":"SB2752","type":"SB","num":2752,"title":"Gov Ethics-Fundraising","raw":"GOV ETHICS-FUNDRAISING","theme":"Workforce, labor & tax incentives","issue":"ethics","also":[],"chamber":"Senate","sponsor":"Julie A. Morrison","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Executive (Senate)","Assignments (Senate)","Elections (Senate)"],"statutes":["5 ILCS 430/5-40"],"nStat":1,"amend":[],"summary":"Amends the State Officials and Employees Ethics Act. Provides that no executive branch constitutional officer, candidate for an executive branch constitutional office, member of the General Assembly, candidate for the General Assembly, any political caucus of the General Assembly, or any political committee on behalf of any of the foregoing may hold a political fundraising function on any day immediately after a day in which the legislature is in session. Further provides that this restriction does not apply to a political fundraising function scheduled at least 14 days in advance of a day the legislature is in special session or the day immediately prior to or after a day the legislature is in special session. Effective immediately.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"SB2753","type":"SB","num":2753,"title":"Veh Code-Inspections","raw":"VEH CD-INSPECTIONS","theme":"Workforce, labor & tax incentives","issue":"vehicle-code","also":[],"chamber":"Senate","sponsor":"Suzy Glowiak Hilton","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Transportation (Senate)"],"statutes":["625 ILCS 5/13C-15"],"nStat":1,"amend":[],"summary":"Amends the Illinois Vehicle Code. Provides that vehicles shall be inspected every 2 years on a schedule that begins in the sixth (rather than fourth) calendar year after the vehicle model year.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-03-13","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["SB2791"]},{"id":"SB2768","type":"SB","num":2768,"title":"Employment-Effective Date","raw":"EMPLOYMENT-EFFECTIVE DATE","theme":"Workforce, labor & tax incentives","issue":"effective-date","also":[],"chamber":"Senate","sponsor":"Li Arellano, Jr.","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["P.A. 104-17, Sec. 99"],"nStat":1,"amend":[],"summary":"Amends Public Act 104-17. Changes the effective date of the Public Act from June 30, 2025 to July 1, 2026. Effective immediately.","last":"Referred to Assignments","lastDate":"2026-01-13","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":[]},{"id":"SB2785","type":"SB","num":2785,"title":"Utility-Shared Roof/Townhouse","raw":"UTILITY-SHARED ROOF/TOWNHOUSE","theme":"Solar, storage & distributed energy","issue":"shared-roof","also":[],"chamber":"Senate","sponsor":"Sara Feigenholtz","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["55 ILCS 5/5-46025"],"nStat":1,"amend":["Senate Amendment 001","Senate Amendment 002"],"summary":"Amends the Counties Code if and only if Senate Bill 25 of the 104th General Assembly becomes law. Provides that\"shared roof\" does not include a roof that serves townhouses. Provides that\"townhouse\" means a privately owned single-family dwelling unit that is attached to but separated from other privately owned single-family dwelling units by a common party wall that has no doors, windows, or other means of human passage or visibility.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-06-01","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB5402"]},{"id":"SB2789","type":"SB","num":2789,"title":"High Voltage Transmission Line","raw":"HIGH VOLTAGE TRANSMISSION LINE","theme":"Transmission, siting & land","issue":"tx-highway","also":[],"chamber":"Senate","sponsor":"Patrick J. Joyce","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["220 ILCS 5/8-406from Ch. 111 2/3, par. 8-406","605 ILCS 5/9-113from Ch. 121, par. 9-113"],"nStat":2,"amend":[],"summary":"Amends the Illinois Highway Code. Provides that a high voltage transmission line may be constructed, placed, or maintained across any public right-of-way or along any highway, federally aided State highway, controlled access highway, interstate highway, or roadway, except as deemed necessary by the Secretary of Transportation to protect public safety or ensure the proper function of the highway. Provides that in the case of the co-location of a high voltage transmission line with Department of Transportation highway right-of-way, the Secretary of Transportation shall engage in coordination activities with a utility or developer to review requested highway corridors for a possible permitted location of a high voltage transmission line. Provides that when a permissible route along a highway corridor has been identified by the Department and the utility or developer, the Department must engage in consultation with the utility or developer to develop a constructability report to be used by both parties when co-location projects are being planned and approved. Amends the Public Utilities Act. Establishes an order of priority when siting a location for a new electric transmission facility.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-03-13","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"SB2791","type":"SB","num":2791,"title":"Veh Code-Electronic Comm Devices","raw":"VEH CD-ELECTRONIC COMM DEVICES","theme":"Workforce, labor & tax incentives","issue":"vehicle-code","also":[],"chamber":"Senate","sponsor":"Laura M. Murphy","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Criminal Law (Senate)","Criminal Law Clear Compliance (Senate)"],"statutes":["625 ILCS 5/12-610.2"],"nStat":1,"amend":["Senate Amendment 001"],"summary":"Amends the Illinois Vehicle Code. Provides that using an electronic communication device includes recording a video, holding a device in one's hand or lap, composing, sending, or reading any text-based communication, or browsing the Internet. Provides that a person is presumed to be in use of an electronic communication device while driving if the electronic communication device is observed in the person's hand while the vehicle is in motion or stopped in traffic. Changes the penalties for the use of an electronic communication device while driving to: for a first offense, a fine not to exceed $250 (instead of $75); for a second offense, a fine not to exceed $500 (instead of $100) and the person must complete a Distracted Driving Safety Course; and for a third or subsequent offense, a fine not to exceed $750 (instead of $125) and a suspension of the person's driver's license for a period of not less than 3 months and not more than 6 months. Includes exceptions for a public transit or commercial driver using a digital dispatch device within the scope of employment and a driver using the phone for a brief, specific purpose while the vehicle is fully and completely stopped at a red light, as long as the purpose is achieved and the electronic communication device use ceases before the light turns green. Requires that the exception for a driver using an electronic communication device in hands-free or voice-operated mode must be 18 or older. Authorizes a municipality to establish an automated distracted driving enforcement program. Provides for the implementation of a distracted driving awareness campaign. Makes other changes. Effective January 1, 2027.","last":"Senate Committee Amendment No. 1 Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-03-27","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["SB2753"]},{"id":"SB2808","type":"SB","num":2808,"title":"Electric Transmission Siting","raw":"ELECTRIC TRANSMISSION SITING","theme":"Transmission, siting & land","issue":"tx-siting","also":[],"chamber":"Senate","sponsor":"Mike Porfirio","party":"D","cos":["Senator Patrick J. Joyce (D)"],"nCos":1,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["New Act"],"nStat":1,"amend":["Senate Amendment 001"],"summary":"Creates the Electric Transmission Facilities Siting Act. Defines terms. Requires that, in the siting of new electric transmission facilities, available corridors be used in the following order of priority: (1) existing public utility corridors; (2) highway corridors; and (3) new corridors. Provides that a public utility or developer may construct, place, or maintain a high-voltage electric service line on a public right-of-way or along a highway if (i) the public utility or developer submits a colocation request for the high-voltage electric service line to the Secretary of Transportation and (ii) the Secretary reviews and approves the colocation request. Provides that the Secretary may deny a colocation request if the Secretary determines that the construction, placement, or maintenance of a high-voltage electric service line on a public right-of-way or along a highway would endanger public safety or would interfere with the proper function of the highway. Provides that a public utility or developer may submit a written request to the Department of Transportation for an evaluation of certain corridors for possible locations for a high-voltage electric service line. Provides that, within 30 days after receipt of a written request, the Secretary shall assign a project coordinator to the request. Provides that a project coordinator, upon assignment to a request, shall begin the evaluation in coordination with the applicable public utility or developer. Requires a public utility or developer to develop a constructability report in consultation with the Department and requires the public utility or developer and the Department to follow the terms and conditions of the constructability report during the planning and approval process for the siting of a high-voltage electric service line. Sets forth requirements for the content of the constructability report. Provides that, if the Department requires that a high-voltage electric service line on a public right-of-way be relocated by a specific date, the Department shall give the applicable public utility or developer notice of the required relocation no less than 10 years before the date of the required relocation. Makes other changes. Effective immediately.","last":"Senate Committee Amendment No. 1 Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-03-27","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB4803","HB4995"]},{"id":"SB2842","type":"SB","num":2842,"title":"CO2 Pipelines-Eminent Domain","raw":"CO2 PIPELINES-EMINENT DOMAIN","theme":"Transmission, siting & land","issue":"co2-eminent","also":[],"chamber":"Senate","sponsor":"Michael W. Halpin","party":"D","cos":["Senator Steve McClure (R)","Senator Sally J. Turner (R)","Senator Paul Faraci (D)","Senator Doris Turner (D)","Senator Rachel Ventura (D)","Senator Graciela Guzman (D)","Senator Laura Fine (D)","Senator Suzy Glowiak Hilton (D)","Senator Patrick J. Joyce (D)","Senator Mike Simmons (D)","Senator Laura M. Murphy (D)","Senator Chris Balkema (R)","Senator Terri Bryant (R)","Senator Neil Anderson (R)","Senator Emil Jones, III (D)","Senator Li Arellano, Jr. (R)","Senator Javier L. Cervantes (D)","Senator Dave Syverson (R)","Senator Adriane Johnson (D)","Senator Jil Tracy (R)","Senator Cristina Castro (D)","Senator Mary Edly-Allen (D)"],"nCos":22,"bip":true,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["220 ILCS 5/8-509from Ch. 111 2/3, par. 8-509","220 ILCS 75/20"],"nStat":2,"amend":[],"summary":"Amends the Public Utilities Act. In provisions concerning the exercise of eminent domain powers by a public utility, provides that an owner or operator of a pipeline designed, constructed, and operated to transport carbon dioxide to which the Illinois Commerce Commission has granted a certificate under the Carbon Dioxide Transportation and Sequestration Act shall not seek or exercise eminent domain authority from the Commission. Amends the Carbon Dioxide Transportation and Sequestration Act. Provides that a certificate of authority does not grant an owner or operator of a carbon dioxide pipeline the authority to take and acquire an easement in any property or interest in property for the construction, maintenance, or operation of a carbon dioxide pipeline through the exercise of eminent domain power. Removes corresponding provisions concerning eminent domain.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-03-27","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":[]},{"id":"SB2875","type":"SB","num":2875,"title":"Consumer Data Privacy","raw":"CONSUMER DATA PRIVACY","theme":"Technology, privacy & communications","issue":"data-privacy","also":[],"chamber":"Senate","sponsor":"Laura M. Murphy","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Executive (Senate)","Assignments (Senate)","AI and Social Media (Senate)"],"statutes":["New Act"],"nStat":1,"amend":["Senate Amendment 001"],"summary":"Creates the Illinois Consumer Data Privacy Act. Applies to legal entities that conduct business in Illinois or produce products or services that are targeted to Illinois residents and that satisfy one or more of the following thresholds: during a calendar year, controls or processes personal data of 100,000 consumers or more, excluding personal data controlled or processed solely for the purpose of completing a payment transaction; or derives over 25% of gross revenue from the sale of personal data and processes or controls personal data of 25,000 consumers or more.\"Personal data\" means any information that is linked or reasonably linkable to an identified or identifiable natural person but does not include deidentified data or publicly available information. Requires a controller who, alone or jointly with others, to consider the purposes and means of the processing of personal data in protecting the security of consumers while processing personal data and in notifying consumers of a breach of the security of the system. Authorizes rights to consumers under the Act to include, but not be limited to, the right to access their personal data, obtain a list of third parties to whom their data has been disclosed, request corrections to inaccurate data, and question the profiling of their information. Creates an appeal process for a consumer to gather more information on the actions of a covered entity. Exempts the State, a political subdivision of the State, and units of local government, a federally recognized Indian tribe, nonprofits established to prevent insurance fraud, and data already covered by federal law. Authorizes the Attorney General to enforce the Act. Makes definitions. Makes other changes. Limits the concurrent exercise of home rule powers. Contains a severability provision.","last":"Senate Committee Amendment No. 1 Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["HB5221","SB3548","SB3890"]},{"id":"SB2886","type":"SB","num":2886,"title":"Genetic Info Privacy-Biomarker","raw":"GENETIC INFO PRIVACY-BIOMARKER","theme":"Technology, privacy & communications","issue":"genetic","also":[],"chamber":"Senate","sponsor":"Rachel Ventura","party":"D","cos":["Senator Michael W. Halpin (D)","Senator Emil Jones, III (D)","Senator Michael E. Hastings (D)","Senator Mary Edly-Allen (D)","Senator Laura M. Murphy (D)","Senator Laura Ellman (D)","Senator Laura Fine (D)","Senator Mark L. Walker (D)","Senator Suzy Glowiak Hilton (D)","Senator Sara Feigenholtz (D)","Senator Mike Simmons (D)","Senator Lakesia Collins (D)","Senator Napoleon Harris, III (D)","Representative Maurice A. West, II (D)","Representative Jennifer Gong-Gershowitz (D)","Representative Mary Beth Canty (D)","Representative Camille Y. Lilly (D)","Representative Joyce Mason (D)","Representative Mary Gill (D)","Representative Michael J. Kelly (D)","Representative Natalie A. Manley (D)","Representative Lilian Jim\u00e9nez (D)","Representative Amy Briel (D)"],"nCos":23,"bip":false,"committees":["Judiciary - Civil (House)","Rules (House)","Judiciary (Senate)","Assignments (Senate)"],"statutes":["410 ILCS 513/10","410 ILCS 513/15","410 ILCS 513/20","410 ILCS 513/25","410 ILCS 513/30","410 ILCS 513/31","410 ILCS 513/31.1","410 ILCS 513/31.10","410 ILCS 513/31.2","410 ILCS 513/31.3","410 ILCS 513/31.5","410 ILCS 513/31.7","410 ILCS 513/31.8","410 ILCS 513/31.9","410 ILCS 513/5","410 ILCS 513/50"],"nStat":16,"amend":[],"summary":"Amends the Genetic Information Privacy Act. Provides that the use of genetic testing, biomarker testing, or both (rather than only genetic testing), and the information derived from testing is confidential and privileged and may be released only to the individual tested and persons specifically authorized in writing by the individual tested to receive the information. Provides that an insurer may not seek information derived from genetic or biomarker testing (rather than only genetic testing) for use in connection with a policy of accident or health insurance (unless the individual voluntarily submits the results and the results are favorable to the individual), for nontherapeutic purposes, or for underwriting purposes. In provisions concerning the use of testing information by employers, provides that an employer may release genetic testing or biomarker testing information (rather than only genetic testing information) under specified circumstances. Limits an employer's use of genetic information, genetic testing, biomarkers, and biomarker testing (rather than only genetic information and genetic testing). In provisions concerning testing, provides that no person may disclose or be compelled to disclose the identity of any person upon whom a genetic test or biomarker test (rather than only genetic test) is performed or the results of a genetic test or biomarker test (rather than only genetic test) in a manner that permits identification of the subject of the test, except to the persons specified in the Act. Limits the concurrent exercise of home rule powers. Defines\"biomarker\" and\"biomarker testing\". Makes other and conforming changes.","last":"Passed Both Houses","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Passed both houses","stageLabel":"Passed both houses","stageNote":"Both chambers approved the same text","passed":true,"rtc":true,"pair":[]},{"id":"SB2907","type":"SB","num":2907,"title":"Muni Code-Utility Info","raw":"MUNI CD-UTILITY INFO","theme":"Utility rates, cost recovery & regulation","issue":"muni-audit-info","also":[],"chamber":"Senate","sponsor":"Laura M. Murphy","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["65 ILCS 5/8-11-2.5"],"nStat":1,"amend":[],"summary":"Amends the Illinois Municipal Code. Provides that the following information for a customer premises shall not be deemed customer-specific information for the purpose of a request for information from a municipality conducting an audit of a public utility: (i) the premises address and zip code; (ii) the classification of the premises as designated by the public utility, such as residential, commercial, or industrial; (iii) monthly usage information sufficient to calculate taxes due, in therms, kilowatts, minutes, or other such other unit of measurement used to calculate the taxes; (iv) the taxes actually assessed, collected, and remitted to the municipality; (v) the first date of service for the premises, if that date occurred within the period being audited; and (vi) any tax exemption claimed for the premises and any additional information that supports a specific tax exemption, if the municipality requests that information, including the customer name and other relevant data. Provides that a municipality may request certain customer-specific information from a utility for the purpose of conducting an audit of the utility's taxes and the enforcement of any related tax claim.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-04-17","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB4692"]},{"id":"SB2958","type":"SB","num":2958,"title":"Agrivoltaic Systems","raw":"AGRIVOLTAIC SYSTEMS","theme":"Transmission, siting & land","issue":"agrivoltaic","also":[],"chamber":"Senate","sponsor":"Doris Turner","party":"D","cos":["Senator Terri Bryant (R)","Senator Graciela Guzman (D)","Senator Rachel Ventura (D)","Senator Patrick J. Joyce (D)","Senator Napoleon Harris, III (D)","Senator Chris Balkema (R)","Senator Mike Porfirio (D)"],"nCos":7,"bip":true,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["20 ILCS 3855/1-10","220 ILCS 5/3-128 new"],"nStat":2,"amend":[],"summary":"Amends the Illinois Power Agency Act and the Public Utilities Act. Provides that\"agrivoltaic system\" means a ground-mounted photovoltaic solar energy system that meets the following criteria: (1) the applicable farm plan and the system have been intentionally designed with agricultural producers, agrivoltaics experts, or both agricultural producers and agrivoltaics experts; (2) the system is constructed, installed, and operated to achieve an integrated and simultaneous production of both solar energy and current or future marketable agricultural products, including all products and activities described in the definition of\"production agriculture\" in the Use Tax Act and apiaries if the apiary is paired with another qualifying marketable agricultural product, by an agricultural producer; (3) the agricultural production of the system occur on land beneath or between rows of solar panels; and (4) the agricultural production of the system begins as soon as agronomically feasible and optimal for the agricultural producer after the commercial operation date of the solar panels and continues until decommissioning. Provides that\"agrivoltaic system\" does not include a system that has a pollinator habitat as the sole dual use of the system.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["HB4830"]},{"id":"SB2979","type":"SB","num":2979,"title":"County/Muni-Natural Gas","raw":"COUNTY/MUNI-NATURAL GAS","theme":"Gas & building decarbonization","issue":"gas-ban-preempt","also":[],"chamber":"Senate","sponsor":"Patrick J. Joyce","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["55 ILCS 5/5-1195 new","65 ILCS 5/11-30-11 new"],"nStat":2,"amend":[],"summary":"Amends the Counties Code and the Illinois Municipal Code. Provides that a county or municipality may not adopt any regulation that prohibits or has the effect of prohibiting the use of natural gas in new construction without a referendum. Limits the concurrent exercise of home rule powers.","last":"Referred to Assignments","lastDate":"2026-01-27","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":["HB4419"]},{"id":"SB2981","type":"SB","num":2981,"title":"Climate Change Superfund","raw":"CLIMATE CHANGE SUPERFUND","theme":"Environment, climate & EPA","issue":"superfund","also":[],"chamber":"Senate","sponsor":"Graciela Guzman","party":"D","cos":["Senator Lakesia Collins (D)","Senator Adriane Johnson (D)","Senator Mary Edly-Allen (D)","Senator Rachel Ventura (D)","Senator Sara Feigenholtz (D)","Senator Karina Villa (D)","Senator Mike Simmons (D)","Senator Emil Jones, III (D)"],"nCos":8,"bip":false,"committees":["Assignments (Senate)","Appropriations (Senate)"],"statutes":["30 ILCS 105/5.1038 new","New Act"],"nStat":2,"amend":[],"summary":"Creates the Climate Change Superfund Act. Creates the Illinois Climate Change Superfund as a special fund in the State treasury. Requires at least 40% of the Fund to be spent on projects that directly benefit disadvantaged communities facing climate change impacts. Directs the Environmental Protection Agency to adopt rules within one year, including regarding the apportionment of liability for climate change for payments into the Fund by responsible parties, regarding qualifying expenditures from the Fund, and regarding an Illinois Climate Change Superfund Program. Requires the Agency to establish procedures to challenge its determinations of liability for climate change and provides for judicial review under the Administrative Review Law. Makes findings. Defines terms. Provides that the Act is severable. Makes conforming changes to the State Finance Act.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB4773"]},{"id":"SB2995","type":"SB","num":2995,"title":"Consumer Fraud-AI Disclosure","raw":"CONSUMER FRAUD-AI DISCLOSURE","theme":"Technology, privacy & communications","issue":"ai-disclosure","also":[],"chamber":"Senate","sponsor":"David Koehler","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Executive (Senate)","Assignments (Senate)","AI and Social Media (Senate)"],"statutes":["815 ILCS 505/2MMMM new"],"nStat":1,"amend":[],"summary":"Amends the Consumer Fraud and Deceptive Business Practices Act. Provides that a person shall not use artificial intelligence while engaging in trade and commerce to communicate with a consumer in a manner that may mislead or deceive a reasonable consumer into believing that the consumer is engaging with a human, unless the consumer is notified in a clear and conspicuous manner that the consumer is not engaging with a human. Provides that a person shall not use artificial intelligence to sell or offer to sell goods or services unless the consumer is notified in a clear and conspicuous manner that artificial intelligence is being used to sell or offer to sell goods or services and the consumer is given an option to request more information regarding the specific use of the artificial intelligence. Provides that a business entity that uses artificial intelligence while engaging in trade and commerce to communicate with a consumer shall give the consumer the option to communicate with a human during the business entity's ordinary business hours. Provides that a violation of the provisions constitutes an unlawful practice within the meaning of the Act.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"SB3037","type":"SB","num":3037,"title":"Dark Sky Act","raw":"DARK SKY ACT","theme":"Environment, climate & EPA","issue":"dark-sky","also":[],"chamber":"Senate","sponsor":"Laura Ellman","party":"D","cos":["Senator Rachel Ventura (D)","Senator Mike Simmons (D)","Representative Janet Yang Rohr (D)","Representative Maura Hirschauer (D)","Representative Laura Faver Dias (D)","Representative Martha Deuter (D)"],"nCos":6,"bip":false,"committees":["Rules (House)","State Government Administration (House)","Assignments (Senate)","State Government (Senate)"],"statutes":["415 ILCS 200/1","415 ILCS 200/10","415 ILCS 200/15","415 ILCS 200/20","415 ILCS 200/22 new","415 ILCS 200/25"],"nStat":6,"amend":["Senate Amendment 003","Senate Amendment 001","Senate Amendment 002","House Amendment 001"],"summary":"Amends the Responsible Outdoor Lighting Control Act. Changes the short title of the Act to the Dark Sky Act. Provides that, beginning December 1, 2026, except for any lighting that a State agency has installed or is using on the effective date of the amendatory Act, all new or renovated luminaires that are purchased or rented with State funds for the purpose of outdoor illumination and any lighting that is installed on land or easements owned, leased, or managed by the State for the purpose of outdoor illumination, including, but not limited to, on roadways, facilities, properties, nonhabitable structures, monuments, and public right-of-way spaces shall comply with specified responsible outdoor lighting requirements. Makes exceptions to the requirements. Provides that a State agency may send a request to the Department of Central Management Services to seek an exemption when planning to install, purchase, or rent lighting under one or more of the listed exceptions to the requirements in the Act. Requires the Department of Central Management Services, within 30 days of receipt, to (i) grant the exemption by memorandum, (ii) deny the exemption by memorandum, or (iii) grant the exemption by failing to issue a memorandum. Makes conforming changes to provisions that apply to the Department of Natural Resources. Changes a definition. Makes technical changes. Effective immediately.","last":"Passed Both Houses","lastDate":"2026-05-31","lastChamber":"Senate","stage":"Passed both houses","stageLabel":"Passed both houses","stageNote":"Both chambers approved the same text","passed":true,"rtc":false,"pair":[]},{"id":"SB3078","type":"SB","num":3078,"title":"Loc Gov-Energy Storage Systems","raw":"LOC GOV-ENERGY STORAGE SYSTEMS","theme":"Solar, storage & distributed energy","issue":"storage-farmland","also":[],"chamber":"Senate","sponsor":"Christopher Belt","party":"D","cos":["Senator Doris Turner (D)","Senator Dale Fowler (R)","Senator Jil Tracy (R)","Senator Dave Syverson (R)","Senator Terri Bryant (R)","Senator Li Arellano, Jr. (R)"],"nCos":6,"bip":true,"committees":["Assignments (Senate)"],"statutes":["505 ILCS 147/10","505 ILCS 147/15","55 ILCS 5/5-12024"],"nStat":3,"amend":[],"summary":"Amends the Counties Code. In provisions concerning energy storage systems, provides that the farmland drainage plan that a facility owner must file with a county shall include, among other things, plans to repair any subsurface drainage affected during construction or deconstruction using procedures outlined in the agricultural impact mitigation agreement (rather than outlined in the decommissioning plan) and procedures for the repair and restoration of surface drainage affected during construction or deconstruction. Provides that a county shall (rather than may) require a facility owner to provide a decommissioning plan to the county. Makes changes to the requirements of a decommissioning plan. Provides that a county shall (rather than may) require the facility owner to submit to the county (i) a commercial operation a commissioning report meeting specified requirements of specified publications of the National Fire Protection Association; (ii) a hazard mitigation analysis meeting specified requirements of specified publications of the National Fire Protection Association; (iii) an emergency operations plan meeting specified requirements of specified publications of the National Fire Protection Association; and (iv) a warning that complies with specified publications of the National Fire Protection Association. Provides that the energy storage system owner shall enter into one agricultural impact mitigation agreement for each energy storage system. Requires the agricultural impact mitigation agreement for an energy storage system to include specified plans. Requires a commercial renewable energy facility owner to make available a copy of the signed agricultural impact mitigation agreement at the site of the commercial renewable energy facility during any construction or deconstruction activities. Makes other changes.","last":"Referred to Assignments","lastDate":"2026-01-29","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":["HB4956","SB3409"]},{"id":"SB3093","type":"SB","num":3093,"title":"Crim Code-Critical Infrastructure","raw":"CRIM CD-CRITICAL INFRASTRUCTRE","theme":"Technology, privacy & communications","issue":"crit-infra","also":[],"chamber":"Senate","sponsor":"Sue Rezin","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["720 ILCS 5/21-1from Ch. 38, par. 21-1","720 ILCS 5/21-8","720 ILCS 5/2-5.05 new"],"nStat":3,"amend":[],"summary":"Amends the Criminal Code of 2012. Provides that a person commits criminal damage to property when he or she intentionally damages, destroys, or tampers with equipment in a critical infrastructure facility without authorization from the critical infrastructure facility. Provides that a violation is: (1) a Class 4 felony when the damage to property does not exceed $500; (2) a Class 3 felony when the damage to property exceeds $500 but does not exceed $10,000; and (3) a Class 2 felony when the damage to property exceeds $10,000. Provides that a person may be liable in any civil action for money damages to the owner of the critical infrastructure facility for any damage resulting from a violation. Provides that it is an affirmative defense to a violation that the owner of the property or land damaged consented to the damage. Provides that a person may also be liable to the owner for court costs and reasonable attorney's fees resulting from a violation. Changes the name of the offense of criminal trespass to a nuclear facility to criminal trespass to a critical infrastructure facility. Includes as an element of the offense that the person must have the intent to damage, destroy, or tamper with equipment of the facility. Provides that a person may also be liable in a civil action for money damages to the owner of the critical infrastructure facility for any damage to personal or real property of the facility resulting from the trespass. Provides that a person may also be liable to the owner for court costs and reasonable attorney's fees. Defines\"critical infrastructure facility\" and\"with the intent to damage, destroy, or tamper with equipment of the facility\".","last":"Referred to Assignments","lastDate":"2026-01-29","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":[]},{"id":"SB3104","type":"SB","num":3104,"title":"Plug-In Solar Energy Systems","raw":"PLUG-IN SOLAR ENERGY SYSTEMS","theme":"Solar, storage & distributed energy","issue":"plugin-solar","also":[],"chamber":"Senate","sponsor":"Rachel Ventura","party":"D","cos":["Senator Graciela Guzman (D)","Senator Paul Faraci (D)","Senator Mark L. Walker (D)","Senator Cristina Castro (D)","Senator Mike Porfirio (D)","Senator David Koehler (D)","Senator Mary Edly-Allen (D)","Senator Karina Villa (D)","Senator Sara Feigenholtz (D)","Senator Emil Jones, III (D)","Senator Robert F. Martwick (D)","Senator Laura Fine (D)","Senator Mattie Hunter (D)","Senator Mike Simmons (D)","Senator Laura Ellman (D)","Senator Laura M. Murphy (D)"],"nCos":16,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["220 ILCS 5/16-107.5a new"],"nStat":1,"amend":["Senate Amendment 001","Senate Amendment 007","Senate Amendment 003","Senate Amendment 005","Senate Amendment 002","Senate Amendment 006","Senate Amendment 004"],"summary":"Amends the Public Utilities Act. Defines\"plug-in solar energy system\". Provides that an electricity provider shall not require an eligible customer who uses, or intends to install and use, a plug-in solar energy system to do certain actions. Provides that an eligible customer may, but shall not be required to, conform the eligible customer's plug-in solar energy system to the interconnection requirements under provisions concerning net metering and any rules adopted pursuant to those provisions. Provides that a plug-in solar energy system that does not interconnect to the electrical system in a manner that is consistent with the applicable rules adopted by the Illinois Commerce Commission shall not be eligible for net electricity metering. Provides that a plug-in solar energy system shall not qualify for any distributed generation rebate. Provides that an electricity provider shall not be liable for any damage or injury caused by an eligible customer's plug-in solar energy system. Provides that homeowners' associations, common interest community associations, and condominium unit owners' associations shall not adopt or enforce any covenant, bylaw, regulation, or other rule that unreasonably restricts or prohibits, or has the effect of prohibiting, the installation or use of a plug-in solar energy system that has a maximum power output to a receptacle outlet of 391 watts or less. Provides that landlords shall not adopt or enforce any lease or contract that unreasonably restricts or prohibits, or has the effect of prohibiting, the installation or use of a plug-in solar energy system that has a maximum power output to a receptacle outlet of 391 watts or less.","last":"Senate Committee Amendment No. 1 Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB4524"]},{"id":"SB3113","type":"SB","num":3113,"title":"Credit Unions-Various","raw":"CREDIT UNIONS-VARIOUS","theme":"Workforce, labor & tax incentives","issue":"credit-union","also":[],"chamber":"Senate","sponsor":"David Koehler","party":"D","cos":["Representative Jay Hoffman (D)"],"nCos":1,"bip":false,"committees":["Executive (House)","Rules (House)","Executive (Senate)","Financial Institutions (Senate)","Assignments (Senate)","Energy & Environment (House)"],"statutes":["205 ILCS 305/20from Ch. 17, par. 4421","205 ILCS 305/29from Ch. 17, par. 4430","205 ILCS 305/57.3 new","205 ILCS 305/57.5 new","205 ILCS 305/59from Ch. 17, par. 4460"],"nStat":5,"amend":["Senate Amendment 001","Senate Amendment 002","House Amendment 002","House Amendment 001"],"summary":"Amends the Illinois Credit Union Act. Provides that the business office for a credit union's registered agent may, but is not required to, be (instead of shall be) the same as the principal place of business of the credit union. In provisions concerning meetings of directors, sets forth provisions concerning the preparation and approval of meeting minutes. Adds provisions concerning disclosure and due diligence requirements for credit unions when providing digital asset services or contracting with a covered person or digital asset service provider and provisions concerning sales of debt cancellation services and products by a credit union to its members. In provisions concerning the investment of funds not used in loans, provides that the funds may be invested in commercial mortgage related securities and collateralized mortgage obligations to aid in the credit union's management of its assets, liabilities, and liquidity. Effective immediately.","last":"Passed Both Houses","lastDate":"2026-05-31","lastChamber":"Senate","stage":"Passed both houses","stageLabel":"Passed both houses","stageNote":"Both chambers approved the same text","passed":true,"rtc":false,"pair":[]},{"id":"SB3183","type":"SB","num":3183,"title":"Worker Protection Unit","raw":"WORKER PROTECTION UNIT","theme":"Workforce, labor & tax incentives","issue":"worker-protection","also":[],"chamber":"Senate","sponsor":"Omar Aquino","party":"D","cos":["Senator Michael E. Hastings (D)","Senator Michael W. Halpin (D)","Senator Graciela Guzman (D)","Senator Mike Porfirio (D)","Senator Mark L. Walker (D)","Senator Paul Faraci (D)","Senator Rachel Ventura (D)","Senator Cristina Castro (D)","Senator Laura M. Murphy (D)","Senator Emil Jones, III (D)","Senator Karina Villa (D)"],"nCos":11,"bip":false,"committees":["Judiciary (Senate)","Assignments (Senate)"],"statutes":["15 ILCS 205/6.3"],"nStat":1,"amend":["Senate Amendment 002","Senate Amendment 001"],"summary":"Amends the Attorney General Act. Provides that, prior to initiating an action, the Attorney General shall conduct an investigation and, in addition to other powers, may: (1) issue subpoenas for documents; (2) require written answers under oath to written interrogatories; (3) inspect the premises of an employer and inspect and make copies of employment-related records kept at the premises; and (4) conduct interviews with workers at an employer's premises during normal business or working hours. Sets forth additional provisions concerning investigations; interviews; subpoenas; obstruction; and search warrants.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-08","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB4725"]},{"id":"SB3234","type":"SB","num":3234,"title":"EPA-Greenhouse Gas-Equity","raw":"EPA-GREENHOUSE GAS-EQUITY","theme":"Environment, climate & EPA","issue":"ghg-equity-community","also":[],"chamber":"Senate","sponsor":"Bill Cunningham","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["415 ILCS 5/9.15"],"nStat":1,"amend":["Senate Amendment 001"],"summary":"Amends the Environmental Protection Act. In provisions establishing greenhouse gas emission reduction deadlines and requirements for electric generating units and large greenhouse gas-emitting units that use gas as a fuel, that are not public GHG-emitting units, and that are located within a specified distance of an equity investment eligible community, specifies that the equity investment eligible community must have been designated by the Restore, Reinvest, and Renew Program Board as of January 11, 2024 and must be located in an R3 Area established under the Cannabis Regulation and Tax Act.","last":"Senate Committee Amendment No. 1 Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-04-24","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["HB5479"]},{"id":"SB3245","type":"SB","num":3245,"title":"EPA-Air Pollution Setbacks","raw":"EPA-AIR POLLUTION SETBACKS","theme":"Environment, climate & EPA","issue":"air-setbacks","also":[],"chamber":"Senate","sponsor":"Laura Ellman","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["415 ILCS 5/9.21 new"],"nStat":1,"amend":[],"summary":"Amends the Environmental Protection Act. Provides that the Environmental Protection Agency shall propose and the Pollution Control Board shall adopt rules to ensure mandatory minimum distances are maintained between sources of air pollution and homes, schools, hospitals, and other similar sites in all applicable Clean Air Act permits to protect the public health, except as prohibited by federal law.","last":"Referred to Assignments","lastDate":"2026-02-03","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":[]},{"id":"SB3246","type":"SB","num":3246,"title":"Utilities-Hydrogen Batteries","raw":"UTILITIES-HYDROGEN BATTERIES","theme":"Solar, storage & distributed energy","issue":"storage-procure","also":[],"chamber":"Senate","sponsor":"Laura Ellman","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["20 ILCS 3855/1-75","220 ILCS 5/16-107.5","220 ILCS 5/16-107.6","220 ILCS 5/23-115","55 ILCS 5/5-12024"],"nStat":5,"amend":[],"summary":"Amends the Illinois Power Agency Act. In provisions concerning the Planning and Procurement Bureau, provides that the Illinois Power Agency shall conduct an initial energy storage procurement that results in electric utilities that served more than 300,000 customers in the State as of January 1, 2019 contracting for at least 1,038 megawatts of cost-effective stand-alone energy storage systems, excluding hydrogen batteries, that can achieve commercial operation on or before December 31, 2029 or an alternative date proposed by the Agency that is no later than December 31, 2030. Amends the Counties Code. In provisions concerning energy storage systems, provides that a county may require an energy storage facility to comply with the version of NFPA 855\"Standard for the Installation of Stationary Energy Storage Systems\", or, for hydrogen batteries, the version of NFPA 853\"Standard for the Installation of Stationary Fuel Cell Power Systems\", in effect on a certain date. Provides that a facility owner's decommissioning plan may include all requirements for decommissioning plans in NFPA 855 or NFPA 853 for hydrogen batteries. Amends the Public Utilities Act. In provisions concerning net electricity metering, provides that each electricity provider shall modify its tariffs to allow net metering for an energy storage system, except for hydrogen batteries, or vehicle storage system energized after a certain date with a nameplate capacity of not more than 5,000 kilowatts. In provisions concerning distributed generation rebates, provides that an energy storage system, except for hydrogen batteries, whether or not paired with distributed generation, shall be separately compensated at a base payment of $300 per kilowatt-hour of nameplate capacity until the threshold date. Provides that, after the threshold date, a stand-alone energy storage system, except for hydrogen batteries, shall be compensated with a rebate of $250 per kilowatt-hour of nameplate capacity. In provisions concerning the resolution of disputes between facility owners and units of local government related to the siting of qualified energy facilities, provides that an energy storage system, except for hydrogen batteries, shall be in compliance with provisions of the Counties Code concerning energy storage systems. Makes other changes.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-03-13","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":[]},{"id":"SB3268","type":"SB","num":3268,"title":"Residential Solar Permitting Platform","raw":"RES SOLAR PERMITTING PLATFORM","theme":"Solar, storage & distributed energy","issue":"solar-permitting","also":[],"chamber":"Senate","sponsor":"Laura Ellman","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["New Act"],"nStat":1,"amend":["Senate Amendment 002","Senate Amendment 003","Senate Amendment 001"],"summary":"Creates the Residential Automated Solar Permitting Platform Act. On or before July 1, 2027, municipalities and counties with a population of more than 10,000 residents must adopt a residential automated solar permitting platform. Requires that the municipality or county anticipate that the residential automated solar permitting platform will have the capability to process at least 75% of residential solar applications on existing construction submitted to authorities having jurisdiction in the State.\"Residential automated solar permitting platform\" means software or a combination of software that automates plan review, automatically produces code-compliant approvals, accepts online payments for permitting fees if permitting fees are levied, and instantly issues permits and permit revisions for residential photovoltaic systems upon online submission of permitting fee payments, if permitting fees are levied, and a code-compliant application. Provides that a person or entity whose rights have been violated under this Act by a municipality or county is entitled to collect: (1) in the case of unlawful retaliation, all legal or equitable relief as may be appropriate; and (2) attorney's fees and costs. Makes other changes.","last":"Senate Committee Amendment No. 3 Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-04-24","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":[]},{"id":"SB3272","type":"SB","num":3272,"title":"Renewable Energy Access Plans","raw":"RENEWABLE ENERGY ACCESS PLANS","theme":"Solar, storage & distributed energy","issue":"rea-plans","also":[],"chamber":"Senate","sponsor":"Bill Cunningham","party":"D","cos":["Representative Jay Hoffman (D)"],"nCos":1,"bip":false,"committees":["Rules (House)","Assignments (Senate)","Energy and Public Utilities (Senate)","Energy & Environment (House)"],"statutes":["220 ILCS 5/8-512","30 ILCS 500/1-10"],"nStat":2,"amend":["Senate Amendment 001"],"summary":"Amends the Public Utilities Act. Provides that, to assist and support the Illinois Commerce Commission in the development of renewable energy access plan updates, the Commission may retain the services of technical and policy experts with relevant expertise and experience. Provides that the procurement is exempt from the requirements of the Illinois Procurement Code. Amends the Illinois Procurement Code to make a conforming change. Effective immediately.","last":"Passed Both Houses","lastDate":"2026-05-21","lastChamber":"Senate","stage":"Passed both houses","stageLabel":"Passed both houses","stageNote":"Both chambers approved the same text","passed":true,"rtc":false,"pair":[]},{"id":"SB3273","type":"SB","num":3273,"title":"Utilities-Interconnections","raw":"UTILITIES-INTERCONNECTIONS","theme":"Solar, storage & distributed energy","issue":"school-interconnect","also":[],"chamber":"Senate","sponsor":"Bill Cunningham","party":"D","cos":["Senator Javier L. Cervantes (D)","Senator Chris Balkema (R)","Representative Jay Hoffman (D)"],"nCos":3,"bip":true,"committees":["Public Utilities (House)","Rules (House)","Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["220 ILCS 5/16-107.5","220 ILCS 5/17-900"],"nStat":2,"amend":["House Amendment 001","Senate Amendment 001"],"summary":"Amends the Public Utilities Act. Sets forth procedures for the processing of interconnection requests from applicants for distributed renewable generation projects on public school land. Provides that, for all net metering credits or other credits owed to a customer who has elected to install a distributed renewable generation project on public school land, all credits intended for the benefit of the consumer must be credited by the public utility or retail energy supplier within 90 days after the public utility or retail energy supplier determines that the criteria for the credit have been met. Provides that the Illinois Commerce Commission shall adopt revisions to its standards for the interconnection of eligible renewable generating equipment and net metering credit rules to conform with the requirements of the provisions of the amendatory Act. In provisions concerning customer self-generation of electricity, provides that, for distributed renewable generation projects on public school land, any fees for interconnection applications charged by the electric cooperative or municipal system must be substantially similar to the fees charged by public utilities for the interconnection of the same or similar projects and must not exceed 150% of the cost of the base interconnection fees of the other public utilities. Effective immediately.","last":"Passed Both Houses","lastDate":"2026-05-31","lastChamber":"Senate","stage":"Passed both houses","stageLabel":"Passed both houses","stageNote":"Both chambers approved the same text","passed":true,"rtc":false,"pair":[]},{"id":"SB3324","type":"SB","num":3324,"title":"Pollution Control Filing Fees","raw":"POLLUTION CONTROL FILING FEES","theme":"Environment, climate & EPA","issue":"filing-fees","also":[],"chamber":"Senate","sponsor":"Adriane Johnson","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["415 ILCS 5/7.5from Ch. 111 1/2, par. 1007.5"],"nStat":1,"amend":[],"summary":"Amends the Environmental Protection Act. In provisions concerning filing fees collected by the Pollution Control Board, provides that the Board may amend the filing fees through a rulemaking proceeding under Title VII of the Act.","last":"Referred to Assignments","lastDate":"2026-02-03","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":[]},{"id":"SB3332","type":"SB","num":3332,"title":"Alt Retail Electric Suppliers","raw":"ALT RETAIL ELECTRIC SUPPLIERS","theme":"Retail choice & procurement","issue":"ares-cert","also":[],"chamber":"Senate","sponsor":"Bill Cunningham","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["220 ILCS 5/16-115"],"nStat":1,"amend":[],"summary":"Amends the Public Utilities Act. In provisions concerning the certification of alternative retail electric suppliers, provides that the alternative retail electric supplier shall publish notice of its application in the official State newspaper within 14 days (rather than 10 days) following the date of its filing. Provides that, no later than 60 days (rather than 45 days) after a complete application is properly filed with the Commission, and such notice is published, the Commission shall issue its order granting or denying the application. Provides that, in determining the level of technical, financial, and managerial resources and abilities which an applicant must demonstrate, the Commission shall consider the applicant's commitment of resources to the management of its sales and marketing staff through affirmative managerial policies, independent audits, technology, hands-on field monitoring, and training and, for applicants who have sales personnel or sales agents within the State, the applicant's managerial presence within the State. Provides that the Commission shall grant the application for a certificate of service authority if it finds, among other things, that the applicant will comply with all applicable federal, State, regional, and industry rules, policies, practices, procedures, and tariffs for the use, operation, and maintenance of the safety, integrity, and reliability, of the interconnected electric transmission system.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-04-24","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB4876"]},{"id":"SB3393","type":"SB","num":3393,"title":"OSFM-Continuing Education","raw":"OSFM-CONTINUING EDUCATION","theme":"Workforce, labor & tax incentives","issue":"fire-sprinkler","also":[],"chamber":"Senate","sponsor":"Michael E. Hastings","party":"D","cos":["Representative Jay Hoffman (D)","Representative Marcus C. Evans, Jr. (D)","Representative Jawaharial Williams (D)","Representative Katie Stuart (D)"],"nCos":4,"bip":false,"committees":["Labor & Commerce (House)","Rules (House)","Licensed Activities (Senate)","Assignments (Senate)","Police & Fire Committee (House)"],"statutes":["225 ILCS 317/35"],"nStat":1,"amend":["House Amendment 001","House Amendment 004","House Amendment 002","House Amendment 003"],"summary":"Amends the Fire Sprinkler Contractor Licensing Act. Provides that the Office of the State Fire Marshal shall prepare a report evaluating the effectiveness and industry impacts of the continuing education requirements established under the Act. Requires the report to include recommendations for statutory or rule changes and to be delivered to the General Assembly by December 31, 2026. Effective immediately.","last":"Placed on Calendar Order of Concurrence House Amendment(s) 3, 4 - May 31, 2026","lastDate":"2026-05-31","lastChamber":"Senate","stage":"Floor action","stageLabel":"Floor action","stageNote":"Moving on the floor","passed":false,"rtc":false,"pair":[]},{"id":"SB3409","type":"SB","num":3409,"title":"Loc Gov-Energy Storage Systems","raw":"LOC GOV-ENERGY STORAGE SYSTEMS","theme":"Solar, storage & distributed energy","issue":"storage-farmland","also":[],"chamber":"Senate","sponsor":"Doris Turner","party":"D","cos":["Senator Sally J. Turner (R)","Senator David Koehler (D)","Senator Chapin Rose (R)","Senator Terri Bryant (R)","Senator Dave Syverson (R)","Senator Neil Anderson (R)","Senator Jil Tracy (R)","Senator Jason Plummer (R)","Senator Darby A. Hills (R)","Senator Chris Balkema (R)","Senator Li Arellano, Jr. (R)"],"nCos":11,"bip":true,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["505 ILCS 147/10","505 ILCS 147/15","55 ILCS 5/5-12024"],"nStat":3,"amend":[],"summary":"Amends the Counties Code. In provisions concerning energy storage systems, provides that the farmland drainage plan that a facility owner must file with a county shall include, among other things, plans to repair any subsurface drainage affected during construction or deconstruction using procedures outlined in the agricultural impact mitigation agreement (rather than outlined in the decommissioning plan) and procedures for the repair and restoration of surface drainage affected during construction or deconstruction. Provides that a county shall (rather than may) require a facility owner to provide a decommissioning plan to the county. Makes changes to the requirements of a decommissioning plan. Provides that a county shall (rather than may) require the facility owner to submit to the county (i) a commercial operation a commissioning report meeting specified requirements of specified publications of the National Fire Protection Association; (ii) a hazard mitigation analysis meeting specified requirements of specified publications of the National Fire Protection Association; (iii) an emergency operations plan meeting specified requirements of specified publications of the National Fire Protection Association; and (iv) a warning that complies with specified publications of the National Fire Protection Association. Provides that the energy storage system owner shall enter into one agricultural impact mitigation agreement for each energy storage system. Requires the agricultural impact mitigation agreement for an energy storage system to include specified plans. Requires a commercial renewable energy facility owner to make available a copy of the signed agricultural impact mitigation agreement at the site of the commercial renewable energy facility during any construction or deconstruction activities. Makes other changes.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-03-27","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["HB4956","SB3078"]},{"id":"SB3437","type":"SB","num":3437,"title":"DCEO-Various","raw":"DCEO-VARIOUS","theme":"Workforce, labor & tax incentives","issue":"dceo-various","also":[],"chamber":"Senate","sponsor":"Doris Turner","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["20 ILCS 3855/1-130","20 ILCS 5075/15","20 ILCS 5075/Act rep.","20 ILCS 5130/10","20 ILCS 5130/15","20 ILCS 605/605-300was 20 ILCS 605/46.2","20 ILCS 605/605-465","20 ILCS 605/605-503","20 ILCS 605/605-913","20 ILCS 655/12-9from Ch. 67 1/2, par. 626","220 ILCS 80/20","305 ILCS 20/5from Ch. 111 2/3, par. 1405","30 ILCS 738/40-40","30 ILCS 750/10-9from Ch. 127, par. 2710-9","30 ILCS 750/9-9from Ch. 127, par. 2709-9","35 ILCS 5/201","35 ILCS 5/220","35 ILCS 5/221","35 ILCS 5/231","410 ILCS 705/7-15","70 ILCS 518/20"],"nStat":21,"amend":[],"summary":"Repeals the Opportunities for At-Risk Women Act. Amends the Illinois Council on Women and Girls Act. Provides that the Council on Women and Girls may create the Opportunities for At-Risk Women Subcommittee to research and analyze organizations that support at-risk women in the State. Amends the Department of Commerce and Economic Opportunity Law of the Civil Administrative Code of Illinois. Provides that provisions requiring the Department of Commerce and Economic Opportunity's official website to contain a comprehensive list of State, local, and federal economic benefits available to businesses in each of the State's counties and municipalities are repealed on July 1, 2026. Provides that the following reports shall be filed on or before January 31 of each year (instead of January 1): a report on entrepreneurial assistance centers; reports on the Enterprise Zone Loan Fund and the Large Business Attraction Fund; and reports concerning cannabis social equity. Amends the Southeastern Illinois Economic Development Authority Act. Makes changes concerning the membership of the Board of the Southeastern Illinois Economic Development Authority. Amends the Illinois Income Tax Act. Extends the sunset for the apprenticeship education expense tax credit, the research and development tax credit, the angel investment tax credit, and the River Edge Redevelopment Zone tax credit. Effective immediately.","last":"Referred to Assignments","lastDate":"2026-02-04","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":["HB5470","SB3443"]},{"id":"SB3443","type":"SB","num":3443,"title":"DCEO-Various","raw":"DCEO-VARIOUS","theme":"Workforce, labor & tax incentives","issue":"dceo-various","also":[],"chamber":"Senate","sponsor":"Doris Turner","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Revenue (Senate)","Assignments (Senate)"],"statutes":["20 ILCS 3855/1-130","20 ILCS 5075/15","20 ILCS 605/605-300was 20 ILCS 605/46.2","20 ILCS 605/605-465","20 ILCS 605/605-503","20 ILCS 605/605-913","20 ILCS 655/12-9from Ch. 67 1/2, par. 626","220 ILCS 80/20","305 ILCS 20/5from Ch. 111 2/3, par. 1405","30 ILCS 738/40-40","30 ILCS 750/10-9from Ch. 127, par. 2710-9","30 ILCS 750/9-9from Ch. 127, par. 2709-9","35 ILCS 5/201","35 ILCS 5/220","35 ILCS 5/221","35 ILCS 5/231","410 ILCS 705/7-15","70 ILCS 518/20"],"nStat":18,"amend":[],"summary":"Amends the Department of Commerce and Economic Opportunity Law of the Civil Administrative Code of Illinois. Provides that provisions requiring the Department of Commerce and Economic Opportunity's official website to contain a comprehensive list of State, local, and federal economic benefits available to businesses in each of the State's counties and municipalities are repealed on July 1, 2026. Provides that the following reports shall be filed on or before January 31 of each year (instead of January 1): a report on entrepreneurial assistance centers; reports on the Enterprise Zone Loan Fund and the Large Business Attraction Fund; and reports concerning cannabis social equity. Amends the Southeastern Illinois Economic Development Authority Act. Makes changes concerning the membership of the Board of the Southeastern Illinois Economic Development Authority. Amends the Illinois Income Tax Act. Extends the sunset for the apprenticeship education expense tax credit, the research and development tax credit, the angel investment tax credit, and the River Edge Redevelopment Zone tax credit. Effective immediately.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB5470","SB3437"]},{"id":"SB3450","type":"SB","num":3450,"title":"Muni Code-Solar Energy System","raw":"MUNI CD-SOLAR ENERGY SYSTEM","theme":"Solar, storage & distributed energy","issue":"muni-solar-ban","also":[],"chamber":"Senate","sponsor":"Craig Wilcox","party":"R","cos":["Senator Donald P. DeWitte (R)","Senator Dave Syverson (R)","Senator Paul Faraci (D)","Senator Li Arellano, Jr. (R)","Senator Christopher Belt (D)","Senator Chris Balkema (R)","Senator Sue Rezin (R)"],"nCos":7,"bip":true,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["65 ILCS 5/11-15.5-10"],"nStat":1,"amend":[],"summary":"Amends the Illinois Municipal Code. Deletes a provision concerning the express prohibition of a municipality's adoption of any ordinance or resolution or the exercise of any power that prohibits or has the effect of prohibiting the installation of a solar energy system or low-voltage solar-powered devices. Provides that a municipality may regulate or prohibit the installation of a solar energy system or low-voltage solar-powered devices in a way that is consistent with the municipality's comprehensive plan or zoning authority.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-04-24","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":[]},{"id":"SB3465","type":"SB","num":3465,"title":"Construction-Sanitary Reqs","raw":"CONSTRUCTION-SANITARY REQS","theme":"Workforce, labor & tax incentives","issue":"sanitary","also":[],"chamber":"Senate","sponsor":"Mattie Hunter","party":"D","cos":["Senator Celina Villanueva (D)","Senator Adriane Johnson (D)","Senator Mike Porfirio (D)","Senator Javier L. Cervantes (D)","Senator Robert Peters (D)","Senator David Koehler (D)","Senator Mary Edly-Allen (D)","Senator Napoleon Harris, III (D)","Senator Emil Jones, III (D)","Senator Karina Villa (D)","Senator Sara Feigenholtz (D)","Representative Theresa Mah (D)","Representative Barbara Hernandez (D)","Representative Anne Stava-Murray (D)","Representative Kevin John Olickal (D)","Representative Will Guzzardi (D)","Representative Katie Stuart (D)","Representative Kelly M. Cassidy (D)","Representative Elizabeth Lisa Hernandez (D)","Representative Camille Y. Lilly (D)","Representative Aaron M. Ortiz (D)","Representative Suzanne M. Ness (D)","Representative Dagmara Avelar (D)","Representative Lilian Jim\u00e9nez (D)","Representative Joyce Mason (D)","Representative Natalie A. Manley (D)","Representative Mary Gill (D)","Representative Sharon Chung (D)","Representative Ann M. Williams (D)","Representative Margaret A. DeLaRosa (D)","Representative Michelle Mussman (D)","Representative Diane Blair-Sherlock (D)","Representative Laura Faver Dias (D)","Representative Norma Hernandez (D)","Representative Stephanie A. Kifowit (D)","Representative Sue Scherer (D)","Representative Amy Briel (D)","Representative Rick Ryan (D)","Representative Harry Benton (D)","Representative Gregg Johnson (D)"],"nCos":40,"bip":false,"committees":["Labor & Commerce (House)","Rules (House)","Assignments (Senate)","Labor (Senate)"],"statutes":["410 ILCS 37/1","410 ILCS 37/10","410 ILCS 37/10.5 new","410 ILCS 37/15","410 ILCS 37/20","410 ILCS 37/5"],"nStat":6,"amend":["House Amendment 001","Senate Amendment 001"],"summary":"Amends the Construction Site Temporary Restroom Facility Act. Changes the Act's short title to the Construction Site Temporary Restroom Facility and Sanitary Conditions for Menstruation and Lactation Act. Repeals a provision which specifies that separate toileting facilities are not required for males and females if individual portable toilet facilities are used by an owner of a portable building or building under construction to provide access to a restroom. Provides that, if a woman or an individual who menstruates is present on a work site and there are 10 or more workers of any gender at the work site, then a separate toilet facility shall be provided at the work site and designated for use by women and individuals who menstruate. Requires employers in the construction industry to provide their workers who menstruate and are performing construction activities on a work site with minimum sanitary conditions. Describes the required minimum sanitary conditions. Requires employers in the construction industry, upon request, to provide their workers who are lactating and performing construction activities on a work site with reasonable accommodations needed to express breast milk. Describes reasonable accommodations for lactation. Provides that, on or before January 1, 2027, the Department of Public Health shall provide guidance to employers on the accommodations to be provided. Authorizes employees of construction sites to call the certified local public health agency with jurisdiction over a construction site to request an inspection if noncompliance with the Act is suspected. Prohibits retaliation by employers if a call is made by an employee on a construction site for suspected noncompliance with the Act. Provides that any owner who fails or refuses to comply with the provisions of the Act commits a petty offense and is subject to a fine to be determined by the certified local public health agency (rather than only being subject to a petty offense). Defines\"employer\". Effective immediately.","last":"Passed Both Houses","lastDate":"2026-05-31","lastChamber":"Senate","stage":"Passed both houses","stageLabel":"Passed both houses","stageNote":"Both chambers approved the same text","passed":true,"rtc":false,"pair":[]},{"id":"SB3488","type":"SB","num":3488,"title":"Wind & Solar Affect Water Flow","raw":"WIND & SOLAR AFFECT WATER FLOW","theme":"Transmission, siting & land","issue":"drainage","also":[],"chamber":"Senate","sponsor":"Sally J. Turner","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["55 ILCS 5/5-12020"],"nStat":1,"amend":[],"summary":"Amends the Counties Code. Provides that the owner of a commercial wind energy facility or commercial solar energy facility must compensate landowners in full if the facility adversely affects the flow of water within the landowner's land, land adjoining landowner's land, or drainage district land, including, but not limited to, by affecting a drainage tile. Provides that the compensation shall be determined by the Department of Agriculture.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-04-24","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["HB5477"]},{"id":"SB3497","type":"SB","num":3497,"title":"Utility-Recoverable Expenses","raw":"UTILITY-RECOVERABLE EXPENSES","theme":"Utility rates, cost recovery & regulation","issue":"recoverable","also":[],"chamber":"Senate","sponsor":"Suzy Glowiak Hilton","party":"D","cos":["Senator Cristina Castro (D)","Senator Laura Fine (D)","Senator Graciela Guzman (D)","Senator Rachel Ventura (D)","Senator Laura M. Murphy (D)","Senator Linda Holmes (D)","Senator Napoleon Harris, III (D)","Senator Doris Turner (D)","Senator Mary Edly-Allen (D)","Senator Mike Simmons (D)"],"nCos":10,"bip":false,"committees":["Executive (Senate)","Assignments (Senate)"],"statutes":["220 ILCS 5/9-224.1 new","220 ILCS 5/9-224from Ch. 111 2/3, par. 9-224","220 ILCS 5/9-225from Ch. 111 2/3, par. 9-225","220 ILCS 5/9-229"],"nStat":4,"amend":[],"summary":"Amends the Public Utilities Act. In provisions concerning expenses that are recoverable by a public utility, provides that the Illinois Commerce Commission shall not consider as an expense of any public utility company, for the purpose of determining any rate or charge, any amount expended for political activity or lobbying, any amount expended for contributions to a trade association or a chamber of commerce, and any amount expended by a public utility for director and officer liability insurance and fiduciary liability insurance. Provides that, in determining whether the purchase of other types of insurance by a public utility is recoverable, the Commission shall determine whether the specific type of insurance is financially beneficial to the public utility's ratepayers or the public utility's shareholders. Provides that, if the Commission determines that the insurance purchased by the public utility is financially beneficial to its shareholders, then the purchase of the insurance shall not be a recoverable expense. Provides that goodwill or institutional advertising shall not be a recoverable expense by a public utility. Provides that the Commission shall deem as a nonrecoverable expense by a public utility (rather than the Commission shall specifically assess the justness and reasonableness of) any amount expended by a public utility to compensate attorneys or t
