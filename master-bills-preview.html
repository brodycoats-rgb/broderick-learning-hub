<style>
:root{
  --bg:#f1f3f6; --surface:#ffffff; --surface-2:#f6f7f9;
  --ink:#12161d; --ink-2:#465061; --ink-3:#667085;
  --line:#e2e5ea; --line-2:#c9ced6;
  --accent:#1f63bd; --accent-ink:#ffffff; --accent-wash:#e7eefa;
  --st-pass:#2a8a5c; --st-floor:#2a78d6; --st-dead:#8b94a3; --st-none:#eda100;
  --warn-wash:#fdf3dc; --warn-ink:#7a5200; --shadow:0 12px 40px rgba(16,24,40,.22);
  --serif:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --surface:#161a21; --surface-2:#1b2029;
    --ink:#eef1f5; --ink-2:#b3bbc8; --ink-3:#8b94a3;
    --line:#262c36; --line-2:#363d4a;
    --accent:#6da7ec; --accent-ink:#0e1116; --accent-wash:#1a2740;
    --st-pass:#4fb985; --st-floor:#5a9fe8; --st-dead:#6b7585; --st-none:#d9a21f;
    --warn-wash:#2c2310; --warn-ink:#f0c46a; --shadow:0 12px 40px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#161a21; --surface-2:#1b2029;
  --ink:#eef1f5; --ink-2:#b3bbc8; --ink-3:#8b94a3;
  --line:#262c36; --line-2:#363d4a;
  --accent:#6da7ec; --accent-ink:#0e1116; --accent-wash:#1a2740;
  --st-pass:#4fb985; --st-floor:#5a9fe8; --st-dead:#6b7585; --st-none:#d9a21f;
  --warn-wash:#2c2310; --warn-ink:#f0c46a; --shadow:0 12px 40px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.hubbar{padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);font-size:14px}
.hubbar b{font-family:var(--serif);color:var(--accent)}
.wrap{max-width:1240px;margin-inline:auto;padding:20px 16px 72px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h1{font-family:var(--serif);font-weight:700;font-size:32px;line-height:1.15;letter-spacing:-.01em;margin-top:4px;text-wrap:balance}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:7px 12px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.small{padding:4px 9px;font-size:13px}
.fresh{display:inline-flex;align-items:center;gap:8px;background:var(--warn-wash);color:var(--warn-ink);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.fresh::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--st-none)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--bg);z-index:5;padding-top:6px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;min-width:0}
.card h2{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.25}
.card .sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.tile .k{font-size:13px;color:var(--ink-2);font-weight:600}
.tile .v{font-size:34px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.tile .v small{font-size:15px;font-weight:600;color:var(--ink-3);margin-left:6px}
.tile .d{font-size:13px;color:var(--ink-3)}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:250px minmax(0,1fr) 40px;gap:12px;align-items:center;min-height:26px}
.row .lbl{font-size:13px;color:var(--ink-2);text-align:left;background:none;border:0;padding:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .lbl:hover{color:var(--accent);text-decoration:underline}
.row .n{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:2px;height:18px}
.bar .seg{border-radius:2px;min-width:3px}
.bar .seg:last-child{border-radius:2px 4px 4px 2px}
.bar.one .seg{background:var(--accent)}
.s-pass{background:var(--st-pass)} .s-floor{background:var(--st-floor)} .s-dead{background:var(--st-dead)} .s-none{background:var(--st-none)} .s-spons{background:var(--line-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip .sw{width:8px;height:8px;border-radius:50%}
.chip.rtc{background:var(--accent-wash);border-color:transparent;color:var(--accent)}
.note{background:var(--warn-wash);color:var(--warn-ink);border-radius:8px;padding:10px 14px;font-size:13px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big b{font-size:48px;font-family:var(--serif);line-height:1}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;border-bottom:1px solid var(--line-2);padding:0 2px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.col i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.col span{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.collab{display:flex;gap:6px;padding:4px 2px 0}
.collab span{flex:1;text-align:center;font-size:11px;color:var(--ink-3)}
.cat-card{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;cursor:pointer}
.cat-card:hover{border-color:var(--accent)}
.cat-card h3{font-family:var(--serif);font-size:17px;font-weight:600}
.cat-card p{color:var(--ink-2);font-size:13px}
.cat-card .cnt{font-size:12px;color:var(--ink-3);font-weight:600}
.billref{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:2px}
.billref:hover{text-decoration-color:currentColor}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:6px 10px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.count{color:var(--ink-3);font-size:13px;margin:4px 0 8px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
th button{background:none;border:0;padding:0;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;cursor:pointer}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td.id{font-weight:700;white-space:nowrap}
.ttl{background:none;border:0;padding:0;text-align:left;color:var(--ink);font-weight:600;cursor:pointer}
.ttl:hover{color:var(--accent);text-decoration:underline}
.hl{color:var(--ink-3);font-size:13px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.pill .sw{border-radius:50%}
.issue{border-top:1px solid var(--line);padding:12px 0}
.issue:first-child{border-top:0}
.issue h4{font-size:15px;font-weight:600}
.issue .bl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chipbtn{border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:2px 10px;font-weight:600;font-size:12px;cursor:pointer;color:var(--accent)}
.chipbtn:hover{border-color:var(--accent)}
.back{margin-bottom:6px}
/* drawer */
#overlay{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:50;display:none;justify-content:flex-end}
#overlay.on{display:flex}
.drawer{background:var(--surface);width:min(760px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);padding:0}
.dhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;gap:8px;align-items:center;justify-content:space-between;z-index:2}
.dbody{padding:18px 22px 60px;display:flex;flex-direction:column;gap:18px}
.dbody h2{font-family:var(--serif);font-size:25px;line-height:1.2;font-weight:700}
.dbody h3{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:6px}
.dbody p,.dbody li{color:var(--ink-2);font-size:14.5px}
.dbody ul{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.sec{border-top:1px solid var(--line);padding-top:14px}

.plain p{font-size:15px;color:var(--ink);margin:0 0 10px}
.ex{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:6px;padding:10px 14px;font-size:14px;color:var(--ink-2)}
.ex b{color:var(--ink)}
.viz{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.viz h4{margin:0 0 10px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.vflow{display:flex;flex-direction:column;gap:0}
.vflow .vs1{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13.5px;color:var(--ink);display:flex;gap:10px;align-items:center}
.vflow .vs1 i{font-style:normal;flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center}
.vflow .varrow{height:12px;margin-left:21px;border-left:2px solid var(--line-2)}
.vvs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vvs>div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.vvs h5{margin:0 0 6px;font-size:13px;color:var(--accent)}
.vvs ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.vbars .vb{display:grid;grid-template-columns:minmax(120px,40%) 1fr auto;gap:8px;align-items:center;font-size:13px;margin:5px 0;color:var(--ink-2)}
.vbars .vt{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.vbars .vt span{display:block;height:100%;background:var(--accent);border-radius:6px}
.vbars .vn{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.vunit{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.who{display:grid;gap:8px}
.who div{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}
.who b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}
.who span{color:var(--ink-2);font-size:13.5px}
.newsl a{display:block;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface);margin-bottom:8px;color:var(--ink)}
.newsl a:hover{border-color:var(--accent)}
.newsl small{display:block;color:var(--ink-3)}
@media (max-width:640px){.vvs{grid-template-columns:1fr}.vbars .vb{grid-template-columns:1fr auto}.vbars .vt{grid-column:1/-1}}
.lead{background:var(--accent-wash);border-radius:8px;padding:14px 16px;color:var(--ink)!important;font-size:15.5px!important}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 12px;font-size:14px}
.kv dt{color:var(--ink-3);font-weight:600} .kv dd{margin:0;color:var(--ink-2)}
.track{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.step{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid var(--line-2);color:var(--ink-3)}
.step.done{background:var(--accent-wash);border-color:transparent;color:var(--accent)}
.step.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
details summary{cursor:pointer;font-weight:600;color:var(--accent)}
details[open] summary{margin-bottom:8px}
.legal{font-size:12.5px;color:var(--ink-3)}
.stepper{display:flex;flex-direction:column;gap:6px}
.stp{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;width:100%}
.stp:hover,.stp[aria-expanded=true]{border-color:var(--accent)}
.stp .no{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.stp b{display:block;font-weight:600}
.stp .d{display:none;color:var(--ink-2);margin-top:4px;font-size:13.5px}
.stp[aria-expanded=true] .d{display:block}
.stp .c{font-size:12px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.glos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px}
.glos div{border-top:1px solid var(--line);padding-top:8px}
.glos b{display:block;font-weight:600}
.glos span{color:var(--ink-2);font-size:13.5px}
.foot{color:var(--ink-3);font-size:12.5px}
@media (max-width:900px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid3,.glos{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:minmax(0,1fr) 36px;gap:4px 8px}
  .row .lbl{grid-column:1 / span 2} .row .bar{grid-column:1} .row .n{grid-column:2}
  h1{font-size:26px}
  .kv{grid-template-columns:100px minmax(0,1fr)}
}
@media (prefers-reduced-motion: no-preference){.tile,.btn,.cat-card{transition:border-color .12s,color .12s}}

":[],"summary":"Amends the Electric Service Customer Choice and Rate Relief Law of 1997 of the Public Utilities Act. Provides that a public service company that is a member of a Regional Transmission Organization shall submit a report to the Illinois Commerce Commission on or before February 1 of each year of any recorded vote cast by the public service company during the immediately preceding calendar year. Provides that a public service company that is a member of a Regional Transmission Organization shall include in the report any recorded vote cast by an affiliate at a meeting of a Regional Transmission Organization during the immediately preceding calendar year. Provides that the report shall include: (i) all recorded votes cast by the public service company, regardless of whether the vote is otherwise disclosed; (ii) all votes cast by an affiliate of the public service company, if the public service company did not vote on the matter; and (iii) a brief description explaining how each vote cast by the public service company or its affiliate, as appropriate, is in the interest of the public.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"HB2789","type":"HB","num":2789,"title":"Property Tax-Mega Project","raw":"PROP TX-MEGA PROJECT","theme":"Workforce, labor & tax incentives","issue":"megaproject","also":["Data centers & large load"],"chamber":"House","sponsor":"Mary Beth Canty","party":"D","cos":["Representative Anthony DeLuca (D)","Representative Tracy Katz Muhl (D)","Representative Nicolle Grasse (D)","Representative Daniel Didech (D)","Representative Dagmara Avelar (D)","Representative Michelle Mussman (D)"],"nCos":6,"bip":false,"committees":["Rules (House)","Revenue & Finance (House)","Tax Credit and Incentives (House)"],"statutes":["35 ILCS 200/10-900 new","35 ILCS 200/10-905 new","35 ILCS 200/10-910 new","35 ILCS 200/10-915 new","35 ILCS 200/10-920 new","35 ILCS 200/10-925 new","35 ILCS 200/10-930 new","35 ILCS 200/10-935 new","35 ILCS 200/10-940 new","35 ILCS 200/10-945 new","35 ILCS 200/10-950 new","35 ILCS 200/10-955 new","35 ILCS 200/10-960 new","35 ILCS 200/10-965 new","35 ILCS 200/10-970 new","35 ILCS 200/10-980 new","35 ILCS 200/10-990 new","35 ILCS 200/Art. 10 Div. 22 heading new"],"nStat":18,"amend":[],"summary":"Amends the Property Tax Code. Provides that property certified by the Department of Revenue as mega project property is eligible for an assessment freeze. Provides that, if property is certified as mega project property, then, during the incentive period, the value added to the property by the project shall not be considered for assessment purposes, and the total valuation of the property during the incentive period shall be limited to the base year valuation. Provides that\"mega project\" means a project that satisfies certain minimum investment, investment period, and other requirements. Contains provisions concerning incentive agreements between a company that plans to undertake a mega project and a local municipality obligating the company to make special payments in addition to property taxes. Effective June 1, 2025.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB4564"]},{"id":"HB3596","type":"HB","num":3596,"title":"Wetlands Protection Act","raw":"WETLANDS PROTECTION ACT","theme":"Environment, climate & EPA","issue":"wetlands","also":[],"chamber":"House","sponsor":"Carol Ammons","party":"D","cos":["Representative Laura Faver Dias (D)","Representative Emanuel Chris Welch (D)","Representative Anne Stava-Murray (D)","Representative Lindsey LaPointe (D)","Representative Nabeela Syed (D)","Representative Theresa Mah (D)","Representative Will Guzzardi (D)","Representative Maura Hirschauer (D)","Representative Janet Yang Rohr (D)","Representative Margaret Croke (D)","Representative Kevin John Olickal (D)","Representative Ann M. Williams (D)","Representative Hoan Huynh (D)","Representative Daniel Didech (D)","Representative Barbara Hernandez (D)","Representative Jennifer Gong-Gershowitz (D)","Representative Tracy Katz Muhl (D)","Representative Martha Deuter (D)","Representative Elizabeth Lisa Hernandez (D)","Representative Diane Blair-Sherlock (D)","Representative Rita Mayfield (D)","Representative Michelle Mussman (D)","Representative Maurice A. West, II (D)","Representative Lilian Jim\u00e9nez (D)","Representative Justin Cochran (D)","Representative Kelly M. Cassidy (D)","Representative Yolonda Morris (D)","Representative Edgar Gonzalez, Jr. (D)","Representative Matt Hanson (D)","Representative Mary Beth Canty (D)","Representative Bob Morgan (D)","Representative Joyce Mason (D)","Representative Robyn Gabel (D)","Representative Dagmara Avelar (D)","Representative Stephanie A. Kifowit (D)","Representative Norma Hernandez (D)","Representative Sonya M. Harper (D)","Representative Jaime M. Andrade, Jr. (D)","Representative Camille Y. Lilly (D)","Representative Jehan Gordon-Booth (D)","Representative Suzanne M. Ness (D)","Representative La Shawn K. Ford (D)"],"nCos":42,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["30 ILCS 105/5.1030 new","New Act"],"nStat":2,"amend":["House Amendment 001","House Amendment 002"],"summary":"Creates the Wetlands Protection Act. Provides that no person may discharge dredged or fill material into a State jurisdictional wetland except with a permit issued by the Department of Natural Resources. Exempts certain activities from the requirements of the Act. Sets forth procedures for individual permit applications and other related procedural requirements. Provides that the Department shall not issue an individual permit unless the Environmental Protection Agency certifies to the Department that there will not be a violation of State water quality standards. Provides that the Department may issue an after-the-fact permit in certain emergency circumstances. Sets forth financial assurance requirements. Authorizes the Department to adopt general permits under the Act. Provides that any person who intends to conduct a regulated activity may do so in accordance with a general permit issued by the Department, which pre-authorizes a category of activities with minimal adverse effects. Provides procedures and requirements regarding preconstruction notifications. Provides that certain entities may establish and operate a mitigation bank or in lieu fee program. Describes procedures and requirements for mitigation banks. Grants the Department rulemaking powers. Provides that the Department shall prepare certain reports and studies. Provides for the review of final decisions of the Department. Provides for investigations by the Department and enforcement by a State's Attorney or the Attorney General. Provides for a civil penalty not to exceed $10,000 per day of violation, with interest after judgment, and with certain costs, fees, and expenses, payable to the Wetlands Protection Fund. Provides that any person may file a complaint with the Illinois Pollution Control Board concerning a violation of the Act, a rule adopted under the Act, a condition of a permit issued under the Act, or an order of the Pollution Control Board issued under the Act. Provides for county and special district stormwater program authorities to control or regulate activities in any wetlands within their jurisdiction. Establishes the Wetlands Protection Fund. Provides that a permit review fee for all permit applications is to be set by the Department by rule. Makes corresponding changes to the State Finance Act. Makes findings. Defines terms. Effective immediately.","last":"House Floor Amendment No. 2 Rule 19(c) / Re-referred to Rules Committee","lastDate":"2026-04-17","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["SB2401"]},{"id":"HB4172","type":"HB","num":4172,"title":"Utility-Project Cost Recovery","raw":"UTILITY-PROJECT COST RECOVERY","theme":"Utility rates, cost recovery & regulation","issue":"lg-load-deposits","also":["Data centers & large load"],"chamber":"House","sponsor":"Dave Vella","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)"],"statutes":["220 ILCS 5/16-108"],"nStat":1,"amend":[],"summary":"Amends the Public Utilities Act. In provisions concerning the recovery of costs associated with the provision of delivery and other services, provides that electric utilities shall not require or collect any security deposit, cash deposit, letter of credit, advance payment, or any other equivalent financial assurance from a large demand project applicant who submits a service or interconnection request if that applicant (1) submitted an application for interconnection or service under existing Commission-approved tariffs and (2) is in good standing with the interconnection and construction requirements applicable to the applicant's service request. Provides that electric utilities shall not delay investment to support, provide service, or interconnect large demand project applicants as a result of the changes made by the amendatory provisions. Provides that the amendatory provisions shall not be construed to limit the following: (1) a utility's enforcement of Commission-approved technical standards for interconnection, (2) a utility's enforcement of reasonable milestones for construction progress, and (3) a utility's ability to recover all costs prudently and reasonably incurred. Provides that the amendatory provisions are inoperative September 1, 2026. Defines\"large demand project applicant\". Effective immediately.","last":"Referred to Rules Committee","lastDate":"2025-10-28","lastChamber":"House","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":[]},{"id":"HB4272","type":"HB","num":4272,"title":"Gas Appliance Labeling","raw":"GAS APPLIANCE LABELING","theme":"Gas & building decarbonization","issue":"gas-label","also":[],"chamber":"House","sponsor":"Kelly M. Cassidy","party":"D","cos":["Representative Diane Blair-Sherlock (D)","Representative Lisa Davis (D)","Representative Yolonda Morris (D)"],"nCos":3,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["815 ILCS 505/2MMMM new"],"nStat":1,"amend":[],"summary":"Amends the Consumer Fraud and Deceptive Business Practices Act. Provides that no person shall sell, attempt to sell, or offer to sell to a consumer in the State a non-externally vented natural gas appliance that is manufactured on or after January 1, 2027 unless a label on the gas appliance bears a specified warning message. Provides that the Attorney General may adopt rules setting forth additional requirements for the placement and formatting of the label. Provides that a person who violates the provision commits an unlawful practice within the meaning of the Act.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["SB3974"]},{"id":"HB4313","type":"HB","num":4313,"title":"Alt Retail Electric Supplier","raw":"ALT RETAIL ELECTRIC SUPPLIER","theme":"Retail choice & procurement","issue":"ares-disclosure","also":[],"chamber":"House","sponsor":"Dagmara Avelar","party":"D","cos":["Representative Lisa Davis (D)","Representative Michael Crawford (D)","Representative Katie Stuart (D)","Representative Laura Faver Dias (D)"],"nCos":4,"bip":false,"committees":["Public Utilities (House)","Rules (House)"],"statutes":["220 ILCS 5/16-115A","220 ILCS 5/16-118","220 ILCS 5/19-115","815 ILCS 505/2DDD","815 ILCS 505/2EE"],"nStat":5,"amend":["House Amendment 001"],"summary":"Amends the Public Utilities Act. In provisions concerning the obligations of alternative retail electric suppliers and provisions concerning the obligations of alternative gas suppliers, provides that the alternative retail electric supplier or alternative gas supplier shall submit to the Illinois Commerce Commission and the Office of the Attorney General certain information about rates that the alternative retail electric supplier or alternative gas supplier charged to residential customers in the prior year, including the number of customers that were enrolled for each rate. Provides that an alternative retail electric supplier or alternative gas supplier shall not pay a commission or any other incentive-based compensation to individuals engaged in in-person solicitation or telemarketing and shall not charge a rate that is more than 25% higher than the current electric supply price or current monthly gas supply rate to any residential or small commercial retail customer at any time. In provisions concerning alternative retail electric supplier selection and provisions concerning alternative gas suppliers, provides that an alternative retail electric supplier or an alternative gas supplier shall not automatically renew a consumer's enrollment after the current term of the contract expires when the renewed contract provides that the consumer will be charged a rate that is higher than the consumer's current contract rate unless: (i) the alternative retail electric supplier or alternative gas supplier complies with certain provisions concerning contract renewal; and (ii) the customer expressly consents to the contract renewal in writing or by electronic signature at least 30 days, but no more than 60 days, before the contract expires. Makes other changes.","last":"House Committee Amendment No. 1 Rule 19(c) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"HB4319","type":"HB","num":4319,"title":"Data Center-Property Rights","raw":"DATA CENTER-PROPERTY RTS","theme":"Data centers & large load","issue":"dc-property","also":[],"chamber":"House","sponsor":"Jed Davis","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)"],"statutes":["New Act"],"nStat":1,"amend":[],"summary":"Creates the Property Owner Protection from Data Center Impacts Act. Makes a property owner eligible for compensation for harm materially and proximately caused by the construction or operation of a data center if the affected property is located within 1,000 feet of the data center and if the data center has caused measurable reduction in fair market value, reduction in business revenue, or adverse environmental or operational impacts, such as noise, vibration, traffic, stormwater burden, or lighting. Creates an appraisal procedure to evaluate the data center's impact on the property owner. Provides a compensation formula to determine real property compensation and business loss compensation. Authorizes a property owner to bring a civil action seeking specified damages and attorney's fees and costs. Creates other remedies for enforcement of the Act. Makes legislative findings. Limits the concurrent exercise of home rule powers.","last":"Referred to Rules Committee","lastDate":"2026-01-14","lastChamber":"House","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":[]},{"id":"HB4355","type":"HB","num":4355,"title":"ICC Transparency Reporting","raw":"ICC TRANSPARENCY REPORTING","theme":"Utility rates, cost recovery & regulation","issue":"icc-transparency","also":[],"chamber":"House","sponsor":"Dave Vella","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)"],"statutes":["220 ILCS 5/5-118 new"],"nStat":1,"amend":[],"summary":"Amends the Public Utilities Act. Provides that the Illinois Commerce Commission shall require all gas, electric, and water utilities under its authority to submit an annual report to the Commission no later than one year after the effective date of the amendatory Act, and every year thereafter, on the utility's efforts in implementing and maintaining transparency in the utility's billing process. Provides that the Commission shall establish, by rule, requirements for the content and structure of the annual report.","last":"Referred to Rules Committee","lastDate":"2026-01-14","lastChamber":"House","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":[]},{"id":"HB4371","type":"HB","num":4371,"title":"Portable Solar Generation","raw":"PORTABLE SOLAR GENERATION","theme":"Solar, storage & distributed energy","issue":"portable-solar","also":[],"chamber":"House","sponsor":"Eva-Dina Delgado","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Public Utilities (House)","Rules (House)","Utilities (House)"],"statutes":["220 ILCS 5/16-107.5a new"],"nStat":1,"amend":[],"summary":"Amends the Public Utilities Act. Provides that a portable solar generation device shall be exempt from (i) net metering program and interconnection requirements under provisions concerning net electricity metering and (ii) any rules adopted pursuant to those provisions. Provides that a portable solar generation device shall include a device or feature that prevents the portable solar generation device from energizing a building's electrical system during a power outage. Provides that an electricity provider shall not require an eligible customer who uses, or intends to install and use, a portable solar generation device to do any of the following: (1) obtain the electricity provider's approval before installing or using the portable solar generation device; (2) pay a fee or charge related to the installation or use of the portable solar generation device; or (3) install additional controls or equipment beyond what is integrated into the portable solar generation device. Provides that an electricity provider shall not be liable for any damage or injury caused by an eligible customer's portable solar generation device.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB4516"]},{"id":"HB4419","type":"HB","num":4419,"title":"County/Muni-Natural Gas","raw":"COUNTY/MUNI-NATURAL GAS","theme":"Gas & building decarbonization","issue":"gas-ban-preempt","also":[],"chamber":"House","sponsor":"Jackie Haas","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)"],"statutes":["55 ILCS 5/5-1195 new","65 ILCS 5/11-30-11 new"],"nStat":2,"amend":[],"summary":"Amends the Counties Code and the Illinois Municipal Code. Provides that a county or municipality may not adopt any regulation that prohibits or has the effect of prohibiting the use of natural gas in new construction without a referendum. Limits the concurrent exercise of home rule powers.","last":"Referred to Rules Committee","lastDate":"2026-01-14","lastChamber":"House","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":["SB2979"]},{"id":"HB4456","type":"HB","num":4456,"title":"Low-Income Utility Rates","raw":"LOW-INCOME UTILITY RATES","theme":"Utility rates, cost recovery & regulation","issue":"low-income-rate","also":[],"chamber":"House","sponsor":"Laura Faver Dias","party":"D","cos":["Representative Dagmara Avelar (D)","Representative Nabeela Syed (D)","Representative Maura Hirschauer (D)","Representative Barbara Hernandez (D)","Senator Adriane Johnson (D)","Senator Willie Preston (D)","Senator Lakesia Collins (D)","Senator Mary Edly-Allen (D)","Senator Sara Feigenholtz (D)","Senator Laura Ellman (D)"],"nCos":10,"bip":false,"committees":["Public Utilities (House)","Rules (House)","Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["220 ILCS 5/9-241from Ch. 111 2/3, par. 9-241","305 ILCS 20/13","305 ILCS 20/6from Ch. 111 2/3, par. 1406"],"nStat":3,"amend":["House Amendment 001","House Amendment 002"],"summary":"Amends the Public Utilities Act. In provisions concerning nondiscrimination, provides that the Commission is authorized to approve a low-income discount rate for residential electric and natural gas customers that applies to the entirety of a qualifying customer's bill, including, but not limited to, a qualifying customer's delivery service charges and energy supply charges. Provides that an electric or natural gas utility may fund low-income discount rates through a surcharge on customers' electric and natural gas bills. Provides that the changes to the Act apply retroactively on and after January 1, 2023. Amends the Energy Assistance Act. In provisions concerning eligibility under the Act, provides that, in setting the annual eligibility level for the use of State funds from the Supplemental Low-Income Energy Assistance Fund, the Department of Commerce and Economic Opportunity shall consider the amount of available funding and may not set a limit higher than 300% of the federal nonfarm poverty level. In provisions concerning the Supplemental Low-Income Energy Assistance Fund, provides that the yearly administrative expenses of the Fund may not exceed 15% (rather than 13%) of the amount collected during that year, except when unspent funds from the Fund are reallocated from a previous year. Provides that any unspent balance of the 15% administrative allowance may be utilized for administrative expenses in the year they are reallocated. Provides that, of the 15% administrative allowance, no less than 9% (rather than 8%) shall be provided to Local Administrative Agencies for administrative expenses. Provides that, beginning January 1, 2027, the Base Energy Assistance Charge shall be $0.80 per month for each utility that is required by the Illinois Commerce Commission to implement a low-income discount rate and shall be $0.40 per month for each utility that is not required to implement a low-income discount rate and that contributes to the Supplemental Low-Income Energy Assistance Fund. Makes other changes.","last":"Passed Both Houses","lastDate":"2026-05-19","lastChamber":"House","stage":"Passed both houses","stageLabel":"Passed both houses","stageNote":"Both chambers approved the same text","passed":true,"rtc":false,"pair":["SB3717"]},{"id":"HB4514","type":"HB","num":4514,"title":"General Rate Increase Hearings","raw":"GENERAL RATE INCREASE HEARINGS","theme":"Utility rates, cost recovery & regulation","issue":"rate-hearings","also":[],"chamber":"House","sponsor":"Nabeela Syed","party":"D","cos":["Representative Jawaharial Williams (D)","Representative Sharon Chung (D)","Representative Laura Faver Dias (D)","Representative Norma Hernandez (D)","Representative Amy Elik (R)","Senator Ram Villivalam (D)","Senator Napoleon Harris, III (D)"],"nCos":7,"bip":true,"committees":["Public Utilities (House)","Rules (House)","Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["220 ILCS 5/9-226.5 new"],"nStat":1,"amend":["House Amendment 002","House Amendment 003","House Amendment 001"],"summary":"Amends the Public Utilities Act. Provides that, for any general rate increase requested by a gas, electric, water, or sewer public utility under the provisions of the Act, the Commission shall hold at least one public hearing during which members of the public can provide input on the requested general rate increase. Provides that any affected ratepayer of a requested general rate increase may testify at the public hearing and may file statements that pertain to the subject matter of the public hearing with the person or persons conducting the public hearing. Provides that a public hearing shall be held in the service territory of the public utility that requested a general rate increase at a time and location to be determined by the Commission. Requires the Commission to comply with certain requirements when determining the location of a public hearing. Provides that the Commission shall provide reasonable notice that complies with the Open Meetings Act to members of the public regarding a public hearing. Provides that\"reasonable notice\" means notice that is provided at least 14 days before a public hearing. Provides that public hearings shall be conducted by the full Commission, a single commissioner, or an administrative law judge from the Commission. Provides that the Commission shall take into consideration any testimony or comments received from members of the public during the public hearing in its deliberations on the requested general rate increase. Makes other changes.","last":"Passed Both Houses","lastDate":"2026-05-20","lastChamber":"House","stage":"Passed both houses","stageLabel":"Passed both houses","stageNote":"Both chambers approved the same text","passed":true,"rtc":false,"pair":[]},{"id":"HB4516","type":"HB","num":4516,"title":"Portable Solar Generation","raw":"PORTABLE SOLAR GENERATION","theme":"Solar, storage & distributed energy","issue":"portable-solar","also":[],"chamber":"House","sponsor":"Abdelnasser Rashid","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)"],"statutes":["220 ILCS 5/16-107.5a new"],"nStat":1,"amend":[],"summary":"Amends the Public Utilities Act. Provides that a portable solar generation device shall be exempt from (i) net metering program and interconnection requirements under provisions concerning net electricity metering and (ii) any rules adopted pursuant to those provisions. Provides that a portable solar generation device shall include a device or feature that prevents the portable solar generation device from energizing a building's electrical system during a power outage. Provides that an electricity provider shall not require an eligible customer who uses, or intends to install and use, a portable solar generation device to do any of the following: (1) obtain the electricity provider's approval before installing or using the portable solar generation device; (2) pay a fee or charge related to the installation or use of the portable solar generation device; or (3) install additional controls or equipment beyond what is integrated into the portable solar generation device. Provides that an electricity provider shall not be liable for any damage or injury caused by an eligible customer's portable solar generation device. Effective June 1, 2026.","last":"Referred to Rules Committee","lastDate":"2026-01-26","lastChamber":"House","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":["HB4371"]},{"id":"HB4524","type":"HB","num":4524,"title":"Plug-In Solar Energy Systems","raw":"PLUG-IN SOLAR ENERGY SYSTEMS","theme":"Solar, storage & distributed energy","issue":"plugin-solar","also":[],"chamber":"House","sponsor":"Daniel Didech","party":"D","cos":["Representative Laura Faver Dias (D)","Representative Mary Beth Canty (D)","Representative Kimberly Du Buclet (D)","Representative Diane Blair-Sherlock (D)","Representative Lilian Jim\u00e9nez (D)","Representative Kelly M. Cassidy (D)","Representative Lindsey LaPointe (D)","Representative Janet Yang Rohr (D)","Representative Abdelnasser Rashid (D)"],"nCos":9,"bip":false,"committees":["Public Utilities (House)","Rules (House)","Utilities (House)"],"statutes":["220 ILCS 5/16-507.5a new","55 ILCS 5/5-46005","65 ILCS 5/11-15.5-5","765 ILCS 165/10"],"nStat":4,"amend":[],"summary":"Amends the Public Utilities Act. Provides that\"plug-in solar energy system\" means a moveable photovoltaic generation device that (i) may or may not include an energy storage system; (ii) exports no more than 1,200 watts to an outlet; (iii) is designed to be connected to a building's electrical system through a standard outlet; (iv) is intended primarily to offset part of an eligible customer's electricity consumption; and (v) is certified by Underwriters Laboratories or an equivalent nationally recognized testing laboratory. Provides that an electricity provider shall not require an eligible customer who uses, or intends to install and use, a plug-in solar energy system to do certain actions. Provides that a plug-in solar energy system is exempt from interconnection requirements under provisions concerning net electricity metering and any rules adopted pursuant to those provisions. Provides that a plug-in solar energy system is not eligible for net electricity metering or any distributed generation rebate. Provides that an electricity provider is not liable for any damage or injury caused by an eligible customer's plug-in solar energy system. Provides that a plug-in solar energy system that has a maximum power output to a receptacle outlet of 391 watts or less is exempt from any product listing standard that would require alterations to a building's premises, wiring, or electrical panels. Provides that landlords, homeowners' associations, common interest community associations, and condominium unit owners' associations shall not adopt, enforce, or attempt to enforce any restriction, covenant, bylaw, regulation, lease stipulation, or other rule that directly or indirectly restricts, prohibits, or imposes unreasonable conditions on the installation, use, or operation of a plug-in solar energy system. Amends the Counties Code, the Illinois Municipal Code, and the Homeowners' Energy Policy Statement Act. Provides that\"solar energy system\" includes a plug-in solar energy system. Makes other changes.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["SB3104"]},{"id":"HB4538","type":"HB","num":4538,"title":"Consumer Identity Verification","raw":"CONSUMER IDENTITY VERIFICATION","theme":"Technology, privacy & communications","issue":"id-verify","also":[],"chamber":"House","sponsor":"Rita Mayfield","party":"D","cos":["Representative Tom Weber (R)","Representative Matt Hanson (D)","Senator Lakesia Collins (D)"],"nCos":3,"bip":true,"committees":["Consumer Protection (House)","Executive (House)","Rules (House)","Assignments (Senate)"],"statutes":["815 ILCS 505/2MMMMM new","New Act"],"nStat":2,"amend":["House Amendment 004","House Amendment 001","House Amendment 002","House Amendment 003"],"summary":"Creates the Identity Verification for Consumer Services Act. Requires an entity that provides specified services to use identity verification to verify a person's identity before initiating or modifying an agreement to provide the service. Provides that an entity that provides a specified service that becomes aware of an attempted or confirmed identity theft through its compliance with the Act shall report the attempted or confirmed identity theft to the Attorney General. Provides that a violation of the Act constitutes an unlawful practice under the Consumer Fraud and Deceptive Business Practices Act. Limits home rule. Amends the Consumer Fraud and Deceptive Business Practices Act to make a conforming change. Effective January 1, 2027.","last":"Referred to Assignments","lastDate":"2026-04-21","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":[]},{"id":"HB4564","type":"HB","num":4564,"title":"DCEO-Tourism","raw":"DCEO-TOURISM","theme":"Workforce, labor & tax incentives","issue":"megaproject","also":["Data centers & large load"],"chamber":"House","sponsor":"Dave Vella","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Int Relations, Tourism, & Trade (House)","Tourism (House)"],"statutes":["20 ILCS 605/605-1119 new","20 ILCS 605/605-1120 new","20 ILCS 605/605-1121 new","20 ILCS 605/605-1122 new","20 ILCS 605/605-1123 new","20 ILCS 605/605-1124 new","220 ILCS 5/2-204 new"],"nStat":7,"amend":[],"summary":"Amends the Department of Commerce and Economic Opportunity Law of the Civil Administrative Code of Illinois. Creates the Illinois Competitiveness and Innovation Working Group within the Department of Commerce and Economic Opportunity. Sets forth the membership of the Working Group. Provides that the Department of Commerce and Economic Opportunity shall review and propose a megaproject incentive framework for the State, including performance-based tax credits, capital assistance, and workforce training tools. Provides that the Department of Commerce and Economic Opportunity shall continue to conduct annual international trade missions to priority markets. Provides for a statewide tourism connectivity plan. Provides that the Department of Commerce and Economic Opportunity shall establish certain grant programs. Amends the Public Utilities Act. Provides that the Illinois Commerce Commission shall monitor and annually report to the Governor and the General Assembly on the affordability, reliability, and capacity of energy for industrial users.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB2789"]},{"id":"HB4595","type":"HB","num":4595,"title":"Utilities-Various","raw":"UTILITIES-VARIOUS","theme":"Utility rates, cost recovery & regulation","issue":"savings-monitor","also":[],"chamber":"House","sponsor":"Dave Vella","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)"],"statutes":["220 ILCS 5/16-107.10 new","220 ILCS 5/4-616 new","220 ILCS 5/8-205.5 new","220 ILCS 5/8-206.5"],"nStat":4,"amend":[],"summary":"Amends the Public Utilities Act. Provides that the Illinois Commerce Commission shall monitor the impact of each public utility in the State on overall consumer savings and on the electrical grid of the State. Requires the Commission to submit an annual report to the Governor, the Attorney General, and the General Assembly that summarizes the results of the Commission's efforts no later than one year after the effective date of the amendatory Act and annually thereafter. Provides that a utility shall cap residential rates for qualifying households at a set monthly maximum during a city, county, or State declaration of a winter weather emergency or an extreme heat warning that covers the area of the utility in which the qualifying household is located. Provides that each utility in the State shall file with the Commission prior to December 1 of each year a plan detailing the implementation of a residential rate cap. Provides that all plans are subject to review and approval by the Commission and that the Commission may direct a utility to modify its plan to comply with the requirements of the amendatory provisions. In provisions concerning Disconnection Protection Programs, provides that a customer who submits documentation that shows that the customer is enrolled in the Low Income Home Energy Assistance Program (LIHEAP), the Percentage of Income Payment Plan (PIPP), or Medicaid shall be granted protection under a utility's Disconnection Protection Program upon the receipt of the customer's documentation. Provides that, if the utility, upon reviewing the customer's documentation, determines that the documentation does not provide sufficient proof that the customer is enrolled in LIHEAP, PIPP, or Medicaid, the utility may remove the customer from the utility's Disconnection Protection Program. Provides that an electric utility that offers at least one market-based rate option, including, but not limited to, net electricity metering, for retail customers who choose to take power and energy supply service from the utility shall limit peak hour rates under the market-based rate option to no more than 150% of the rate that the customer would otherwise pay if the customer was not using the market-based rate option. Makes other changes.","last":"Referred to Rules Committee","lastDate":"2026-02-03","lastChamber":"House","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":[]},{"id":"HB4661","type":"HB","num":4661,"title":"District Office Utility Bills","raw":"DISTRICT OFFICE UTILITY BILLS","theme":"Utility rates, cost recovery & regulation","issue":"district-office-bills","also":[],"chamber":"House","sponsor":"Ann M. Williams","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)"],"statutes":["25 ILCS 115/4from Ch. 63, par. 15.1","30 ILCS 105/25from Ch. 127, par. 161"],"nStat":2,"amend":[],"summary":"Amends the General Assembly Compensation Act. Provides that any utility bill for service provided to a member's district office in the immediately preceding fiscal year may be paid from funds appropriated for such expenditures in the current fiscal year. Provides that any utility bill for service provided to a member's district office in fiscal year 2015 through fiscal year 2017, as well as any interest or penalties on those amounts, may be paid from funds appropriated for such expenditures in any fiscal year. Amends the State Finance Act to make a conforming changes. Effective immediately.","last":"Referred to Rules Committee","lastDate":"2026-02-03","lastChamber":"House","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":[]},{"id":"HB4692","type":"HB","num":4692,"title":"Muni Code-Utility Info","raw":"MUNI CD-UTILITY INFO","theme":"Utility rates, cost recovery & regulation","issue":"muni-audit-info","also":[],"chamber":"House","sponsor":"Michelle Mussman","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)"],"statutes":["65 ILCS 5/8-11-2.5"],"nStat":1,"amend":[],"summary":"Amends the Illinois Municipal Code. Provides that the following information for a customer premises shall not be deemed customer-specific information for the purpose of a request for information from a municipality conducting an audit of a public utility: (i) the premises address and zip code; (ii) the classification of the premises as designated by the public utility, such as residential, commercial, or industrial; (iii) monthly usage information sufficient to calculate taxes due, in therms, kilowatts, minutes, or other such other unit of measurement used to calculate the taxes; (iv) the taxes actually assessed, collected, and remitted to the municipality; (v) the first date of service for the premises, if that date occurred within the period being audited; and (vi) any tax exemption claimed for the premises and any additional information that supports a specific tax exemption, if the municipality requests that information, including the customer name and other relevant data. Provides that a municipality may request certain customer-specific information from a utility for the purpose of conducting an audit of the utility's taxes and the enforcement of any related tax claim.","last":"Referred to Rules Committee","lastDate":"2026-02-06","lastChamber":"House","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":["SB2907"]},{"id":"HB4725","type":"HB","num":4725,"title":"Worker Protection Unit","raw":"WORKER PROTECTION UNIT","theme":"Workforce, labor & tax incentives","issue":"worker-protection","also":[],"chamber":"House","sponsor":"Jay Hoffman","party":"D","cos":["Representative Theresa Mah (D)","Senator Omar Aquino (D)","Senator Michael W. Halpin (D)","Senator Mike Porfirio (D)","Senator Mary Edly-Allen (D)","Senator Elgie R. Sims, Jr. (D)","Senator Mattie Hunter (D)"],"nCos":7,"bip":false,"committees":["Executive (House)","Rules (House)","Judiciary (Senate)","Assignments (Senate)"],"statutes":["15 ILCS 205/6.3"],"nStat":1,"amend":["House Amendment 003","House Amendment 002","House Amendment 001"],"summary":"Amends the Attorney General Act. Provides that, prior to initiating an action, the Attorney General shall conduct an investigation and, in addition to other powers, may: (1) issue subpoenas for documents; (2) require written answers under oath to written interrogatories; (3) inspect the premises of an employer and inspect and make copies of employment-related records kept at the premises; and (4) conduct interviews with workers at an employer's premises during normal business or working hours. Sets forth additional provisions concerning investigations; interviews; subpoenas; obstruction; and search warrants.","last":"Passed Both Houses","lastDate":"2026-05-20","lastChamber":"House","stage":"Passed both houses","stageLabel":"Passed both houses","stageNote":"Both chambers approved the same text","passed":true,"rtc":false,"pair":["SB3183"]},{"id":"HB4731","type":"HB","num":4731,"title":"Utilities-Excavation","raw":"UTILITIES-EXCAVATION","theme":"Transmission, siting & land","issue":"excavation","also":[],"chamber":"House","sponsor":"Lawrence Larry Walsh, Jr.","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Public Utilities (House)","Rules (House)","Telecom (House)"],"statutes":["220 ILCS 50/2from Ch. 111 2/3, par. 1602"],"nStat":1,"amend":[],"summary":"Amends the Illinois Underground Utility Facilities Damage Prevention Act. Provides that\"excavation\" does not include an excavation for the purpose of connecting a communications service customer's home or business to the communications service provider's own communications network that is performed: (i) only with a hand tool, (ii) by a communications service provider, and (iii) to a depth not greater than 12 inches. Effective immediately.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["SB3573"]},{"id":"HB4751","type":"HB","num":4751,"title":"Wages & Benefits-Skilled Labor","raw":"WAGES & BENEFITS-SKILLED LABOR","theme":"Workforce, labor & tax incentives","issue":"prevailing-craft","also":[],"chamber":"House","sponsor":"Dave Vella","party":"D","cos":["Representative Katie Stuart (D)","Representative Lawrence Larry Walsh, Jr. (D)","Representative Anne Stava-Murray (D)"],"nCos":3,"bip":false,"committees":["Rules (House)"],"statutes":["820 ILCS 130/2","820 ILCS 130/2.2 new"],"nStat":2,"amend":[],"summary":"Amends the Prevailing Wage Act. Restores certain provisions of the Act to the form in which they existed before Public Act 104-17 took effect. Provides that nothing in the Act prohibits the payment of wages and fringe benefits for work performed under the Act that is based upon the craft and the skill level of the laborers, mechanics, or other employees who perform the work if the wages and fringe benefits are established and are paid in accordance with a collective bargaining agreement or understanding between an employer or an employer association and a bona fide labor organization for work performed of a similar character in the locality in which the work is performed. Effective July 1, 2026.","last":"Referred to Rules Committee","lastDate":"2026-02-06","lastChamber":"House","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":[]},{"id":"HB4769","type":"HB","num":4769,"title":"Utility-Customer Charge Freeze","raw":"UTIL-CUSTOMER CHARGE FREEZE","theme":"Utility rates, cost recovery & regulation","issue":"charge-freeze","also":[],"chamber":"House","sponsor":"Dagmara Avelar","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Public Utilities (House)","Rules (House)"],"statutes":["220 ILCS 5/9-241.5 new"],"nStat":1,"amend":[],"summary":"Amends the Public Utilities Act. Provides that a public utility shall freeze its monthly customer charge for low-income households at an amount equal to a percentage of the household's income that is no greater than the current percentage of income used to determine the amount of monthly credits administered to participants of the Percentage of Income Payment Plan under the Energy Assistance Act.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"HB4773","type":"HB","num":4773,"title":"Climate Change Superfund","raw":"CLIMATE CHANGE SUPERFUND","theme":"Environment, climate & EPA","issue":"superfund","also":[],"chamber":"House","sponsor":"Abdelnasser Rashid","party":"D","cos":["Representative Daniel Didech (D)","Representative Michelle Mussman (D)","Representative Lilian Jim\u00e9nez (D)","Representative Kelly M. Cassidy (D)","Representative Barbara Hernandez (D)","Representative Will Guzzardi (D)","Representative Dagmara Avelar (D)","Representative Lindsey LaPointe (D)","Representative Theresa Mah (D)","Representative Kevin John Olickal (D)","Representative Joyce Mason (D)","Representative Ann M. Williams (D)","Representative La Shawn K. Ford (D)"],"nCos":13,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["30 ILCS 105/5.1038 new","New Act"],"nStat":2,"amend":[],"summary":"Creates the Climate Change Superfund Act. Creates the Illinois Climate Change Superfund as a special fund in the State treasury. Requires at least 40% of the Fund to be spent on projects that directly benefit disadvantaged communities facing climate change impacts. Directs the Environmental Protection Agency to adopt rules within one year, including regarding the apportionment of liability for climate change for payments into the Fund by responsible parties, regarding qualifying expenditures from the Fund, and regarding an Illinois Climate Change Superfund Program. Requires the Agency to establish procedures to challenge its determinations of liability for climate change and provides for judicial review under the Administrative Review Law. Makes findings. Defines terms. Provides that the Act is severable. Makes conforming changes to the State Finance Act.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["SB2981"]},{"id":"HB4781","type":"HB","num":4781,"title":"Utility-Recoverable Expenses","raw":"UTILITY-RECOVERABLE EXPENSES","theme":"Utility rates, cost recovery & regulation","issue":"recoverable","also":[],"chamber":"House","sponsor":"Theresa Mah","party":"D","cos":["Representative Sonya M. Harper (D)","Representative Michelle Mussman (D)","Representative Lindsey LaPointe (D)","Representative Kelly M. Cassidy (D)","Representative Dagmara Avelar (D)","Representative Abdelnasser Rashid (D)","Representative Ann M. Williams (D)","Representative Lilian Jim\u00e9nez (D)"],"nCos":8,"bip":false,"committees":["Public Utilities (House)","Rules (House)"],"statutes":["220 ILCS 5/9-224.1 new","220 ILCS 5/9-224from Ch. 111 2/3, par. 9-224","220 ILCS 5/9-225from Ch. 111 2/3, par. 9-225","220 ILCS 5/9-229"],"nStat":4,"amend":[],"summary":"Amends the Public Utilities Act. In provisions concerning expenses that are recoverable by a public utility, provides that the Illinois Commerce Commission shall not consider as an expense of any public utility company, for the purpose of determining any rate or charge, any amount expended for political activity or lobbying, any amount expended for contributions to a trade association or a chamber of commerce, and any amount expended by a public utility for director and officer liability insurance and fiduciary liability insurance. Provides that, in determining whether the purchase of other types of insurance by a public utility is recoverable, the Commission shall determine whether the specific type of insurance is financially beneficial to the public utility's ratepayers or the public utility's shareholders. Provides that, if the Commission determines that the insurance purchased by the public utility is financially beneficial to its shareholders, then the purchase of the insurance shall not be a recoverable expense. Provides that goodwill or institutional advertising shall not be a recoverable expense by a public utility. Provides that the Commission shall deem as a nonrecoverable expense by a public utility (rather than the Commission shall specifically assess the justness and reasonableness of) any amount expended by a public utility to compensate attorneys or technical experts to prepare and litigate a general rate case filing. Provides that the amount that is deposited into the Consumer Intervenor Compensation Fund by a public utility shall not be a recoverable expense by the public utility. Provides that the computation of compensation awarded from the Fund shall take into consideration the market rates paid to persons of comparable training and experience who offer similar services, but may not exceed the comparable market rate for services paid by the public utility as part of its nonrecoverable rate case expense reported to the Commission (rather than as part of its rate case expense). Makes other changes.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["SB3497","SB3822"]},{"id":"HB4798","type":"HB","num":4798,"title":"EPA-GHG Emission Limits","raw":"EPA-GHG EMISSION LIMITS","theme":"Environment, climate & EPA","issue":"ghg-emergency","also":[],"chamber":"House","sponsor":"Lawrence Larry Walsh, Jr.","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["415 ILCS 5/9.15"],"nStat":1,"amend":[],"summary":"Amends the Environmental Protection Act. In a provision establishing greenhouse gas emission controls, authorizes an electric generating unit or large GHG-emitting unit to continue operating if an emergency, pre-emergency, or conservative operations situation exists. Provides that no variance, adjusted standard, or other regulatory relief that is otherwise available under the Act may be granted from the Act's greenhouse gas emission controls if battery storage resources constitute at least 10% of the total State-installed generation capacity. Provides that, if battery storage resources constitute less than 10% of the total State-installed generation capacity at any time after the effective date of the amendatory Act, the Environmental Protection Agency shall delay enforcement of certain greenhouse gas emission controls. Directs the Environmental Protection Agency to adopt rules to implement these requirements. Defines\"battery storage resource\" and\"total State-installed generation capacity\". Makes other changes. Effective immediately.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":[]},{"id":"HB4803","type":"HB","num":4803,"title":"Electric Transmission Siting","raw":"ELECTRIC TRANSMISSION SITING","theme":"Transmission, siting & land","issue":"tx-siting","also":[],"chamber":"House","sponsor":"Dave Vella","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Public Utilities (House)","Rules (House)"],"statutes":["New Act"],"nStat":1,"amend":["House Amendment 001","House Amendment 002"],"summary":"Creates the Electric Transmission Colocation and Siting Priority Act. Defines terms. Requires that, in the siting of new electric transmission facilities, available corridors be used in the following order of priority: (1) existing public utility corridors; (2) State highway corridors; and (3) new corridors. Provides that a public utility or transmission developer may construct, place, or maintain a high-voltage transmission line on a public right-of-way or along a highway if (i) the public utility or transmission developer submits a colocation request for the high-voltage transmission line to the Secretary of Transportation and (ii) the Secretary reviews and approves the colocation request. Provides that the Secretary may deny a colocation request if the Secretary determines that the construction, placement, or maintenance of a high-voltage transmission line on a public right-of-way or along a highway would endanger public safety or would interfere with the proper function of the highway. Provides that a public utility or transmission developer may submit a written request to the Department of Transportation for an evaluation of certain corridors for possible locations for a high-voltage transmission line. Provides that, within 30 days after receipt of a written request, the Secretary shall assign a project coordinator to the request. Provides that a project coordinator, upon assignment to a request, shall begin the evaluation in coordination with the applicable public utility or transmission developer. Requires a public utility or transmission developer to develop a constructability report in consultation with the Department and requires the public utility or transmission developer and the Department to follow the terms and conditions of the constructability report during the planning and approval process for the siting of a high-voltage transmission line. Sets forth requirements for the content of the constructability report. Provides that, if the Department requires that a high-voltage transmission line on a public right-of-way be relocated by a specific date, the Department shall give the applicable public utility or transmission developer notice of the required relocation no less than 10 years before the date of the required relocation. Makes other changes. Effective January 1, 2027.","last":"House Floor Amendment No. 2 Rule 19(c) / Re-referred to Rules Committee","lastDate":"2026-04-17","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB4995","SB2808"]},{"id":"HB4805","type":"HB","num":4805,"title":"Unemployment Ins-Prefile Claim","raw":"UNEMPLOYMENT INS-PREFILE CLAIM","theme":"Workforce, labor & tax incentives","issue":"ui-prefile","also":[],"chamber":"House","sponsor":"Gregg Johnson","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Labor & Commerce (House)","Rules (House)"],"statutes":["820 ILCS 405/2800from Ch. 48, par. 780","820 ILCS 405/700from Ch. 48, par. 450"],"nStat":2,"amend":[],"summary":"Amends the Unemployment Insurance Act. Provides that, if an employer employing 75 or more employees in the State conducts a layoff, furlough, or temporary shutdown resulting in the separation of one or more employees, the employer shall submit required claim-initiation information to the Department of Employment Security on behalf of each affected employee. Provides that the Department shall provide written or electronic confirmation to the affected employee that the claim-initiation information has been submitted on their behalf by the employer. Sets forth additional requirements. Provides for civil penalties for a violation of the provision.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-04-17","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"HB4823","type":"HB","num":4823,"title":"Transmission Ownership Act","raw":"TRANSMISSION OWNERSHIP ACT","theme":"Transmission, siting & land","issue":"tx-ownership","also":[],"chamber":"House","sponsor":"Lawrence Larry Walsh, Jr.","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Public Utilities (House)","Rules (House)"],"statutes":["220 ILCS 5/24-100 new","220 ILCS 5/24-105 new","220 ILCS 5/Art. XXIV heading new","30 ILCS 559/20-10","New Act"],"nStat":5,"amend":[],"summary":"Creates the Transmission Ownership and Reliability Act. Defines terms. Provides that all new electric transmission facilities located wholly or partly within the geographic boundaries of the State shall be owned, operated, and maintained exclusively by a Commission-regulated and investor-owned utility. Provides that any entity proposing to construct a new electric transmission facility in the State shall obtain a certificate of public convenience and necessity under the Public Utilities Act. Provides that the construction of electric transmission facilities shall comply with all provisions of the Electric Transmission Systems Construction Standards Act and that third-party constructors shall adhere to prevailing wage, safety, and diversity requirements under that Act. Sets forth rulemaking provisions. Provides that any entity that constructs or operates an electric transmission facility in violation of the Act may be subject to monetary penalties, revocation of certification, or transfer orders issued by the Commission. Amends the Illinois Works Jobs Program Act. Provides that, to qualify as a\"community-based organization\", an organization must demonstrate, among other things, a plan to provide the skills and knowledge necessary to obtain a commercial driver's license (CDL). Creates the Transmission Efficiency and Cooperation Law within the Public Utilities Act. Provides that an incumbent electric transmission owner has the right to construct, own, and maintain an electric transmission line that has been approved for construction in a transmission plan and that will connect to facilities that are owned by the incumbent electric transmission owner and are or will be under the functional control of a regional transmission operator. Provides that the right to construct, own, and maintain an electric transmission line belongs individually and proportionally to each incumbent electric transmission owner, unless otherwise agreed upon in writing. Provides that proportionality shall be determined based on the location of the electric transmission line relative to each incumbent electric transmission owner's retail service territory. Provides that an incumbent electric transmission owner may assign its right to construct, own, and maintain an electric transmission line to a transmission affiliate. Makes other changes. Effective immediately.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"HB4830","type":"HB","num":4830,"title":"Agrivoltaic Systems","raw":"AGRIVOLTAIC SYSTEMS","theme":"Transmission, siting & land","issue":"agrivoltaic","also":[],"chamber":"House","sponsor":"Michelle Mussman","party":"D","cos":["Representative Kelly M. Cassidy (D)","Representative Lilian Jim\u00e9nez (D)"],"nCos":2,"bip":false,"committees":["Rules (House)","Energy & Environment (House)"],"statutes":["20 ILCS 3855/1-10","220 ILCS 5/3-128 new"],"nStat":2,"amend":[],"summary":"Amends the Illinois Power Agency Act and the Public Utilities Act. Provides that\"agrivoltaic system\" means a ground-mounted photovoltaic solar energy system that meets the following criteria: (1) the applicable farm plan and the system have been intentionally designed with agricultural producers, agrivoltaics experts, or both agricultural producers and agrivoltaics experts; (2) the system is constructed, installed, and operated to achieve an integrated and simultaneous production of both solar energy and current or future marketable agricultural products, including all products and activities described in the definition of\"production agriculture\" in the Use Tax Act and apiaries if the apiary is paired with another qualifying marketable agricultural product, by an agricultural producer; (3) the agricultural production of the system occur on land beneath or between rows of solar panels; and (4) the agricultural production of the system begins as soon as agronomically feasible and optimal for the agricultural producer after the commercial operation date of the solar panels and continues until decommissioning. Provides that\"agrivoltaic system\" does not include a system that has a pollinator habitat as the sole dual use of the system.","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["SB2958"]},{"id":"HB4858","type":"HB","num":4858,"title":"Equal Pay-Variable Pay Scale","raw":"EQUAL PAY-VARIABLE PAY SCALE","theme":"Workforce, labor & tax incentives","issue":"equal-pay-scale","also":[],"chamber":"House","sponsor":"Janet Yang Rohr","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Labor & Commerce (House)","Rules (House)"],"statutes":["820 ILCS 112/10","820 ILCS 112/5"],"nStat":2,"amend":[],"summary":"Amends the Equal Pay Act of 2003. Provides that it is unlawful for an employer with 15 or more employees to fail to include the base pay scale and variable pay scale (rather than the pay scale and benefits) for a position in any specific job posting. Provides that the base pay scale and variable pay scale shall be provided as separate ranges on the job posting. Defines\"base pay scale\" and\"variable pay scale\".","last":"Rule 19(a) / Re-referred to Rules Committee","lastDate":"2026-03-27","lastChamber":"House","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"HB4876","type":"HB","num":4876,"title":"Alt Retail Electric Suppliers","raw":"ALT RETAIL ELECTRIC SUPPLIERS","theme":"Retail choice & procurement","issue":"ares-cert","also":[],"
