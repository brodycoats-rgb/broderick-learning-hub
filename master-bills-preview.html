echnical experts to prepare and litigate a general rate case filing. Provides that the amount that is deposited into the Consumer Intervenor Compensation Fund by a public utility shall not be a recoverable expense by the public utility. Provides that the computation of compensation awarded from the Fund shall take into consideration the market rates paid to persons of comparable training and experience who offer similar services, but may not exceed the comparable market rate for services paid by the public utility as part of its nonrecoverable rate case expense reported to the Commission (rather than as part of its rate case expense). Makes other changes.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-15","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB4781","SB3822"]},{"id":"SB3529","type":"SB","num":3529,"title":"Make-Ready Infrastructure Act","raw":"MAKE-READY INFRASTRUCTURE ACT","theme":"Retail choice & procurement","issue":"make-ready","also":[],"chamber":"Senate","sponsor":"Adriane Johnson","party":"D","cos":["Senator Sara Feigenholtz (D)"],"nCos":1,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["New Act"],"nStat":1,"amend":[],"summary":"Creates the Make-Ready Infrastructure Rules Act. Sets forth findings. Defines terms. Provides that an electric utility shall propose a new rule, before the electric utility submits its next Multi-Year Integrated Rate Plan, that authorizes the electric utility to design and deploy all electrical distribution infrastructure on the utility side of the meter for all customers who have installed separately metered or submetered infrastructure to support electric vehicle charging stations, other than charging stations in single-family residences. Provides that an electric utility shall recover its revenue requirement for the design and deployment of such electrical distribution infrastructure through periodic Multi-Year Integrated Rate Plan proceedings or through other methods determined by the Commission by rule. Provides that the Commission shall require an electric utility to provide an accurate and full accounting of all the electric utility's expenses related to electrical distribution infrastructure and shall apply appropriate penalties to an electric utility that is not accurately tracking all expenses. Provides that the new proposed rule, once effective, shall be offered to customers as an alternative to the transmission line extension rules in place as of the effective date of the Act for electric vehicle infrastructure and any customer allowances established under the rule shall be based on the full useful life of the electrical distribution infrastructure. Makes other changes.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-04-24","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"SB3548","type":"SB","num":3548,"title":"Consumer Data Privacy Act","raw":"CONSUMER DATA PRIVACY ACT","theme":"Technology, privacy & communications","issue":"data-privacy","also":[],"chamber":"Senate","sponsor":"Sue Rezin","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Executive (Senate)","Assignments (Senate)","AI and Social Media (Senate)"],"statutes":["30 ILCS 105/5.1038 new","5 ILCS 140/7","New Act"],"nStat":3,"amend":["Senate Amendment 001"],"summary":"Creates the Consumer Data Privacy Act. Establishes certain consumer rights relating to personal data, including the rights to confirm whether data is being processed, to correct any inaccuracies in the consumer's personal data, to delete personal data provided by the consumer, to obtain a copy of the consumer's personal data that was previously provided, and to opt out of targeted advertising, the sale of data, or profiling of the consumer. Defines terms. Applies to persons who conduct business in Illinois or produce products or services that are targeted to Illinois residents and that during the a calendar year control or process person data of at least 100,000 consumers or 25,0000 consumers and derives over 50% of gross revenue from the sale of personal data. Makes requirements for persons or entities that control and process consumer data and also exempts certain persons or entities from the statutory provisions of the Act. Provides that the Attorney General has exclusive authority to enforce the consumer data privacy rights. Creates the Consumer Privacy Fund to be administered by the Office of the Attorney General. Amends the Freedom of Information Act. Exempts from disclosure data protection impact assessments done under the Illinois Consumer Data Privacy Act. Makes a conforming change in the State Finance Act.","last":"Senate Committee Amendment No. 1 Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["HB5221","SB2875","SB3890"]},{"id":"SB3571","type":"SB","num":3571,"title":"WARN Act-AI Layoffs","raw":"WARN ACT-AI LAYOFFS","theme":"Workforce, labor & tax incentives","issue":"warn-ai","also":[],"chamber":"Senate","sponsor":"Mike Simmons","party":"D","cos":["Senator Karina Villa (D)","Senator Mary Edly-Allen (D)","Senator Rachel Ventura (D)","Senator Robert F. Martwick (D)"],"nCos":4,"bip":false,"committees":["Executive (Senate)","Assignments (Senate)","AI and Social Media (Senate)"],"statutes":["820 ILCS 65/10","820 ILCS 65/45","820 ILCS 65/47 new"],"nStat":3,"amend":["Senate Amendment 001"],"summary":"Amends the Illinois Worker Adjustment and Retraining Notification Act. Provides that, when required to report the reason for a mass layoff or closing, the employer shall disclose any artificial intelligence-related job impacts, including the number of employees laid off substantially due to the replacement or automation by artificial intelligence of the functions performed by the employees. Provides that, if the Department of Commerce and Economic Opportunity issues any public report disclosing mass layoffs or closings, the Department shall include the reason for the mass layoff or closing in the report, including whether the mass layoff or closing is substantially due to artificial intelligence. Makes other changes.","last":"Senate Committee Amendment No. 1 Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"SB3573","type":"SB","num":3573,"title":"Fiber Optic Excavation Crews","raw":"FIBER OPTIC EXCAVATION CREWS","theme":"Transmission, siting & land","issue":"excavation","also":[],"chamber":"Senate","sponsor":"Steve McClure","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["220 ILCS 50/4.2 new"],"nStat":1,"amend":[],"summary":"Amends the Illinois Underground Utility Facilities Damage Prevention Act. Defines\"fiber optic excavation crew\". Provides that a fiber optic excavation crew shall comply with the following requirements: (1) every member of the fiber optic excavation crew must have completed a safety and installation training course provided by JULIE; (2) throughout an excavation project, the fiber optic excavation crew shall only use updated city maps, county maps, and right-of-way maps that are less than 2 years old; (3) the fiber optic excavation crew shall obtain a surety bond and provide proof of the surety bond to the unit of local government with jurisdiction over the excavation project; and (4) within 30 days after the completion of an excavation project, the fiber optic excavation crew shall fully restore any residential and landowner ground surface and landscaping to the condition the applicable land was in before the excavation project commenced. Provides that the amount of the surety bond shall be a reasonable amount set by the applicable unit of local government. Provides that the manager or supervisor of the crew shall send, and the project owner shall confirm the submission of, a letter affirming the restoration of the affected land to the mayor or the applicable township official of the land on which the project is located. Provides that a person who violates the amendatory provisions shall be subject to a $500 fine for the first violation, a $1,000 fine for the second violation, and a fine of no more than $5,000 for each subsequent violation. Provides that the Commission may enter into an arbitration process with a person who violates the amendatory provisions 5 or more times to determine the proper damages, repayment, and fines for the violations.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-03-13","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB4731"]},{"id":"SB3574","type":"SB","num":3574,"title":"Regulation-Tech","raw":"REGULATION-TECH","theme":"Technology, privacy & communications","issue":"shell","also":[],"chamber":"Senate","sponsor":"Sue Rezin","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["220 ILCS 5/1-101from Ch. 111 2/3, par. 1-101"],"nStat":1,"amend":[],"summary":"Amends the Public Utilities Act. Makes a technical change in a Section concerning the short title.","last":"Referred to Assignments","lastDate":"2026-02-05","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":["HB910","SB317","SB329","SB640","SB3575","SB3576"]},{"id":"SB3575","type":"SB","num":3575,"title":"Regulation-Tech","raw":"REGULATION-TECH","theme":"Technology, privacy & communications","issue":"shell","also":[],"chamber":"Senate","sponsor":"Sue Rezin","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["220 ILCS 5/1-101from Ch. 111 2/3, par. 1-101"],"nStat":1,"amend":[],"summary":"Amends the Public Utilities Act. Makes a technical change in a Section concerning the short title.","last":"Referred to Assignments","lastDate":"2026-02-05","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":["HB910","SB317","SB329","SB640","SB3574","SB3576"]},{"id":"SB3576","type":"SB","num":3576,"title":"Regulation-Tech","raw":"REGULATION-TECH","theme":"Technology, privacy & communications","issue":"shell","also":[],"chamber":"Senate","sponsor":"Sue Rezin","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["220 ILCS 5/13-100from Ch. 111 2/3, par. 13-100"],"nStat":1,"amend":[],"summary":"Amends the Public Utilities Act. Makes a technical change in a Section concerning the short title of the Telecommunications Article.","last":"Referred to Assignments","lastDate":"2026-02-05","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":["HB910","SB317","SB329","SB640","SB3574","SB3575"]},{"id":"SB3578","type":"SB","num":3578,"title":"Data Centers-Foreign Ownership","raw":"DATA CENTERS-FOREIGN OWNERSHIP","theme":"Data centers & large load","issue":"dc-foreign","also":[],"chamber":"Senate","sponsor":"Sue Rezin","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["New Act"],"nStat":1,"amend":[],"summary":"Creates the Data Center Construction by Foreign Adversaries Act. Provides that no foreign company may construct or cause to be constructed a data center in the State unless the Illinois Commerce Commission, the Illinois Power Agency, and the Department of Commerce and Economic Opportunity conduct a joint study of the energy consumption of the prospective data center and certify to the Governor and the General Assembly that the energy used by the new data center is a new self-generated load and does not affect the load supply of PJM or MISO. Provides that the term\"foreign company\" means an entity that (i) is at least 51% owned by a foreign adversary or (ii) is headquartered in a country with a government that is a foreign adversary.","last":"Referred to Assignments","lastDate":"2026-02-05","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":[]},{"id":"SB3579","type":"SB","num":3579,"title":"Utility-Termination/Referendum","raw":"UTILITY-TERMINATION/REFERENDUM","theme":"Utility rates, cost recovery & regulation","issue":"water-termination","also":[],"chamber":"Senate","sponsor":"Sue Rezin","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["220 ILCS 5/8-205from Ch. 111 2/3, par. 8-205","220 ILCS 5/9-210.5"],"nStat":2,"amend":[],"summary":"Amends the Public Utilities Act. Provides that termination of water utility service to a residential user, including a tenant of a mastermetered apartment building, for nonpayment of bills is prohibited: (1) on any day when the National Weather Service forecast for the following 6 days covering the area of the utility in which the residence is located includes a forecast that the temperature will be 32 degrees Fahrenheit or below; (2) on any day when the National Weather Service forecast for the following 6 days covering the area of the utility in which the residence is located includes a forecast that the temperature will be 90 degrees Fahrenheit or above; or (3) when the National Weather Service issues an excessive heat watch, excessive heat warning, or heat advisory covering the area of the utility in which the residence is located. In provisions concerning procedures for a large public utility to acquire a water or sewer utility, provides that if the water or sewer utility being acquired is owned by the State or a political subdivision of the State, a referendum will be required to approve the acquisition of the water or sewer utility by the large public utility (rather than only requiring a public meeting and publication of the terms of acquisition in a newspaper of general circulation in the area that the water or sewer utility operates). Effective immediately.","last":"Referred to Assignments","lastDate":"2026-02-05","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":[]},{"id":"SB3580","type":"SB","num":3580,"title":"Energy-Generation Task Force","raw":"ENERGY-GENERATION TASK FORCE","theme":"Solar, storage & distributed energy","issue":"regional-reliability-tf","also":[],"chamber":"Senate","sponsor":"Jason Plummer","party":"R","cos":["Senator Dale Fowler (R)","Senator Sally J. Turner (R)","Senator Dave Syverson (R)","Senator Neil Anderson (R)","Senator Donald P. DeWitte (R)","Senator Craig Wilcox (R)"],"nCos":6,"bip":false,"committees":["Assignments (Senate)","Appropriations (Senate)"],"statutes":["New Act"],"nStat":1,"amend":[],"summary":"Creates the Illinois Regional Generation Reliability Task Force Act. Sets forth findings of the General Assembly. Creates the Illinois Regional Generation Reliability Task Force. Provides that the Task Force shall monitor the reliability of the Illinois power grid. Contains provisions concerning: the membership of the Task Force; duties of the Task Force; administrative support; and an annual report. Effective immediately.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":[]},{"id":"SB3581","type":"SB","num":3581,"title":"EPA-Greenhouse Gases","raw":"EPA-GREENHOUSE GASES","theme":"Environment, climate & EPA","issue":"ghg-revert","also":[],"chamber":"Senate","sponsor":"Dale Fowler","party":"R","cos":["Senator Dave Syverson (R)","Senator Neil Anderson (R)","Senator Andrew S. Chesney (R)","Senator Donald P. DeWitte (R)","Senator Terri Bryant (R)","Senator Craig Wilcox (R)"],"nCos":6,"bip":false,"committees":["Assignments (Senate)"],"statutes":["415 ILCS 5/3.131 rep.","415 ILCS 5/9.15"],"nStat":2,"amend":[],"summary":"Amends the Environmental Protection Act. Reverts provisions regarding greenhouse gases to the language existing before changes made by amendment under P.A. 102-662. Repeals a provision defining\"clean energy\". Effective immediately.","last":"Referred to Assignments","lastDate":"2026-02-05","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":[]},{"id":"SB3583","type":"SB","num":3583,"title":"EPA-Photovoltaic Dump","raw":"EPA-PHOTOVOLTAIC DUMP","theme":"Solar, storage & distributed energy","issue":"pv-landfill","also":[],"chamber":"Senate","sponsor":"John F. Curran","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["415 ILCS 5/22.23g new"],"nStat":1,"amend":[],"summary":"Amends the Environmental Protection Act. Provides that, beginning January 1, 2028, no person may knowingly cause or allow the mixing of a photovoltaic module with municipal waste that is intended for disposal at a landfill. Provides that, beginning January 1, 2028, no person may knowingly cause or allow the disposal of a photovoltaic module in a sanitary landfill. Defines\"consumer electronic device\" and\"photovoltaic module\". Effective January 1, 2027.","last":"Chief Sponsor Changed to Sen. John F. Curran","lastDate":"2026-06-01","lastChamber":"Senate","stage":"Sponsor change","stageLabel":"Sponsor changed","stageNote":"Chief sponsor changed at the end of the snapshot","passed":false,"rtc":false,"pair":[]},{"id":"SB3584","type":"SB","num":3584,"title":"Audit-IPA Renewable","raw":"AUDIT-IPA RENEWABLE","theme":"Retail choice & procurement","issue":"ipa-audit","also":[],"chamber":"Senate","sponsor":"Jil Tracy","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["30 ILCS 5/3-2.5 new"],"nStat":1,"amend":[],"summary":"Amends the Illinois State Auditing Act. Provides that, in calendar years 2027, 2032, 2037, 2042, and 2047, the Auditor General shall conduct a performance audit of (i) the programs and procurement activities administered by the Illinois Power Agency to implement the Renewable Portfolio Standard and (ii) the Adjustable Block program established under the Illinois Power Agency Act. Provides that the performance audits shall address specified questions related to renewable energy, solar vendors, and other issues. Provides that performance audits shall each include physical inspections of 3 random solar sites funded through the Adjustable Block program. Provides that the Auditor General shall consult with energy experts in the audit process and may employ an energy consulting firm. Provides for the Auditor General to report findings and recommendations. Repeals the provisions added by the amendatory Act on July 1, 2050. Effective immediately.","last":"Referred to Assignments","lastDate":"2026-02-05","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":[]},{"id":"SB3586","type":"SB","num":3586,"title":"Electric Utility Rate Caps","raw":"ELECTRIC UTILITY RATE CAPS","theme":"Utility rates, cost recovery & regulation","issue":"rate-caps","also":[],"chamber":"Senate","sponsor":"Sue Rezin","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["20 ILCS 3855/1-75","220 ILCS 5/16-108.30"],"nStat":2,"amend":[],"summary":"Amends the Illinois Power Agency Act. In provisions concerning the Planning and Procurement Bureau, provides that the total of renewable energy resources procured shall be reduced for all retail customers based on the amount necessary to limit the annual estimated average net increase due to the costs of these resources included in the amounts paid by eligible retail customers in connection with electric service to no more than 4.25% of the amount paid per kilowatthour by those customers during the year ending May 31, 2009 (removes provisions concerning an inflation adjustment). In provisions concerning the Energy Transition Assistance Fund, provides that the energy transition assistance charge shall not exceed 1.3% (instead of 1.45%) of the amount paid per kilowatthour by eligible retail customers during the year ending May 31, 2009. Removes provisions concerning an adjustment in the energy transition assistance charge for inflation. Effective immediately.","last":"Referred to Assignments","lastDate":"2026-02-05","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":[]},{"id":"SB3593","type":"SB","num":3593,"title":"Telecommunications Theft","raw":"TELECOMMUNICATIONS THEFT","theme":"Technology, privacy & communications","issue":"tel-theft","also":[],"chamber":"Senate","sponsor":"Dave Syverson","party":"R","cos":["Senator Sue Rezin (R)"],"nCos":1,"bip":false,"committees":["Assignments (Senate)","Criminal Law (Senate)"],"statutes":["815 ILCS 325/2from Ch. 121 1/2, par. 322","815 ILCS 325/4.1","815 ILCS 325/6.5"],"nStat":3,"amend":[],"summary":"Amends the Recyclable Metal Purchase Registration Law. Provides that it is a violation of the Act for any person to possess, purchase, attempt to purchase, sell, or attempt to sell, or for any recyclable metal dealer to purchase or attempt to purchase, telecommunications wire in any amount unless the seller is an authorized agent, a representative or employee of a licensed contractor of a public utility, a provider of telecommunications services, as described in the Public Utilities Act, or a provider of broadband service, interconnected VoIP services, or wireless services, as described in the Public Utilities Act. Provides that the Recyclable Metal Theft Task Force shall review the effectiveness of its efforts in deterring and investigating the problem of recyclable metal theft specific to telecommunications wires, burned wire, and any other equipment used to provide (i) telecommunications services, as described in the Public Utilities Act, or (ii) broadband service, interconnected VoIP services, or wireless services, as described in the Public Utilities Act. Provides that the Task Force shall consider and develop long-term solutions, both legislative and enforcement-driven, for the rising problem of theft of these wires and equipment in this State. Provides that the Task Force shall be composed of one representative of a wireless telecommunications carrier. Provides that the Task Force shall, by October 31 of each year, report its findings and recommendations to the General Assembly and the Governor. Changes the definition of the term\"recyclable metal\". Defines the terms\"burned wire\" and\"telecommunications wire\". Effective July 1, 2027.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-04-17","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"SB3606","type":"SB","num":3606,"title":"EPA-Heat Rate","raw":"EPA-HEAT RATE","theme":"Gas & building decarbonization","issue":"heat-rate","also":[],"chamber":"Senate","sponsor":"Steve Stadelman","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["415 ILCS 5/9.15"],"nStat":1,"amend":[],"summary":"Amends the Environmental Protection Act. In provisions regarding the regulation of greenhouse gases, defines\"heat rate\" as the gross amount of energy used by an electric generator or power plant, expressed in British thermal units (Btus), to generate one kilowatt hour (kWh) of electricity, as measured using a 12-month average. In provisions regarding electric generating units and large greenhouse gas-emitting units that have a heat rate greater than or equal to 7,000 Btus/kWh, requires each EGU and large GHG-emitting unit, by no later than January 1, 2035, to reduce its COe emissions by at least 50% from its existing COe emissions as measured using a 12-month gross average in 2034.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-04-24","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":[]},{"id":"SB3613","type":"SB","num":3613,"title":"Rural Broadband Deploy Study","raw":"RURAL BROADBAND DEPLOY STUDY","theme":"Technology, privacy & communications","issue":"broadband-study","also":[],"chamber":"Senate","sponsor":"Rachel Ventura","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Appropriations (Senate)"],"statutes":["220 ILCS 80/35 new"],"nStat":1,"amend":[],"summary":"Amends the Broadband Advisory Council Act. Requires the Broadband Advisory Council to identify and evaluate the costs and benefits that may materialize pursuant to the installation and deployment of rural broadband in all areas served by broadband cooperatives in Illinois. Provides that the study shall consider all material social and economic costs and benefits of the installation and deployment, including, but not limited to, the effects of expanded access to telehealth, remote job opportunities, and educational materials.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":[]},{"id":"SB3629","type":"SB","num":3629,"title":"Cty Code-Commercial Wind/Solar","raw":"CTY CD-COMMERCIAL WIND/SOLAR","theme":"Solar, storage & distributed energy","issue":"commercial-solar-south","also":[],"chamber":"Senate","sponsor":"Terri Bryant","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["55 ILCS 5/5-12020"],"nStat":1,"amend":[],"summary":"Amends the Counties Code. Provides that the amendments made by Public Act 102-1123 to provisions concerning commercial wind energy facilities and commercial solar energy facilities do not apply to a commercial wind energy development, a commercial solar energy development, or an energy storage development on property in that located South of Interstate 70 and Edwards County, Franklin County, Hamilton County, Jackson County, Jefferson County, Madison County, Monroe County, Perry County, Randolph County, St. Clair County, Union County, Wabash County, Washington County, Wayne County, or White County.","last":"Referred to Assignments","lastDate":"2026-02-05","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":[]},{"id":"SB3652","type":"SB","num":3652,"title":"Broadband Providers-Easements","raw":"BROADBAND PROVIDERS-EASEMENTS","theme":"Technology, privacy & communications","issue":"broadband-easements","also":[],"chamber":"Senate","sponsor":"Michael W. Halpin","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["220 ILCS 30/17.3","220 ILCS 30/17.4","220 ILCS 30/17.5","220 ILCS 30/17.6","220 ILCS 30/17.8"],"nStat":5,"amend":[],"summary":"Amends the Electric Supplier Act. In provisions concerning rights granted to electric cooperative broadband grant recipients, provides that, outside of the grant service area, a broadband provider may access and use (i) any existing electric easement held or controlled by the broadband provider or (ii) any other existing electric easement contingent upon an agreement with the easement holder or controller for the delivery of broadband service by the broadband provider. Provides that, if the proper permits are acquired by State and local authorities, no property owner of property located outside the grant service area shall forbid or prevent a proposed broadband provider from entering upon the property for purposes of and in connection with the deployment of broadband infrastructure, nor shall any such property owner forbid or prohibit the broadband provider from deploying upon, beneath, or over that property broadband infrastructure utilized by the broadband provider for such broadband service. Provides that the property owner may be entitled to the payment of just compensation by that broadband provider and the broadband provider shall indemnify the property owner for any physical damage caused by the deployment of the broadband infrastructure and service. Changes references in the Electrical Service Broadband Deployment and Access Law to include broadband providers.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-03-13","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["SB3838"]},{"id":"SB3664","type":"SB","num":3664,"title":"DCEO-Energy Choice","raw":"DCEO-ENERGY CHOICE","theme":"Retail choice & procurement","issue":"energy-choice-commission","also":[],"chamber":"Senate","sponsor":"Meg Loughran Cappel","party":"D","cos":["Senator Chris Balkema (R)"],"nCos":1,"bip":true,"committees":["Assignments (Senate)","Appropriations (Senate)"],"statutes":["20 ILCS 605/605-1119 new"],"nStat":1,"amend":[],"summary":"Amends the Department of Commerce and Economic Opportunity Law of the Civil Administrative Code of Illinois. Creates the Illinois Future of Energy Choice and Economic Impact Commission. Sets forth the membership of the Commission. Provides that the Commission has certain duties with respect to energy policy. Effective immediately.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB5195"]},{"id":"SB3665","type":"SB","num":3665,"title":"Income Tax-Energy Choice","raw":"INC TAX-ENERGY CHOICE","theme":"Retail choice & procurement","issue":"energy-choice-credit","also":[],"chamber":"Senate","sponsor":"Meg Loughran Cappel","party":"D","cos":["Senator Chris Balkema (R)"],"nCos":1,"bip":true,"committees":["Revenue (Senate)","Assignments (Senate)"],"statutes":["35 ILCS 5/246 new"],"nStat":1,"amend":[],"summary":"Amends the Illinois Income Tax Act. Provides that a qualified taxpayer may apply to the Department of Revenue for an income tax credit in an amount equal to 20% of the wages paid by the qualified taxpayer to a qualified energy choice worker based in Illinois in the taxable year. Provides that the term\"qualified taxpayer\" means a taxpayer that is a regulated utility in the State of Illinois or a power generating company providing baseload or intermediate generation in Illinois and that meets specified criteria and is able to demonstrate an adverse and material operational impact to either its overall Illinois-based workforce or its ability to conduct business in Illinois based on the scheduled phaseout target dates of 2030, 2035, 2040, and 2045, as provided in Public Act 102-662. Sets forth limitations on the amount of the credit. Effective immediately.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["HB5194"]},{"id":"SB3693","type":"SB","num":3693,"title":"Clean Transportation Standard","raw":"CLEAN TRANSPORTATION STANDARD","theme":"Environment, climate & EPA","issue":"clean-transport","also":[],"chamber":"Senate","sponsor":"David Koehler","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["New Act"],"nStat":1,"amend":[],"summary":"Creates the Clean Transportation Standard Act. Establishes a clean transportation standard to reduce life cycle carbon intensity of fuels for the ground transportation sector by specified amounts. Provides for related rulemaking and calculations. Provides that the clean transportation standard shall take the form of a credit marketplace monitored by the Environmental Protection Agency. Provides for verification and data privacy requirements for the Agency. Provides for penalties for failing to offset deficits in certain situations, and for penalties for submitting false information. Exempts airline, rail, ocean-going, and military fuel. Provides that the Agency must develop a periodic fuel supply forecast. Establishes findings. Defines terms. Contains other provisions. Effective January 1, 2027.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-03-13","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"SB3705","type":"SB","num":3705,"title":"Energy Storage Revenue Bonds","raw":"ENERGY STORAGE REVENUE BONDS","theme":"Solar, storage & distributed energy","issue":"storage-bonds","also":[],"chamber":"Senate","sponsor":"Sue Rezin","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["20 ILCS 3501/801-40","20 ILCS 3501/825-65","20 ILCS 3855/1-75","220 ILCS 5/16-107.6","220 ILCS 5/8-507.5 new","415 ILCS 5/9.15 rep."],"nStat":6,"amend":[],"summary":"Amends the Illinois Finance Authority Act. Provides that the Illinois Finance Authority shall have power to issue revenue bonds for energy storage projects that seek State-level energy storage credits or utility cost recovery. Provides that the Authority shall coordinate with the Illinois Power Agency to ensure that the financing terms of the revenue bonds are structured to minimize costs to State ratepayers. In provisions concerning Clean Coal, Coal, Energy Efficiency, PACE, and Renewable Energy Project financing, provides that bonds issued by the Authority shall be limited obligations of the Authority and payable solely from the revenues and receipts derived from the energy storage projects for which the bonds are issued. Requires the bonds to contain on their face a certain statement. Amends the Illinois Power Agency Act. In provisions concerning the Planning and Procurement Bureau, provides that an energy storage project shall not be eligible for the procurement of energy storage credits under provisions concerning the equity accountability system unless the owner or developer of the energy storage project demonstrates, as a condition of bid eligibility, that the energy storage project's long-term debt financing is secured through bonds issued by the Authority. Provides that the Agency shall not execute any procurement plan or enter into contracts for energy storage or renewable energy credits that would result in the average retail customer's bill exceeding cost-control caps set forth in certain provisions of the Public Utilities Act, unless the excess amount is approved by the General Assembly. Amends the Public Utilities Act. Requires the Illinois Commerce Commission to conduct an annual Energy Affordability and Rate Impact Study. Sets forth requirements for the content of the Study. In provisions concerning distributed generation rebates, provides that, if a Multi-Year Integrated Grid Plan or any subsequent integrated resource plan submitted by a utility or the Commission includes a proposal to increase, suspend, or otherwise exceed any existing statutory rate caps or cost-control benchmarks in certain provisions of the Act, such adjustment shall not take effect unless specifically approved by a joint resolution of the General Assembly. Amends the Environmental Protection Act by repealing provisions concerning greenhouse gases. Makes other changes. Effective immediately.","last":"Referred to Assignments","lastDate":"2026-02-05","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":["HB5440"]},{"id":"SB3711","type":"SB","num":3711,"title":"Solar Energy Checkoff Program","raw":"SOLAR ENERGY CHECKOFF PROGRAM","theme":"Solar, storage & distributed energy","issue":"solar-checkoff","also":[],"chamber":"Senate","sponsor":"Adriane Johnson","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["30 ILCS 105/5.1038 new","New Act"],"nStat":2,"amend":[],"summary":"Creates the Solar Energy Reliability and Affordability Checkoff Program Act. Sets forth findings. Defines terms. Creates the Solar Energy Reliability and Affordability Fund. Provides that the Fund may receive deposits of moneys collected by the Department of Agriculture under provisions of the Act concerning the collection of solar energy fees. Creates the Solar Energy Reliability and Affordability Board appointed by the Governor to administer and manage the Fund. Sets forth membership requirements of the Board. Provides that the Board shall ensure that assessments collected under the Act are used for the creation and publication of research, communication, marketing, and education programs that promote accurate information related to, emphasize the clean energy benefits and affordability of, and promote the adoption of solar energy systems and energy storage systems, which may include the funding of third-party organizations for these purposes and any related activities to carry out the programs as proposed by the Board. Requires each owner, operator, or developer of a solar energy system to pay a $5 per kilowatt-hour assessment on all solar energy systems sold for installation within the State to the Department of Agriculture. Provides that assessments are payable directly to the Board and shall be paid when a commercial renewable energy facility owner enters into an agricultural impact mitigation agreement as required under the Renewable Energy Facilities Agricultural Impact Mitigation Act. Requires the Board to publish an annual financial and activities report. Amends the State Finance Act to create the Solar Energy Reliability and Affordability Fund as a special fund in the State treasury. Effective immediately.","last":"Referred to Assignments","lastDate":"2026-02-05","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":["HB5388"]},{"id":"SB3717","type":"SB","num":3717,"title":"Low-Income Utility Rates","raw":"LOW-INCOME UTILITY RATES","theme":"Utility rates, cost recovery & regulation","issue":"low-income-rate","also":[],"chamber":"Senate","sponsor":"Adriane Johnson","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Appropriations (Senate)"],"statutes":["220 ILCS 5/9-241from Ch. 111 2/3, par. 9-241","305 ILCS 20/13","305 ILCS 20/6from Ch. 111 2/3, par. 1406"],"nStat":3,"amend":[],"summary":"Amends the Public Utilities Act. In provisions concerning nondiscrimination, provides that the Commission is authorized to approve a low-income discount rate for residential electric and natural gas customers that applies to the entirety of a qualifying customer's bill, including, but not limited to, a qualifying customer's delivery service charges and energy supply charges. Provides that an electric or natural gas utility may fund low-income discount rates through a surcharge on customers' electric and natural gas bills. Provides that the changes to the Act apply retroactively on and after January 1, 2023. Amends the Energy Assistance Act. In provisions concerning eligibility under the Act, provides that, in setting the annual eligibility level for the use of State funds from the Supplemental Low-Income Energy Assistance Fund, the Department of Commerce and Economic Opportunity shall consider the amount of available funding and may not set a limit higher than 300% of the federal nonfarm poverty level. In provisions concerning the Supplemental Low-Income Energy Assistance Fund, provides that the yearly administrative expenses of the Fund may not exceed 15% (rather than 13%) of the amount collected during that year, except when unspent funds from the Fund are reallocated from a previous year. Provides that any unspent balance of the 15% administrative allowance may be utilized for administrative expenses in the year they are reallocated. Provides that, of the 15% administrative allowance, no less than 9% (rather than 8%) shall be provided to Local Administrative Agencies for administrative expenses. Provides that, beginning January 1, 2027, the Base Energy Assistance Charge shall be $0.80 per month for each utility that is required by the Illinois Commerce Commission to implement a low-income discount rate and shall be $0.40 per month for each utility that is not required to implement a low-income discount rate and that contributes to the Supplemental Low-Income Energy Assistance Fund. Makes other changes.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB4456"]},{"id":"SB3761","type":"SB","num":3761,"title":"Data Centers-Various","raw":"DATA CENTERS-VARIOUS","theme":"Data centers & large load","issue":"dc-selfdirect","also":[],"chamber":"Senate","sponsor":"Mike Simmons","party":"D","cos":["Representative Mary Gill (D)"],"nCos":1,"bip":false,"committees":["Executive (Senate)","Assignments (Senate)","AI and Social Media (Senate)"],"statutes":["20 ILCS 3855/1-75","220 ILCS 5/16-105.5","220 ILCS 5/4-620 new"],"nStat":3,"amend":[],"summary":"Amends the Illinois Power Agency Act. Establishes the data center self-direct program to allow for customers taking service under the data center tariff to receive a reduction in the charges collected for the procurement of renewable energy resources. Provides that the reduction in charges available to the customer shall increase based on the energy or capacity value of the new additive clean energy generation's contribution pursuant to the specified requirements. Provides that the Illinois Power Agency may require that participating customers provide annual reports related to facility operation and performance, customer electricity consumption and load profiles, and other information as necessary. Amends the Public Utilities Act. Provides that, on or after January 1, 2027, at least 180 days prior to commencing any construction activities, the data center operator of a proposed data center shall submit a data center disclosure to the Illinois Commerce Commission. Establishes publication and open meeting requirements concerning the data center disclosures. On and after January 1, 2027, requires all data centers operating within the State to maintain water consumption data to submit annual disclosures of the data center's water usage to the Department of Natural Resources. Requires the Department of Natural Resources to make an aggregated and anonymized form of data disclosed to it available on a publicly accessible website. Provides that data centers that fail to comply with any disclosure requirements under the Act may be subject to fines of up to $10,000 per violation. Requires the Department of Natural Resources and the Illinois Commerce Commission to adopt implementing rules. Requires a specified electric utility to, no later than 90 days after the effective date of the amendatory Act, make a filing with the Commission that proposes revenue-neutral tariff changes, which shall present the Commission with an opportunity to suspend the tariffs and consider revenue-neutral tariff changes related to rate design. Makes other changes. Effective immediately.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["SB3830"]},{"id":"SB3772","type":"SB","num":3772,"title":"EPA-Environmental Justice","raw":"EPA-ENVIRONMENTAL JUSTICE","theme":"Environment, climate & EPA","issue":"ej-permits","also":[],"chamber":"Senate","sponsor":"Graciela Guzman","party":"D","cos":["Senator Rachel Ventura (D)","Senator Javier L. Cervantes (D)","Senator Adriane Johnson (D)","Senator Sara Feigenholtz (D)","Senator Laura Ellman (D)","Senator David Koehler (D)","Senator Mike Porfirio (D)","Representative Lilian Jim\u00e9nez (D)","Representative Sonya M. Harper (D)","Representative Robyn Gabel (D)","Representative Diane Blair-Sherlock (D)","Representative Michelle Mussman (D)","Representative Aaron M. Ortiz (D)","Representative Theresa Mah (D)","Representative Kevin John Olickal (D)","Representative Kelly M. Cassidy (D)","Representative Mary Beth Canty (D)","Representative Justin Slaughter (D)","Representative Jennifer Gong-Gershowitz (D)","Representative Ann M. Williams (D)","Representative La Shawn K. Ford (D)","Representative Maura Hirschauer (D)","Representative Dagmara Avelar (D)","Representative Anna Moeller (D)"],"nCos":24,"bip":false,"committees":["Rules (House)","Executive (Senate)","Assignments (Senate)","Energy & Environment (House)"],"statutes":["415 ILCS 155/15 new","415 ILCS 5/39.16 new"],"nStat":2,"amend":["Senate Amendment 001"],"summary":"Amends the Environmental Protection Act. Provides that, beginning January 1, 2027, upon receipt of certain air pollution control construction permit applications, the Environmental Protection Agency shall evaluate (i) whether the applicable source falls within an area of environmental justice concern and, if so, notify specified persons; (ii) whether emissions can be reduced or limited; (iii) whether additional air quality modeling is needed; and (iv) whether specified permit enhancements are needed. Requires the Agency's permitting decisions to be informed by the applicant's history of violations of environmental laws and other factors. Allows the Agency to adopt rules. Amends the Environmental Justice Act. Establishes the Office of Environmental Justice within the Environmental Protection Agency to coordinate the integration of environmental justice into Agency programs and for other purposes. Requires the Director of the Environmental Protection Agency to appoint an Environmental Justice Officer to administer the Office of Environmental Justice. Effective immediately.","last":"Passed Both Houses","lastDate":"2026-05-30","lastChamber":"Senate","stage":"Passed both houses","stageLabel":"Passed both houses","stageNote":"Both chambers approved the same text","passed":true,"rtc":false,"pair":["HB5374"]},{"id":"SB3794","type":"SB","num":3794,"title":"Loc Gov-Residential Energy","raw":"LOC GOV-RESIDENTIAL ENERGY","theme":"Gas & building decarbonization","issue":"res-backup","also":[],"chamber":"Senate","sponsor":"Javier L. Cervantes","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["55 ILCS 5/5-46005","55 ILCS 5/5-46025","55 ILCS 5/5-46030 new","65 ILCS 5/11-15.5-25","65 ILCS 5/11-15.5-30 new","65 ILCS 5/11-15.5-5"],"nStat":6,"amend":["Senate Amendment 001"],"summary":"Amends the Counties Code and the Illinois Municipal Code. Provides that a county or a municipality may not adopt or enforce an ordinance, rule, or other measure that would regulate the installation or inspection of a residential energy backup system, including on a building with a shared roof. Defines\"residential energy backup system\". Effective June 1, 2026.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-04-17","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["HB5049"]},{"id":"SB3822","type":"SB","num":3822,"title":"Utilities-Recoverable Expenses","raw":"UTILITIES-RECOVERABLE EXPENSES","theme":"Utility rates, cost recovery & regulation","issue":"recoverable","also":[],"chamber":"Senate","sponsor":"Jil Tracy","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["220 ILCS 5/9-224from Ch. 111 2/3, par. 9-224","220 ILCS 5/9-225from Ch. 111 2/3, par. 9-225","220 ILCS 5/9-227from Ch. 111 2/3, par. 9-227","220 ILCS 5/9-229"],"nStat":4,"amend":[],"summary":"Amends the Public Utilities Act. Provides that the Illinois Commerce Commission shall not consider as an expense of any public utility, for the purpose of determining any rate or charge, any amount expended for contributions or gifts to political candidates, political parties, political or legislative committees, or any committee or organization working to influence referendum petitions or elections or contributions to a trade association, chamber of commerce, or public charity, including, but not limited to, a charity managed by the public utility or an affiliated interest. Makes changes in provisions definitions; donations made by a public utility for energy assistance; consideration of attorney and expert compensation as an expense; and the Consumer Intervenor Compensation Fund.","last":"Referred to Assignments","lastDate":"2026-02-06","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":["HB4781","SB3497"]},{"id":"SB3830","type":"SB","num":3830,"title":"Data Centers-Various","raw":"DATA CENTERS-VARIOUS","theme":"Data centers & large load","issue":"dc-selfdirect","also":[],"chamber":"Senate","sponsor":"Rachel Ventura","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Executive (Senate)","Assignments (Senate)","AI and Social Media (Senate)"],"statutes":["20 ILCS 3855/1-75","220 ILCS 5/16-105.5","220 ILCS 5/4-620 new","525 ILCS 45/5.1from Ch. 5, par. 1605.1","525 ILCS 45/5.4 new","525 ILCS 45/5from Ch. 5, par. 1605"],"nStat":6,"amend":["Senate Amendment 001","Senate Amendment 002"],"summary":"Amends the Illinois Power Agency Act. Establishes the data center self-direct program to allow for customers taking service under the data center tariff to receive a reduction in the charges collected for the procurement of renewable energy resources. Provides that the reduction in charges available to the customer shall increase based on the energy or capacity value of the new additive clean energy generation's contribution pursuant to the specified requirements. Provides that the Illinois Power Agency may require that participating customers provide annual reports related to facility operation and performance, customer electricity consumption and load profiles, and other information as necessary. Amends the Public Utilities Act. On and after January 1, 2027, requires all data centers operating within the State and discharging water to a wastewater treatment plant to identify likely pollutants in the data center's water discharges to monitor the data center's water discharges for the likely pollutants and to maintain data on the pollutant levels in water discharges. Requires the Environmental Protection Agency to analyze and assess all data center water pollutant discharge level disclosure data. On and after January 1, 2027, requires all data centers operating within the State to maintain water consumption data to submit annual disclosures of the data center's water usage to the Department of Natural Resources. Requires the Department of Natural Resources to make an aggregated and anonymized form of data disclosed to it available on a publicly accessible website. Provides that data centers that fail to comply with any disclosure requirements under the Act may be subject to fines of up to $10,000 per violation. Requires the Department of Natural Resources and the Illinois Commerce Commission to adopt implementing rules. Requires a specified electric utility to, no later than 90 days after the effective date of the amendatory Act, make a filing with the Commission that proposes revenue-neutral tariff changes, which shall present the Commission with an opportunity to suspend the tariffs and consider revenue-neutral tariff changes related to rate design. Amends the Water Use Act of 1983. Makes changes in provisions concerning water conflict resolution and groundwater emergency restrictions. Sets forth requirements for data centers under the Act. Makes other changes. Effective immediately.","last":"Senate Committee Amendment No. 2 Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["SB3761"]},{"id":"SB3838","type":"SB","num":3838,"title":"Broadband Deployment Act","raw":"BROADBAND DEPLOYMENT ACT","theme":"Technology, privacy & communications","issue":"broadband-easements","also":[],"chamber":"Senate","sponsor":"Patrick J. Joyce","party":"D","cos":["Senator Paul Faraci (D)","Senator Mattie Hunter (D)","Senator Napoleon Harris, III (D)","Senator Javier L. Cervantes (D)"],"nCos":4,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["New Act"],"nStat":1,"amend":[],"summary":"Creates the Broadband Deployment Act. Sets forth findings. Defines terms. Provides that, conditional upon acquiring the proper agreement or permit with the highway right-of-way controller or holder, a broadband grant recipient may install, maintain, and use broadband infrastructure along a highway right-of-way. Provides that no property owner of property located within the highway right-of-way shall forbid or prevent a proposed broadband grant recipient from entering upon the property for purposes of and in connection with the deployment of broadband infrastructure, nor shall any such property owner forbid or prohibit the broadband grant recipient from deploying upon, beneath, or over that property broadband infrastructure utilized by the broadband grant recipient for such broadband service. Provides that the broadband grant recipient must notify the property owner in writing by sending notification to the property owner's address specified in the online or publicly available records of the applicable county assessor (i) by the United States Postal Service, certified mail, return receipt requested; (ii) by a designated private delivery service, as defined by the Internal Revenue Service, that provides the same function as certified mail with return receipt; or (iii) by personally serving the notification. Sets forth requirements for the content of the notice. Provides that if the property owner intends to demand just compensation, the property owner must serve written notice thereof upon the broadband grant recipient within 45 days after the anticipated date of broadband deployment as provided in the notice to the property owner. Provides that neither the property owner's notice to demand just compensation, nor the property owner's assertion of a specific claim for just compensation, nor the initiation of any legal action to enforce the claim of just compensation shall delay or impair the right of the broadband grant recipient to deploy broadband infrastructure and provide broadband service within or upon, beneath, or over certain property. Provides that the rights and obligations of broadband grant recipients and landowners set forth in the amendatory provisions do not apply on and after January 1, 2030. Makes other changes. Effective immediately.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-04-17","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["SB3652"]},{"id":"SB3839","type":"SB","num":3839,"title":"Utilities-Various","raw":"UTILITIES-VARIOUS","theme":"Utility rates, cost recovery & regulation","issue":"repeal-various","also":[],"chamber":"Senate","sponsor":"Dave Syverson","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["20 ILCS 3855/1-75","20 ILCS 605/605-1075 rep.","220 ILCS 5/16-108.30 rep.","220 ILCS 5/8-103A rep.","220 ILCS 5/8-103B rep.","220 ILCS 5/8-103 rep.","220 ILCS 5/9-241from Ch. 111 2/3, par. 9-241","220 ILCS 5/9-252.2 new","35 ILCS 620/2a.1 rep.","35 ILCS 620/2a.2 rep.","35 ILCS 640/Act rep."],"nStat":11,"amend":[],"summary":"Amends the Department of Commerce and Economic Opportunity Law of the Civil Administrative Code of Illinois. Repeals provisions concerning the Energy Transition Assistance Fund. Amends the Illinois Power Agency Act. Removes provisions concerning the renewable portfolio standard. Amends the Public Utilities Revenue Act. Repeals provisions concerning the imposition of tax on invested capital and on distribution of electricity and provisions concerning annual return, collection, and payment. Repeals the Electricity Excise Tax Law. Amends the Public Utilities Act. In provisions concerning nondiscrimination, removes the authority of the Illinois Commerce Commission to permit or require electric and natural gas utilities to file a tariff establishing low-income discount rates after the completion of the Commission's study assessing the necessity, design, and implementation of low-income discount rates. Provides that no public utilities in the State shall charge any fees or surcharges for energy storage programs on a customer's electric bill. Repeals provisions concerning energy efficiency and demand-response measures; an energy efficiency analysis; and the Energy Transition Assistance Fund.","last":"Referred to Assignments","lastDate":"2026-02-06","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":false,"pair":[]},{"id":"SB3856","type":"SB","num":3856,"title":"BIPA-Security Purpose","raw":"BIPA-SECURITY PURPOSE","theme":"Technology, privacy & communications","issue":"bipa","also":[],"chamber":"Senate","sponsor":"John F. Curran","party":"R","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["740 ILCS 14/10","740 ILCS 14/15"],"nStat":2,"amend":[],"summary":"Amends the Biometric Information Privacy Act. Defines\"security purpose\" to mean for the purpose of preventing or investigating retail theft, fraud, or any other misappropriation or theft of a thing of value. Provides that security purpose includes protecting property from trespass, controlling access to property, or protecting any person from harm, including stalking, violence, or harassment, and includes assisting a law enforcement investigation. Waives certain requirements for collecting, capturing, or otherwise obtaining a person's or a customer's biometric identifier or biometric information under certain circumstances relating to security purposes. Effective immediately.","last":"Referred to Assignments","lastDate":"2026-02-06","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":[]},{"id":"SB3890","type":"SB","num":3890,"title":"Consumer Data Privacy","raw":"CONSUMER DATA PRIVACY","theme":"Technology, privacy & communications","issue":"data-privacy","also":[],"chamber":"Senate","sponsor":"Rachel Ventura","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Executive (Senate)","Assignments (Senate)","AI and Social Media (Senate)"],"statutes":["30 ILCS 105/5.1038 new","815 ILCS 530/55 new","815 ILCS 530/60 new","815 ILCS 530/65 new","New Act"],"nStat":5,"amend":[],"summary":"Creates the Illinois Data Privacy Protection Act. Applies to legal entities that conduct business in Illinois or produce products or services that are targeted to Illinois residents and that satisfy one or more of the following thresholds: during a calendar year, controls or processes personal data of 100,000 consumers or more, excluding personal data controlled or processed solely for the purpose of completing a payment transaction; or derives over 25% of gross revenue from the sale of personal data and processes or controls personal data of 25,000 consumers or more. Requires a controller, alone or jointly with others, to consider the purposes and means of the processing of personal data in protecting the security of consumers while processing personal data and in notifying consumers of a breach of the security of the system. Authorizes rights to consumers under the Act to include, but not be limited to, the right to access their personal data, obtain a list of third parties to whom their data has been disclosed, request corrections to inaccurate data, and question the profiling of their information. Authorizes the Attorney General to enforce the Act. Amends the Personal Information Protection Act. Provides that, annually, on or before January 31, a data broker operating in the State must register with the Attorney General. Provides that the Attorney General shall create a page on its Internet website in which the registration information is accessible to the public that allows consumers to delete their personal information across all registered data brokers. Provides for civil penalties. Amends the State Finance Act to create the Data Privacy Protection Fund. Makes definitions. Makes other changes. Limits the concurrent exercise of home rule powers. Contains a severability provision.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["HB5221","SB2875","SB3548"]},{"id":"SB3922","type":"SB","num":3922,"title":"Utilities-Various","raw":"UTILITIES-VARIOUS","theme":"Utility rates, cost recovery & regulation","issue":"vpp","also":[],"chamber":"Senate","sponsor":"Javier L. Cervantes","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["20 ILCS 3855/1-10","220 ILCS 5/16-107.6","220 ILCS 5/16-107.9","220 ILCS 5/20-140","220 ILCS 5/23-115","55 ILCS 5/5-12020"],"nStat":6,"amend":["Senate Amendment 003","Senate Amendment 002","Senate Amendment 001"],"summary":"Amends the Public Utilities Act. In provisions concerning virtual power plant programs, provides that, in setting the values of upfront payment and performance payment compensation under the provisions, the Illinois Commerce Commission shall set values for eligible systems that include energy storage that are, taking into account the time value of money, not less than: (A) for an eligible system that did not receive and agrees not to apply for a rebate for its storage component under specified provisions, $250 per kilowatt-hour nameplate capacity paid on the date the system is placed in service; or (B) for an eligible system that received a rebate for its storage component under specified provisions, $0 per kilowatt-hour. In provisions concerning distributed generation and storage rebates, provides that, until the later of December 31, 2029 or the threshold date (rather than until December 31, 2029), the value of specified rebates shall be $300 per kilowatt of nameplate generating capacity, measured as nominal DC power output, of the distributed generation. Amends the Counties Code. In provisions concerning setback distances for commercial wind energy facilities or commercial solar energy facilities, specifies that the ability of a county to require a reasonable setback distance between fencing and public rights-of-way if the requirement is not specific to commercial wind energy facilities or commercial solar energy facilities and does not preclude the development of commercial wind energy facilities or commercial solar energy facilities or the ability of commercial wind energy facilities or commercial solar energy facilities to comply with the requirements set forth in the provisions shall not exceed 50 feet between fencing and public rights-of-way. Amends the Illinois Power Agency Act. Provides that a\"community renewable generation project\" means an electric generating facility that, among other things, is limited in nameplate capacity to less than or equal to 5,000 kilowatts (rather than 10,000 kilowatts). Makes other changes.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-06-01","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB4996"]},{"id":"SB3927","type":"SB","num":3927,"title":"Clean Energy-Workforce Hubs","raw":"CLEAN ENERGY-WORKFORCE HUBS","theme":"Workforce, labor & tax incentives","issue":"workforce-hubs","also":[],"chamber":"Senate","sponsor":"Lakesia Collins","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Assignments (Senate)"],"statutes":["20 ILCS 730/5-20"],"nStat":1,"amend":[],"summary":"Amends the Energy Transition Act. Provides that the Clean Jobs Workforce Hubs Network shall incorporate targeted outreach, recruitment, training, and placement services specifically for participants seeking careers within the climate, environmental, and clean energy sector. Defines\"climate, environmental, and clean energy sector\". Provides that the Department of Commerce and Economic Opportunity shall collect, track, and report certain information concerning the Clean Jobs Workforce Network Program. Provides that the information shall be disaggregated by race, gender, geography, and equity status.","last":"Referred to Assignments","lastDate":"2026-02-06","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":["HB4910"]},{"id":"SB3929","type":"SB","num":3929,"title":"Environmental Goal Extensions","raw":"ENVIORNMENTAL GOAL EXTENSIONS","theme":"Environment, climate & EPA","issue":"goal-extension","also":[],"chamber":"Senate","sponsor":"Patrick J. Joyce","party":"D","cos":["Senator Donald P. DeWitte (R)","Senator Chris Balkema (R)","Senator Craig Wilcox (R)","Senator Seth Lewis (R)"],"nCos":4,"bip":true,"committees":["Assignments (Senate)"],"statutes":["20 ILCS 3855/1-5","220 ILCS 5/16-108.18","415 ILCS 5/9.15"],"nStat":3,"amend":[],"summary":"Amends the Illinois Power Agency Act. Provides that it is the policy of the State to rapidly transition to 100% clean energy by 2060 (rather than 2050). Amends the Public Utilities Act. In provisions relating to performance incentives and metrics for electric utilities designed to encourage those utilities to support and facilitate the State's clean energy transition, extends timelines by 10 years from existing statutory dates to allow for competitive market development and cost declines. Amends the Environmental Protection Act. Provides that all electricity generating units and large greenhouse gas-emitting units that use coal or oil as a fuel and are not public GHG-emitting units shall permanently reduce all CO2e and co-pollutant emissions to zero no later than January 1, 2040 (rather than 2030). Further provides that All EGUs and large greenhouse gas-emitting units that use coal as a fuel and are public GHG-emitting units shall permanently reduce CO2e emissions to zero no later than December 31, 2055 (rather than 2045). Provides that if the emissions reduction requirement is not achieved by December 31, 2045 (rather than 2035), the plant shall retire one or more units or otherwise reduce its CO2e emissions by 45% from existing emissions by June 30, 2048 (rather than 2038). Provides that no later than January 1. 2050 (rather than 2040) all EGUs and large greenhouse gas-emitting units that have a NOx emission rate of greater than 0.12 lbs/MWh or a SO2 emission rate greater than 0.006 lb/MWh, and are not located in or within 3 miles of an environmental justice community designated as of January 1, 2021 or an equity investment eligible community shall permanently reduce all CO2e and co-pollutant emissions to zero, including through unit retirement or the use of 100% green hydrogen or other similar technology that is commercially proven to achieve zero carbon emissions.","last":"Referred to Assignments","lastDate":"2026-02-06","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":[]},{"id":"SB3930","type":"SB","num":3930,"title":"Drone Safety & Interference","raw":"DRONE SAFETY & INTERFERENCE","theme":"Technology, privacy & communications","issue":"drone","also":[],"chamber":"Senate","sponsor":"Napoleon Harris, III","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Executive (Senate)","Assignments (Senate)"],"statutes":["New Act"],"nStat":1,"amend":[],"summary":"Creates the Drone Safety and Interference Prevention Act. Creates the offenses of (1) unlawful imaging of an emergency response activity; (2) unlawful operation over critical infrastructure facilities; and (3) unlawful operation of a drone over a correctional institution or facility. Defines these offenses and establishes penalties. Provides that a private person or entity operating a drone in the State is prohibited from equipping or using on the drone any firearm, weaponized laser, kinetic impact projectile, chemical agent or irritant, or any other lethal or non-lethal weapon. Provides that a law enforcement officer may seize a drone and any attached equipment, including any image-capturing devices, storage media, or weapons, if the officer has probable cause to believe the drone was used or operated in violation of the Act. Provides that any drone or equipment seized under the Act is subject to forfeiture in accordance with the Criminal Code of 2012 and the Forfeiture Article of the Code of Criminal Procedure of 1963, as applicable. Provides that the State may use forfeited drones and equipment for law enforcement purposes, including training and counter-drone operations. Provides that prior to forfeiture, the court shall provide notice and an opportunity for hearing to the owner or operator of the drone, unless the drone was abandoned or unclaimed. Provides that, if the court determines, by a preponderance of the evidence, that the drone was used in violation of the Act, the drone shall be forfeited to the State. Provides that any images or data seized under the provision shall be retained only if there is a reasonable suspicion they contain evidence of a crime. Provides that all other data must be deleted within 30 days unless relevant to an ongoing investigation. Provides that the State, any unit of local government, any law enforcement agency or any officers or agents of those entities that are acting reasonably and in good faith to enforce the Act are not civilly liable for damage to or loss of a drone, except for willful or wanton misconduct. Provides that the Act shall be enforced by State and local law enforcement agencies. Provides that enforcement data under the Act shall be reported through the Illinois State Police's existing Uniform Crime Reporting program. Contains a severability provision. Effective January 1, 2027.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-03-27","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":["HB5275"]},{"id":"SB3970","type":"SB","num":3970,"title":"Utility-Cost-Benefit Analysis","raw":"UTILITY-COST-BENEFIT ANALYSIS","theme":"Utility rates, cost recovery & regulation","issue":"gas-cba","also":[],"chamber":"Senate","sponsor":"Seth Lewis","party":"R","cos":["Senator Donald P. DeWitte (R)","Senator Chris Balkema (R)","Senator Craig Wilcox (R)"],"nCos":3,"bip":false,"committees":["Assignments (Senate)"],"statutes":["220 ILCS 5/8-106 new"],"nStat":1,"amend":[],"summary":"Amends the Public Utilities Act. Provides that, prior to approving or directing any decarbonization pathway, pilot program, infrastructure investment, or regulatory mandate related to the natural gas distribution system, the Commission shall conduct a comprehensive, independent cost-benefit analysis that evaluates: (i) life-cycle greenhouse gas emissions reductions; (ii) cumulative energy system costs, including any stranded asset risks estimated at no less than $80,000,000,000 by 2050 under high-electrification scenarios; (iii) ratepayer bill impacts for all customer classes, with a focus on low-income and non-migrating customers; (iv) system reliability and safety under State standards; (v) equity impacts, including cost shifts to vulnerable populations; (vi) workforce and job impacts; and (vii) the extent to which competitive market mechanisms, such as private investment, third-party financing, and supplier competition, can achieve equivalent or superior outcomes at lower costs. Provides that the Commission shall not approve a decarbonization pathway, pilot program, infrastructure investment, or regulatory mandate unless the pathway, program, investment, or mandate demonstrates net benefits under the cost-benefit analysis without prioritizing an approach where regulated solutions increase costs without proportional benefits. Provides that the Commission shall use transparent, market-based data from sources such as PJM Interconnection, LLC (PJM), Midcontinent Independent System Operator, Inc. (MISO), and Chicago Citygate and coordinate with applicable biennial long-term gas infrastructure plans.","last":"Referred to Assignments","lastDate":"2026-02-06","lastChamber":"Senate","stage":"Awaiting committee assignment","stageLabel":"Not yet in committee","stageNote":"Referred to Rules or Assignments and never sent to a committee","passed":false,"rtc":true,"pair":[]},{"id":"SB3973","type":"SB","num":3973,"title":"ICC Real Property Acquisition","raw":"ICC REAL PROPERTY ACQUISITION","theme":"Transmission, siting & land","issue":"icc-property","also":[],"chamber":"Senate","sponsor":"Doris Turner","party":"D","cos":[],"nCos":0,"bip":false,"committees":["Judiciary (Senate)","Assignments (Senate)"],"statutes":["220 ILCS 5/4-102 new"],"nStat":1,"amend":[],"summary":"Amends the Public Utilities Act. Provides that, subject to the provisions of the Public Contract Fraud Act, the Illinois Commerce Commission is authorized during fiscal years 2027 and 2028 to acquire real property located in Springfield, as necessary to carry out the duties vested in the Commission. Provides that real property may be acquired subject to any third-party interests in the property that do not prevent the Commission from beneficially using the property. Provides that the Executive Director of the Commission may enter into contracts relating to construction, reconstruction, or renovation projects for any buildings or lands acquired by the Commission, and contracts to equip, lease, repair, operate, and maintain real property as appropriate to carry out the duties of the Executive Director. Provides that the Executive Director, on behalf of the Commission, may enter into agreements for the purpose of exercising the Commission's authority. Provides that the exercise of the authority vested in the Commission to acquire property under the provision is subject to appropriation. Effective immediately.","last":"Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":false,"pair":[]},{"id":"SB3974","type":"SB","num":3974,"title":"Gas Appliance Labeling","raw":"GAS APPLIANCE LABELING","theme":"Gas & building decarbonization","issue":"gas-label","also":[],"chamber":"Senate","sponsor":"Graciela Guzman","party":"D","cos":["Senator Julie A. Morrison (D)","Senator Mattie Hunter (D)","Senator Robert Peters (D)","Senator Emil Jones, III (D)","Senator Rachel Ventura (D)","Senator Adriane Johnson (D)","Senator Napoleon Harris, III (D)"],"nCos":7,"bip":false,"committees":["Assignments (Senate)","Energy and Public Utilities (Senate)"],"statutes":["815 ILCS 505/2MMMM new"],"nStat":1,"amend":["Senate Amendment 001"],"summary":"Amends the Consumer Fraud and Deceptive Business Practices Act. Provides that no person shall sell, attempt to sell, or offer to sell to a consumer in the State a non-externally vented natural gas appliance that is manufactured on or after January 1, 2027 unless a label on the gas appliance bears a specified warning message. Provides that the Attorney General may adopt rules setting forth additional requirements for the placement and formatting of the label. Provides that a person who violates the provision commits an unlawful practice within the meaning of the Act.","last":"Senate Committee Amendment No. 1 Rule 3-9(a) / Re-referred to Assignments","lastDate":"2026-05-22","lastChamber":"Senate","stage":"Stalled by deadline rule","stageLabel":"Re-referred after deadline","stageNote":"Sent back to Rules or Assignments after missing a committee deadline","passed":false,"rtc":true,"pair":["HB4272"]},{"id":"SB3975","type":"SB","num":3975,"title":
