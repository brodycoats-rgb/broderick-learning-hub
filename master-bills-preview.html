 102-662, which is CEJA, and repeals a definition of clean energy. It takes effect immediately.","why":"If enacted, this would remove the CEJA emission reduction deadlines for fossil plants, a sweeping change. It is a statement bill as much as a working proposal, and it marks the far end of the range of CEJA rollback ideas on this list.","q":["What obligations in CEJA would disappear in practice","How do other CEJA linked programs depend on those provisions"],"go":["ctg","policy"],"plain":["SB3581 reverts the greenhouse gas parts of the Environmental Protection Act to the wording they had before Public Act 102-662, which is CEJA, and repeals a definition of clean energy. It takes effect immediately.","In practice it would undo the emission reduction deadlines and related rules that CEJA added for fossil fuel plants."],"ex":"A gas plant that had been planning for CEJA reduction deadlines would see them disappear from the law once the bill takes effect, and it would not need to meet those requirements. Made up example.","viz":{"kind":"flow","title":"What a reversion does","steps":["CEJA added greenhouse gas rules (PA 102-662)","SB3581 restores the text from before","Those deadlines go away"]},"states":[["Rollbacks elsewhere","Some states have loosened clean energy targets or delayed deadlines, including Virginia and Pennsylvania debates on regional carbon programs. I did not verify the current law of each state, so check before quoting."]],"places":[["Illinois power plants","CEJA's requirements applied to coal, oil and some gas plants on a schedule that started in 2030."]],"news":[]},"clean-transport":{"headline":"A clean transportation fuel standard with a credit market","bg":"The Clean Transportation Standard Act sets declining carbon intensity targets for ground transportation fuels and runs through a credit marketplace monitored by Illinois EPA. California's low carbon fuel standard is the best known model.","why":"In similar programs, electric utilities earn credits for supplying electricity to vehicles. The value of those credits can fund charging programs and lower the cost of electric vehicle service, but fuel suppliers would face compliance costs that can show up in pump prices.","q":["How would utilities generate and use credits","What is the starting carbon intensity baseline"],"go":["policy"],"plain":["A clean fuel standard sets a carbon intensity target for gasoline, diesel and other transportation fuels, and the target gets lower each year. Fuel sellers who beat the target earn credits, and those who miss it must buy credits. SB3693, the Clean Transportation Standard Act, creates that system in Illinois with a credit marketplace monitored by the Illinois EPA.","California's low carbon fuel standard is the best known model."],"ex":"Under the standard a fuel supplier blends more ethanol or renewable diesel, or supplies electricity for charging, and earns credits it can sell. A supplier that cannot meet the target buys credits from others. Made up example.","viz":{"kind":"flow","title":"Credit market","steps":["Target gets lower each year","Cleaner fuels earn credits","Dirtier fuels need credits","Credits traded in a market"]},"states":[["California","Started its low carbon fuel standard in 2011."],["Oregon and Washington","Oregon's Clean Fuels Program and Washington's Clean Fuel Standard run on the same credit model."],["New Mexico","Passed a Clean Transportation Fuel Standard in 2024."]],"places":[["Illinois corn and soybean country","Ethanol and biodiesel producers could benefit from credits, which is one reason the idea has farm state support and opposition from fuel sellers."]],"news":[]},"goal-extension":{"headline":"Push CEJA clean energy deadlines back by about a decade","bg":"The bill changes state policy to rapidly transition to 100 percent clean energy by 2060 instead of 2050. It extends utility performance metric timelines by 10 years, moves the coal and oil zero emissions date from 2030 to 2040, and moves later dates for coal, public plants and high emission units out by roughly 10 years or more.","why":"This is the broadest timeline extension proposal on the list. For utilities it would relax the performance metrics tied to the clean energy transition, and for generation owners it changes retirement dates. It also changes the planning basis for the IPA and for grid plans.","q":["Which retirements would move and by how much","Do the utility performance metrics shift with the same dates"],"go":["ctg","policy","grid"],"plain":["CEJA set a goal of 100 percent clean energy by 2050. SB3929 pushes the goal to 2060. It also extends utility performance metric timelines by 10 years, moves the coal and oil zero emissions date from 2030 to 2040, and moves later dates for coal, public plants and high emission units out by about a decade or more.","The change would give existing plants more years and lower the pace of the transition."],"ex":"A coal plant that had to stop emitting in 2030 would have until 2040. A utility with a performance target that landed in 2035 would see it move to 2045. Made up example.","viz":{"kind":"bars","title":"Key dates","rows":[["CEJA goal year",2050.0],["SB3929 goal year",2060.0]],"unit":"year"},"states":[["Other states","Most states with 100 percent clean energy laws have kept their dates, with some adding reliability safety valves. I did not verify whether any other state has pushed its goal out by a decade."]],"places":[["Illinois coal and oil plants","The 2030 date applies to coal and oil fired plants, which is why this is a utility and generator focused bill."]],"news":[]},"gas-label":{"headline":"Warning labels on unvented gas appliances","bg":"These bills amend the Consumer Fraud and Deceptive Business Practices Act so no one may sell a non externally vented natural gas appliance made on or after January 1, 2027 without a label carrying a specified warning. The Attorney General may add requirements by rule. Indoor combustion from gas stoves and similar appliances has become a health and policy topic nationally.","why":"Labels shape consumer perception of gas appliances and may be used as a first step toward broader restrictions. For gas utilities the concern is the effect on customer choices and on the political climate for gas in homes, even though the bill itself regulates sellers and not utilities.","q":["What exactly would the warning say","Does it reach appliances already installed"],"go":["gas"],"plain":["An unvented gas appliance burns gas indoors and releases the exhaust into the room instead of sending it outside through a pipe. HB4272 and SB3974 say no one may sell one made on or after January 1, 2027 unless it carries a warning label. The Attorney General can add requirements by rule, and the enforcement route is the state consumer fraud law.","The concern behind it is indoor air quality. Burning gas indoors produces nitrogen dioxide and other pollutants."],"ex":"A shopper buys a gas fireplace log set or a ventless heater. The box would carry a clear warning about indoor combustion and the need for ventilation. A gas stove vented by a hood is not the same product class, so check how the bill defines unvented. Made up example.","viz":{"kind":"flow","title":"What changes at the store","steps":["Appliance made on or after Jan 1, 2027","Must carry warning label","Attorney General can add rules","Sale without a label breaks consumer fraud law"]},"states":[["No statewide model found","I did not find another state with a statewide warning label law for gas appliances. California's Proposition 65 is the closest, and it works through business notices, so treat any comparison as loose."]],"places":[["Illinois homes","Older apartments and small homes with ventless heaters and gas ranges are where the issue shows up, especially in winter."]],"news":[]},"gas-ban-preempt":{"headline":"Stop local governments from banning natural gas in new construction without a referendum","bg":"Several cities nationally have restricted gas hookups in new buildings. These bills bar a county or municipality from adopting any regulation that prohibits or effectively prohibits natural gas use in new construction unless voters approve it by referendum, and limit concurrent home rule powers.","why":"This protects the ability to offer gas service in new construction and removes local patchwork risk for gas utilities. Opponents frame it as local control being limited. Companion bills with different sponsors suggest bipartisan appeal.","q":["How is a prohibition with the effect of a ban defined","How does it interact with stretch energy code adoption"],"go":["gas"],"plain":["Some cities have passed rules that stop gas hookups in new buildings so that new homes are all electric. HB4419 and SB2979 bar a county or municipality from adopting any rule that prohibits or effectively prohibits natural gas in new construction unless voters approve it in a referendum. The bills also limit home rule power, which is the broad power Illinois cities like Chicago have to act on local matters.","Supporters say it protects consumer choice and the gas workforce. Opponents say it takes away local control over climate policy."],"ex":"A suburb passes an ordinance that new houses cannot connect to gas. Under the bills that ordinance would be void unless residents approved it on a ballot. A builder who wants to install gas stoves and furnaces could. Made up example.","viz":{"kind":"vs","title":"Local choice on gas in new buildings","sides":[{"h":"Today","items":["City can adopt rules","No statewide bar on a local rule"]},{"h":"Under the bills","items":["Local rule only after a referendum","Home rule power limited"]}]},"states":[["Many states","More than twenty states have passed laws blocking local gas bans, including Texas, Ohio, Arizona, Florida and Tennessee."],["Berkeley, California","Passed the first ban in 2019, and a federal appeals court struck it down in 2023 under a federal appliance law."]],"places":[["Berkeley","The best known ban and the best known court loss."],["Chicago area","Local governments have discussed building electrification plans, which is the type of rule these bills would block."]],"news":[{"t":"CUB Q&A, the Illinois Future of Gas proceeding","src":"Citizens Utility Board","u":"https://www.citizensutilityboard.org/blog/2026/08/03/cub-qa-the-illinois-future-of-gas-proceeding/","d":"2026-08-03"}]},"energy-audit":{"headline":"Require a home energy rating for new homes and at sale","bg":"Builders of new residential buildings would cause an energy audit that yields a Home Energy Rating System, or HERS, Index Score. A change to the Residential Real Property Disclosure Act would, subject to exceptions, require disclosure of the energy information before title transfers.","why":"Ratings make energy use visible to buyers and may increase demand for efficiency and electrification upgrades. Utility efficiency programs often use HERS scores.","q":["Who pays for the audit","Does the disclosure apply to resale of older homes"],"go":["policy"],"plain":["A HERS Index score is a number that rates how energy efficient a home is, where 100 is a standard new home and lower is better. HB4887 would require builders of new homes to arrange an energy audit that produces the score, and would require sellers to disclose the energy information before the title transfers, with some exceptions.","Disclosure lets buyers compare energy costs the way they compare square footage."],"ex":"Two similar houses are for sale. One has a score of 55 and the other 85. The buyer sees the scores, so a lower predicted utility bill shows up in the price. Made up numbers.","viz":{"kind":"bars","title":"Lower is better on the HERS scale","rows":[["Standard new home",100.0],["Efficient home",55.0],["Less efficient home",85.0]],"unit":"HERS score, illustrative"},"states":[["Portland, Oregon","Requires a home energy score for most homes listed for sale."],["Austin, Texas","Requires an energy audit and disclosure for home sales."],["Montgomery County, Maryland","Has a similar benchmarking and disclosure approach."]],"places":[["Illinois home sales","Realtors and sellers would see a new disclosure line in the Residential Real Property Disclosure."]],"news":[]},"stretch-code":{"headline":"Let counties adopt the Illinois Stretch Energy Code","bg":"The Illinois Stretch Energy Code is an optional, more efficient building code. Today only municipalities may adopt it. The bill lets counties adopt it too.","why":"A wider adoption base means more new buildings built to a higher efficiency standard, which lowers per building load and can favor electric heating. This links to the preemption bills that restrict local gas rules.","q":["Does a county stretch code interact with the gas preemption bills"],"go":["policy"],"plain":["Illinois has a base building code and an optional stretch energy code that is more efficient. Today only municipalities can adopt the stretch code. HB4994 lets counties adopt it too, so unincorporated areas could use it.","Nothing is forced. A county would choose it by vote."],"ex":"A county board adopts the stretch code. A builder putting up homes in unincorporated parts of that county must meet the higher efficiency level. A neighboring county that did not adopt it stays on the base code. Made up example.","viz":{"kind":"flow","title":"Who can adopt","steps":["Illinois Stretch Energy Code","Today municipalities only","Under HB4994 counties too"]},"states":[["Massachusetts","Has used a stretch code and an opt in specialized code for years."],["Washington and Colorado","Also let local governments go beyond the state energy code."]],"places":[["Illinois counties","Unincorporated areas, which have fewer local codes, are where the change would show up."]],"news":[]},"res-backup":{"headline":"Keep local governments from regulating residential energy backup systems","bg":"A county or municipality could not adopt or enforce rules regulating the installation or inspection of a residential energy backup system, including on a building with a shared roof. The bills take effect June 1, 2026.","why":"Backup systems such as home batteries and generators interconnect with the utility system. Statewide uniformity may speed installation, but it also reduces local inspection authority over fire and electrical safety.","q":["Does the definition cover batteries, generators or both","What safety review stays in place"],"go":["storage"],"plain":["A residential energy backup system is a home battery or generator that keeps the lights on in an outage. HB5049 and SB3794 say a county or municipality could not adopt or enforce rules on installing or inspecting one, including on a building with a shared roof. They take effect June 1, 2026.","Supporters want homeowners to install batteries without patchwork local rules. Opponents note that local fire and electrical inspection is how problems get caught."],"ex":"A homeowner wants a wall mounted battery in the garage. Today the city may require a permit and an inspection. Under the bills the city could not regulate the installation or inspection. Made up example.","viz":{"kind":"vs","title":"Who regulates home battery installs","sides":[{"h":"Today","items":["Local permit and inspection","Local fire department rules"]},{"h":"Under the bills","items":["Local rules barred","Statewide standards only"]}]},"states":[["Fire code states","Many states and cities follow the National Fire Protection Association standard for batteries, called NFPA 855. A California law and local codes add rules on location and spacing. I did not verify a state that bars local regulation outright."]],"places":[["Fire safety events","The Moss Landing battery fire in January 2025 in California made local officials more cautious about batteries."]],"news":[{"t":"California adopts battery storage safety legislation following Moss Landing fire","src":"ESS News","u":"https://www.ess-news.com/2025/10/10/california-adopts-battery-storage-safety-legislation-following-moss-landing-fire/","d":"2025-10-10"}]},"peaker":{"headline":"Let gas peaker plants run continuously until 21,000 MW of new renewables are online","bg":"Peaker plants normally run only at times of peak demand and have permit limits on hours. This bill lets each natural gas fired peaker run up to continuously, notwithstanding any permit or rule, to the extent federal law allows, until 30 days after Illinois EPA posts a determination that at least 21,000 MW of new utility scale renewable capacity has been built, using IPA data.","why":"It addresses reliability concerns when capacity is tight in MISO and PJM, but it sets aside local air permit conditions. A very large renewable threshold means the relief could last a long time. It is a pure reliability versus emissions tradeoff.","q":["How close is the state to 21,000 MW today","What air quality limits would no longer apply"],"go":["ctg"],"plain":["A peaker plant is a gas plant that only runs on the hottest and coldest days when demand spikes, so its permit limits the hours it can run. SB2736 would let each gas fired peaker run up to continuously, notwithstanding any permit or rule, as far as federal law allows. That would last until 30 days after the Illinois EPA posts that at least 21,000 MW of new utility scale renewable capacity has been built, using IPA data.","It trades air quality limits for supply, and ties the end date to how much clean energy has actually come online."],"ex":"A peaker normally runs about a hundred hours a year because its permit says so. Under the bill it could run all day every day until the 21,000 MW threshold is certified. Neighbors would then get far more exhaust than the permit allowed. Made up numbers.","viz":{"kind":"flow","title":"The trigger in the bill","steps":["Peaker runs under permit hour limits","Limits lifted while renewables are below 21,000 MW","Illinois EPA posts that 21,000 MW is built","Limits return 30 days later"]},"states":[["Reliability moves elsewhere","Some states have granted temporary exemptions to keep plants running in emergencies, usually for a limited time and subject to federal orders. I did not find a state that lifts the hour limits for all peakers until a clean energy target is met."]],"places":[["Chicago area peakers","Many peaker plants are near dense neighborhoods, which is why hour limits matter to residents."]],"news":[]},"heat-rate":{"headline":"Require inefficient power plants to cut emissions by half by 2035","bg":"Heat rate measures how much fuel energy a plant uses to make a kilowatt hour. The bill defines it and requires each generating unit with a heat rate of 7,000 Btu per kWh or higher to reduce CO2e emissions by at least 50 percent from its 2034 level by January 1, 2035.","why":"This is a performance based rule that targets less efficient units and applies from a 2034 baseline. It would shape which older gas units stay economic and could prompt investment or retirement choices ahead of 2035.","q":["Which Illinois units sit at or above 7,000 Btu per kWh","How is the 2034 baseline measured"],"go":["ctg"],"plain":["Heat rate is how much fuel energy a plant burns to make one kilowatt hour. A higher number means a less efficient plant. SB3606 requires every generating unit with a heat rate of 7,000 Btu per kWh or higher to cut its carbon dioxide equivalent emissions by at least 50 percent from its 2034 level by January 1, 2035.","It targets older, less efficient units and leaves efficient new combined cycle plants out of the requirement."],"ex":"A plant burns 10,000 Btu of gas for each kWh it makes, which is above the 7,000 line. If it emitted 1 million tons in 2034, it would have to be at 500,000 tons or less by January 1, 2035. Made up numbers.","viz":{"kind":"bars","title":"Illustrative cut for a covered unit","rows":[["2034 emissions",100.0],["2035 limit",50.0]],"unit":"percent of 2034 level"},"states":[["Not a common design","Many states regulate emissions by rate or by cap. I did not find another state that targets plants by a heat rate threshold."]],"places":[["Illinois older gas fleet","Older steam and simple cycle units are the likely targets."]],"news":[]},"ares-disclosure":{"headline":"Tighter consumer protections on alternative retail electric and gas suppliers","bg":"Alternative retail electric suppliers and alternative gas suppliers sell supply in competition with utilities. The bill requires them to report prior year residential rates and enrollment to the ICC and Attorney General, bans commissions or incentive pay for in person and telemarketing sales, caps rates at no more than 25 percent above the utility supply price, and restricts automatic renewals into higher rates.","why":"Utilities bill their customers for default supply and see customers who switch to suppliers and sometimes come back with complaints. A rate cap and renewal limits would reduce the exposure of customers to high variable rates, and it is a recurring consumer protection issue at the ICC.","q":["How is the 25 percent cap measured against changing utility prices","Does it change what a returning customer pays"],"go":["u101"],"plain":["An alternative retail supplier sells electricity or gas to households in competition with the local utility, and the utility still delivers it. HB4313 requires these suppliers to report their prior year residential rates and enrollment to the ICC and the Attorney General, bans commissions or incentive pay for in person and telemarketing sales, caps rates at no more than 25 percent above the utility supply price, and restricts automatic renewals into higher rates.","The pitch is to stop low teaser rates that turn into high rates."],"ex":"A salesperson at the door offers a fixed rate for six months. The contract then renews automatically at a variable rate that is far above the utility price. Under the bill the sale could not be paid by commission, the renewal would be limited, and the rate could not rise above 25 percent over the utility price. Made up example.","viz":{"kind":"bars","title":"The cap in the bill","rows":[["Utility supply price",100.0],["Maximum supplier price",125.0]],"unit":"index, utility price = 100"},"states":[["Massachusetts","A 2018 law bans variable rate residential electric contracts for new customers and many renewals."],["New York","Limited sales to low income customers by energy service companies starting in 2019."]],"places":[["Door to door sales","Ameren Illinois and ComEd territory, where retail suppliers market to households."]],"news":[]},"ares-cert":{"headline":"Slightly longer timelines for certifying alternative retail electric suppliers","bg":"The bills extend the notice period after filing for supplier certification from 10 to 14 days, and extend the time for ICC action after a complete application from 45 to 60 days, along with related procedural changes.","why":"A procedural change that gives the ICC and interested parties more time to review. Small direct effect.","q":["What other certification steps change"],"go":["u101"],"plain":["Before a company can sell power to households as an alternative retail supplier, it files for certification with the ICC. HB4876 and SB3332 slightly extend two clocks. The notice period after filing goes from 10 to 14 days, and the time for the ICC to act after a complete application goes from 45 to 60 days, along with related procedural changes.","They are small timing changes that give regulators and the public more time."],"ex":"A new supplier files a complete application on a Monday. Today the ICC has 45 days to act, and under the bill it would have 60. The notice period would also be 14 days rather than 10. Made up example.","viz":{"kind":"bars","title":"Clock changes","rows":[["ICC action days now",45.0],["ICC action days under bills",60.0],["Notice days now",10.0],["Notice days under bills",14.0]],"unit":"days"},"states":[["General","Most states certify retail suppliers, but timelines vary. I did not compare specific numbers."]],"places":[["ICC in Springfield and Chicago","The ICC handles certifications."]],"news":[]},"ipa-database":{"headline":"A public database of developers, suppliers and subcontractors for IPA and broadband programs","bg":"The IPA and DCEO would build searchable public databases of awardees, contractors, developers, suppliers and subcontractors for covered programs, organized by specialty and region, and developers would post before work starts and update status until completion.","why":"It supports local and diverse supplier participation in clean energy and broadband projects and gives visibility into project pipelines. It adds administrative work for developers and agencies.","q":["Which programs are covered","Who maintains the data"],"go":["policy"],"plain":["The IPA runs the state's renewable energy procurement and DCEO runs broadband grants. HB4940 would have them build searchable public databases listing awardees, contractors, developers, suppliers and subcontractors, organized by specialty and region. Developers would post before work starts and update status until completion.","It is a directory for finding who is doing the work, and a way for local firms to find subcontracting jobs."],"ex":"A local electrician wants work on a solar project that won IPA support. The database shows the developer, the region and the subcontracting needs, so the electrician can call before work begins. Made up example.","viz":{"kind":"flow","title":"How the database fills","steps":["IPA and DCEO award a project","Developer posts before work starts","Updates status until completion","Public can search by specialty and region"]},"states":[["General","Many states publish awardee lists for state funded projects. I did not compare the details."]],"places":[["Illinois broadband and solar projects","Both programs are funded with public money."]],"news":[]},"energy-choice-credit":{"headline":"An income tax credit for utilities and generators hurt by the CEJA phaseouts","bg":"The bills create a tax credit equal to 20 percent of wages paid to a qualified energy choice worker in Illinois. A qualified taxpayer is a regulated utility or a baseload or intermediate generator that can show an adverse and material operational impact on its Illinois workforce or business from the 2030, 2035, 2040 and 2045 phaseout dates in Public Act 102-662.","why":"The credit is designed to offset workforce impacts of CEJA's phaseouts and is aimed directly at utilities and generators. It has a state revenue cost, and the criteria for qualification would decide who benefits.","q":["How much would the credit cost the state","What counts as adverse and material impact"],"go":["ctg","policy"],"plain":["HB5194 and SB3665 create an income tax credit equal to 20 percent of the wages paid to a qualified energy choice worker in Illinois. A qualified taxpayer is a regulated utility or a baseload or intermediate generator that can show an adverse and material operational impact on its Illinois workforce or business from the 2030, 2035, 2040 and 2045 phaseout dates in CEJA.","It is meant to soften the cost of the phaseouts for companies and workers."],"ex":"A generator pays $100 million a year in wages to workers at a plant that must stop burning coal in 2030. If those workers qualify, the credit could be 20 percent of those wages, up to rules in the bill. Made up numbers.","viz":{"kind":"bars","title":"Credit example","rows":[["Wages of qualified workers",100.0],["Credit at 20 percent",20.0]],"unit":"million dollars, illustrative"},"states":[["Other states","Coal communities in several states, including Colorado, have transition funds for workers and local tax bases. I did not find another state that gives employers a wage credit tied to phaseout dates."]],"places":[["Illinois power plant communities","Towns that rely on plant property taxes and wages are where the effect would be felt."]],"news":[]},"energy-choice-commission":{"headline":"A state commission on the future of energy choice and economic impact","bg":"The bills create the Illinois Future of Energy Choice and Economic Impact Commission under DCEO, with set membership and duties on energy policy.","why":"Commissions are a way to study contested energy policy outside the normal committee process. Who sits on it and what it is charged to examine would signal the direction of any follow up legislation.","q":["Who appoints the members","What deliverable and deadline"],"go":["policy"],"plain":["HB5195 and SB3664 create the Illinois Future of Energy Choice and Economic Impact Commission inside DCEO, with set membership and duties on energy policy. A commission studies and recommends, it does not set rules.","The commission would look at how energy policy affects choice and the economy, and it pairs with the energy choice tax credit on this list."],"ex":"The commission meets, hears from utilities, workers and customers, and publishes a report with recommendations to the General Assembly. Made up example.","viz":{"kind":"flow","title":"What a commission does","steps":["Appointed members","Hearings and study","Report with recommendations","Legislature decides"]},"states":[["General","Many states use task forces on energy transition and workers. Examples include coal community commissions in several states."]],"places":[["Springfield","Housed in DCEO."]],"news":[]},"make-ready":{"headline":"Let utilities build the distribution side infrastructure for EV charging","bg":"Make ready means the utility installs the wiring and equipment up to the charger. The bill requires each electric utility to propose a rule before its next Multi Year Integrated Rate Plan authorizing it to design and deploy distribution infrastructure on the utility side of the meter for customers with separately metered EV charging, other than single family homes. Cost recovery is through rate plan proceedings or other ICC set methods, with full expense accounting and penalties for inaccurate tracking, and it is an alternative to the transmission line extension rules.","why":"This is a direct utility rule proposal. It can speed charger installation and spread costs over the useful life of the assets, but it moves more capital into rate base and adds accounting and penalty exposure. It connects to Multi Year Integrated Grid Plan decisions.","q":["How does cost recovery in the rate plan compare with line extension rules today","What penalties apply for tracking errors"],"go":["grid","icc"],"plain":["Make ready means the utility installs the wiring and equipment up to the charger, which can be the expensive part of a charging site. SB3529 requires each electric utility to propose a rule before its next multi year rate plan that lets it design and build the distribution side infrastructure on the utility side of the meter for separately metered EV charging, other than single family homes. Costs are recovered through rate plans or other ICC set methods.","A charger operator pays less up front, and the cost goes into rates over time."],"ex":"A shopping center wants fast chargers. The utility builds the new transformer and cable up to the meter and recovers the cost from customers over years, while the operator installs chargers. Made up example.","viz":{"kind":"flow","title":"Who builds what","steps":["Utility builds to the meter","Charger operator installs chargers","Utility recovers cost through rates"]},"states":[["California, New York, Colorado and Massachusetts","All use utility make ready programs with approved budgets."]],"places":[["Illinois charging corridors","Multifamily buildings and commercial lots are the target, not single family homes."]],"news":[]},"ipa-audit":{"headline":"Periodic performance audits of the IPA's renewable programs","bg":"The Auditor General would audit IPA renewable portfolio standard procurement and the Adjustable Block program in 2027, 2032, 2037, 2042 and 2047, including physical inspection of three random solar sites in the Adjustable Block program, with outside energy consultants allowed.","why":"It adds oversight of the program that funds distributed solar and supports renewable credit procurement. Audit findings often feed later legislative changes.","q":["What questions the audits must answer"],"go":["policy"],"plain":["SB3584 has the Auditor General audit the IPA's renewable portfolio standard procurement and Adjustable Block program in 2027, 2032, 2037, 2042 and 2047. That includes physically inspecting three random solar sites in the Adjustable Block program, and outside energy consultants are allowed.","The Adjustable Block program pays for rooftop and small solar based on blocks of capacity."],"ex":"An auditor picks three solar sites at random, drives out and checks that panels exist, work and match the paperwork. Made up example.","viz":{"kind":"bars","title":"Audit years","rows":[["Audit 1",2027.0],["Audit 2",2032.0],["Audit 3",2037.0],["Audit 4",2042.0],["Audit 5",2047.0]],"unit":"year"},"states":[["General","Audits of state clean energy programs are common. I did not compare specifics."]],"places":[["Illinois solar sites","Three random sites in the Adjustable Block program per audit."]],"news":[]},"portable-solar":{"headline":"Exempt portable solar devices from net metering and interconnection rules","bg":"A portable solar generation device would be exempt from net metering, interconnection requirements and related rules, provided it has a feature preventing it from energizing a dead grid. The intent is to let consumers plug small devices into an outlet without a utility process.","why":"Utilities worry about back feeding and about workers' safety during outages, and want visibility into what is connected to their system. The anti islanding feature is the key safety question and the exemption removes the utility from the approval process.","q":["How is the anti energizing feature verified","Are utilities notified of installations"],"go":["u101"],"plain":["HB4371 and HB4516 would exempt a portable solar generation device from net metering, interconnection requirements and related rules, so long as it has a feature that stops it from energizing a dead grid. The goal is to let a person plug a small device into an outlet without a utility process.","This is the same family as plug in solar."],"ex":"A renter buys a small suitcase style solar panel, plugs it into an outlet to run a fridge or computer, and does not file an application with the utility. Made up example.","viz":{"kind":"flow","title":"What is skipped","steps":["Buy portable solar device","Plug in","No net metering or interconnection filing","Anti islanding feature required"]},"states":[["Utah","The first state to legalize plug in solar, in 2025."],["Other states","Many more have considered bills in 2026. See the plug in solar entry for details."]],"places":[["Utah and Germany","Utah is the model in the US and Germany is the model worldwide."]],"news":[{"t":"Utah led the nation in legalizing plug in solar systems","src":"KUTV","u":"https://kutv.com/news/eye-on-your-money/utah-leads-nation-in-legalizing-plug-in-solar-systems-despite-lack-of-widespread-use","d":""}]},"plugin-solar":{"headline":"Plug in solar for renters and homeowners up to 1,200 watts","bg":"Often called balcony solar, a plug in solar energy system is a movable photovoltaic device, with or without storage, that exports no more than 1,200 watts to a standard outlet. Utah was the first state to legalize it in 2025 and other states have followed. These bills bar an electricity provider from requiring the customer to take specified steps, and let the customer choose, but not be required, to meet interconnection requirements.","why":"Plug in solar offsets a small share of a household's use and does not require a roofline or contractor. The utility questions are safety, meter accuracy and visibility of the devices, and how many would be installed.","q":["Does the customer have to notify the utility","What UL standard applies to the device"],"go":["u101"],"plain":["Plug in solar, sometimes called balcony solar, is a movable solar panel setup that sends no more than 1,200 watts into a standard wall outlet. The bills would stop a utility from forcing the customer through specific steps and let the customer choose, but not be required, to meet interconnection rules.","According to Canary Media, SB3104 would let systems of up to 1,200 watts connect without interconnection agreements or fees, bar homeowners associations and landlords from imposing rules on arrays of 391 watts or less, require units to shut off in an outage, and require certification by UL Solutions or an equivalent. Solar United Neighbors estimates savings of up to $400 a year per household. Units cost about $3 per watt, around $2,000 for a typical model."],"ex":"A renter in Peoria hangs a panel from a balcony and plugs it into an outlet. It runs the fridge and other small loads in the daytime and trims the monthly bill. During a blackout it shuts off to protect line workers. Made up setting, with figures from the Canary article.","viz":{"kind":"bars","title":"Size limits in the reported bill","rows":[["Plug in system limit",1200.0],["HOA and landlord protection limit",391.0]],"unit":"watts"},"states":[["Utah","Legalized plug in solar in 2025, though use has been small."],["Germany","Balcony solar is widespread, with the inverter limit around 800 watts."],["Other states","Many states took up bills in 2026, and an Illinois SB3104 was reported as deferred to 2027 in one tracker."]],"places":[["Springfield","The bill passed the Senate Energy and Public Utilities Committee on March 12, 2026."],["Utilities","ComEd said it had no position and Ameren did not respond, according to Canary Media."]],"news":[{"t":"Balcony solar bill gains momentum in Illinois","src":"Canary Media","u":"https://www.canarymedia.com/articles/solar/balcony-solar-bill-gains-momentum-illinois","d":"2026-03"},{"t":"Utah led the nation in legalizing plug in solar systems","src":"KUTV","u":"https://kutv.com/news/eye-on-your-money/utah-leads-nation-in-legalizing-plug-in-solar-systems-despite-lack-of-widespread-use","d":""}]},"storage-farmland":{"headline":"Farmland drainage repair duties for energy storage facilities","bg":"Counties regulate energy storage systems under the Counties Code. These bills require the facility's farmland drainage plan to include repair of subsurface drainage damaged during construction or deconstruction, following the agricultural impact mitigation agreement, and not only the decommissioning plan.","why":"Drain tile damage is a frequent complaint from farmers near solar and storage sites. The change makes repair duties part of the plan filed with the county, which strengthens landowner protections and slightly raises developer obligations.","q":["What financial assurance backs the repair obligation"],"go":["storage"],"plain":["Farmland drain tile is underground pipe that carries water out of fields so crops do not drown. Counties regulate energy storage systems under the Counties Code. HB4956, SB3078 and SB3409 would require the facility's farmland drainage plan to include repair of subsurface drainage damaged during construction or deconstruction, following the agricultural impact mitigation agreement, and not only the decommissioning plan.","Broken tile can flood a field for years if no one fixes it."],"ex":"Crews trench across a field to connect a battery site and cut a tile line. Water backs up and floods the neighbor's soybean field. Under the bills the repair duty is part of the facility's plan from the start. Made up example.","viz":{"kind":"flow","title":"Drainage duty","steps":["Construction cuts tile","Plan requires repair","Follow agricultural impact mitigation agreement","Field drainage restored"]},"states":[["Illinois already","Public Act 104-0390 requires CO2 pipeline companies to make immediate temporary repairs of flowing drain tile and pay to restore drainage permanently. The storage bills bring the same idea to batteries."],["Iowa and Minnesota","Have similar drain tile concerns in farm states."]],"places":[["Kane County","Solar projects there file a preliminary farmland drain tile investigation with the county."]],"news":[]},"solar-checkoff":{"headline":"A voluntary solar checkoff fund","bg":"The bills create the Solar Energy Reliability and Affordability Checkoff Program Act, with a fund, a board and fees collected through the Department of Agriculture, intended to support solar reliability and affordability.","why":"The program is funded by a checkoff and would sit alongside, not inside, existing IPA solar programs. Its governance and who pays the fee are the open questions.","q":["Who pays the fee","What projects the fund supports"],"go":["policy"],"plain":["A checkoff is a voluntary line on a form or bill where people add money to a fund. HB5388 and SB3711 create the Solar Energy Reliability and Affordability Checkoff Program Act, with a fund, a board and fees collected through the Department of Agriculture, intended to support solar reliability and affordability.","Because the details are mostly fee and board mechanics, read the bill text for who pays and who spends."],"ex":"A farmer buying a product sees a line to add a small amount for the solar fund. The board then spends the pooled money on projects that help solar stay reliable and affordable. Made up example.","viz":{"kind":"flow","title":"Checkoff flow","steps":["Voluntary fee collected through Department of Agriculture","Pooled in a fund","Board decides how to spend","Support solar projects"]},"states":[["Agricultural checkoffs","Farm commodity checkoff programs, such as for soybeans and corn, are a long standing tool. I did not find another state with a solar checkoff."]],"places":[["Illinois farms","Department of Agriculture involvement suggests a farm focus."]],"news":[]},"shared-roof":{"headline":"Solar on shared roofs and townhouses","bg":"HB5402 extends the Homeowners' Energy Policy Statement Act to buildings with a shared roof when a system sits entirely within the owner's section or all owners agree. SB2785 amends the Counties Code to say a shared roof does not include a roof that serves townhouses, and it takes effect only if Senate Bill 25 of the 104th General Assembly becomes law.","why":"Townhouses and attached homes are a large share of housing, and disputes over roof ownership and association rules often block solar. Clear rules could raise rooftop adoption in these segments.","q":["How do HOA rules interact with these changes"],"go":["u101"],"plain":["Townhouses and attached homes often share a roof, which can make rooftop solar hard because one owner's panels sit above a neighbor. HB5402 extends the Homeowners' Energy Policy Statement Act to shared roof buildings when a system sits entirely within the owner's section or all owners agree. SB2785 amends the Counties Code to say a shared roof does not include a roof that serves townhouses, and takes effect only if Senate Bill 25 of the 104th General Assembly becomes law.","SB25 is the 2025 energy omnibus, which was signed Jan 8, 2026."],"ex":"Two neighbors in a row of townhouses. One wants panels entirely on her half of the roof. Under HB5402 her association could not stop her as long as the panels stay in her section or all owners agree. Made up example.","viz":{"kind":"vs","title":"Shared roof solar rule","sides":[{"h":"Today","items":["Association or neighbor may object"]},{"h":"Under HB5402","items":["Allowed inside the owner's section","Or when all owners agree"]}]},"states":[["Solar access laws","Many states protect homeowners from association bans on solar, including California, Colorado and Florida."]],"places":[["Chicago area townhouses","Row houses and townhome subdivisions are the typical case."]],"news":[]},"district-energy":{"headline":"Certification and grants for district energy and thermal storage","bg":"The District Energy and Thermal Energy Storage Parity Act has the ICC, with Illinois EPA, set up an optional certification process for Qualified District Energy Infrastructure, and Illinois EPA create a grant program for projects.","why":"District energy systems deliver heating and cooling through shared loops and can compete with or complement gas and electric service. Certification would give them standing at the ICC.","q":["Do certified systems get utility style regulation","How do grants coordinate with utility programs"],"go":["gas"],"plain":["District energy means a central plant makes hot or cold water and pipes it to many buildings. Thermal storage stores heat or cold in tanks or the ground for later. The District Energy and Thermal Energy Storage Parity Act has the ICC, with the Illinois EPA, create an optional certification for Qualified District Energy Infrastructure, and has the Illinois EPA run a grant program for projects.","Certification gives projects a status that helps them get financing and treatment alongside other energy options."],"ex":"A university campus or downtown block builds a shared thermal loop. If certified it can apply for grants and be treated as qualified infrastructure. Made up example.","viz":{"kind":"flow","title":"District energy path","steps":["Central plant makes heat or cold","Pipes carry it to buildings","Thermal storage holds it for later","Certification and grants support the project"]},"states":[["Minnesota","St. Paul runs a well known district energy system."],["New York and Massachusetts","Pursue networked geothermal pilots."]],"places":[["Downtown Chicago","A large district cooling system serves downtown buildings."],["College campuses","Many Illinois campuses run central plants."]],"news":[]},"storage-bonds":{"headline":"Let the Illinois Finance Authority issue revenue bonds for energy storage","bg":"The Authority could issue revenue bonds for energy storage projects that seek state level storage credits or utility cost recovery, coordinating with the IPA so terms minimize cost to ratepayers.","why":"Cheaper financing lowers the cost of projects that utilities will contract for or own. Both versions have Republican chief sponsors, which points to Republican interest in storage financing.","q":["Who backs repayment","How does bond financing fit with IPA procurement"],"go":["storage"],"plain":["HB5440 and SB3705 would let the Illinois Finance Authority issue revenue bonds for energy storage projects that seek state storage credits or utility cost recovery, working with the IPA to keep costs low for ratepayers. Revenue bonds are repaid from the project's income, not from general taxes.","Cheaper financing lowers a project's cost of capital, which can lower what customers pay."],"ex":"A battery developer borrows through the Authority at a lower rate than in the market. The savings are passed on in the price paid for stored power. Made up example.","viz":{"kind":"flow","title":"Bond path","steps":["Developer applies","Finance Authority issues revenue bonds","Project repays from its revenue","Lower financing cost flows to customers"]},"states":[["Several states","Green banks and finance authorities in states such as Connecticut and New York finance clean energy projects."]],"places":[["Illinois Finance Authority","Operates in Chicago."]],"news":[{"t":"VPP and supporting DER policy developments, Q1 2026","src":"SEPA","u":"https://sepapower.org/knowledge/vpp-and-supporting-der-policy-developments-q1-2026/","d":"2026"}]},"cs-colocation":{"headline":"Community solar changes, project labor agreements and prevailing wage","bg":"The bills rename community solar references to photovoltaic community renewable generation projects, require a project labor agreement for certain new community driven community solar construction, remove an exception from prevailing wage for small multifamily geothermal projects, and add pre apprenticeship recruiting activities with the Department of Corrections.","why":"Labor requirements raise project cost and shape who can build. They also fit the labor and workforce emphasis found in recent Illinois energy law.","q":["How many projects would be subject to the project labor agreement"],"go":["policy"],"plain":["The bills rename community solar references to photovoltaic community renewable generation projects, require a project labor agreement for certain new community driven community solar construction, remove an exception from prevailing wage for small multifamily geothermal projects, and add pre apprenticeship recruiting activities with the Department of Corrections.","A project labor agreement is a contract that sets wages and rules with unions before construction."],"ex":"A community driven solar project is built on a church's land. Under the bills the contractor must sign a project labor agreement, pay prevailing wage and recruit through pre apprenticeship programs. Made up example.","viz":{"kind":"flow","title":"New requirements","steps":["Community driven community solar","Project labor agreement","Prevailing wage applies","Pre apprenticeship recruiting"]},"states":[["New York and Maryland","Also tie incentives to labor standards for solar projects. I did not compare specifics."]],"places":[["Illinois community solar","Projects are located in both ComEd and Ameren Illinois territory."]],"news":[]},"storage-procure":{"headline":"Storage procurement of at least 1,038 MW and a change for hydrogen batteries","bg":"The IPA conducts an initial energy storage procurement so that utilities with more than 300,000 customers contract for at least 1,038 MW of stand alone storage, excluding hydrogen batteries, able to operate by December 31, 2029, or a later date up to 2030. The bill also lets counties require NFPA 855 compliance, or NFPA 853 for hydrogen batteries, and allows net metering for storage except hydrogen batteries.","why":"This is the core of the state's near term storage buildout and is aimed at the largest utilities, which includes Ameren Illinois. The hydrogen battery carve out changes which technologies qualify. See the hub's battery storage primer.","q":["What share of the procurement falls to each utility","Why exclude hydrogen batteries"],"go":["storage"],"plain":["SB3246 has the IPA run an initial energy storage procurement so that utilities with more than 300,000 customers contract for at least 1,038 MW of stand alone storage, not including hydrogen batteries, able to operate by December 31, 2029, or a later date up to 2030. It also lets counties require NFPA 855 compliance, or NFPA 853 for hydrogen batteries, and allows net metering for storage except hydrogen batteries.","NFPA 855 is the fire safety standard for stationary battery storage."],"ex":"A utility signs contracts for batteries totaling over 1,000 MW. A county can require a fire safety design under NFPA 855 before it approves the site. Made up example.","viz":{"kind":"bars","title":"Procurement target","rows":[["Minimum stand alone storage",1038.0]],"unit":"MW, per the bill"},"states":[["California","Moss Landing fire in January 2025 led to new state storage safety law."],["New York","Leads the country in local battery moratoriums, according to Energy Storage News."],["Illinois already","The 2025 omnibus created a storage procurement, so check how this bill interacts."]],"places":[["Moss Landing, California","The January 2025 fire is the best known battery storage incident."]],"news":[{"t":"California adopts battery storage safety legislation following Moss Landing fire","src":"ESS News","u":"https://www.ess-news.com/2025/10/10/california-adopts-battery-storage-safety-legislation-following-moss-landing-fire/","d":"2025-10-10"},{"t":"New York leads US in BESS moratoriums","src":"Energy Storage News","u":"https://www.energy-storage.news/?p=97043","d":""}]},"solar-permitting":{"headline":"Require automated permitting for residential solar","bg":"By July 1, 2027, municipalities and counties above 10,000 residents must adopt an automated residential solar permitting platform that can process at least 75 percent of applications, similar to the SolarAPP+ model.","why":"Permit delay is a large soft cost for rooftop solar. Faster permits can accelerate interconnection requests that utilities must process.","q":["Who builds and pays for the platform"],"go":["u101"],"plain":["SolarAPP+ is a software tool that checks a rooftop solar design against the code and issues the permit in minutes instead of weeks. SB3268 says that by July 1, 2027, cities and counties over 10,000 residents must adopt an automated residential solar permitting platform that can process at least 75 percent of applications.","Permitting delays add cost to every rooftop system."],"ex":"An installer submits plans for a standard roof system. The software checks them against the code and issues the permit the same day. A complicated project goes to a human reviewer. Made up example.","viz":{"kind":"flow","title":"Automated permit","steps":["Installer uploads design","Software checks code","Instant permit for standard systems","Complex ones go to staff"]},"states":[["California","A 2022 law requires cities and counties to offer instant online solar and storage permits."],["New Jersey","Lawmakers passed an automated solar permitting bill unanimously in 2025."]],"places":[["Illinois cities over 10,000","The size threshold would cover most cities and larger villages."]],"news":[{"t":"New Jersey unanimously passes bill for automated solar permitting","src":"pv magazine USA","u":"https://pv-magazine-usa.com/2025/07/01/new-jersey-unanimously-passes-bill-for-automated-solar-permitting-2/","d":"2025-07-01"}]},"rea-plans":{"headline":"Let the ICC hire outside experts for renewable energy access plan updates","bg":"The ICC could hire technical and policy experts to support updates of the renewable energy access plan, which guides transmission needs for renewable development, exempt from the Illinois Procurement Code.","why":"Planning for renewable access sits at the intersection of transmission, the IPA and MISO and PJM. Outside expertise could improve plan quality. This bill passed both houses.","q":["How is the access plan used in utility planning"],"go":["grid","icc"],"plain":["The renewable energy access plan guides which transmission and grid upgrades are needed for renewable development. SB3272 lets the ICC hire technical and policy experts to support updates of that plan, exempt from the Illinois Procurement Code.","Hiring outside experts speeds up work that the agency staff may not have time or skills to do."],"ex":"The ICC contracts a transmission planning firm to model where new renewable projects can connect without expensive upgrades. Made up example.","viz":{"kind":"flow","title":"Plan update","steps":["ICC needs help","Hires experts without normal procurement rules","Updates renewable energy access plan","Guides transmission planning"]},"states":[["General","Regulators in many states hire outside consultants for large studies."]],"places":[["Springfield","The ICC runs the plan."]],"news":[]},"school-interconnect":{"headline":"Faster interconnection and better credits for solar on public school land","bg":"The bill sets procedures for processing interconnection requests for distributed renewable generation on public school land and requires that credits intended for the customer be applied properly. This bill passed both houses.","why":"Utilities process these requests, so procedure deadlines and credit rules affect operations. Schools are a favored customer group for solar savings.","q":["What are the new utility response deadlines"],"go":["u101"],"plain":["SB3273 sets procedures for processing interconnection requests for distributed renewable generation on public school land and requires that credits intended for the customer be applied properly. Interconnection is the process of tying a solar array to the grid. The bill passed both houses.","Schools can save on power bills with solar on rooftops and fields."],"ex":"A school district puts solar on its parking canopy. The utility must follow set steps and timelines, and bill credits must land on the school's account. Made up example.","viz":{"kind":"flow","title":"School solar","steps":["District proposes array","Utility follows set interconnection steps","Credits applied to the school bill","Savings flow to the district"]},"states":[["California, New Jersey and Arizona","Many school districts use solar for savings."]],"places":[["Illinois public schools","The bill covers public school land."]],"news":[]},"muni-solar-ban":{"headline":"Let municipalities regulate or prohibit solar installations","bg":"Current law bars municipalities from prohibiting solar installations. The bill deletes that bar so that a municipality may regulate or prohibit installation of solar energy systems and low voltage solar devices.","why":"A major reversal that would allow local bans on solar. It would limit rooftop and ground solar in some places.","q":["Is existing state protection for residential rooftop solar affected"],"go":["u101"],"plain":["Current law bars municipalities from prohibiting solar installations. SB3450 deletes that bar so a municipality may regulate or prohibit installation of solar energy systems and low voltage solar devices.","That would hand cities power to ban rooftop and plug in solar."],"ex":"A village could pass a rule against rooftop solar on historic streets, or any solar. Today it cannot prohibit it. Made up example.","viz":{"kind":"vs","title":"City power over solar","sides":[{"h":"Today","items":["Municipality cannot prohibit"]},{"h":"Under SB3450","items":["Municipality may regulate or prohibit"]}]},"states":[["Solar access states","Many states protect the right to install solar, including California, Colorado and Florida, which is the opposite direction from SB3450."]],"places":[["Illinois municipalities","Home rule cities and villages."]],"news":[]},"regional-reliability-tf":{"headline":"A task force to monitor grid reliability","bg":"The Illinois Regional Generation Reliability Task Force would monitor the reliability of the Illinois grid, with set membership, duties, administrative support and an annual report.","why":"A reliability focused task force reflects concern about capacity in MISO and PJM. Its membership and report would offer a venue for supply adequacy arguments.","q":["Who sits on it","What does the annual report trigger"],"go":["ctg"],"plain":["SB3580 creates the Illinois Regional Generation Reliability Task Force to monitor the reliability of the Illinois grid, with set membership, duties, administrative support and an annual report.","A task force advises and reports. It does not make rules."],"ex":"Each year the group publishes how close the grid came to shortfalls in MISO and PJM and what could be done. Made up example.","viz":{"kind":"flow","title":"Task force","steps":["Members meet","Monitor reliability","Annual report","Legislators and agencies act"]},"states":[["General","Many states have reliability or resource adequacy studies, including an Illinois resource adequacy study referenced in the 2025 omnibus."]],"places":[["MISO and PJM regions","Illinois is split between two grid operators."]],"news":[]},"pv-landfill":{"headline":"Keep end of life solar panels out of landfills","bg":"Beginning January 1, 2028, no one could knowingly mix a photovoltaic module with municipal waste intended for landfill or dispose of one in a sanitary landfill. The chief sponsor changed to Senator John Curran at the end of the snapshot.","why":"It creates a recycling requirement for solar modules before the large wave of retirements arrives. Developers and utilities with solar assets would plan for decommissioning cost.","q":["Where would panels be recycled"],"go":["policy"],"plain":["Solar panels last 25 to 30 years and then become waste. Beginning January 1, 2028, SB3583 says no one could knowingly mix a solar module with municipal waste intended for landfill, or put one in a sanitary landfill. The chief sponsor changed to Senator John Curran at the end of the snapshot.","Panels contain materials such as glass, aluminum and small amounts of metals that can be recycled."],"ex":"A farm retires old solar panels. Instead of sending them to the dump, the owner has to send them to a recycler or reuse program. Made up example.","viz":{"kind":"flow","title":"End of life","steps":["Panel retires","Cannot go to a landfill after Jan 1, 2028","Recycle or reuse"]},"states":[["Washington","Has a solar panel stewardship law that makes manufacturers pay for take back."]],"places":[["Illinois landfills","The ban applies to sanitary landfills."]],"news":[]},"commercial-solar-south":{"headline":"Exempt southern Illinois counties from state limits on commercial wind and solar","bg":"The bill says the amendments made by Public Act 102-1123 to the commercial wind and solar siting rules do not apply to developments south of Interstate 70 in listed counties.","why":"It would reduce the state level siting standards in a region, leaving local governments more authority.","q":["Which counties are listed"],"go":["policy"],"plain":["Public Act 102-1123 set statewide rules for how counties handle commercial wind and solar siting. SB3629 says that those amendments do not apply to developments south of Interstate 70 in the listed counties. The effect is to let those counties follow different rules.","It is an exemption for a region."],"ex":"A solar developer proposes a project in a county south of I-70. State siting limits would not apply there, so local rules govern. A county north of I-70 stays under state limits. Made up example.","viz":{"kind":"vs","title":"Where state siting limits apply","sides":[{"h":"North of I-70","items":["State limits apply"]},{"h":"South of I-70, listed counties","items":["Exempt, local rules govern"]}]},"states":[["Local control states","Several states let counties set their own wind and solar siting rules, while others set statewide limits."]],"places":[["Southern Illinois","Counties south of I-70."]],"news":[]},"interconnection-rules":{"headline":"Revise distributed generation interconnection rules for 40 kW to 2 MW systems","bg":"The ICC would, within 180 days, revise Part 466 and 467 of its rules to address barriers to timely and cost effective interconnection of distributed generation between 40 kilowatts and 2 megawatts, including solar, storage, hybrid gas electric and renewable natural gas. It must coordinate with the Future of Gas proceeding and the rules take effect by July 1, 2026.","why":"Interconnection is a utility operations issue. Shorter timelines, defined cost factors and a nod to hybrid gas electric systems and renewable natural gas would all change utility workload and cost allocation.","q":["What timeline and cost rules would be set","How does it fit into the Future of Gas proceeding"],"go":["gas","icc"],"plain":["Interconnection rules decide how long and how costly it is to connect a power source to the grid. SB4028 has the ICC revise Parts 466 and 467 of its rules within 180 days to address barriers for generation between 40 kilowatts and 2 megawatts, including solar, storage, hybrid gas electric and renewable natural gas. It must coordinate with the Future of Gas proceeding, and rules take effect by July 1, 2026.","Midsize projects are often the slowest."],"ex":"A farm wants a 1 MW solar array. Today it waits for a study and pays for upgrades. The revised rules would aim to cut the wait and cost. Made up example.","viz":{"kind":"bars","title":"Size range","rows":[["Lower bound",40.0],["Upper bound",2000.0]],"unit":"kilowatts"},"states":[["Minnesota and California","Run interconnection reform proceedings."],["Nationwide","FERC has pushed large interconnection reforms in recent years."]],"places":[["Illinois farms and businesses","Mid size projects."]],"news":[{"t":"CUB Q&A, the Illinois Future of Gas proceeding","src":"Citizens Utility Board","u":"https://www.citizensutilityboard.org/blog/2026/08/03/cub-qa-the-illinois-future-of-gas-proceeding/","d":"2026-08-03"}]},"tx-siting":{"headline":"Put new high voltage transmission in existing corridors and along highways first","bg":"New transmission is hard to site because of landowner opposition and permitting. These bills require siting to use available corridors in order of priority, existing public utility corridors, then highway corridors, then new corridors. A utility or developer could place a high voltage line on or along a public right of way if it files a colocation request with the Secretary of Transportation, who may deny it for safety or highway function reasons. IDOT assigns a project coordinator within 30 days of a request.","why":"Using existing corridors can cut cost and speed approval, which matters for the new transmission needed to connect generation and serve large loads. It also puts IDOT in a new gatekeeper role and could reduce use of eminent domain. Three versions of the same idea show broad interest in the House and Senate.","q":["How long does IDOT review take in practice","Does corridor priority conflict with the ICC certificate process"],"go":["grid","icc"],"plain":["High voltage lines carry power over long distances, and building them is slow because landowners fight them. HB4803, HB4995 and SB2808 set an order of preference for routes. First use existing public utility corridors, then highway corridors, then brand new corridors. A utility or developer could put a high voltage line on or along a public right of way if it files a colocation request with the Secretary of Transportation, who may deny it for safety or highway function reasons. IDOT must assign a project coordinator within 30 days.","The idea is to reuse land that is already cleared and publicly owned, so fewer farms are crossed."],"ex":"A developer wants to build a line across 100 miles of farmland. Under the bills it first looks at an existing power line corridor, then at highway edges, and only then at new land. A highway route might need IDOT approval but avoids new landowners. Made up example.","viz":{"kind":"flow","title":"Route priority","steps":["1 Existing utility corridors","2 Highway corridors","3 New corridors"]},"states":[["Federal and regional","Federal Order 1920 requires long term regional transmission planning, and MISO approved a large package of new lines in 2024."],["Minnesota and others","Have rules favoring existing corridors and highways."]],"places":[["Grain Belt Express","A proposed line of roughly 800 miles from Kansas to Indiana that crosses Illinois and has been fought by landowners."],["Central Illinois","Landowners along proposed routes are the people who care most about this order."]],"news":[]},"tx-ownership":{"headline":"Give incumbent utilities the right to build new transmission","bg":"The Transmission Ownership and Reliability Act requires new transmission in Illinois to be owned, operated and maintained exclusively by an ICC regulated, investor owned utility, requires a certificate of public convenience and necessity, applies Electric Transmission Systems Construction Standards Act rules to builders, and creates a right for an incumbent transmission owner to build facilities in its territory. Federal Order 1000 competition rules and state right of first refusal laws are the backdrop.","why":"A right of first refusal protects incumbent utilities from competitive transmission developers and ties new lines to ICC oversight. Critics say competition lowers costs. Supporters cite reliability, local accountability and labor standards. This is a central issue in MISO and PJM transmission planning.","q":["How would this interact with MISO competitive bidding rules","What are the federal court risks of a state ROFR"],"go":["grid","icc"],"plain":["Who gets to build new power lines is a big money question, because the owner earns a regulated return. HB4823, the Transmission Ownership and Reliability Act, requires new transmission in Illinois to be owned, operated and maintained exclusively by an ICC regulated investor owned utility, requires a certificate of public convenience and necessity, applies construction standards, and creates a right for an incumbent transmission owner to build in its territory. That is a right of first refusal.","Federal Order 1000 aimed to let competitors bid for lines, and many states responded by passing right of first refusal laws."],"ex":"MISO identifies a need for a new line near an Ameren substation. Under the bill Ameren has the first right to build it, and an independent developer could not bid. Without the bill the developer could bid, which can lower costs but adds complexity. Made up example.","viz":{"kind":"vs","title":"Who builds new lines","sides":[{"h":"Competition","items":["Independent developers can bid","Possible lower cost","Possible delay and disputes"]},{"h":"Right of first refusal","items":["Incumbent utility builds","Simpler and faster","Less price pressure"]}]},"states":[["Texas, Indiana and Minnesota","Have right of first refusal laws in some form."],["Court fights","Several state ROFR laws have been challenged in court."]],"places":[["Ameren Illinois territory","The incumbent in central and southern Illinois."],["ComEd territory","The incumbent in northern Illinois."]],"news":[]},"agrivoltaic":{"headline":"Define agrivoltaic systems that combine farming and solar","bg":"An agrivoltaic system is a ground mounted solar system designed with agricultural producers or experts so farming continues beneath or between the panels. The bills define the term in the Illinois Power Agency Act and Public Utilities Act so such projects can qualify for state programs.","why":"Agrivoltaics can ease farmland conflict with solar development. A statutory definition would shape which projects get incentives and standing in permitting.","q":["What qualifies a system as agrivoltaic","Which incentives attach to the definition"],"go":["policy"],"plain":["Agrivoltaics means solar panels placed so farming continues beneath or between them, such as sheep grazing or crops that tolerate shade. HB4830 and SB2958 define an agrivoltaic system in the Illinois Power Agency Act and Public Utilities Act so these projects can qualify for state programs. The definition is ground mounted solar designed with agricultural producers or experts so farming continues.","The benefit is keeping farmland in production while generating power."],"ex":"A developer builds a solar field with taller panels spaced for tractors and sheep. Because it fits the definition, the project can compete for state incentives. A standard solar field with no farming would not qualify. Made up example.","viz":{"kind":"vs","title":"Standard solar vs agrivoltaic","sides":[{"h":"Standard","items":["Land used mainly for power","Farming stops"]},{"h":"Agrivoltaic","items":["Panels designed with producers","Grazing or crops continue"]}]},"states":[["Illinois already","The state has a pollinator friendly solar standard."],["Massachusetts and New Jersey","Have dual use solar incentives, with Massachusetts' SMART program adding payments for agrivoltaics."],["Colorado","Has pilot projects."]],"places":[["Illinois farmland","Counties where solar and farming compete for land."]],"news":[]},"muni-commercial":{"headline":"Cities may license and regulate commercial operations within their boundaries","bg":"Municipal corporate authorities could license and regulate all commercial operations, for profit or not, but could not tax them beyond existing authority. The definition excludes agritourism and agricultural uses.","why":"Primarily a municipal powers bill. It can matter when a city wants to license energy facilities or utility operations inside its limits.","q":["Does the license power reach utility facilities"],"go":["policy"],"plain":["HB4921 would let municipal corporate authorities license and regulate all commercial operations, whether or not for profit, but they could not tax beyond existing authority. The definition excludes agritourism and agricultural uses.","It is a general local power."],"ex":"A village could require a license for a commercial operation inside its borders, such as a large facility, and write conditions for how it runs. A farm stand would not be caught. Made up example.","viz":{"kind":"flow","title":"Local licensing","steps":["Village adopts license rule","Commercial operations must follow","Agriculture and agritourism excluded"]},"states":[["General","Local business licensing is common in most states. I did not compare details."]],"places":[["Illinois municipalities","Applies inside municipal borders."]],"news":[]},"brownfield-pv":{"headline":"Treat brownfield solar as a high impact business and define brownfield site photovoltaic projects","bg":"Utility scale brownfield and large solar projects could be located in enterprise zones as high impact businesses, and brownfield site photovoltaic is defined as projects with at least 50 percent of acreage on land covered by federal or state cleanup programs.","why":"Building solar on cleaned up industrial land avoids farmland and uses existing grid connections. Enterprise zone status brings tax incentives. Retired plant sites are a major candidate class.","q":["Which retired plant sites qualify"],"go":["ctg"],"plain":["A brownfield is a former industrial or contaminated site that can be hard to reuse. HB5438 allows utility scale brownfield and large solar projects in enterprise zones as high impact businesses, and defines brownfield site photovoltaic as projects with at least 50 percent of acreage on land covered by federal or state cleanup programs.","It points solar toward polluted land rather than farmland."],"ex":"A closed factory site has been through a state cleanup program. A developer builds solar on at least half of its acres and qualifies for enterprise zone treatment. Made up example.","viz":{"kind":"bars","title":"Definition threshold","rows":[["Minimum acreage on cleanup program land",50.0]],"unit":"percent"},"states":[["Many states","Run programs for solar on landfills and brownfields, and the federal government has the RE-Powering America's Land initiative."]],"places":[["Illinois former industrial sites","Closed plants and landfills."]],"news":[]},"drainage":{"headline":"Solar and wind developers owe landowners for water and drainage harm","bg":"HB5477 says a commercial wind or solar facility near a municipality must be annexed or follow its zoning, with factors listed. SB3488 requires owners of commercial wind and solar facilities to compensate landowners in full if the facility harms water flow on their land, adjoining land or drainage district land, including drain tile.","why":"These bills add landowner remedies against renewable developers. They can raise project cost and project financing risk. They mirror the farmland drainage rules for storage sites.","q":["How is compensation set","Who decides adverse effect"],"go":["policy"],"plain":["HB5477 says a commercial wind or solar facility near a municipality must be annexed or follow its zoning, with factors listed. SB3488 requires owners of commercial wind and solar facilities to compensate landowners in full if the facility harms water flow on their land, adjoining land or drainage district land, including drain tile.","Drain tile moves water off farm fields. Construction can break it."],"ex":"A solar farm builder crushes a tile main that serves three farms. Water backs up. Under SB3488 the owner has to compensate each affected landowner in full. Made up example.","viz":{"kind":"flow","title":"Compensation duty","steps":["Construction disrupts drainage","Water harms neighbors or district land","Owner compensates landowners in full"]},"states":[["Illinois already","Public Act 104-0390 requires CO2 pipeline companies to repair drain tile and pay for damages, and an earlier Illinois law, backed by the Farm Bureau, requires wind and solar developers to file a drainage plan with the county."],["Iowa and Ohio","Have similar issues with drain tile and large projects."]],"places":[["Kane County","Solar petitions in the county include a preliminary farmland drain tile investigation."],["DeKalb County","Voted on solar farm proposals in recent years."]],"news":[{"t":"Pritzker signs measure brought by IFB (earlier farmland drainage law, background)","src":"Illinois Farm Bureau","u":"https://ilfb.org/resources/ifb-in-action/pritzker-signs-measure-brought-by-ifb/","d":""}]},"ag-land-fee":{"headline":"A $275 per acre fee when farmland is converted to development","bg":"Beginning January 1, 2027 the buyer or lessee of agricultural land removed from production for an industrial park, commercial area or housing or another use would pay a Farmland Conversion Fee of $275 per acre.","why":"A fee would raise the cost of siting data centers, solar or substations on farmland. Whether energy facilities are exempt decides the energy impact.","q":["Are solar, storage and utility facilities exempt"],"go":["dc"],"plain":["Beginning January 1, 2027, HB5593 would charge the buyer or lessee of agricultural land removed from production for an industrial park, commercial area, housing or another use a Farmland Conversion Fee of $275 per acre.","It is a one time per acre charge that makes converting farmland cost more."],"ex":"A developer buys 500 acres of farmland for a data center campus. The fee would be 500 times $275, which is $137,500. Made up acreage, real fee from the bill.","viz":{"kind":"bars","title":"Fee on illustrative acres","rows":[["100 acres",27500.0],["500 acres",137500.0],["1000 acres",275000.0]],"unit":"dollars at 275 per acre"},"states":[["Farmland protection","Many states use conversion fees, easements or tax penalties to slow farmland loss. Examples include the rollback tax in some states."]],"places":[["Joliet, Yorkville and other data center sites","The Yorkville Project Cardinal covers 1,037 acres, and a $275 fee would be about $285,000, if that land counted as agricultural land removed from production."]],"news":[{"t":"You sold us out, Illinois data center boom ignites local backlash","src":"Shaw Local","u":"https://www.shawlocal.com/news/2026/05/30/you-sold-us-out-illinois-data-center-boom-ignites-local-backlash/","d":"2026-05-30"}]},"tx-highway":{"headline":"Let high voltage lines use highway rights of way, with IDOT coordination","bg":"A high voltage transmission line could be built across or along a public right of way, including interstates, except where the Secretary of Transportation finds it needed to protect safety or highway function. IDOT must coordinate with the utility or developer on corridors and produce a constructability report. The bill also amends the Public Utilities Act to set a siting priority order.","why":"This is the Senate version of the corridor priority approach found in HB4803 and HB4995, with the highway code as its main focus.","q":["How do these bills differ from the colocation versions"],"go":["grid"],"plain":["SB2789 lets a high voltage transmission line cross or run along a public right of way, including interstates, except where the Secretary of Transportation finds it must be refused to protect safety or highway function. IDOT must coordinate with the utility or developer on corridors and produce a constructability report. The bill also amends the Public Utilities Act to set a siting priority order.","It is one of three transmission siting bills."],"ex":"A developer wants to string a line beside an interstate. IDOT reviews the request, helps pick a corridor and writes a report on whether it can be built. Made up example.","viz":{"kind":"flow","title":"Highway colocation","steps":["Developer asks IDOT","IDOT coordinates corridors","Constructability report","Approval or denial for safety"]},"states":[["Minnesota, Michigan and others","Allow lines in highway right of way in some conditions."],["Europe","Often combines roads and power corridors."]],"place
