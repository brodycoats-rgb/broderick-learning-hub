["By how much would rates rise"],"go":["policy"],"plain":["HB4942 raises the Workers' Compensation Commission Operations Fund surcharge and fee and the Rate Adjustment Fund payments, effective immediately.","These fees fund the commission that handles workplace injury cases."],"ex":"An insurer pays a higher surcharge. Costs show up in premiums. Made up example.","viz":{"kind":"flow","title":"Funding","steps":["Employers and insurers pay surcharges","Funds the Commission","Handles injury claims"]},"states":[["General","Every state funds its workers' comp agency, many with surcharges."]],"places":[["Illinois","Statewide."]],"news":[]},"dceo-various":{"headline":"DCEO housekeeping bills with tax credit extensions","bg":"These bills repeal the requirement that DCEO's website list available benefits by county, move report due dates from January 1 to January 31, change the Southeastern Illinois Economic Development Authority board, and extend sunsets for tax credits such as the apprenticeship education expense credit and research credit. SB3437 also repeals the Opportunities for At-Risk Women Act. HB5470 passed both houses.","why":"Omnibus economic development bills often carry tax credit extensions that matter to many industries, but this has little direct bearing on utilities.","q":["Which tax credits are extended and until when"],"go":["policy"],"plain":["These bills repeal the requirement that DCEO's website list available benefits by county, move report due dates from January 1 to January 31, change the Southeastern Illinois Economic Development Authority board, and extend sunsets for tax credits such as the apprenticeship education expense credit and research credit. SB3437 also repeals the Opportunities for At-Risk Women Act. HB5470 passed both houses.","A sunset is the date a tax credit expires."],"ex":"A company claims the research credit. The extension keeps it available. Made up example.","viz":{"kind":"flow","title":"Housekeeping","steps":["Sunsets extended","Report dates moved","Website rule repealed"]},"states":[["General","State tax credit sunsets are routinely extended."]],"places":[["Southeastern Illinois","The authority's board changes."]],"news":[]},"tax-tribunal":{"headline":"Appropriation for the Illinois Independent Tax Tribunal","bg":"A budget bill appropriating $711,000 for the Tribunal for the fiscal year beginning July 1, 2025.","why":"Budget housekeeping. Bills like this are sometimes watched as possible vehicles for other language.","q":["Is this a vehicle for a different bill"],"go":["policy"],"plain":["A budget bill appropriating $711,000 for the Illinois Independent Tax Tribunal for the fiscal year beginning July 1, 2025.","The tribunal hears tax disputes."],"ex":"The tribunal gets money to pay judges and staff. Made up example.","viz":{"kind":"bars","title":"Appropriation","rows":[["Tribunal funding",711000.0]],"unit":"dollars"},"states":[["General","Many states have tax tribunals."]],"places":[["Illinois","One state agency."]],"news":[]},"ethics":{"headline":"Limit political fundraising on certain days","bg":"Statewide officers, legislators, candidates, caucuses and committees could not hold a political fundraiser on any day immediately after a day on which certain legislative or official activity occurs.","why":"Fundraising and lobbying calendars are relevant to government relations teams who attend events.","q":["Which days are covered"],"go":["policy"],"plain":["SB2752 says statewide officers, legislators, candidates, caucuses and committees could not hold a political fundraiser on any day immediately after a day on which certain legislative or official activity occurs.","It separates official work from fundraising."],"ex":"A legislator votes on a bill and could not hold a fundraiser the next day. Made up example.","viz":{"kind":"flow","title":"Rule","steps":["Official activity day","Next day no fundraiser"]},"states":[["Texas","Bans contributions to legislators during the legislative session."],["Other states","Have session blackout rules."]],"places":[["Springfield","Fundraisers around session days."]],"news":[]},"vehicle-code":{"headline":"Vehicle inspection timing and handheld device rules","bg":"SB2753 moves the start of two year vehicle inspections from the fourth to the sixth year after the model year. SB2791 defines use of an electronic communication device while driving to include recording video, holding a device and similar acts.","why":"Vehicle bills reach utilities only through fleet operations.","q":["Does it affect fleet inspection schedules"],"go":["policy"],"plain":["SB2753 moves the start of two year vehicle inspections from the fourth to the sixth year after the model year. SB2791 defines use of an electronic communication device while driving to include recording video, holding a device and similar acts.","The first bill delays the first emissions test for new cars and the second tightens distracted driving."],"ex":"A car from model year 2026 would get its first inspection later. A driver holding a phone to film while driving could be cited. Made up example.","viz":{"kind":"bars","title":"Inspection start year","rows":[["Now",4.0],["Under SB2753",6.0]],"unit":"years after the model year"},"states":[["Handheld bans","About thirty states ban handheld phone use while driving."]],"places":[["Chicago metro and Metro East","The inspection areas."]],"news":[]},"effective-date":{"headline":"Delay the effective date of Public Act 104-17 to July 1, 2026","bg":"The bill changes the effective date of Public Act 104-17 from June 30, 2025 to July 1, 2026 and takes effect immediately.","why":"A timing change that interacts with HB4751 on prevailing wage.","q":["Which provisions are delayed"],"go":["policy"],"plain":["SB2768 changes the effective date of Public Act 104-17 from June 30, 2025 to July 1, 2026 and takes effect immediately. HB4751 on this list refers to Public Act 104-17 as well, so the two are related.","A date change gives people more time."],"ex":"A rule that had started in 2025 would instead start in July 2026. Made up example.","viz":{"kind":"bars","title":"Date change","rows":[["Original effective year",2025.0],["New effective year",2026.0]],"unit":"year"},"states":[["General","Delays of effective dates are common."]],"places":[["Illinois","Statewide."]],"news":[]},"credit-union":{"headline":"Credit union governance and disclosure updates","bg":"The Illinois Credit Union Act would change registered agent office rules, meeting minutes rules and disclosure and due diligence requirements. It passed both houses.","why":"Little relevance to utilities. It appears on the list as a bill that moved.","q":["Why was it tracked"],"go":["policy"],"plain":["The Illinois Credit Union Act would change registered agent office rules, meeting minutes rules and disclosure and due diligence requirements. It passed both houses.","It is governance cleanup."],"ex":"A credit union board follows updated minute keeping rules. Made up example.","viz":{"kind":"flow","title":"Changes","steps":["Registered agent","Minutes","Disclosure and due diligence"]},"states":[["General","Credit union acts are updated regularly."]],"places":[["Illinois","Statewide."]],"news":[]},"fire-sprinkler":{"headline":"Report on continuing education for fire sprinkler contractors","bg":"The Office of the State Fire Marshal would report to the General Assembly by December 31, 2026 on the effect of continuing education requirements for fire sprinkler contractors. At the snapshot the bill was on the House calendar for concurrence.","why":"A licensing report with little energy relevance.","q":["Why was it tracked"],"go":["policy"],"plain":["The Office of the State Fire Marshal would report to the General Assembly by December 31, 2026 on the effect of continuing education requirements for fire sprinkler contractors. At the snapshot the bill was on the House calendar for concurrence.","A report bill."],"ex":"The Fire Marshal studies whether training rules help safety and writes a report. Made up example.","viz":{"kind":"flow","title":"Report","steps":["Study","Report by Dec 31, 2026"]},"states":[["General","Contractor training rules vary by state."]],"places":[["Illinois","Statewide."]],"news":[]},"sanitary":{"headline":"Restroom and sanitary access on construction sites","bg":"The Construction Site Temporary Restroom Facility Act would be renamed and require sanitary conditions for menstruation and lactation, and repeal an exception for portable toilets. It passed both houses with 40 cosponsors.","why":"Contractors on utility construction sites would comply. It is a workplace standard.","q":["What facility changes does a contractor have to make"],"go":["policy"],"plain":["The Construction Site Temporary Restroom Facility Act would be renamed and require sanitary conditions for menstruation and lactation, and repeal an exception for portable toilets. It passed both houses with 40 cosponsors.","It makes restrooms on job sites work for everyone."],"ex":"A crew site must have a restroom that is sanitary for menstruation and lactation. Made up example.","viz":{"kind":"flow","title":"Site rule","steps":["Construction site","Restroom meets sanitary conditions"]},"states":[["General","Some states set jobsite sanitation rules."]],"places":[["Illinois construction sites","Statewide."]],"news":[]},"warn-ai":{"headline":"Disclose AI related job losses in mass layoff notices","bg":"Employers filing a WARN Act notice would disclose layoffs substantially due to replacement or automation by AI, and the Department of Employment Security would act on the information.","why":"It reflects concern about AI and jobs and could eventually cover large employers that automate customer service and back office work.","q":["How is substantially due to AI determined"],"go":["policy"],"plain":["Employers filing a WARN Act notice would disclose layoffs substantially due to replacement or automation by AI, and the Department of Employment Security would act on the information.","WARN notices are the advance notice of mass layoffs."],"ex":"A company lays off 100 workers because software replaces their work. Its WARN notice states AI as the reason. Made up example.","viz":{"kind":"flow","title":"Notice","steps":["Mass layoff","WARN notice","Discloses AI cause","Department acts"]},"states":[["New York","Added an AI related checkbox to its WARN notice form in 2025."]],"places":[["Illinois layoffs","Statewide."]],"news":[]},"equal-pay-reports":{"headline":"Require annual workforce management reports from large employers","bg":"Within two years the Department of Labor would adopt rules requiring specified employers to file annual public reports on workforce management policies, practices and performance.","why":"A transparency obligation for large employers.","q":["Who is a specified employer"],"go":["policy"],"plain":["Within two years the Department of Labor would adopt rules requiring specified employers to file annual public reports on workforce management policies, practices and performance.","It increases transparency about how large employers manage their workforce."],"ex":"A large employer files an annual report that the public can read. Made up example.","viz":{"kind":"flow","title":"Report","steps":["Rules adopted","Employers file yearly","Public can read"]},"states":[["Illinois already","The Equal Pay Registration Certificate applies to employers with 100 or more employees."]],"places":[["Illinois large employers","Covered by rule."]],"news":[]}},"cats":[{"name":"Data centers & large load","slug":"data-centers","short":"Data centers and large load","blurb":"Who pays for, powers and lives next to the data center boom.","primer":"Data centers can ask for as much power as a small city. Utilities, regulators and legislators are working out how to serve that load without pushing costs or reliability risk onto other customers. The bills here fall into four ideas. Make data centers disclose and plan early. Make them pay for or bring their own clean supply. Protect neighbors and water. Limit what utilities can require of them. Large load tariffs at the ICC and capacity pressure in MISO and PJM are the backdrop.","watch":"Peak demand fees, self direct programs that reduce renewable charges, hourly clean energy matching, deposits and financial assurance for large loads, and early disclosure to the ICC.","stat":"Illinois Power Agency Act, Public Utilities Act, Environmental Protection Act","go":["dc"]},{"name":"Environment, climate & EPA","slug":"environment","short":"Environment and climate","blurb":"CEJA's emission deadlines, permit rules and the push to loosen or tighten them.","primer":"The Climate and Equitable Jobs Act, or CEJA, set a path to retire coal and reduce gas plant emissions and to reach 100 percent clean energy by 2050. The 2026 bills pull in both directions. Some tighten the rules with environmental justice reviews, coal ash closure, wetlands permits and a climate superfund. Others loosen them by delaying deadlines, adding emergency exceptions or tying timing to battery buildout. Federal rollbacks and the 2023 Sackett decision are driving states to write their own floors.","watch":"Any bill that moves a CEJA date, creates a new permit step for siting energy facilities, or sets cost for closing coal ash sites.","stat":"Environmental Protection Act, Public Act 102-662 (CEJA)","go":["ctg","policy"]},{"name":"Gas & building decarbonization","slug":"gas-buildings","short":"Gas and buildings","blurb":"Fights over gas in homes, building codes and the future of the gas system.","primer":"Gas utilities face pressure from electrification policy and from the ICC's Future of Gas proceeding. The bills in this group include a warning label on unvented gas appliances, a bar on local gas bans without a referendum, building energy audits, and a stretch energy code for counties. Two plant bills sit here too. One lets gas peakers run more, and one forces older units to cut emissions by half by 2035.","watch":"Preemption of local gas bans, appliance labeling, the stretch code and whatever happens to gas decarbonization planning.","stat":"Counties Code, Illinois Municipal Code, Consumer Fraud Act, Energy Efficient Building Act","go":["gas"]},{"name":"Retail choice & procurement","slug":"retail-choice","short":"Retail choice and procurement","blurb":"Supplier competition, the IPA's buying role and the energy choice debate.","primer":"Illinois lets customers buy electricity and gas from alternative suppliers while the utility still delivers it. The Illinois Power Agency buys renewable energy credits and plans procurement for utility customers. This group covers supplier consumer protections, procedures for certifying suppliers, an income tax credit for workers affected by CEJA phaseouts, a commission on energy choice, a make ready rule for EV charging and an audit of the IPA's renewable programs.","watch":"Rate caps on suppliers, the energy choice commission and tax credit pair, and audit provisions for IPA programs.","stat":"Public Utilities Act, Illinois Power Agency Act, Illinois Income Tax Act","go":["u101","policy"]},{"name":"Solar, storage & distributed energy","slug":"solar-storage","short":"Solar, storage and distributed energy","blurb":"Rooftop, plug in and community solar plus the state's storage buildout.","primer":"This is the largest group. It includes small devices such as plug in solar, rooftop rules for townhouses, automated permitting, community solar, storage procurement and financing, interconnection rules, farmland drainage duties for storage sites, and a bill allowing cities to ban solar. Many of these bills show that distributed resources are growing faster than the processes meant to handle them.","watch":"Interconnection timelines, the 1,038 MW storage procurement, virtual power plant payments and local siting authority.","stat":"Public Utilities Act (net metering and interconnection), Illinois Power Agency Act, Counties Code","go":["storage","u101"]},{"name":"Technology, privacy & communications","slug":"technology","short":"Technology, privacy and communications","blurb":"Privacy law, broadband, drones and the shell bills to watch.","primer":"This group mixes bills about consumer data privacy, biometric and genetic privacy, AI disclosure, drones near critical infrastructure, broadband deployment and copper theft. It also holds seven shell bills with only a technical change, which are the most important to watch because a later amendment can turn them into major legislation overnight.","watch":"The four data privacy bills, easement and right of way access for broadband, and any movement on the Public Utilities Act shells.","stat":"Consumer Fraud Act, Genetic Information Privacy Act, Biometric Information Privacy Act, Electric Supplier Act","go":["trends"]},{"name":"Transmission, siting & land","slug":"transmission-siting","short":"Transmission, siting and land","blurb":"Where new lines, solar and pipelines can go and who has the right to build them.","primer":"Illinois needs new transmission to connect generation and serve large loads, and building it means landowner conflict, permits and competition between utilities and developers. The bills here set a corridor priority order and highway colocation, give incumbent utilities the right to build, add landowner remedies for drainage, ban eminent domain for CO2 pipelines, define agrivoltaics, add a farmland conversion fee, and protect buried utilities during excavation.","watch":"The three corridor siting bills, the transmission ownership act and the drainage bills.","stat":"Public Utilities Act, Illinois Highway Code, Counties Code, Underground Utility Facilities Damage Prevention Act","go":["grid","icc"]},{"name":"Utility rates, cost recovery & regulation","slug":"rates-regulation","short":"Rates, cost recovery and regulation","blurb":"Affordability bills that decide what utilities may charge and recover.","primer":"Affordability drove much of the 2026 agenda. These bills ask the ICC to hold more hearings, post every bill charge on a website, cap renewable procurement costs, freeze customer charges for low income households, discount whole bills, and bar utilities from recovering costs such as lobbying, association dues and rate case legal fees. Some go further and propose repealing major clean energy programs. This is where the Public Utilities Act is most directly rewritten.","watch":"Recoverable expense limits, the low income discount rate pair, the charge website, and the repeal and rate cap bills.","stat":"Public Utilities Act, Illinois Power Agency Act, Public Utilities Revenue Act","go":["icc","policy"]},{"name":"Workforce, labor & tax incentives","slug":"workforce","short":"Workforce, labor and tax incentives","blurb":"Prevailing wage, jobs programs, megaproject incentives and housekeeping bills.","primer":"Most of these bills are labor and economic development measures that touch utilities as large employers and contractors. They include prevailing wage changes, an Attorney General worker protection unit, workforce hubs for clean energy jobs, megaproject incentives, employment notice rules, and several housekeeping bills that happened to be tracked.","watch":"Prevailing wage bills, megaproject incentives and the DCEO omnibus bills.","stat":"Prevailing Wage Act, Equal Pay Act, Department of Commerce and Economic Opportunity Law, Energy Transition Act","go":["policy"]}],"hub":{"dc":[{"t":"Data Center Desk legislation","u":"dcd-legislation.html"},{"t":"Illinois data center learning center","u":"illinois-data-center-learning-center.html"}],"ctg":[{"t":"CTG learning guide","u":"ameren-missouri-illinois-ctg.html"}],"policy":[{"t":"Illinois energy policy guide","u":"ameren-illinois-energy-policy.html"}],"gas":[{"t":"Future of Gas","u":"future-of-gas.html"}],"storage":[{"t":"Battery storage primer","u":"illinois-battery-storage-primer.html"}],"grid":[{"t":"Grid plan","u":"grid-plan.html"}],"icc":[{"t":"ICC proceedings briefing","u":"icc-proceedings.html"}],"u101":[{"t":"Utility 101","u":"utility-101.html"}],"miso":[{"t":"MISO ERAS playbook","u":"miso-eras-business-acumen-playbook.html"}],"trends":[{"t":"Illinois legislative trends 2020 to 2026","u":"illinois-legislative-trends-2020-2026.html"}],"gloss":[{"t":"Hub glossary","u":"glossary.html"}]},"glossary":[{"t":"Bill number prefixes","d":"HB is a House Bill, SB a Senate Bill and HR a House Resolution. A resolution expresses the view of one chamber and does not become law."},{"t":"Chief sponsor","d":"The legislator who files and leads a bill. Others who sign on are cosponsors."},{"t":"Committee deadline","d":"Dates set by chamber rules by which a bill must clear committee. Bills not reported out are sent to Rules in the House and Assignments in the Senate."},{"t":"Rule 19 and Rule 3-9","d":"House Rule 19 and Senate Rule 3-9 are the rules that re-refer bills that missed a committee deadline. Re-referral does not always end a bill, but a bill in Rules or Assignments needs leadership to move it."},{"t":"Rules Committee and Assignments","d":"House Rules and Senate Assignments are leadership controlled committees that decide whether a bill is sent to a substantive committee. A bill sitting there is effectively on hold."},{"t":"Third reading","d":"The final floor vote stage in a chamber. A bill that passes third reading in both chambers in identical form is sent to the Governor."},{"t":"Concurrence","d":"When the second chamber amends a bill, the first chamber must vote to agree, which is called concurring. Without it the bill goes no further."},{"t":"Passed both houses","d":"Both chambers approved the same text. Within 30 days it is sent to the Governor, who has 60 calendar days to act."},{"t":"Veto session","d":"A fall session where lawmakers can override vetoes with three fifths vote in each chamber and take up other business."},{"t":"Lame duck session","d":"The days between the November election and the swearing in of the new General Assembly in January. Bills passed then are often major."},{"t":"Shell bill","d":"A bill with only a technical change, held as a vehicle. A later amendment can replace its whole text."},{"t":"Gut and replace","d":"Using a shell bill by deleting its text and adding new language through an amendment."},{"t":"Public Act (P.A.)","d":"The number assigned to a bill once it becomes law. P.A. 102-662 is CEJA."},{"t":"CEJA","d":"The Climate and Equitable Jobs Act, Public Act 102-662 of 2021. It sets emission deadlines for fossil plants, a 100 percent clean energy goal by 2050 and several equity and workforce programs."},{"t":"FEJA","d":"The Future Energy Jobs Act of 2016, which set up solar incentives and energy efficiency programs that CEJA later built on."},{"t":"ICC","d":"The Illinois Commerce Commission, which regulates rates and service of investor owned utilities."},{"t":"IPA","d":"The Illinois Power Agency, which plans and runs procurement for utilities and administers renewable programs."},{"t":"IEPA and IPCB","d":"The Illinois EPA enforces and proposes environmental rules. The Illinois Pollution Control Board adopts them."},{"t":"DCEO","d":"The Department of Commerce and Economic Opportunity, which runs economic development and workforce programs."},{"t":"RTO","d":"A regional transmission organization such as MISO or PJM that runs the grid and wholesale market for a region."},{"t":"MISO and PJM","d":"The two RTOs that serve Illinois. MISO covers central and southern Illinois, which includes Ameren Illinois. PJM covers northern Illinois."},{"t":"Multi Year Integrated Grid Plan","d":"A multi year plan a utility files with the ICC for grid investment under CEJA's performance based framework."},{"t":"Rate case","d":"A proceeding in which the ICC decides what a utility can charge. A general rate increase request triggers one."},{"t":"Recoverable expense","d":"A cost the ICC allows a utility to include in rates and collect from customers."},{"t":"Net metering","d":"A billing arrangement that credits customers with their own solar generation sent to the grid."},{"t":"Interconnection","d":"The process of connecting a generator or storage system to the utility grid."},{"t":"Make ready","d":"Utility built wiring and equipment up to the customer's meter or charger so a new load can connect."},{"t":"Eminent domain","d":"The legal power to take private property for public use with compensation. Utilities and some pipelines can hold it."},{"t":"Peaker plant","d":"A power plant that runs only during peak demand, usually gas fired."},{"t":"Heat rate","d":"How many Btu of fuel a plant needs to make one kilowatt hour. A lower heat rate means higher efficiency."},{"t":"Virtual power plant","d":"A group of small resources such as home batteries that are controlled together to act like a power plant."},{"t":"Equity investment eligible community","d":"A community category defined under CEJA and related programs, used to target incentives and in some emission timelines."},{"t":"Stranded asset","d":"An investment that loses value before it is paid off, a concern when gas pipes may see less use."},{"t":"Future of Gas proceeding","d":"The ICC docket (24-0158) examining the future of the gas distribution system, with a Phase 2C stage."},{"t":"Prevailing wage","d":"The locally set pay level required on public works and some publicly supported projects."}],"process":[{"t":"Filed","d":"A legislator files the bill. It is read for the first time and sent to the Rules Committee (House) or Assignments (Senate).","stage":"Referred to Rules or Assignments"},{"t":"Assigned to committee","d":"Leadership refers the bill to a substantive committee. This step is missing for many bills on the list.","stage":"Awaiting committee assignment"},{"t":"Committee hearing","d":"The committee takes testimony and votes. Amendments are often added here. Deadlines apply.","stage":"Hearing noticed"},{"t":"Deadline re-referral","d":"Bills not reported by the committee deadline are sent back to Rules or Assignments under Rule 19 or Rule 3-9.","stage":"Stalled by deadline rule"},{"t":"Floor and third reading","d":"The bill is placed on the calendar and voted on by the full chamber, then goes to the other chamber to repeat the path.","stage":"Floor action"},{"t":"Concurrence","d":"If the second chamber amends the bill, the first chamber votes to agree.","stage":"Floor action"},{"t":"Passed both houses","d":"Identical text approved. The bill is sent to the Governor within 30 days.","stage":"Passed both houses"},{"t":"Governor","d":"The Governor has 60 days to sign, veto, or use an amendatory veto. Overrides need three fifths in each chamber.","stage":""},{"t":"Law","d":"Signed bills become Public Acts. Effective dates depend on the bill and on when it passed. Bills passed after May 31 need a three fifths vote to take effect before the following June 1.","stage":""}],"monthly":{"2025-02":1,"2025-05":1,"2025-10":2,"2026-01":8,"2026-02":34,"2026-03":51,"2026-04":24,"2026-05":38,"2026-06":6},"snapshots":[{"date":"2026-06-01","total":165,"passed":13,"stalled":100,"notAssigned":49}]};
</script>
<script>
(function(){
"use strict";
var D=window.MB;
if(!D){document.getElementById("view").innerHTML='<div class="note">The data file <b>bills-data.js</b> did not load. Upload it to the same folder as this page on GitHub, then reload. In a single file preview it will not appear.</div>';document.getElementById("tabs").style.display="none";return}
var B=D.bills, BY={}; B.forEach(function(b){BY[b.id]=b});
var CATN={}; D.cats.forEach(function(c){CATN[c.name]=c});
var STAGES=[
 {k:"Passed both houses",c:"s-pass",l:"Passed both houses"},
 {k:"Floor action",c:"s-floor",l:"Floor action"},
 {k:"Sponsor change",c:"s-spons",l:"Sponsor changed"},
 {k:"Stalled by deadline rule",c:"s-dead",l:"Re-referred after deadline"},
 {k:"Awaiting committee assignment",c:"s-none",l:"Not yet in committee"}];
var SMAP={}; STAGES.forEach(function(s){SMAP[s.k]=s});
var STATS={"220 ILCS 5":"Public Utilities Act","20 ILCS 3855":"Illinois Power Agency Act","415 ILCS 5":"Environmental Protection Act","55 ILCS 5":"Counties Code","30 ILCS 105":"State Finance Act","20 ILCS 605":"Dept. of Commerce and Economic Opportunity Law","65 ILCS 5":"Illinois Municipal Code","30 ILCS 500":"Illinois Procurement Code","815 ILCS 505":"Consumer Fraud and Deceptive Business Practices Act","305 ILCS 20":"Energy Assistance Act","35 ILCS 5":"Illinois Income Tax Act","20 ILCS 3501":"Illinois Finance Authority Act","35 ILCS 200":"Property Tax Code","20 ILCS 730":"Energy Transition Act","220 ILCS 80":"Underground Utility Facilities Damage Prevention Act","625 ILCS 5":"Illinois Vehicle Code"};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pct(n,t){return t?Math.round(n/t*100):0}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmt(d){var p=d.split("-");return MON[+p[1]-1]+" "+(+p[2])+", "+p[0]}
function person(n){return n.replace(/^Representative /,"Rep. ").replace(/^Senator /,"Sen. ")}
function slug(c){return c.slug}
function catBySlug(s){return D.cats.filter(function(c){return c.slug===s})[0]}
function stageChip(b){var s=SMAP[b.stage];return '<span class="pill"><i class="sw '+s.c+'"></i>'+esc(s.l)+'</span>'}
function billBtn(id,txt){return '<button class="billref" data-open="'+esc(id)+'">'+esc(txt||id)+'</button>'}
function setHash(h){if(location.hash!==h)history.pushState(null,"",h)}

/* state */
var F={q:"",cat:"",chamber:"",stage:"",party:"",bip:"",rtc:"",sort:"id",dir:1};
var lastList=B.map(function(b){return b.id});

/* ---------------- overview ---------------- */
function counts(fn,list){var m={};(list||B).forEach(function(b){var k=fn(b);m[k]=(m[k]||0)+1});return m}
function stageBar(list){
  var c=counts(function(b){return b.stage},list);
  return '<div class="bar">'+STAGES.filter(function(s){return c[s.k]}).map(function(s){return '<div class="seg '+s.c+'" style="flex:'+c[s.k]+'" title="'+esc(s.l)+' '+c[s.k]+'"></div>'}).join("")+'</div>';
}
function legend(){return '<div class="legend">'+STAGES.map(function(s){return '<span><i class="sw '+s.c+'"></i>'+esc(s.l)+'</span>'}).join("")+'</div>'}
function overview(){
  var n=B.length, cs=counts(function(b){return b.stage});
  var pass=cs["Passed both houses"]||0, dead=cs["Stalled by deadline rule"]||0, none=cs["Awaiting committee assignment"]||0;
  var bip=B.filter(function(b){return b.bip}).length, nocos=B.filter(function(b){return b.nCos===0}).length;
  var pairs=0,seen={};B.forEach(function(b){if(b.pair.length&&!seen[b.issue]){seen[b.issue]=1;pairs++}});
  var h='';
  h+='<div class="note" style="margin-bottom:16px">Snapshot of the Trackbill master list as of <b>'+fmt(D.meta.asOf)+'</b>. Stage and last action reflect the end of the spring session. Facts only on this page. Briefs are drafted study notes, not a company position or legal advice.</div>';
  h+='<div class="tiles">'+
   tile("All bills",n,"Senate "+counts(function(b){return b.chamber})["Senate"]+" and House "+counts(function(b){return b.chamber})["House"],"bills")+
   tile("Passed both houses",pass,pct(pass,n)+"% of the list","bills|stage=Passed both houses")+
   tile("Re-referred after deadline",dead,pct(dead,n)+"% of the list","bills|stage=Stalled by deadline rule")+
   tile("Never sent to committee",none,pct(none,n)+"% of the list","bills|stage=Awaiting committee assignment")+'</div>';
  h+='<div class="grid2" style="margin-top:16px">';
  h+='<div class="card"><div class="card-head"><div><h2>Where the bills stand</h2><p class="sub">Last recorded action. Select a row to see those bills.</p></div></div><div class="rows">'+
    STAGES.map(function(s){var c=cs[s.k]||0;return '<div class="row"><button class="lbl" data-go="bills|stage='+esc(s.k)+'">'+esc(s.l)+'</button><div class="bar"><div class="seg '+s.c+'" style="flex:0 0 '+Math.max(pct(c,n),1)+'%"></div></div><div class="n">'+c+'</div></div>'}).join("")+'</div></div>';
  h+='<div class="card"><div class="card-head"><div><h2>What passed both houses</h2><p class="sub">'+pass+' bills cleared both chambers by June 1</p></div></div><div class="rows">'+
    B.filter(function(b){return b.passed}).map(function(b){return '<div style="display:flex;gap:10px;align-items:baseline">'+billBtn(b.id)+'<span style="color:var(--ink-2)">'+esc(b.title)+'</span></div>'}).join("")+'</div></div>';
  h+='</div>';
  /* themes */
  var ct=counts(function(b){return b.theme});
  var order=D.cats.map(function(c){return c.name}).sort(function(a,b){return (ct[b]||0)-(ct[a]||0)});
  var max=ct[order[0]];
  h+='<div class="card" style="margin-top:16px"><div class="card-head"><div><h2>Bills by category</h2><p class="sub">Bar shows stage mix. Select a category for its primer and bills.</p></div></div><div class="rows">'+
   order.map(function(k){var c=CATN[k],list=B.filter(function(b){return b.theme===k});return '<div class="row"><button class="lbl" data-go="cat|'+c.slug+'">'+esc(c.short)+'</button><div style="width:'+Math.round(ct[k]/max*100)+'%">'+stageBar(list)+'</div><div class="n">'+ct[k]+'</div></div>'}).join("")+'</div>'+legend()+'</div>';
  /* chamber party, cosponsors, activity */
  var rep=B.filter(function(b){return b.party==="R"}).length;
  var bins=[["None",0,0],["1 to 3",1,3],["4 to 9",4,9],["10 to 19",10,19],["20 or more",20,999]];
  var bc=bins.map(function(x){return B.filter(function(b){return b.nCos>=x[1]&&b.nCos<=x[2]}).length});
  var bmax=Math.max.apply(null,bc);
  h+='<div class="grid2" style="margin-top:16px">';
  h+='<div class="card"><div class="card-head"><div><h2>Sponsors and support</h2><p class="sub">Chief sponsors by party and how many cosponsors each bill drew</p></div></div>'+
    '<div class="big"><b>'+pct(rep,n)+'%</b><span style="color:var(--ink-2)">of chief sponsors are Republican ('+rep+' of '+n+'). Democrats chief sponsor '+(n-rep)+'.</span></div>'+
    '<div class="rows" style="margin-top:14px">'+bins.map(function(x,i){return '<div class="row" style="grid-template-columns:150px minmax(0,1fr) 40px"><span class="lbl" style="cursor:default">'+x[0]+' cosponsors</span><div class="bar one"><div class="seg" style="flex:0 0 '+Math.max(Math.round(bc[i]/bmax*100),2)+'%"></div></div><div class="n">'+bc[i]+'</div></div>'}).join("")+'</div>'+
    '<p class="sub" style="margin-top:12px">'+nocos+' bills ('+pct(nocos,n)+'%) have no cosponsors. Only '+bip+' bills have both Democratic and Republican names attached, and '+B.filter(function(b){return b.bip&&b.passed}).length+' of them passed both houses.</p></div>';
  var m=D.monthly,keys=Object.keys(m).sort(),mm=Math.max.apply(null,keys.map(function(k){return m[k]}));
  h+='<div class="card"><div class="card-head"><div><h2>When the last action happened</h2><p class="sub">Bills by month of last recorded action</p></div></div>'+
    '<div class="cols">'+keys.map(function(k){return '<div class="col"><span>'+m[k]+'</span><i style="height:'+Math.round(m[k]/mm*100)+'%"></i></div>'}).join("")+'</div>'+
    '<div class="collab">'+keys.map(function(k){var p=k.split("-");return '<span>'+MON[+p[1]-1]+(p[0]!=="2026"?" "+p[0].slice(2):"")+'</span>'}).join("")+'</div>'+
    '<p class="sub" style="margin-top:12px">Spikes in March mark the committee deadline re-referrals. May is the end of session push. One snapshot cannot show change over time, so trend lines start building as new exports are added.</p></div>';
  h+='</div>';
  /* statutes */
  var sc={};B.forEach(function(b){var seen={};b.statutes.forEach(function(s){var mt=s.match(/^(\d+ ILCS \d+)/);if(mt&&!seen[mt[1]]){seen[mt[1]]=1;sc[mt[1]]=(sc[mt[1]]||0)+1}})});
  var sk=Object.keys(sc).filter(function(k){return STATS[k]}).sort(function(a,b){return sc[b]-sc[a]}).slice(0,10), smax=sc[sk[0]];
  h+='<div class="grid2" style="margin-top:16px"><div class="card"><div class="card-head"><div><h2>Which laws the bills change</h2><p class="sub">Number of bills amending each statute</p></div></div><div class="rows">'+
    sk.map(function(k){return '<div class="row"><span class="lbl" style="cursor:default" title="'+esc(k)+'">'+esc(STATS[k])+'</span><div class="bar one"><div class="seg" style="flex:0 0 '+Math.round(sc[k]/smax*100)+'%"></div></div><div class="n">'+sc[k]+'</div></div>'}).join("")+'</div><p class="sub" style="margin-top:10px">The Public Utilities Act is the center of gravity. About '+pct(sc["220 ILCS 5"],n)+' percent of all bills amend it.</p></div>';
  h+='<div class="card"><div class="card-head"><div><h2>Start here</h2><p class="sub">A short path for learning the core issues</p></div></div><div class="rows" style="gap:12px">'+
    path("1. Learn how a bill moves","See the nine steps and what each stage means.","learn")+
    path("2. Pick a category","Read the primer, then the issue briefs inside it.","cats")+
    path("3. Open any bill title","Each bill has the core issue, background, implications and questions to ask.","bills")+
    path("4. Check the glossary","Terms such as shell bill, concurrence and heat rate.","learn|gloss")+
    '</div><p class="sub" style="margin-top:12px">'+pairs+' topics appear in more than one bill, usually a House and Senate pair. Open one and the related versions are linked.</p></div></div>';
  return h;

function filtered(){
  var q=F.q.trim().toLowerCase();
  var l=B.filter(function(b){
    if(F.cat&&b.theme!==F.cat) return false;
    if(F.chamber&&b.chamber!==F.chamber) return false;
    if(F.stage&&b.stage!==F.stage) return false;
    if(F.party&&b.party!==F.party) return false;
    if(F.bip==="yes"&&!b.bip) return false;
    if(F.rtc==="yes"&&!b.rtc) return false;
    if(q){var hay=(b.id+" "+b.title+" "+b.sponsor+" "+b.summary+" "+D.issues[b.issue].headline+" "+D.issues[b.issue].bg).toLowerCase();if(hay.indexOf(q)<0)return false}
    return true});
  var k=F.sort,d=F.dir;
  l.sort(function(a,b){var x,y;
    if(k==="id"){x=a.type+("00000"+a.num).slice(-5);y=b.type+("00000"+b.num).slice(-5)}
    else if(k==="title"){x=a.title;y=b.title}
    else if(k==="sponsor"){x=a.sponsor;y=b.sponsor}
    else if(k==="stage"){x=STAGES.indexOf(SMAP[a.stage]);y=STAGES.indexOf(SMAP[b.stage])}
    else if(k==="date"){x=a.lastDate;y=b.lastDate}

}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-open],[data-go],[data-tab],[data-sort],[data-step],#dclose,#dprev,#dnext,#freset,#overlay");
  if(!t) return;
  if(t.id==="overlay"){ if(e.target===t) closeBill(); return }
  if(t.id==="dclose") return closeBill();

  if(t.id==="dnext") return step(1);
  if(t.id==="freset"){F={q:"",cat:"",chamber:"",stage:"",party:"",bip:"",rtc:"",sort:"id",dir:1};return render()}
  if(t.hasAttribute("data-open")) return openBill(t.getAttribute("data-open"),t.getAttribute("data-list"));
  if(t.hasAttribute("data-go")) return go(t.getAttribute("data-go"));
  if(t.hasAttribute("data-tab")) return go(t.getAttribute("data-tab"));
  if(t.hasAttribute("data-sort")){var k=t.getAttribute("data-sort");if(F.sort===k)F.dir*=-1;else{F.sort=k;F.dir=1}return renderTable()}
  if(t.hasAttribute("data-step")){var on=t.getAttribute("aria-expanded")==="true";t.setAttribute("aria-expanded",String(!on))}
});
